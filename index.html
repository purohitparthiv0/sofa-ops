  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    const { createClient } = window.supabase;
    const DEFAULT_SUPABASE_URL = 'https://qsyubbefhttdfiglbtbt.supabase.co';

    const urlParams = new URLSearchParams(window.location.search);

      localStorage.setItem('sg_supabase_key', urlSetupKey.trim());
      window.history.replaceState({}, document.title, window.location.pathname);

    function Icon({ name, size = 16, className = '' }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide && window.lucide.icons[name]) {
          const svg = window.lucide.createElement(window.lucide.icons[name]);
          svg.setAttribute('width', size);
          svg.setAttribute('height', size);
          if (className) svg.setAttribute('class', className);
          ref.current.innerHTML = '';
          ref.current.appendChild(svg);
        }
      }, [name, size, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" />;
    }

    function getDeviceFingerprint() {
      let fp = localStorage.getItem('sg_device_fp');
      if (!fp) {
        fp = 'DEV-' + Math.random().toString(36).substring(2, 10).toUpperCase();
        localStorage.setItem('sg_device_fp', fp);
      }
      return fp;
    }

    function formatINR(num) {
      const val = Math.round(Number(num) || 0);
      return '₹' + val.toLocaleString('en-IN');
    }

    function formatDateDDMMYYYY(dateInput) {
      if (!dateInput) return '—';
      const d = new Date(dateInput);
      if (isNaN(d.getTime())) return String(dateInput);
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      return `${dd}/${mm}/${yyyy}`;
    }

    function formatDateTimeDDMMYYYY(dateInput) {
      if (!dateInput) return '—';
      const d = new Date(dateInput);
      if (isNaN(d.getTime())) return String(dateInput);
      const time = d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
      return `${formatDateDDMMYYYY(d)} ${time}`;
    }

    function getDueUrgency(promisedDateStr, status) {
      if (!promisedDateStr || status === 'Delivered') return null;
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const due = new Date(promisedDateStr + 'T00:00:00');
      const diffDays = Math.round((due - today) / 86400000);
      if (diffDays < 0) return { label: `OVERDUE (${Math.abs(diffDays)}d)`, level: 'overdue' };
      if (diffDays === 0) return { label: 'DUE TODAY', level: 'today' };
      if (diffDays === 1) return { label: 'DUE TOMORROW', level: 'tomorrow' };
      return null;
    }

    // =========================================================================
    // PATCH PRE-STEP (a): SAFE MIGRATION OF LEGACY ORDERS TO MULTI-LINE V8
    // =========================================================================
    function migrateOrderToV8(order) {
      if (!order) return order;
      if (Array.isArray(order.order_lines) && order.order_lines.length > 0) {
        return order;
      }
      const migratedLines = [];
      if (order.seating_segments || order.design_name) {
        const segParts = String(order.seating_segments || '').split('+').map(s => s.trim()).filter(Boolean);
        migratedLines.push({
          id: 'mig-seat-' + (order.id || Math.random()),
          part: 'Seating',
          custom_part: '',
          design_name: order.design_name || '',
          unit: 'Inches',
          rate: order.seating_rate || 0,
          measurement_pending: order.status === 'Measurement Pending',
          segments: segParts.length
            ? segParts.map((len, i) => ({ id: 's-' + i, length: len, width: '', label: '' }))
            : [{ id: 's-0', length: '', width: '', label: '' }]
        });
      }
      if (order.back_segments) {
        const bParts = String(order.back_segments || '').split('+').map(s => s.trim()).filter(Boolean);
        migratedLines.push({
          id: 'mig-back-' + (order.id || Math.random()),
          part: 'Back',
          custom_part: '',
          design_name: order.design_name || '',
          unit: order.back_unit === 'Pcs' ? 'Pcs' : 'Inches',
          rate: order.back_rate || 0,
          measurement_pending: false,
          segments: bParts.map((len, i) => ({ id: 'b-' + i, length: len, width: '', label: '' }))
        });
      }
      return {
        ...order,
        order_lines: migratedLines,
        sofa_shape: order.sofa_shape || { type: 'None', unit: 'inch', sides: {} },
        special_cuts: Array.isArray(order.special_cuts) ? order.special_cuts : [],
        is_archived: Boolean(order.is_archived),
        is_trashed: Boolean(order.is_trashed)
      };
    }

    // =========================================================================
    // PATCH ITEMS 1 + 2: MULTI-LINE ENGINE, EXPRESSIONS (24x4), INTEGER MATH
    // =========================================================================
    function evalLengthToken(token) {
      const clean = String(token ?? '').trim().toLowerCase().replace(/×/g, 'x').replace(/\*/g, 'x');
      if (!clean) return 0;
      if (clean.includes('x')) {
        const parts = clean.split('x').map((p) => p.trim()).filter(Boolean);
        if (!parts.length) return 0;
        let prod = 1;
        for (const p of parts) {
          const v = Number(p);
          if (!Number.isFinite(v) || v <= 0) return 0;
          prod *= v;
        }
        return prod;
      }
      const v = Number(clean);
      return Number.isFinite(v) && v > 0 ? v : 0;
    }

    function parseLengthExpression(expr) {
      if (!expr) return [];
      return String(expr)
        .replace(/,/g, '+')
        .split('+')
        .map((t) => evalLengthToken(t))
        .filter((n) => n > 0);
    }

    function toInt(val) {
      const n = parseInt(String(val ?? '').replace(/[^0-9-]/g, ''), 10);
      return Number.isInteger(n) ? n : 0;
    }

    function calcLineEstimate(line = {}) {
      const unit = line.unit === 'Pcs' ? 'Pcs' : 'Inches';
      const rateInt = Math.max(0, toInt(line.rate));
      const segments = Array.isArray(line.segments) ? line.segments : [];

      const lengthValues = [];
      const displaySegments = [];

      segments.forEach((seg) => {
        const rawLen = String(seg?.length ?? '').trim();
        const rawWid = String(seg?.width ?? '').trim();
        const lbl = String(seg?.label ?? '').trim();
        if (!rawLen) return;
        const parsedLens = parseLengthExpression(rawLen);
        parsedLens.forEach((val) => lengthValues.push(val));
        if (parsedLens.length > 0) {
          const segStr = rawWid ? `${rawLen}"×${rawWid}"` : (unit === 'Inches' ? `${rawLen}"` : `${rawLen}`);
          displaySegments.push(lbl ? `${segStr} (${lbl})` : segStr);
        }
      });

      // Integer math in centi-inches (1/100th inch) to handle decimals without floating-point drift
      const totalCentiInches = lengthValues.reduce((acc, n) => acc + Math.round(n * 100), 0);
      const totalInches = totalCentiInches / 100;

      let quarters = 0;
      let billableQty = 0;
      let billableStr = '0.00';
      let amount = 0;

      if (unit === 'Pcs') {
        billableQty = Math.round(totalInches);
        billableStr = String(billableQty);
        amount = Math.floor(billableQty * rateInt);
      } else {
        // quarters = ceil(total_inches / 3) = ceil(totalCentiInches / 300)
        quarters = totalCentiInches > 0 ? Math.ceil(totalCentiInches / 300) : 0;
        billableQty = quarters / 4;
        billableStr = billableQty.toFixed(2);
        // Round DOWN to whole rupees: Math.floor((quarters * rateInt) / 4)
        amount = Math.floor((quarters * rateInt) / 4);
      }

      const partLabel = line.part === 'Other' ? (line.custom_part || 'Other') : (line.part || 'Seating');
      const exprText = displaySegments.length ? displaySegments.join(' + ') : '0';
      const liveText = unit === 'Inches'
        ? `${partLabel}${line.design_name ? ' - ' + line.design_name : ''}: ${exprText} = ${totalInches}" = ${billableStr} ft × Rs ${rateInt.toLocaleString('en-IN')} = Rs ${amount.toLocaleString('en-IN')}`
        : `${partLabel}${line.design_name ? ' - ' + line.design_name : ''}: ${exprText} = ${billableStr} pcs × Rs ${rateInt.toLocaleString('en-IN')} = Rs ${amount.toLocaleString('en-IN')}`;

      const prodSpecText = `${partLabel} - ${line.design_name || 'Design'} - ${displaySegments.length ? displaySegments.join(' + ') : 'Pending'} (${unit === 'Inches' ? billableStr + ' ft' : billableStr + ' pcs'})`;

      return {
        id: line.id,
        partLabel,
        design_name: line.design_name || '',
        unit,
        rateInt,
        lengthValues,
        displaySegments,
        totalInches,
        quarters,
        billableQty,
        billableStr,
        amount,
        liveText,
        prodSpecText,
        measurement_pending: Boolean(line.measurement_pending)
      };
    }

    function calcOrderEstimate(form = {}) {
      const lines = Array.isArray(form.order_lines) ? form.order_lines : [];
      const lineCalcs = lines.map((l) => calcLineEstimate(l));
      const linesTotal = lineCalcs.reduce((s, c) => s + c.amount, 0);
      const visitChargeInt = Math.max(0, toInt(form.visit_charge));
      const advanceInt = Math.max(0, toInt(form.advance_amount));
      const total = linesTotal + visitChargeInt;
      const balance = total - advanceInt;
      const hasMeasurementPending = lineCalcs.some((c) => c.measurement_pending);

      // Build backward-compatible summary fields for legacy columns
      const allDesigns = [...new Set(lineCalcs.map((c) => c.design_name).filter(Boolean))].join(', ') || form.design_name || '';
      const seatCalcs = lineCalcs.filter((c) => c.partLabel === 'Seating');
      const backCalcs = lineCalcs.filter((c) => c.partLabel !== 'Seating');

      return {
        lineCalcs,
        linesTotal,
        visitChargeInt,
        advanceInt,
        total,
        balance,
        hasMeasurementPending,
        allDesigns,
        seatingInches: seatCalcs.reduce((s, c) => s + c.totalInches, 0),
        seatingFeet: seatCalcs.reduce((s, c) => s + c.billableQty, 0),
        seatingSegmentsStr: seatCalcs.map((c) => c.displaySegments.join('+')).filter(Boolean).join(' | '),
        backRaw: backCalcs.reduce((s, c) => s + c.totalInches, 0),
        backBillable: backCalcs.reduce((s, c) => s + c.billableQty, 0),
        backSegmentsStr: backCalcs.map((c) => `${c.partLabel}: ${c.displaySegments.join('+')}`).filter(Boolean).join(' | ')
      };
    }

    // =========================================================================

      );
    }

    // =========================================================================
    // PATCH ITEM 5: WHATSAPP MESSAGE TEMPLATES, PAPER BILL TERMS & PREVIEW MODAL
    // =========================================================================
    const DEFAULT_WA_TEMPLATES = {
      estimate: {
        lang: 'Hinglish',
        text: `Namaste {customer} ji!\n*Shree Gayatri Furnishing Hub* mein aapka swagat hai.\n\nAapke Sofa Cover ka Estimate (*{order_no}*):\n{lines}\n\n*Estimate Total: Rs {total}*\nOrder confirm karne ke liye kripya sampark karein: {shop_phone}`
      },
      receipt: {
        lang: 'Hinglish',
        text: `Namaste {customer} ji! Aapka Sofa Cover order confirm ho gaya hai.\n\n*Shree Gayatri Furnishing Hub*\nOrder No: *{order_no}*\n\n*Order Details:*\n{lines}\n\nEstimate Total: *Rs {total}*\nAdvance Paid: *Rs {advance}*\nBalance Due: *Rs {balance}*\nPromised Delivery Date: *{promised_date}*\nShop Contact: {shop_phone}\n\n*Zaroori Niyam (Terms):*\n1. Cover ko garm paani mein na dhoyein (Do not wash the cover in hot water).\n2. Machine-dry ya spin bilkul na karein (Do not machine-dry/spin).\n3. Sofa aur curtain items ki delivery ke liye 3rd floor par jana hoga (For delivery of sofa and curtain items you must go to the 3rd floor).\n4. Diya gaya advance non-refundable hai (Advance paid is non-refundable).`
      },
      ready: {
        lang: 'Hinglish',
        text: `Namaste {customer} ji! Aapka Sofa Cover (Order *{order_no}*) bankar *READY* hai.\n\n{lines}\nBalance Due: *Rs {balance}*\n\nNote: Sofa aur curtain items ki delivery ke liye 3rd floor par padharein.\n- *Shree Gayatri Furnishing Hub* ({shop_phone})`
      },
      reminder: {
        lang: 'Hinglish',
        text: `Namaste {customer} ji! Aapke Sofa Cover Order *{order_no}* ka Balance *Rs {balance}* baaki hai.\nKripya 3rd floor se apna order collect karein.\n- *Shree Gayatri Furnishing Hub* ({shop_phone})`
      },
      delivered: {
        lang: 'Hinglish',
        text: `Dhanyavaad {customer} ji! Order *{order_no}* deliver ho chuka hai.\nYaad rakhein: Cover ko garm paani mein na dhoyein aur machine-dry/spin na karein.\n- *Shree Gayatri Furnishing Hub* ({shop_phone})`
      }
    };

    const WhatsAppService = {
      formatPhone(mobile) {
        const digits = String(mobile || '').replace(/\D/g, '');
        return digits.length === 10 ? `91${digits}` : digits;
      },
      buildLinesSummary(order) {
        const migrated = migrateOrderToV8(order);
        const calc = calcOrderEstimate(migrated);
        if (!calc.lineCalcs.length) {
          return `${order.design_name || 'Sofa Cover'}: Rs ${Number(order.estimate_total || 0).toLocaleString('en-IN')}`;
        }
        return calc.lineCalcs
          .map((c) => `${c.partLabel} - ${c.design_name || 'Design'}: ${c.billableStr} ${c.unit === 'Inches' ? 'ft' : 'pcs'} x Rs ${c.rateInt.toLocaleString('en-IN')} = Rs ${c.amount.toLocaleString('en-IN')}`)
          .join('\n');
      },
      renderMessage(type, order, settings) {
        const templates = settings?.wa_templates || DEFAULT_WA_TEMPLATES;
        const tplObj = templates[type] || DEFAULT_WA_TEMPLATES[type] || DEFAULT_WA_TEMPLATES.receipt;
        const rawTpl = typeof tplObj === 'string' ? tplObj : tplObj.text;
        const shopPhone = [settings?.shop_phone || '8866925561', settings?.shop_phone_alt].filter(Boolean).join(' / ');
        const linesText = this.buildLinesSummary(order);

        return rawTpl
          .replace(/\{customer\}/g, order.customer_name || '')
          .replace(/\{order_no\}/g, order.order_no || '')
          .replace(/\{lines\}/g, linesText)
          .replace(/\{total\}/g, Number(order.estimate_total || 0).toLocaleString('en-IN'))
          .replace(/\{advance\}/g, Number(order.advance_amount || 0).toLocaleString('en-IN'))
          .replace(/\{balance\}/g, Number(order.balance_amount || 0).toLocaleString('en-IN'))
          .replace(/\{promised_date\}/g, formatDateDDMMYYYY(order.promised_date))
          .replace(/\{shop_phone\}/g, shopPhone);
      },
      getEncodedUrl(mobile, messageText) {
        const phone = this.formatPhone(mobile);
        return `https://wa.me/${phone}?text=${encodeURIComponent(messageText)}`;
      }
    };

    function WhatsAppPreviewModal({ type: initialType, order, settings, onClose }) {
      const [msgType, setMsgType] = useState(initialType || 'receipt');
      const [text, setText] = useState(() => WhatsAppService.renderMessage(initialType || 'receipt', order, settings));

      useEffect(() => {
        setText(WhatsAppService.renderMessage(msgType, order, settings));
      }, [msgType, order, settings]);

      const handleOpenWA = () => {
        window.open(WhatsAppService.getEncodedUrl(order.mobile, text), '_blank');
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-md border border-gray-300 max-w-lg w-full p-5 shadow-xl space-y-4">

    // =========================================================================
    // STICKER MODAL (Prints Multi-Line Specs + Widths + Shape SVG + Special Cuts)
    // =========================================================================
    function StickerPrintModal({ ordersList, settings, onClose, onLogReprint }) {
      const w = settings?.sticker_width_mm || 60;
      const h = settings?.sticker_height_mm || 40;
      const handlePrint = () => {
        const style = document.createElement('style');
        style.innerHTML = `@page { size: ${w}mm ${h}mm; margin: 0; }`;
        document.head.appendChild(style);
        ordersList.forEach((ord) => onLogReprint && onLogReprint(ord));
        window.print();
        document.head.removeChild(style);
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-md border border-gray-300 max-w-lg w-full p-4 md:p-5 shadow-lg">
            <div className="flex justify-between items-center border-b border-gray-200 pb-3 mb-4">
              <div>
                <h3 className="font-bold text-base text-gray-900">
                  {ordersList.length > 1 ? `Batch Stickers (${ordersList.length})` : `Cutting Sticker — ${ordersList[0].order_no}`}
                </h3>
                <p className="text-xs text-gray-500">Label size: {w} × {h} mm (Measurements, Shape & Special Cuts only — No prices)</p>
              </div>
              <button onClick={onClose} className="p-2 min-w-[44px] min-h-[44px] text-gray-500 hover:bg-gray-100 rounded inline-flex items-center justify-center"><Icon name="X" size={18} /></button>
            </div>
            <div id="printable-area" className="max-h-96 overflow-y-auto bg-gray-100 p-4 rounded border border-gray-200 space-y-3 mb-4">
              {ordersList.map((rawOrder) => {
                const order = migrateOrderToV8(rawOrder);
                const calc = calcOrderEstimate(order);
                const qrUrl = `${window.location.origin}${window.location.pathname}?scan=${order.order_no}`;
                const qrImgSrc = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&margin=0&data=${encodeURIComponent(qrUrl)}`;
                return (
                  <div key={order.id} style={{ width: `${w}mm`, minHeight: `${h}mm`, pageBreakAfter: 'always' }} className="bg-white border border-black p-1.5 flex flex-col justify-between text-black leading-tight overflow-hidden mx-auto">
                    <div className="flex justify-between items-start border-b border-black pb-0.5">
                      <div>
                        <div className="font-bold text-xs tracking-tight">{order.order_no}</div>
                        <div className="text-[8px] font-semibold truncate max-w-[38mm]">{calc.allDesigns}</div>
                      </div>
                      <img src={qrImgSrc} alt="QR" className="w-[8mm] h-[8mm]" />
                    </div>
                    <div className="text-[7.5px] space-y-0.5 my-0.5">
                      {calc.lineCalcs.map((lc, idx) => (
                        <div key={idx} className={lc.measurement_pending ? 'font-bold underline' : ''}>
                          <strong>{lc.partLabel}:</strong> {lc.design_name} — {lc.displaySegments.join(' + ') || 'PENDING'} ({lc.billableStr}{lc.unit === 'Inches' ? 'ft' : 'pcs'})
                          {lc.measurement_pending && ' [PENDING]'}
                        </div>
                      ))}
                      {order.sofa_shape && order.sofa_shape.type && order.sofa_shape.type !== 'None' && (
                        <div className="pt-0.5">
                          <SofaShapeSVG shape={order.sofa_shape} compact={true} />
                        </div>
                      )}
                      {Array.isArray(order.special_cuts) && order.special_cuts.length > 0 && (
                        <div className="border-t border-black pt-0.5 font-bold">
                          SPL CUT: {order.special_cuts.map((sc) => `${sc.type} (${sc.line_ref || ''} ${sc.size || ''}: ${sc.note || ''})`).join('; ')}
                        </div>
                      )}
                      {order.tailor_notes && <div className="truncate italic border-t border-dashed border-gray-500 pt-0.5">Note: {order.tailor_notes}</div>}
                    </div>
                    <div className="text-[7.5px] font-bold border-t border-black pt-0.5 flex justify-between">
                      <span>DEL: {formatDateDDMMYYYY(order.promised_date)}</span>
                      <span>PCS: {order.total_pcs}</span>
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="flex gap-2">
              <button onClick={handlePrint} className="flex-1 bg-amber-700 hover:bg-amber-800 text-white py-2.5 px-4 rounded font-semibold text-sm inline-flex items-center justify-center gap-2 min-h-[44px]">
                <Icon name="Printer" size={16} /> Print Sticker(s)
              </button>
            </div>
          </div>
        </div>
      );
    }

    function OrderTimelineModal({ order, activityLogs, onClose }) {
      const logs = activityLogs.filter((l) => l.order_id === order.id || l.orders?.order_no === order.order_no);
      return (

            <div className="flex justify-between items-center border-b border-gray-200 pb-3 mb-4">
              <div><h3 className="font-bold text-base text-gray-900">Order Audit Timeline — {order.order_no}</h3></div>
              <button onClick={onClose} className="p-2 min-w-[44px] min-h-[44px] text-gray-500 hover:bg-gray-100 rounded inline-flex items-center justify-center"><Icon name="X" size={18} /></button>
            </div>
            <div className="max-h-80 overflow-y-auto space-y-3">
              {logs.length === 0 ? <p className="text-sm text-gray-500 py-6 text-center">No activity events logged.</p> : logs.map((l) => (
                <div key={l.id} className="flex items-start gap-3 border-l-2 border-amber-600 pl-3 py-1">
                  <div className="flex-1">
                    <div className="text-sm font-medium text-gray-900">{l.action}</div>
                    <div className="text-xs text-gray-500">By <span className="font-semibold uppercase">{l.performed_by_role || l.role}</span> • {formatDateTimeDDMMYYYY(l.created_at)}</div>

    // =========================================================================
    // PATCH ITEM 8: IMPORTANT NOTES BOARD COMPONENT (Admin & Sales Home Screen)
    // =========================================================================
    function ImportantNotesBoard({ notes, orders, onMarkDone, onOpenOrder }) {
      const [showHistory, setShowHistory] = useState(false);
      const openNotes = notes.filter((n) => n.status !== 'done');
      const doneNotes = notes.filter((n) => n.status === 'done');
      const displayed = showHistory ? doneNotes : openNotes;

      return (
        <div className="bg-white border border-amber-300 rounded shadow-sm mb-4">
          <div className="px-4 py-2.5 bg-amber-50 border-b border-amber-200 flex flex-wrap justify-between items-center gap-2">
            <div className="flex items-center gap-2">
              <Icon name="Pin" size={16} className="text-amber-800" />
              <span className="font-bold text-sm text-gray-900">Important Notes Board</span>
              <span className="px-2 py-0.5 rounded-full text-xs font-bold bg-red-600 text-white tabular-nums">
                {openNotes.length} Open
              </span>
            </div>
            <button
              type="button"
              onClick={() => setShowHistory((v) => !v)}
              className="text-xs font-semibold text-amber-900 underline"
            >
              {showHistory ? `View Open Notes (${openNotes.length})` : `View Done History (${doneNotes.length})`}
            </button>
          </div>

          {displayed.length === 0 ? (
            <div className="p-3 text-xs text-gray-500 text-center">
              {showHistory ? 'No completed notes in history yet.' : 'No open important notes right now.'}
            </div>
          ) : (
            <div className="divide-y divide-gray-200 max-h-56 overflow-y-auto">
              {displayed.map((note) => {
                const linkedOrder = orders.find((o) => o.id === note.order_id || o.order_no === note.order_no);
                return (
                  <div
                    key={note.id}
                    onClick={() => linkedOrder && onOpenOrder(linkedOrder)}
                    className="px-4 py-2.5 hover:bg-gray-50 cursor-pointer flex flex-wrap justify-between items-center gap-2"
                  >
                    <div className="space-y-0.5">
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-xs text-gray-900 underline">{note.order_no}</span>
                        <span className={`px-1.5 py-0.2 rounded text-[10px] font-bold uppercase ${
                          note.priority === 'Urgent' ? 'bg-red-100 text-red-800 border border-red-300' : 'bg-gray-100 text-gray-700'
                        }`}>
                          {note.priority || 'Normal'}
                        </span>
                        <span className="text-sm font-medium text-gray-900">{note.note_text}</span>
                      </div>
                      <div className="text-[11px] text-gray-500">
                        By <strong className="uppercase">{note.created_by_role}</strong> • {formatDateTimeDDMMYYYY(note.created_at)}
                        {note.status === 'done' && ` • Marked done (${formatDateTimeDDMMYYYY(note.done_at)})`}
                      </div>
                    </div>
                    {note.status !== 'done' && (
                      <button
                        type="button"
                        onClick={(e) => { e.stopPropagation(); onMarkDone(note); }}
                        className="px-2.5 py-1 bg-emerald-700 hover:bg-emerald-800 text-white rounded text-xs font-semibold"
                      >
                        Mark Done
                      </button>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // ORDER ENTRY SCREEN (Multi-Line + Widths + Shape SVG + Special Cuts + Photo + Note)
    // =========================================================================
    function OrderEntryScreen({ supabase, existingOrder: rawExisting, allOrders, salesmen, notes, currentRole, onCancel, onCommitOrder }) {
      const existingOrder = useMemo(() => migrateOrderToV8(rawExisting), [rawExisting]);
      const isConfirmed = existingOrder && !['Measurement Pending', 'Estimate Given'].includes(existingOrder.status);
      const canEditSpecs = !isConfirmed || currentRole === 'admin';
      const draftKey = existingOrder ? `sg_draft_v8_${existingOrder.id}` : 'sg_draft_v8_new_order';

      const defaultLine = () => ({
        id: 'line-' + Math.random().toString(36).slice(2, 9),
        part: 'Seating',
        custom_part: '',
        design_name: '',
        unit: 'Inches',
        rate: '',
        measurement_pending: false,
        segments: [{ id: 'seg-' + Math.random().toString(36).slice(2, 9), length: '', width: '36', label: '' }]
      });

      const [form, setForm] = useState(() => {
        if (!existingOrder) {
          const saved = localStorage.getItem(draftKey);
          if (saved) {
            try { return JSON.parse(saved); } catch (e) {}
          }
        }
        return {
          customer_name: existingOrder?.customer_name || '',
          mobile: existingOrder?.mobile || '',
          address: existingOrder?.address || '',
          home_delivery: existingOrder?.home_delivery || false,
          measurement_source: existingOrder?.measurement_source || 'Customer brought',
          visit_staff_name: existingOrder?.visit_staff_name || '',
          visit_charge: existingOrder?.visit_charge || 0,
          order_lines: existingOrder?.order_lines?.length ? existingOrder.order_lines : [defaultLine()],
          sofa_shape: existingOrder?.sofa_shape || { type: 'None', unit: 'inch', sides: {} },
          special_cuts: existingOrder?.special_cuts || [],
          sketch_photo_url: existingOrder?.sketch_photo_url || '',
          tailor_notes: existingOrder?.tailor_notes || '',
          total_pcs: existingOrder?.total_pcs || '',
          advance_amount: existingOrder?.advance_amount || 0,
          payment_mode: existingOrder?.payment_mode || 'Cash',
          salesman_id: existingOrder?.salesman_id || (salesmen[0]?.id || ''),
          promised_date: existingOrder?.promised_date || '',
          important_note_text: '',
          important_note_priority: 'Normal'
        };
      });

      const [uploadingPhoto, setUploadingPhoto] = useState(false);
      const [reviewMode, setReviewMode] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      useEffect(() => {
        if (!existingOrder) {
          localStorage.setItem(draftKey, JSON.stringify(form));
        }
      }, [form]);

      // Collect all widths already used across all lines in this order for quick-select chips
      const usedWidths = useMemo(() => {
        const set = new Set(['26', '36', '48', '54']);
        (form.order_lines || []).forEach((l) => {
          (l.segments || []).forEach((s) => {
            if (s.width && String(s.width).trim()) set.add(String(s.width).trim());
          });
        });
        return Array.from(set);
      }, [form.order_lines]);

      const calc = useMemo(() => calcOrderEstimate(form), [form]);

      const orderExistingNotes = useMemo(() => {
        if (!existingOrder) return [];
        return (notes || []).filter((n) => n.order_id === existingOrder.id || n.order_no === existingOrder.order_no);
      }, [existingOrder, notes]);

      // Line & Segment handlers
      const addLine = () => {
        const lastDesign = form.order_lines[form.order_lines.length - 1]?.design_name || '';
        setForm((f) => ({
          ...f,
          order_lines: [
            ...f.order_lines,
            {
              id: 'line-' + Math.random().toString(36).slice(2, 9),
              part: f.order_lines.length === 1 ? 'Back' : 'Handle',
              custom_part: '',
              design_name: lastDesign,
              unit: 'Inches',
              rate: '',
              measurement_pending: false,
              segments: [{ id: 'seg-' + Math.random().toString(36).slice(2, 9), length: '', width: '36', label: '' }]
            }
          ]
        }));
      };

      const removeLine = (lineId) => {
        if (form.order_lines.length <= 1) return alert('At least one line is required.');
        setForm((f) => ({ ...f, order_lines: f.order_lines.filter((l) => l.id !== lineId) }));
      };

      const updateLine = (lineId, patch) => {
        setForm((f) => ({
          ...f,
          order_lines: f.order_lines.map((l) => (l.id === lineId ? { ...l, ...patch } : l))
        }));
      };

      const addSegment = (lineId) => {
        setForm((f) => ({
          ...f,
          order_lines: f.order_lines.map((l) => {
            if (l.id !== lineId) return l;
            const prevSeg = l.segments[l.segments.length - 1];
            const autofillWidth = prevSeg?.width ?? '36';
            return {
              ...l,
              segments: [
                ...l.segments,
                { id: 'seg-' + Math.random().toString(36).slice(2, 9), length: '', width: autofillWidth, label: '' }
              ]
            };
          })
        }));
      };

      const updateSegment = (lineId, segId, patch) => {
        setForm((f) => ({
          ...f,
          order_lines: f.order_lines.map((l) => {
            if (l.id !== lineId) return l;
            return {
              ...l,
              segments: l.segments.map((s) => (s.id === segId ? { ...s, ...patch } : s))
            };
          })
        }));
      };

      const removeSegment = (lineId, segId) => {
        setForm((f) => ({
          ...f,
          order_lines: f.order_lines.map((l) => {
            if (l.id !== lineId || l.segments.length <= 1) return l;
            return { ...l, segments: l.segments.filter((s) => s.id !== segId) };
          })
        }));
      };

      // Special Cuts handlers
      const addSpecialCut = () => {
        setForm((f) => ({
          ...f,
          special_cuts: [
            ...(f.special_cuts || []),
            { id: 'sc-' + Math.random().toString(36).slice(2, 8), type: 'Step cut', line_ref: 'Seating Seg 1', size: '', note: '' }
          ]
        }));
      };

      const updateSpecialCut = (scId, patch) => {
        setForm((f) => ({
          ...f,
          special_cuts: (f.special_cuts || []).map((sc) => (sc.id === scId ? { ...sc, ...patch } : sc))
        }));
      };

      const removeSpecialCut = (scId) => {
        setForm((f) => ({
          ...f,
          special_cuts: (f.special_cuts || []).filter((sc) => sc.id !== scId)
        }));
      };

      // Sketch Photo Upload to Supabase Storage (with DataURL fallback)
      const handlePhotoUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setUploadingPhoto(true);
        try {
          const ext = file.name.split('.').pop() || 'jpg';
          const fileName = `sketch_${Date.now()}.${ext}`;
          if (supabase) {
            const { error: upErr } = await supabase.storage.from('sofa_sketches').upload(fileName, file, { upsert: true });
            if (!upErr) {
              const { data: pub } = supabase.storage.from('sofa_sketches').getPublicUrl(fileName);
              if (pub?.publicUrl) {
                setForm((f) => ({ ...f, sketch_photo_url: pub.publicUrl }));
                setUploadingPhoto(false);
                return;
              }
            }
          }
          const reader = new FileReader();
          reader.onload = () => {
            setForm((f) => ({ ...f, sketch_photo_url: reader.result }));
            setUploadingPhoto(false);
          };
          reader.readAsDataURL(file);
        } catch (err) {
          setUploadingPhoto(false);
        }
      };

      const validateAndOpenReview = () => {
        setErrorMsg('');
        if (!form.customer_name.trim() || String(form.mobile).replace(/\D/g, '').length < 10) {
          return setErrorMsg('Please enter Customer Name and 10-digit Mobile Number.');
        }
        if (!form.order_lines.some((l) => l.design_name.trim())) {
          return setErrorMsg('Please enter Design Name on at least one order line.');
        }
        if (!form.salesman_id || !form.promised_date || !form.total_pcs) {
          return setErrorMsg('Salesman, Promised Delivery Date, and Total Pieces are required to confirm.');
        }
        setReviewMode(true);
      };

      const finalizeSave = (targetStatus, afterAction = 'none') => {
        setErrorMsg('');
        if (!form.customer_name.trim() || !form.mobile.trim()) {
          return setErrorMsg('Customer Name and Mobile are required.');
        }
        const nextStatus = targetStatus === 'Confirmed'
          ? (calc.hasMeasurementPending ? 'Measurement Pending' : 'Cutting Pending')
          : targetStatus;

        const payload = {
          customer_name: form.customer_name,
          mobile: form.mobile,
          address: form.address,
          home_delivery: form.home_delivery,
          measurement_source: form.measurement_source,
          visit_staff_name: form.visit_staff_name,
          visit_charge: calc.visitChargeInt,
          design_name: calc.allDesigns || 'Custom Sofa Cover',
          seating_segments: calc.seatingSegmentsStr,
          seating_total_inches: calc.seatingInches,
          seating_feet: calc.seatingFeet,
          seating_rate: calc.lineCalcs[0]?.rateInt || 0,
          back_unit: 'Inches',
          back_segments: calc.backSegmentsStr,
          back_total_raw: calc.backRaw,
          back_billable_qty: calc.backBillable,
          back_rate: calc.lineCalcs[1]?.rateInt || 0,
          order_lines: form.order_lines,
          sofa_shape: form.sofa_shape,
          special_cuts: form.special_cuts,
          sketch_photo_url: form.sketch_photo_url,
          tailor_notes: form.tailor_notes,
          total_pcs: parseInt(form.total_pcs, 10) || 1,
          estimate_total: calc.total,
          advance_amount: calc.advanceInt,
          payment_mode: form.payment_mode,
          salesman_id: form.salesman_id || null,
          promised_date: form.promised_date || null,
          status: nextStatus
        };

        if (!existingOrder) localStorage.removeItem(draftKey);
        onCommitOrder(payload, targetStatus === 'Confirmed', afterAction, {
          manualNote: form.important_note_text.trim()
            ? { text: form.important_note_text.trim(), priority: form.important_note_priority }
            : null,
          hasMeasurementPending: calc.hasMeasurementPending,
          advanceZeroOnConfirm: targetStatus === 'Confirmed' && calc.advanceInt === 0
        });
      };

      const shapeSpec = SOFA_SHAPE_TEMPLATES[form.sofa_shape?.type || 'None'] || SOFA_SHAPE_TEMPLATES['None'];

      return (
        <div className="bg-white border border-gray-300 rounded-md shadow-sm">
          <div className="px-4 md:px-5 py-3.5 border-b border-gray-200 flex flex-wrap justify-between items-center gap-3 bg-gray-50">
            <div className="flex items-center gap-3">
              <button onClick={onCancel} className="px-3 py-2 border border-gray-300 bg-white hover:bg-gray-100 rounded text-xs font-semibold text-gray-700 inline-flex items-center gap-1.5">
                <Icon name="ArrowLeft" size={14} /> Back
              </button>
              <h2 className="font-bold text-base text-gray-900">
                {existingOrder ? `Edit Order ${existingOrder.order_no}` : 'New Sofa Cover Order / Estimate'}
              </h2>
            </div>
          </div>

          {errorMsg && (
            <div className="mx-4 mt-4 p-3 bg-red-50 border border-red-300 text-red-800 rounded text-sm font-medium">
              {errorMsg}
            </div>
          )}

          {orderExistingNotes.length > 0 && (
            <div className="mx-4 mt-4 p-3 bg-amber-50 border border-amber-300 rounded space-y-1">
              <div className="text-xs font-bold uppercase text-amber-900">Order Important Notes:</div>
              {orderExistingNotes.map((n) => (
                <div key={n.id} className="text-xs text-gray-900">
                  • <strong>[{n.priority}]</strong> {n.note_text} <span className="text-gray-500">({n.status})</span>
                </div>
