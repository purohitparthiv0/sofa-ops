      const [globalSearchTerm, setGlobalSearchTerm] = useState('');

      const loadAll = async () => {
        const { data: ord } = await supabase.from('orders').select('*, salesmen(name)').order('created_at', { ascending: false });
        setOrders((ord || []).map(migrateOrderToV8));
        const { data: sm } = await supabase.from('salesmen').select('*').eq('is_active', true).order('name');
        setSalesmen(sm || []);
        const { data: st } = await supabase.from('app_settings').select('*').single();
        if (st) setSettings({ ...st, shop_phone: st.shop_phone || '8866925561', wa_templates: st.wa_templates || DEFAULT_WA_TEMPLATES });
        const { data: nt } = await supabase.from('important_notes').select('*').order('created_at', { ascending: false });
        if (nt) setNotes(nt);

        if (isAdmin) {
          const { data: dev } = await supabase.from('devices').select('*').order('created_at', { ascending: false }); setDevices(dev || []);
          const { data: pl } = await supabase.from('tailor_piece_logs').select('*, orders(order_no)').order('logged_at', { ascending: false }); setPieceLogs(pl || []);
          const { data: al } = await supabase.from('activity_logs').select('*, orders(order_no)').order('created_at', { ascending: false }).limit(200); setActivityLogs(al || []);
        }
      };

      useEffect(() => {
        loadAll();
        const sub = supabase.channel('sql-live-v8').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, loadAll).subscribe();
        const kd = (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setGlobalSearchOpen(true); setGlobalSearchTerm(''); } else if (e.key === 'Escape') setGlobalSearchOpen(false); };
        window.addEventListener('keydown', kd);
        return () => { supabase.removeChannel(sub); window.removeEventListener('keydown', kd); };
      }, [isAdmin]);

      const createImportantNote = async (oId, oNo, text, prio = 'Urgent') => {
        await supabase.from('important_notes').insert({ order_id: oId, order_no: oNo, note_text: text, priority: prio, status: 'open', created_by_role: profile.role });
      };

      const handleCommitOrder = async (payload, wasConfirmed, afterAction, noteMeta) => {
        try {
          const p = { ...payload, salesman_id: payload.salesman_id || null, total_pcs: payload.total_pcs || 1 };
          let sOrd;
          if (editingOrder) {
            const { data } = await supabase.from('orders').update(p).eq('id', editingOrder.id).select('*, salesmen(name)').single(); sOrd = data;
            await supabase.from('activity_logs').insert({ order_id: sOrd.id, action: `Updated -> ${p.status}`, performed_by: profile.id, performed_by_role: profile.role });
          } else {
            const { data } = await supabase.from('orders').insert({ ...p, created_by: profile.id }).select('*, salesmen(name)').single(); sOrd = data;
            await supabase.from('activity_logs').insert({ order_id: sOrd.id, action: `Created -> ${p.status}`, performed_by: profile.id, performed_by_role: profile.role });
          }
          if (noteMeta?.manualNote) await createImportantNote(sOrd.id, sOrd.order_no, noteMeta.manualNote.text, noteMeta.manualNote.priority);
          if (noteMeta?.advanceZeroOnConfirm) await createImportantNote(sOrd.id, sOrd.order_no, 'Advance not taken', 'Urgent');
          if (noteMeta?.hasMeasurementPending) await createImportantNote(sOrd.id, sOrd.order_no, 'Measurement pending on line', 'Urgent');
          
          setEditingOrder(null); setActiveNav('orders'); loadAll();
          if (afterAction === 'sticker_and_wa') { setStickerBatch([sOrd]); setWaPreviewOrder({ order: sOrd, type: 'receipt' }); } else if (afterAction === 'sticker_only') setStickerBatch([sOrd]);
        } catch (e) { alert(e.message); }
      };

      const handleStatusChange = async (order, newStatus) => {
        if (!confirm(`Change status to "${newStatus}"?`)) return;
        await supabase.from('orders').update({ status: newStatus }).eq('id', order.id);
        await supabase.from('activity_logs').insert({ order_id: order.id, action: `Status -> ${newStatus}`, performed_by: profile.id, performed_by_role: profile.role });
        loadAll();
      };

      const handleDownloadExcel = () => {
        const orderRows = orders.map((o) => ({ Order_No: o.order_no, Date: formatDateDDMMYYYY(o.created_at), Status: o.status, Lines_Summary: WhatsAppService.buildLinesSummary(o), Total_Pcs: o.total_pcs, Estimate_Total: o.estimate_total, Advance: o.advance_amount, Balance: o.balance_amount, Salesman: o.salesmen?.name || '', Promised_Date: formatDateDDMMYYYY(o.promised_date) }));
        if (window.XLSX) { const wb = window.XLSX.utils.book_new(); window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(orderRows), 'Orders'); window.XLSX.writeFile(wb, `SG_Sofa_Backup_${new Date().toISOString().split('T')[0]}.xlsx`); }
      };

      const handleMoveBackToPending = async (order) => {
        if (!isAdmin) return;
        if (['With Tailor', 'Silai Done', 'Ready', 'Delivered'].includes(order.status) && !confirm(`WARNING: Prod started. Move back anyway?`)) return;
        const reason = prompt(`Reason for moving ${order.order_no} back to Pending:`); if (!reason) return;
        await supabase.from('orders').update({ status: 'Estimate Given' }).eq('id', order.id); loadAll();
      };
      const handleArchiveOrder = async (order) => {
        if (!isAdmin) return; const reason = prompt(`Reason for archiving ${order.order_no}:`); if (!reason) return;
        await supabase.from('orders').update({ is_archived: true, archive_reason: reason }).eq('id', order.id); loadAll();
      };
      const handleRestoreOrder = async (order) => { if (!isAdmin) return; await supabase.from('orders').update({ is_archived: false, is_trashed: false }).eq('id', order.id); loadAll(); };
      const handleMoveToTrash = async (order) => {
        if (!isAdmin) return; const reason = prompt(`Reason for trashing ${order.order_no}:`); if (!reason) return;
        await supabase.from('orders').update({ is_trashed: true, trash_reason: reason }).eq('id', order.id); loadAll();
      };
      const handlePermanentDelete = async (order) => {
        if (!isAdmin) return; const t = prompt(`Type "${order.order_no}" to permanently delete:`); if (t !== order.order_no) return alert('Cancelled');
        await supabase.from('orders').delete().eq('id', order.id); loadAll();
      };

      const activeOrders = useMemo(() => orders.filter(o => !o.is_archived && !o.is_trashed), [orders]);
      const archivedOrders = useMemo(() => orders.filter(o => o.is_archived && !o.is_trashed), [orders]);
      const trashedOrders = useMemo(() => orders.filter(o => o.is_trashed), [orders]);

      const displayedOrders = useMemo(() => {
        const base = activeNav === 'archived' ? archivedOrders : activeNav === 'trash' ? trashedOrders : activeOrders;
        const q = searchQuery.toLowerCase().trim();
        return base.filter(o => {
          if (q && !(o.order_no?.toLowerCase().includes(q) || o.customer_name?.toLowerCase().includes(q) || o.mobile?.includes(q))) return false;
          if (activeNav === 'orders') {
            if (queueFilter === 'READY_DELIVERY') return o.status === 'Ready';
            if (queueFilter === 'BALANCE_DUE') return !['Measurement Pending', 'Estimate Given'].includes(o.status) && Number(o.balance_amount) > 0;
            if (queueFilter === 'UNCONFIRMED') return ['Measurement Pending', 'Estimate Given'].includes(o.status);
          }
          return true;
        });
      }, [activeOrders, archivedOrders, trashedOrders, activeNav, searchQuery, queueFilter]);

      const selectPage = (nav, filter = null) => { setActiveNav(nav); if (filter !== null) setQueueFilter(filter); setMobileDrawerOpen(false); };

      const renderSidebarContent = (isMobile = false) => (
        <div className="space-y-1.5 flex-1 flex flex-col">
          {isMobile && <div className="flex justify-between items-center pb-3 mb-2 border-b"><div className="flex items-center gap-2"><div className="w-7 h-7 bg-amber-600 rounded text-white flex items-center justify-center font-bold text-xs">SG</div><div><div className="font-bold text-sm">Shree Gayatri</div><div className="text-xs text-gray-500 uppercase">{profile.role}</div></div></div><button onClick={()=>setMobileDrawerOpen(false)} className="p-2 min-h-[44px] min-w-[44px]"><Icon name="X" size={20} /></button></div>}
          <button onClick={()=>{setEditingOrder(null); selectPage('new_order');}} className="w-full mb-3 bg-amber-700 text-white py-2.5 px-3 rounded font-bold text-sm flex justify-center items-center gap-2 min-h-[44px]"><Icon name="Plus" size={16}/> New Order / Estimate</button>
          
          <button onClick={()=>selectPage('orders', 'ALL')} className={`w-full text-left px-3 py-2.5 rounded text-sm font-medium flex justify-between min-h-[44px] md:min-h-0 ${activeNav==='orders'&&queueFilter==='ALL'?'bg-gray-900 text-white':'hover:bg-gray-100 text-gray-700'}`}><span className="flex items-center gap-2"><Icon name="ListOrdered" size={16}/> All Orders</span><span className="text-xs opacity-80">{activeOrders.length}</span></button>
          <button onClick={()=>selectPage('orders', 'READY_DELIVERY')} className={`w-full text-left px-3 py-2.5 rounded text-sm font-medium flex justify-between min-h-[44px] md:min-h-0 ${activeNav==='orders'&&queueFilter==='READY_DELIVERY'?'bg-gray-900 text-white':'hover:bg-gray-100 text-gray-700'}`}><span className="flex items-center gap-2"><Icon name="PackageCheck" size={16}/> Ready for Del.</span><span className="text-xs font-bold px-1.5 bg-emerald-100 text-emerald-800 rounded">{activeOrders.filter(o=>o.status==='Ready').length}</span></button>
          <button onClick={()=>selectPage('orders', 'BALANCE_DUE')} className={`w-full text-left px-3 py-2.5 rounded text-sm font-medium flex justify-between min-h-[44px] md:min-h-0 ${activeNav==='orders'&&queueFilter==='BALANCE_DUE'?'bg-gray-900 text-white':'hover:bg-gray-100 text-gray-700'}`}><span className="flex items-center gap-2"><Icon name="IndianRupee" size={16}/> Balance Due</span><span className="text-xs font-bold px-1.5 bg-red-100 text-red-800 rounded">{activeOrders.filter(o=>!['Measurement Pending','Estimate Given'].includes(o.status)&&Number(o.balance_amount)>0).length}</span></button>
          <button onClick={()=>selectPage('orders', 'UNCONFIRMED')} className={`w-full text-left px-3 py-2.5 rounded text-sm font-medium flex justify-between min-h-[44px] md:min-h-0 ${activeNav==='orders'&&queueFilter==='UNCONFIRMED'?'bg-gray-900 text-white':'hover:bg-gray-100 text-gray-700'}`}><span className="flex items-center gap-2"><Icon name="Clock" size={16}/> Unconfirmed</span><span className="text-xs opacity-80">{activeOrders.filter(o=>['Measurement Pending','Estimate Given'].includes(o.status)).length}</span></button>
          
          {isAdmin && (
            <div className="pt-3 mt-3 border-t space-y-1.5">
              <div className="px-3 text-[11px] font-bold uppercase text-gray-400">Admin Controls</div>
              <button onClick={()=>selectPage('reports')} className={`w-full text-left px-3 py-2.5 rounded text-sm font-medium flex items-center gap-2 min-h-[44px] md:min-h-0 ${activeNav==='reports'?'bg-gray-900 text-white':'hover:bg-gray-100 text-gray-700'}`}><Icon name="BarChart3" size={16}/> Reports & Analytics</button>
              <button onClick={()=>selectPage('settings')} className={`w-full text-left px-3 py-2.5 rounded text-sm font-medium flex items-center gap-2 min-h-[44px] md:min-h-0 ${activeNav==='settings'?'bg-gray-900 text-white':'hover:bg-gray-100 text-gray-700'}`}><Icon name="Settings" size={16}/> Shop Settings & Data</button>
              <button onClick={()=>selectPage('archived')} className={`w-full text-left px-3 py-2.5 rounded text-sm font-medium flex items-center justify-between gap-2 min-h-[44px] md:min-h-0 ${activeNav==='archived'?'bg-gray-900 text-white':'hover:bg-gray-100 text-gray-700'}`}><span className="flex items-center gap-2"><Icon name="Archive" size={16}/> Archived</span><span className="text-xs opacity-80">{archivedOrders.length}</span></button>
              <button onClick={()=>selectPage('trash')} className={`w-full text-left px-3 py-2.5 rounded text-sm font-medium flex items-center justify-between gap-2 min-h-[44px] md:min-h-0 ${activeNav==='trash'?'bg-red-900 text-white':'hover:bg-gray-100 text-gray-700'}`}><span className="flex items-center gap-2"><Icon name="Trash" size={16}/> Trash (30d)</span><span className="text-xs opacity-80">{trashedOrders.length}</span></button>
            </div>
          )}
          <div className="mt-auto pt-3 border-t text-xs text-gray-500 px-2">
            <div>Fixed Rate Policy Active</div><div>Round-up: 0.25 ft increments</div>
          </div>
          {isMobile && <div className="pt-3 border-t space-y-2"><button onClick={triggerInstall} className="w-full px-3 py-2.5 bg-gray-100 rounded text-sm font-semibold min-h-[44px] flex justify-center gap-2"><Icon name="Download" size={16}/> Install App</button><button onClick={onLogout} className="w-full px-3 py-2.5 bg-red-50 text-red-700 rounded text-sm font-semibold min-h-[44px] flex justify-center gap-2"><Icon name="LogOut" size={16}/> Logout</button></div>}
        </div>
      );

      return (
        <div className="min-h-screen flex flex-col w-full overflow-x-hidden">
          <header className="bg-gray-900 text-white px-3 md:px-4 py-2 flex justify-between items-center sticky top-0 z-30 no-print">
            <div className="flex items-center gap-2.5 min-w-0">
              <button onClick={()=>setMobileDrawerOpen(true)} className="md:hidden p-2 -ml-1 min-w-[44px] min-h-[44px] rounded text-gray-200"><Icon name="Menu" size={22} /></button>
              <div className="w-8 h-8 md:w-7 md:h-7 bg-amber-600 rounded flex items-center justify-center font-bold text-xs shrink-0">SG</div>
              <div className="min-w-0">
                <div className="font-bold text-sm leading-tight hidden md:block">Shree Gayatri Handloom House — Sofa Dept</div>
                <div className="font-bold text-sm md:hidden">Sofa ERP</div>
                <div className="text-xs text-gray-400 truncate">Role: <strong className="text-white uppercase">{profile.role}</strong> • Server RLS</div>
              </div>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              <button onClick={()=>{setGlobalSearchOpen(true); setGlobalSearchTerm('');}} className="md:hidden p-2 min-h-[44px] min-w-[44px] bg-gray-800 rounded flex items-center justify-center"><Icon name="Search" size={18}/></button>
              <button onClick={()=>{setGlobalSearchOpen(true); setGlobalSearchTerm('');}} className="hidden md:inline-flex bg-gray-800 border-gray-700 px-3 py-1.5 rounded text-xs items-center gap-2"><Icon name="Search" size={14}/> Quick Search (Ctrl+K)</button>
              <button onClick={handleDownloadExcel} className="hidden md:inline-flex bg-gray-800 border-gray-700 px-3 py-1.5 rounded text-xs items-center gap-1"><Icon name="Download" size={14}/> Excel Backup</button>
              <button onClick={triggerInstall} className="hidden md:inline-flex bg-gray-800 border-gray-700 px-3 py-1.5 rounded text-xs items-center gap-1"><Icon name="Download" size={14}/> Install</button>
              <button onClick={onLogout} className="hidden md:inline-flex bg-gray-800 border-gray-700 px-3 py-1.5 rounded text-xs items-center gap-1"><Icon name="LogOut" size={14}/> Logout</button>
            </div>
          </header>

          {mobileDrawerOpen && <div className="fixed inset-0 z-50 md:hidden flex no-print"><div className="fixed inset-0 bg-black/50" onClick={()=>setMobileDrawerOpen(false)}/><aside className="relative w-72 max-w-[82vw] bg-white h-full p-4 overflow-y-auto flex flex-col">{renderSidebarContent(true)}</aside></div>}

          <div className="flex-1 flex overflow-x-hidden">
            <aside className="hidden md:flex w-56 bg-white border-r p-3 flex-col shrink-0 no-print">{renderSidebarContent(false)}</aside>
            <main className="flex-1 min-w-0 p-3 md:p-5">
              {activeNav === 'new_order' && <OrderEntryScreen supabase={supabase} existingOrder={editingOrder} allOrders={activeOrders} salesmen={salesmen} notes={notes} currentRole={profile.role} onCancel={()=>{setEditingOrder(null); setActiveNav('orders');}} onCommitOrder={handleCommitOrder} />}
              {['orders', 'archived', 'trash'].includes(activeNav) && (
                <>
                  {activeNav === 'orders' && <ImportantNotesBoard notes={notes} orders={activeOrders} onMarkDone={async (n) => { await supabase.from('important_notes').update({status:'done'}).eq('id', n.id); loadAll(); }} onOpenOrder={(o)=>{setEditingOrder(o); setActiveNav('new_order');}} />}
                  <div className="bg-white border rounded shadow-sm">
                    <div className="p-3 border-b bg-gray-50 flex flex-wrap justify-between items-center gap-2">
                      <div className="flex items-center gap-2"><h3 className="font-bold text-sm uppercase">{activeNav==='archived'?'Archived':activeNav==='trash'?'Trash (30d)':'Active Orders Queue'}</h3><input placeholder="Search No, Name..." className="border rounded px-3 py-1.5 text-sm" value={searchQuery} onChange={(e)=>setSearchQuery(e.target.value)}/></div>
                      <div className="flex items-center gap-2">
                        {selectedIds.length > 0 && <button onClick={()=>setStickerBatch(orders.filter(o=>selectedIds.includes(o.id)))} className="px-3 py-2 bg-amber-700 text-white rounded text-xs font-bold min-h-[44px] md:min-h-0">Batch Print ({selectedIds.length})</button>}
                        <button onClick={handleDownloadExcel} className="md:hidden px-3 py-2 bg-gray-800 text-white rounded text-xs font-bold min-h-[44px]"><Icon name="Download" size={14}/></button>
                      </div>
                    </div>
                    {/* Mobile Card List */}
                    <div className="md:hidden divide-y">
                      {displayedOrders.length===0 ? <div className="p-8 text-center text-gray-500">No orders found.</div> : displayedOrders.map(o => {
                        const calc = calcOrderEstimate(o); const isConf = !['Measurement Pending','Estimate Given'].includes(o.status);
                        return (
                          <div key={o.id} onClick={()=>{setEditingOrder(o); setActiveNav('new_order');}} className="p-4 space-y-2.5">
                            <div className="flex justify-between items-start"><div><div className="font-bold text-base">{o.order_no}</div><div className="font-semibold text-base">{o.customer_name}</div></div><StatusChip status={o.status}/></div>
                            <div className="text-xs space-y-0.5">{calc.lineCalcs.map((lc,i)=><div key={i}>{lc.partLabel} - {lc.design_name}: {lc.displaySegments.join('+')}</div>)}</div>
                            <div className="flex justify-between pt-1 border-t"><div className="text-xs">Due: {formatDateDDMMYYYY(o.promised_date)}</div><div className="text-sm text-red-700 font-bold">Bal: {formatINR(o.balance_amount)}</div></div>
                            <div className="pt-2 flex flex-wrap gap-2" onClick={e=>e.stopPropagation()}>
                              {isConf && <button onClick={()=>setStickerBatch([o])} className="flex-1 py-2 border rounded text-xs font-semibold min-h-[44px]">Sticker</button>}
                              <button onClick={()=>setWaPreviewOrder({ order: o, type: isConf ? 'receipt' : 'estimate' })} className="flex-1 py-2 bg-emerald-700 text-white rounded text-xs font-semibold min-h-[44px] flex items-center justify-center gap-1"><Icon name="MessageSquare" size={14}/> WA</button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    {/* Desktop Table */}
                    <div className="hidden md:block overflow-x-auto max-h-[75vh]">
                      <table className="w-full text-left tabular-nums text-sm"><thead className="bg-gray-100 text-gray-600 text-xs uppercase sticky top-0 border-b"><tr><th className="p-2.5 w-8"><input type="checkbox" onChange={e=>setSelectedIds(e.target.checked?displayedOrders.map(o=>o.id):[])}/></th><th className="p-2.5">Order</th><th className="p-2.5">Customer</th><th className="p-2.5">Lines (Part - Design)</th><th className="p-2.5">Status</th><th className="p-2.5 text-right">Balance</th><th className="p-2.5 text-right">Actions</th></tr></thead><tbody className="divide-y">
                        {displayedOrders.map(o => {
                          const calc = calcOrderEstimate(o); const isConf = !['Measurement Pending','Estimate Given'].includes(o.status);
                          return (
                            <tr key={o.id} className="hover:bg-gray-50"><td className="p-2.5"><input type="checkbox" checked={selectedIds.includes(o.id)} onChange={e=>setSelectedIds(p=>e.target.checked?[...p,o.id]:p.filter(id=>id!==o.id))}/></td><td className="p-2.5 font-bold">{o.order_no}</td><td className="p-2.5"><div className="font-semibold">{o.customer_name}</div><div className="text-xs text-gray-500">{o.mobile}</div></td><td className="p-2.5 text-xs space-y-0.5">{calc.lineCalcs.map((lc,i)=><div key={i}>{lc.partLabel} - {lc.design_name}</div>)}</td><td className="p-2.5"><StatusChip status={o.status}/></td><td className="p-2.5 text-right font-bold text-red-700">{formatINR(o.balance_amount)}</td><td className="p-2.5 text-right whitespace-nowrap"><div className="inline-flex gap-1"><button onClick={()=>{setEditingOrder(o);setActiveNav('new_order');}} className="px-2 py-1 border rounded text-xs">Open</button>{isConf&&activeNav==='orders'&&<button onClick={()=>setStickerBatch([o])} className="px-2 py-1 border rounded text-xs" title="Sticker">🖨️</button>}<button onClick={()=>setTimelineOrder(o)} className="px-2 py-1 border rounded text-xs" title="History"><Icon name="History" size={14}/></button><button onClick={()=>setWaPreviewOrder({ order: o, type: isConf ? 'receipt' : 'estimate' })} className="px-2 py-1 bg-emerald-700 text-white rounded text-xs">WA</button>{isAdmin&&isConf&&activeNav==='orders'&&<button onClick={()=>handleMoveBackToPending(o)} className="px-2 py-1 bg-amber-100 text-amber-900 border border-amber-300 rounded text-xs font-semibold">Move Back</button>}{isAdmin&&activeNav==='orders'&&<button onClick={()=>handleArchiveOrder(o)} className="px-2 py-1 bg-gray-100 border rounded text-xs">Archive</button>}{isAdmin&&activeNav==='orders'&&<button onClick={()=>handleMoveToTrash(o)} className="px-2 py-1 bg-red-50 text-red-700 border rounded text-xs">Delete</button>}{(activeNav==='archived'||activeNav==='trash')&&isAdmin&&<button onClick={()=>handleRestoreOrder(o)} className="px-2 py-1 bg-emerald-700 text-white rounded text-xs">Restore</button>}{activeNav==='trash'&&isAdmin&&<button onClick={()=>handlePermanentDelete(o)} className="px-2 py-1 bg-red-700 text-white rounded text-xs font-bold">Delete Perm</button>}</div></td></tr>
                          );
                        })}
                      </tbody></table>
                    </div>
                  </div>
                </>
              )}
              {isAdmin && activeNav === 'reports' && <AdminReportsView orders={activeOrders} salesmen={salesmen} settings={settings} pieceLogs={pieceLogs} onDownloadExcel={handleDownloadExcel} />}
              {isAdmin && activeNav === 'settings' && (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <div className="bg-white border rounded p-4 space-y-3"><h3 className="font-bold">Device Approval</h3><div className="divide-y border rounded">{devices.map(d=><div key={d.id} className="p-3 flex justify-between items-center text-xs"><div><div className="font-bold">{d.device_name||'Device'} ({d.requested_role})</div><div className="text-gray-500 font-mono">{d.device_fingerprint}</div><div className="mt-0.5">Status: <strong className="uppercase">{d.status}</strong></div></div><div className="flex gap-1.5">{d.status!=='approved'&&<button onClick={async()=>{await supabase.from('devices').update({status:'approved',approved_by:profile.id}).eq('id',d.id);loadAll();}} className="px-2.5 py-1.5 bg-emerald-700 text-white rounded font-bold">Allow</button>}<button onClick={async()=>{await supabase.from('devices').delete().eq('id',d.id);loadAll();}} className="px-2.5 py-1.5 bg-red-100 text-red-700 rounded font-bold">Remove</button></div></div>)}</div></div>
                  <div className="bg-white border rounded p-4 space-y-3"><h3 className="font-bold">WhatsApp Templates</h3><div className="grid grid-cols-2 gap-2"><div><label className="block text-xs font-semibold">Primary Phone</label><input className="w-full border rounded px-2.5 py-1.5 text-sm" value={settings.shop_phone||''} onChange={e=>setSettings({...settings, shop_phone:e.target.value})}/></div></div>{Object.keys(DEFAULT_WA_TEMPLATES).map(tKey=>{const cur = settings.wa_templates?.[tKey]||DEFAULT_WA_TEMPLATES[tKey]; return <div key={tKey} className="border rounded p-2.5 space-y-1.5"><div className="flex justify-between"><span className="font-bold text-xs uppercase">{tKey}</span></div><textarea rows={3} className="w-full border rounded p-2 text-xs font-mono" value={cur.text||''} onChange={e=>setSettings({...settings, wa_templates:{...settings.wa_templates, [tKey]:{...cur, text:e.target.value}}})}/></div>;})}<button onClick={async()=>{await supabase.from('app_settings').update({shop_phone:settings.shop_phone, wa_templates:settings.wa_templates}).eq('id',1); alert('Saved');}} className="w-full bg-gray-900 text-white py-2.5 rounded font-bold text-xs min-h-[44px]">Save</button></div>
                </div>
              )}
            </main>
          </div>
          {globalSearchOpen && <div className="fixed inset-0 bg-black/50 flex items-start justify-center z-50 pt-14 p-4" onClick={()=>setGlobalSearchOpen(false)}><div className="bg-white rounded border max-w-lg w-full shadow-xl overflow-hidden" onClick={e=>e.stopPropagation()}><div className="p-3 border-b flex items-center gap-2"><Icon name="Search" size={16}/><input autoFocus placeholder="Type Order No, Name..." className="w-full text-sm focus:outline-none" value={globalSearchTerm} onChange={e=>setGlobalSearchTerm(e.target.value)}/><button onClick={()=>setGlobalSearchOpen(false)} className="text-xs text-gray-500">ESC</button></div><div className="max-h-72 overflow-y-auto divide-y">{globalSearchTerm && displayedOrders.filter(o=>o.order_no.toLowerCase().includes(globalSearchTerm.toLowerCase())||o.customer_name.toLowerCase().includes(globalSearchTerm.toLowerCase())).map(o=><button key={o.id} onClick={()=>{setGlobalSearchOpen(false); setEditingOrder(o); setActiveNav('new_order');}} className="w-full text-left px-4 py-3 hover:bg-gray-50 flex justify-between"><div><span className="font-bold text-sm">{o.order_no}</span><span className="ml-2 text-sm">{o.customer_name}</span></div><StatusChip status={o.status}/></button>)}</div></div></div>}
          {stickerBatch && <StickerPrintModal ordersList={stickerBatch} settings={settings} onClose={()=>setStickerBatch(null)} onLogReprint={async(o)=>{await supabase.from('activity_logs').insert({order_id:o.id, action:'Sticker printed', performed_by:profile.id, performed_by_role:profile.role});}} />}
          {timelineOrder && <OrderTimelineModal order={timelineOrder} activityLogs={activityLogs} onClose={()=>setTimelineOrder(null)} />}
          {waPreviewOrder && <WhatsAppPreviewModal type={waPreviewOrder.type} order={waPreviewOrder.order} settings={settings} onClose={()=>setWaPreviewOrder(null)} />}
        </div>
      );
    }

    const STAFF_ACCOUNTS = [{ label: 'Owner (Admin)', email: 'admin@shop.local', role: 'admin' }, { label: 'Sales Counter', email: 'sales@shop.local', role: 'sales' }, { label: 'Cutting Master', email: 'cutting@shop.local', role: 'cutting' }, { label: 'Tailor 1', email: 'tailor1@shop.local', role: 'tailor_1' }, { label: 'Tailor 2', email: 'tailor2@shop.local', role: 'tailor_2' }];

    function App() {
      const [savedKey, setSavedKey] = useState(() => localStorage.getItem('sg_supabase_key') || '');
      const [keyInput, setKeyInput] = useState('');
      const [supabaseClient, setSupabaseClient] = useState(null);
      const [session, setSession] = useState(null);
      const [profile, setProfile] = useState(null);
      const [deviceStatus, setDeviceStatus] = useState('checking');
      const [selectedStaff, setSelectedStaff] = useState(STAFF_ACCOUNTS[0]);
      const [pin, setPin] = useState('');
      const scannedOrderNo = new URLSearchParams(window.location.search).get('scan');

      useEffect(() => {
        if (savedKey && savedKey.length > 15) {
          const client = createClient(DEFAULT_SUPABASE_URL, savedKey.trim(), { global: { headers: { 'x-device-fp': getDeviceFingerprint() } } });
          setSupabaseClient(client);
        }
      }, [savedKey]);

      useEffect(() => {
        if (!supabaseClient) return;
        supabaseClient.auth.getSession().then(({ data: { session } }) => { setSession(session); if (session) verifyProfileAndDevice(supabaseClient, session.user.id); });
        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_e, sess) => {
          setSession(sess); if (sess) verifyProfileAndDevice(supabaseClient, sess.user.id); else { setProfile(null); setDeviceStatus('unauthenticated'); }
        });
        return () => subscription.unsubscribe();
      }, [supabaseClient]);

      const verifyProfileAndDevice = async (client, userId) => {
        const { data: prof } = await client.from('profiles').select('*').eq('id', userId).maybeSingle();
        if (!prof) return; setProfile(prof);
        const fp = getDeviceFingerprint(); const devName = navigator.userAgent.slice(0, 45);
        const { data: dev } = await client.from('devices').select('*').eq('device_fingerprint', fp).maybeSingle();
        if (!dev) {
          if (prof.role === 'admin') {
            const { data: bootStatus, error: rpcErr } = await client.rpc('bootstrap_first_admin_device', { p_fp: fp, p_name: devName });
            if (!rpcErr && bootStatus === 'approved') { setDeviceStatus('approved'); return; }
          }
          await client.from('devices').insert({ device_fingerprint: fp, device_name: devName, requested_role: prof.role, status: 'pending' });
          setDeviceStatus('pending');
        } else setDeviceStatus(dev.status);
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        const { error } = await supabaseClient.auth.signInWithPassword({ email: selectedStaff.email, password: `SG_${pin}_PIN` });
        if (error) alert('Invalid PIN.'); setPin('');
      };

      if (!supabaseClient) {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4"><div className="bg-white border rounded p-6 max-w-sm w-full space-y-4 text-center"><h1 className="font-bold text-lg">Shree Gayatri Furnishing Hub</h1><input placeholder="sb_publishable_..." className="w-full border rounded px-3 py-2 text-sm font-mono min-h-[44px]" value={keyInput} onChange={(e) => setKeyInput(e.target.value)} /><button onClick={() => { localStorage.setItem('sg_supabase_key', keyInput); setSavedKey(keyInput); }} className="w-full bg-amber-700 text-white py-3 rounded font-bold text-sm min-h-[44px]">Connect Database</button></div></div>
        );
      }
      if (session && deviceStatus !== 'approved') {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4"><div className="bg-white border rounded p-6 max-w-sm w-full text-center space-y-4"><h2 className="font-bold text-base">Approval Pending</h2><p className="text-xs text-gray-600">ID: <strong className="font-mono">{getDeviceFingerprint()}</strong></p><button onClick={() => verifyProfileAndDevice(supabaseClient, session.user.id)} className="w-full bg-amber-700 text-white py-2.5 rounded text-xs font-bold min-h-[44px]">Refresh Approval Status</button><button onClick={() => supabaseClient.auth.signOut()} className="text-xs text-red-700 underline block mx-auto min-h-[44px] p-2">Logout</button></div></div>
        );
      }
      if (!session || !profile) {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4"><div className="bg-white border rounded p-6 max-w-sm w-full shadow-sm space-y-5"><div className="border-b pb-3 text-center"><h1 className="font-bold text-base">Shree Gayatri Furnishing Hub</h1><p className="text-xs text-gray-500">Sofa Cover Dept — Secure Sign In</p></div><form onSubmit={handleLogin} className="space-y-3.5"><div><label className="block text-xs font-semibold mb-1">Role</label><select className="w-full border rounded px-3 py-2 text-sm font-semibold bg-white min-h-[44px]" value={selectedStaff.email} onChange={(e) => setSelectedStaff(STAFF_ACCOUNTS.find((s) => s.email === e.target.value))}>{STAFF_ACCOUNTS.map((s) => <option key={s.email} value={s.email}>{s.label}</option>)}</select></div><div><label className="block text-xs font-semibold mb-1">4-Digit PIN</label><input type="password" maxLength={4} inputMode="numeric" placeholder="••••" className="w-full border rounded px-3 py-2 text-center text-xl tracking-widest font-bold min-h-[44px]" value={pin} onChange={(e) => setPin(e.target.value)} /></div><button className="w-full bg-gray-900 text-white py-3 rounded font-bold text-sm min-h-[44px]">Sign In</button></form></div></div>
        );
      }
      if (['admin', 'sales'].includes(profile.role)) return <DesktopERPView supabase={supabaseClient} profile={profile} savedKey={savedKey} triggerInstall={()=>{}} onLogout={() => supabaseClient.auth.signOut()} />;
      return <div className="min-h-screen bg-gray-100"><header className="bg-gray-900 text-white px-4 py-3 flex justify-between items-center"><div className="font-bold text-sm">Shree Gayatri</div><button onClick={() => supabaseClient.auth.signOut()} className="bg-gray-800 border px-3 py-2 rounded text-xs font-semibold min-h-[44px]">Logout</button></header><ShopFloorMobileView supabase={supabaseClient} profile={profile} scannedOrderNo={scannedOrderNo} /></div>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
