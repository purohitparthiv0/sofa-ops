    // =========================================================================
    // MOBILE-FIRST CUTTING & TAILOR WORK QUEUES (Large Touch Targets, 1 Task/Screen)
    // =========================================================================
    function ShopFloorMobileView({ db, saveDb, currentRole, scannedOrderNo }) {
      const [selectedTailor, setSelectedTailor] = useState({});
      const [undoState, setUndoState] = useState(null);

      const queueOrders = useMemo(() => {
        const list = db.orders.filter((o) => {
          if (currentRole === 'cutting') return o.status === 'Cutting Pending';
          if (currentRole === 'tailor_1' || currentRole === 'tailor_2') {
            return o.status === 'With Tailor' && o.assigned_tailor === currentRole;
          }
          return false;
        });
        return list.sort((a, b) => (a.promised_date || '9999-12-31').localeCompare(b.promised_date || '9999-12-31'));
      }, [db.orders, currentRole]);

      const startOfDay = new Date();
      startOfDay.setHours(0, 0, 0, 0);
      const startOfMonth = new Date(startOfDay.getFullYear(), startOfDay.getMonth(), 1);

      const myLogs = db.pieceLogs.filter((l) => l.tailor_role === currentRole);
      const todayPcs = myLogs.filter((l) => new Date(l.logged_at) >= startOfDay).reduce((s, l) => s + Number(l.pcs_count), 0);
      const monthPcs = myLogs.filter((l) => new Date(l.logged_at) >= startOfMonth).reduce((s, l) => s + Number(l.pcs_count), 0);

      const triggerUndoableChange = (prevDbSnapshot, nextDbSnapshot, label) => {
        saveDb(nextDbSnapshot);
        if (undoState?.timer) clearTimeout(undoState.timer);
        const timer = setTimeout(() => setUndoState(null), 10000);
        setUndoState({ prevDb: prevDbSnapshot, label, timer });
      };

      const handleUndo = () => {
        if (!undoState) return;
        clearTimeout(undoState.timer);
        saveDb(undoState.prevDb);
        setUndoState(null);
      };

      const handleCuttingComplete = (order) => {
        const tailor = selectedTailor[order.id];
        if (!tailor) return alert('Select Tailor 1 or Tailor 2 before confirming.');
        const tailorLabel = tailor === 'tailor_1' ? 'Tailor 1' : 'Tailor 2';
        if (!confirm(`Confirm cutting complete for ${order.order_no} and assign to ${tailorLabel}?`)) return;

        const nowIso = new Date().toISOString();
        const nextOrders = db.orders.map((o) =>
          o.id === order.id ? { ...o, status: 'With Tailor', assigned_tailor: tailor, stage_changed_at: nowIso } : o
        );
        const nextActivity = [
          { id: crypto.randomUUID(), order_no: order.order_no, action: `Cutting completed -> Assigned to ${tailorLabel}`, role: currentRole, created_at: nowIso },
          ...db.activityLogs
        ];
        triggerUndoableChange(db, { ...db, orders: nextOrders, activityLogs: nextActivity }, `${order.order_no} assigned to ${tailorLabel}`);
      };

      const handleStitchingComplete = (order) => {
        if (!confirm(`Confirm stitching complete for ${order.order_no} (${order.total_pcs} pcs)?`)) return;
        const nowIso = new Date().toISOString();
        const rate = db.settings?.tailorRates?.[currentRole] || 150;
        const nextOrders = db.orders.map((o) =>
          o.id === order.id ? { ...o, status: 'Silai Done', stage_changed_at: nowIso } : o
        );
        const nextPieceLogs = [
          {
            id: crypto.randomUUID(),
            order_no: order.order_no,
            tailor_role: currentRole,
            pcs_count: Number(order.total_pcs) || 1,
            rate_at_time: rate,
            is_manual_adjustment: false,
            logged_at: nowIso
          },
          ...db.pieceLogs
        ];
        const nextActivity = [
          { id: crypto.randomUUID(), order_no: order.order_no, action: `Stitching completed (${order.total_pcs} pcs)`, role: currentRole, created_at: nowIso },
          ...db.activityLogs
        ];
        triggerUndoableChange(db, { ...db, orders: nextOrders, pieceLogs: nextPieceLogs, activityLogs: nextActivity }, `${order.order_no} marked Silai Done`);
      };

      return (
        <div className="max-w-xl mx-auto p-3 space-y-4">
          {undoState && (
            <div className="bg-gray-900 text-white px-4 py-3 rounded flex justify-between items-center shadow-md">
              <span className="text-sm font-medium">{undoState.label}</span>
              <button onClick={handleUndo} className="bg-amber-600 text-white px-3 py-2 rounded text-xs font-bold uppercase min-h-[44px]">
                Undo (10s)
              </button>
            </div>
          )}

          {currentRole.startsWith('tailor') && (
            <div className="bg-white border border-gray-300 rounded p-4 grid grid-cols-2 divide-x divide-gray-200 text-center tabular-nums">
              <div>
                <div className="text-xs font-semibold text-gray-500 uppercase">Today Stitched</div>
                <div className="text-2xl font-bold text-gray-900 mt-0.5">{todayPcs} pcs</div>
              </div>
              <div>
                <div className="text-xs font-semibold text-gray-500 uppercase">This Month</div>
                <div className="text-2xl font-bold text-amber-800 mt-0.5">{monthPcs} pcs</div>
              </div>
            </div>
          )}

          <div className="flex justify-between items-center px-1">
            <h2 className="font-bold text-base text-gray-900">
              {currentRole === 'cutting' ? `To Cut (${queueOrders.length})` : `To Stitch (${queueOrders.length})`}
            </h2>
            <span className="text-xs text-gray-500">Sorted by delivery date</span>
          </div>

          {queueOrders.length === 0 ? (
            <div className="bg-white border border-gray-300 rounded p-10 text-center space-y-1">
              <div className="font-bold text-gray-800">Queue is clear</div>
              <p className="text-xs text-gray-500">No pending orders assigned to your station right now.</p>
            </div>
          ) : (
            queueOrders.map((order) => {
              const urgency = getDueUrgency(order.promised_date, order.status);
              const isScanned = scannedOrderNo === order.order_no;
              return (
                <div
                  key={order.id}
                  className={`bg-white rounded border-2 p-4 space-y-3 ${
                    isScanned ? 'border-amber-600' : urgency?.level === 'overdue' ? 'border-red-400' : 'border-gray-300'
                  }`}
                >
                  <div className="flex justify-between items-start border-b border-gray-200 pb-2.5">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-lg text-gray-900">{order.order_no}</span>
                        {urgency && (
                          <span className={`px-2 py-0.5 rounded text-xs font-bold ${
                            urgency.level === 'overdue' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-900'
                          }`}>
                            {urgency.label}
                          </span>
                        )}
                      </div>
                      <div className="text-base font-semibold text-gray-800 mt-0.5">{order.design_name}</div>
                    </div>
                    <div className="text-right tabular-nums">
                      <div className="text-xs font-semibold text-gray-500">DELIVERY</div>
                      <div className="text-sm font-bold text-gray-900">{formatDateDDMMYYYY(order.promised_date)}</div>
                      <div className="text-xs font-bold text-amber-800 mt-0.5">{order.total_pcs} PCS</div>
                    </div>
                  </div>

                  <div className="bg-gray-50 border border-gray-200 rounded p-3 space-y-1.5 text-sm tabular-nums">
                    {getOrderLines(order).map((l, i) => (
                      <div key={i}>
                        <span className="text-gray-500 font-semibold">{linePartName(l)}:</span> <strong>{lineRowsText(l)}</strong> ({Number(l.qty) || 0} {l.unit === 'Pcs' ? 'pcs' : 'ft'})
                        {l.design ? <span className="text-gray-600"> — {l.design}</span> : null}
                        {l.pending ? <span className="text-red-700 font-bold"> — MEASUREMENT PENDING</span> : null}
                      </div>
                    ))}
                    {order.tailor_notes && (
                      <div className="pt-1.5 border-t border-gray-200 text-gray-900 font-medium">
                        <span className="text-red-700 font-bold">Note:</span> {order.tailor_notes}
                      </div>
                    )}
                  </div>

                  {currentRole === 'cutting' && (
                    <div className="space-y-2.5 pt-1">
                      <div className="grid grid-cols-2 gap-2">
                        {['tailor_1', 'tailor_2'].map((tKey) => (
                          <button
                            key={tKey}
                            type="button"
                            onClick={() => setSelectedTailor({ ...selectedTailor, [order.id]: tKey })}
                            className={`py-3.5 rounded border-2 font-bold text-base min-h-[48px] ${
                              selectedTailor[order.id] === tKey
                                ? 'bg-gray-900 text-white border-gray-900'
                                : 'bg-white text-gray-800 border-gray-300'
                            }`}
                          >
                            {tKey === 'tailor_1' ? 'Tailor 1' : 'Tailor 2'}
                          </button>
                        ))}
                      </div>
                      <button
                        type="button"
                        onClick={() => handleCuttingComplete(order)}
                        className="w-full bg-amber-700 active:bg-amber-800 text-white py-4 rounded font-bold text-base min-h-[48px]"
                      >
                        Confirm Cutting Done
                      </button>
                    </div>
                  )}

                  {currentRole.startsWith('tailor') && (
                    <button
                      type="button"
                      onClick={() => handleStitchingComplete(order)}
                      className="w-full bg-emerald-700 active:bg-emerald-800 text-white py-4 rounded font-bold text-base min-h-[48px]"
                    >
                      Mark Stitching Done ({order.total_pcs} Pcs)
                    </button>
                  )}
                </div>
              );
            })
          )}
        </div>
      );
    }

    // =========================================================================
    // ADMIN REPORTS MODULE
    // - Desktop (>= 768px): Tabbed report view with inline filters
    // - Mobile (< 768px): Collapsible "Filters" button + Single-column stacked sections in exact priority order:
    //   1. Today's summary (2 stat tiles per row)
    //   2. Pending orders (with stage visual bars + scrollable table)
    //   3. Late orders
    //   4. Ready/Delivery pending
    //   5. Balance due
    //   6. Measurement visits, Tailor report, Salesman report, Unconfirmed follow-up
    // =========================================================================
    function AdminReportsView({ db, onDownloadExcel }) {
      const todayIso = new Date().toISOString().split('T')[0];
      const thirtyDaysAgoIso = new Date(Date.now() - 30 * 86400000).toISOString().split('T')[0];

      const [reportType, setReportType] = useState('day_end');
      const [fromDate, setFromDate] = useState(thirtyDaysAgoIso);
      const [toDate, setToDate] = useState(todayIso);
      const [mobileFiltersOpen, setMobileFiltersOpen] = useState(false);

      const inRange = (isoStr) => {
        if (!isoStr) return false;
        const d = isoStr.split('T')[0];
        return d >= fromDate && d <= toDate;
      };

      const rangeOrders = db.orders.filter((o) => inRange(o.created_at));
      const confirmedRange = rangeOrders.filter((o) => !['Measurement Pending', 'Estimate Given'].includes(o.status));

      // Today's summary metrics
      const todayOrders = db.orders.filter((o) => o.created_at?.startsWith(todayIso));
      const todayConfirmed = todayOrders.filter((o) => !['Measurement Pending', 'Estimate Given'].includes(o.status));
      const cashAdv = todayConfirmed.filter((o) => o.payment_mode === 'Cash').reduce((s, o) => s + Number(o.advance_amount), 0);
      const upiAdv = todayConfirmed.filter((o) => o.payment_mode === 'UPI').reduce((s, o) => s + Number(o.advance_amount), 0);
      const cardAdv = todayConfirmed.filter((o) => o.payment_mode === 'Card').reduce((s, o) => s + Number(o.advance_amount), 0);
      const totalTodayBalance = todayConfirmed.reduce((s, o) => s + Number(o.balance_amount), 0);

      const lateOrdersList = db.orders.filter(
        (o) => o.status !== 'Delivered' && getDueUrgency(o.promised_date, o.status)?.level === 'overdue'
      );
      const readyDeliveryList = db.orders.filter((o) => o.status === 'Ready');
      const balanceDueList = db.orders.filter(
        (o) => !['Measurement Pending', 'Estimate Given'].includes(o.status) && Number(o.balance_amount) > 0
      );

      const shareDailySummaryWhatsApp = () => {
        const text =
          `*Shree Gayatri Handloom House — Sofa Cover Dept*\n` +
          `Daily Closing (${formatDateDDMMYYYY(todayIso)})\n\n` +
          `• Orders Created: ${todayOrders.length}\n` +
          `• Confirmed: ${todayConfirmed.length}\n` +
          `• Ready: ${readyDeliveryList.length}\n` +
          `• Delivered Today: ${db.orders.filter((o) => o.status === 'Delivered' && o.stage_changed_at?.startsWith(todayIso)).length}\n\n` +
          `*Advance Collected Today:*\n` +
          `Cash: ${formatINR(cashAdv)} | UPI: ${formatINR(upiAdv)} | Card: ${formatINR(cardAdv)}\n` +
          `Total Advance: *${formatINR(cashAdv + upiAdv + cardAdv)}*\n` +
          `Total Pending Customer Dues: *${formatINR(balanceDueList.reduce((s, o) => s + Number(o.balance_amount), 0))}*`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      };

      const REPORT_TABS = [
        { id: 'day_end', label: '1. Day-End Closing' },
        { id: 'aging', label: '2. Stage Aging & Bottlenecks' },
        { id: 'late_delivery', label: '3. Late & Delivery Pending' },
        { id: 'visits', label: '4. Measurement Visits' },
        { id: 'tailors', label: '5. Tailor Piece & Earnings' },
        { id: 'salesmen', label: '6. Salesman Conversion' },
        { id: 'unconfirmed', label: '7. Unconfirmed Follow-Up' },
        { id: 'dues', label: '8. Customer Dues' }
      ];

      const pendingStages = ['Measurement Pending', 'Estimate Given', 'Cutting Pending', 'With Tailor', 'Silai Done', 'Ready'];
      const maxStageCount = Math.max(1, ...pendingStages.map((st) => db.orders.filter((o) => o.status === st).length));

      return (
        <div className="space-y-4">
          {/* Mobile Collapsible "Filters" Button Bar (< 768px) */}
          <div className="md:hidden bg-white border border-gray-300 rounded p-3 space-y-3 no-print">
            <div className="flex justify-between items-center gap-2">
              <div className="text-sm font-bold text-gray-900">
                Reports ({formatDateDDMMYYYY(fromDate)} – {formatDateDDMMYYYY(toDate)})
              </div>
              <button
                type="button"
                onClick={() => setMobileFiltersOpen((v) => !v)}
                className="px-3.5 py-2 bg-gray-900 text-white rounded text-sm font-semibold inline-flex items-center gap-2 min-h-[44px]"
              >
                <Icon name="SlidersHorizontal" size={16} />
                <span>Filters</span>
              </button>
            </div>

            {mobileFiltersOpen && (
              <div className="pt-3 border-t border-gray-200 space-y-3">
                <div className="grid grid-cols-1 gap-2.5">
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1 mobile-label">From Date</label>
                    <input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} className="w-full border border-gray-300 rounded px-3 py-2 text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1 mobile-label">To Date</label>
                    <input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} className="w-full border border-gray-300 rounded px-3 py-2 text-sm" />
                  </div>
                </div>
                <div className="grid grid-cols-1 gap-2">
                  <button onClick={shareDailySummaryWhatsApp} className="w-full py-2.5 bg-emerald-700 text-white rounded text-sm font-semibold inline-flex items-center justify-center gap-2 min-h-[44px]">
                    <Icon name="Share2" size={16} /> Share Daily Summary (WhatsApp)
                  </button>
                  <button onClick={onDownloadExcel} className="w-full py-2.5 bg-gray-900 text-white rounded text-sm font-semibold inline-flex items-center justify-center gap-2 min-h-[44px]">
                    <Icon name="Download" size={16} /> Export Excel (.xlsx)
                  </button>
                  <button onClick={() => window.print()} className="w-full py-2.5 bg-white border border-gray-300 text-gray-800 rounded text-sm font-semibold inline-flex items-center justify-center gap-2 min-h-[44px]">
                    <Icon name="Printer" size={16} /> Print / PDF
                  </button>
                </div>
              </div>
            )}
          </div>

          {/* Desktop Filter & Export Header (>= 768px) */}
          <div className="hidden md:flex bg-white border border-gray-300 rounded p-4 flex-wrap justify-between items-center gap-3 no-print">
            <div className="flex flex-wrap items-center gap-2">
              <label className="text-xs font-bold text-gray-600">From:</label>
              <input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} className="border border-gray-300 rounded px-2.5 py-1.5 text-xs font-medium" />
              <label className="text-xs font-bold text-gray-600">To:</label>
              <input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} className="border border-gray-300 rounded px-2.5 py-1.5 text-xs font-medium" />
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={shareDailySummaryWhatsApp} className="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded text-xs font-semibold inline-flex items-center gap-1.5">
                <Icon name="Share2" size={14} /> Share Daily Summary (WA)
              </button>
              <button onClick={() => window.print()} className="px-3 py-1.5 bg-white hover:bg-gray-50 border border-gray-300 text-gray-800 rounded text-xs font-semibold inline-flex items-center gap-1.5">
                <Icon name="Printer" size={14} /> Print / PDF
              </button>
              <button onClick={onDownloadExcel} className="px-3 py-1.5 bg-gray-900 hover:bg-gray-800 text-white rounded text-xs font-semibold inline-flex items-center gap-1.5">
                <Icon name="Download" size={14} /> Export Excel (.xlsx)
              </button>
            </div>
          </div>

          {/* Desktop Report Selector Bar (>= 768px) */}
          <div className="hidden md:flex flex-wrap gap-1.5 no-print">
            {REPORT_TABS.map((rt) => (
              <button
                key={rt.id}
                onClick={() => setReportType(rt.id)}
                className={`px-3 py-2 rounded text-xs font-semibold border ${
                  reportType === rt.id
                    ? 'bg-amber-700 text-white border-amber-700'
                    : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'
                }`}
              >
                {rt.label}
              </button>
            ))}
          </div>

          {/* =============================================================== */}
          {/* MOBILE SINGLE-COLUMN ORDERED REPORTS (< 768px)                  */}
          {/* Order: 1. Today's summary -> 2. Pending orders -> 3. Late       */}
          {/* -> 4. Ready/Delivery pending -> 5. Balance due -> Rest          */}
          {/* =============================================================== */}
          <div className="md:hidden space-y-4">
            {/* 1. Today's Summary (Stat tiles 2 per row) */}
            <section className="bg-white border border-gray-300 rounded p-4 space-y-3">
              <h3 className="font-bold text-base text-gray-900 border-b border-gray-200 pb-2">1. Today's Summary</h3>
              <div className="grid grid-cols-2 gap-3 tabular-nums">
                <div className="border border-gray-200 rounded p-3 bg-gray-50">
                  <div className="text-xs text-gray-600 font-semibold">Orders Today</div>
                  <div className="text-lg font-bold text-gray-900 mt-1">{todayOrders.length} ({todayConfirmed.length} Conf.)</div>
                </div>
                <div className="border border-gray-200 rounded p-3 bg-gray-50">
                  <div className="text-xs text-gray-600 font-semibold">Ready / Delivered</div>
                  <div className="text-lg font-bold text-gray-900 mt-1">{readyDeliveryList.length} / {db.orders.filter((o) => o.status === 'Delivered').length}</div>
                </div>
                <div className="border border-gray-200 rounded p-3 bg-gray-50">
                  <div className="text-xs text-gray-600 font-semibold">Advance Today</div>
                  <div className="text-lg font-bold text-emerald-700 mt-1">{formatINR(cashAdv + upiAdv + cardAdv)}</div>
                </div>
                <div className="border border-gray-200 rounded p-3 bg-gray-50">
                  <div className="text-xs text-gray-600 font-semibold">Today Balance</div>
                  <div className="text-lg font-bold text-red-700 mt-1">{formatINR(totalTodayBalance)}</div>
                </div>
              </div>
              <div className="overflow-x-auto border border-gray-200 rounded">
                <table className="w-full min-w-[420px] text-sm tabular-nums">
                  <thead className="bg-gray-100 text-xs uppercase text-gray-600">
                    <tr>
                      <th className="p-2.5 text-left border-b">Mode</th>
                      <th className="p-2.5 text-right border-b">Orders</th>
                      <th className="p-2.5 text-right border-b">Today Adv.</th>
                      <th className="p-2.5 text-right border-b">Period Adv.</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-200">
                    {['Cash', 'UPI', 'Card'].map((mode) => (
                      <tr key={mode}>
                        <td className="p-2.5 font-semibold">{mode}</td>
                        <td className="p-2.5 text-right">{todayConfirmed.filter((o) => o.payment_mode === mode).length}</td>
                        <td className="p-2.5 text-right font-bold">{formatINR(todayConfirmed.filter((o) => o.payment_mode === mode).reduce((s, o) => s + Number(o.advance_amount), 0))}</td>
                        <td className="p-2.5 text-right">{formatINR(confirmedRange.filter((o) => o.payment_mode === mode).reduce((s, o) => s + Number(o.advance_amount), 0))}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </section>

            {/* 2. Pending Orders by Stage (Full-width chart bars + scrollable table) */}
            <section className="bg-white border border-gray-300 rounded p-4 space-y-3">
              <h3 className="font-bold text-base text-gray-900 border-b border-gray-200 pb-2">2. Pending Orders & Stage Aging</h3>
              {/* Full-width stage distribution chart */}
              <div className="space-y-2 w-full">
                {pendingStages.map((st) => {
                  const count = db.orders.filter((o) => o.status === st).length;
                  const pct = Math.round((count / maxStageCount) * 100);
                  return (
                    <div key={st} className="w-full space-y-1">
                      <div className="flex justify-between text-xs font-semibold text-gray-700">
                        <span>{st}</span>
                        <span className="tabular-nums">{count}</span>
                      </div>
                      <div className="w-full bg-gray-100 h-2.5 rounded overflow-hidden">
                        <div className="bg-amber-700 h-full rounded" style={{ width: `${pct}%` }} />
                      </div>
                    </div>
                  );
                })}
              </div>
              <div className="overflow-x-auto border border-gray-200 rounded">
                <table className="w-full min-w-[460px] text-sm tabular-nums">
                  <thead className="bg-gray-100 text-xs uppercase text-gray-600">
                    <tr>
                      <th className="p-2.5 text-left border-b">Stage</th>
                      <th className="p-2.5 text-right border-b">Pending</th>
                      <th className="p-2.5 text-right border-b">Avg Age</th>
                      <th className="p-2.5 text-right border-b">Stuck</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-200">
                    {pendingStages.map((st) => {
                      const list = db.orders.filter((o) => o.status === st);
                      const avgDays = list.length ? (list.reduce((s, o) => s + getHoursInStage(o) / 24, 0) / list.length).toFixed(1) : '0.0';
                      const limit = db.settings?.stageAlertHours?.[st] || 48;
                      const stuck = list.filter((o) => getHoursInStage(o) > limit).length;
                      return (
                        <tr key={st}>
                          <td className="p-2.5"><StatusChip status={st} /></td>
                          <td className="p-2.5 text-right font-bold">{list.length}</td>
                          <td className="p-2.5 text-right">{avgDays}d</td>
                          <td className="p-2.5 text-right font-bold text-red-700">{stuck}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </section>

            {/* 3. Late Orders */}
            <section className="bg-white border border-gray-300 rounded p-4 space-y-3">
              <div className="flex justify-between items-center border-b border-gray-200 pb-2">
                <h3 className="font-bold text-base text-gray-900">3. Late Orders</h3>
                <span className="px-2 py-0.5 bg-red-100 text-red-800 rounded text-xs font-bold tabular-nums">{lateOrdersList.length}</span>
              </div>
              <div className="overflow-x-auto border border-gray-200 rounded">
                <table className="w-full min-w-[500px] text-sm tabular-nums">
                  <thead className="bg-gray-100 text-xs uppercase text-gray-600">
                    <tr>
                      <th className="p-2.5 text-left border-b">Order</th>
                      <th className="p-2.5 text-left border-b">Customer</th>
                      <th className="p-2.5 text-left border-b">Stage</th>
                      <th className="p-2.5 text-left border-b">Due Date</th>
                      <th className="p-2.5 text-right border-b">Balance</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-200">
                    {lateOrdersList.length === 0 ? (
                      <tr><td colSpan={5} className="p-4 text-center text-gray-500">No overdue orders.</td></tr>
                    ) : (
                      lateOrdersList.map((o) => (
                        <tr key={o.id}>
                          <td className="p-2.5 font-bold">{o.order_no}</td>
                          <td className="p-2.5">{o.customer_name} ({o.mobile})</td>
                          <td className="p-2.5"><StatusChip status={o.status} /></td>
                          <td className="p-2.5 text-red-700 font-bold">{formatDateDDMMYYYY(o.promised_date)}</td>
                          <td className="p-2.5 text-right font-bold">{formatINR(o.balance_amount)}</td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </section>

            {/* 4. Ready / Delivery Pending */}
            <section className="bg-white border border-gray-300 rounded p-4 space-y-3">
              <div className="flex justify-between items-center border-b border-gray-200 pb-2">
                <h3 className="font-bold text-base text-gray-900">4. Ready / Delivery Pending</h3>
                <span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded text-xs font-bold tabular-nums">{readyDeliveryList.length}</span>
              </div>
              <div className="overflow-x-auto border border-gray-200 rounded">
                <table className="w-full min-w-[480px] text-sm tabular-nums">
                  <thead className="bg-gray-100 text-xs uppercase text-gray-600">
                    <tr>
                      <th className="p-2.5 text-left border-b">Order</th>
                      <th className="p-2.5 text-left border-b">Customer</th>
                      <th className="p-2.5 text-left border-b">Design</th>
                      <th className="p-2.5 text-right border-b">Balance Due</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-200">
                    {readyDeliveryList.length === 0 ? (
                      <tr><td colSpan={4} className="p-4 text-center text-gray-500">No orders waiting in Ready state.</td></tr>
                    ) : (
                      readyDeliveryList.map((o) => (
                        <tr key={o.id}>
                          <td className="p-2.5 font-bold">{o.order_no}</td>
                          <td className="p-2.5">{o.customer_name} ({o.mobile})</td>
                          <td className="p-2.5">{o.design_name}</td>
                          <td className="p-2.5 text-right font-bold text-red-700">{formatINR(o.balance_amount)}</td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </section>

            {/* 5. Balance Due (Customer Dues) */}
            <section className="bg-white border border-gray-300 rounded p-4 space-y-3">
              <div className="flex justify-between items-center border-b border-gray-200 pb-2">
                <h3 className="font-bold text-base text-gray-900">5. Balance Due (Customer Dues)</h3>
                <span className="text-sm font-bold text-red-700 tabular-nums">
                  {formatINR(balanceDueList.reduce((s, o) => s + Number(o.balance_amount), 0))}
                </span>
              </div>
              <div className="overflow-x-auto border border-gray-200 rounded">
                <table className="w-full min-w-[500px] text-sm tabular-nums">
                  <thead className="bg-gray-100 text-xs uppercase text-gray-600">
                    <tr>
                      <th className="p-2.5 text-left border-b">Order</th>
                      <th className="p-2.5 text-left border-b">Customer</th>
                      <th className="p-2.5 text-left border-b">Status</th>
                      <th className="p-2.5 text-right border-b">Total</th>
                      <th className="p-2.5 text-right border-b">Balance</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-200">
                    {balanceDueList.map((o) => (
                      <tr key={o.id}>
                        <td className="p-2.5 font-bold">{o.order_no}</td>
                        <td className="p-2.5">{o.customer_name} ({o.mobile})</td>
                        <td className="p-2.5"><StatusChip status={o.status} /></td>
                        <td className="p-2.5 text-right">{formatINR(o.estimate_total)}</td>
                        <td className="p-2.5 text-right font-bold text-red-700">{formatINR(o.balance_amount)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

    function DesktopERPView({ db, saveDb, currentRole, savedKey, onLogout, triggerInstall, syncStatus }) {
      const isAdmin = currentRole === 'admin';
      const [activeNav, setActiveNav] = useState('orders'); // orders | new_order | reports | settings
      const [queueFilter, setQueueFilter] = useState('ALL'); // ALL | READY_DELIVERY | BALANCE_DUE | STUCK | UNCONFIRMED
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedIds, setSelectedIds] = useState([]);
      const [mobileDrawerOpen, setMobileDrawerOpen] = useState(false);

      const [editingOrder, setEditingOrder] = useState(null);
      const [stickerBatch, setStickerBatch] = useState(null);
      const [timelineOrder, setTimelineOrder] = useState(null);
      const [undoState, setUndoState] = useState(null);

      // Ctrl+K Global Search Modal
      const [globalSearchOpen, setGlobalSearchOpen] = useState(false);
      const [globalSearchTerm, setGlobalSearchTerm] = useState('');

      // Admin Settings State
      const [newSalesman, setNewSalesman] = useState('');
      const [pinEdits, setPinEdits] = useState(db.settings.pins);
      const [rateEdits, setRateEdits] = useState(db.settings.tailorRates);
      const [dimEdits, setDimEdits] = useState({ w: db.settings.sticker_width_mm || 60, h: db.settings.sticker_height_mm || 40 });
      const [alertEdits, setAlertEdits] = useState(db.settings.stageAlertHours || { 'Cutting Pending': 24, 'With Tailor': 48, 'Silai Done': 12, 'Ready': 72 });

      useEffect(() => {
        const onKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setGlobalSearchOpen((prev) => !prev);
            setGlobalSearchTerm('');
          } else if (e.key === 'Escape') {
            setGlobalSearchOpen(false);
            setMobileDrawerOpen(false);
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      const selectPage = (nav, filter = null) => {
        setActiveNav(nav);
        if (filter !== null) setQueueFilter(filter);
        setMobileDrawerOpen(false);
      };

      const triggerUndoableChange = (prevDb, nextDb, label) => {
        saveDb(nextDb);
        if (undoState?.timer) clearTimeout(undoState.timer);
        const timer = setTimeout(() => setUndoState(null), 10000);
        setUndoState({ prevDb, label, timer });
      };

      const handleUndo = () => {
        if (!undoState) return;
        clearTimeout(undoState.timer);
        saveDb(undoState.prevDb);
        setUndoState(null);
      };

      const handleCommitOrder = (payload, wasConfirmed, afterAction) => {
        const nowIso = new Date().toISOString();
        let savedOrder;
        let nextOrders;
        let nextSeq = db.nextOrderSeq || 1;

        if (editingOrder) {
          savedOrder = { ...editingOrder, ...payload, stage_changed_at: nowIso };
          nextOrders = db.orders.map((o) => (o.id === editingOrder.id ? savedOrder : o));
        } else {
          const orderNo = 'SC-' + String(nextSeq).padStart(4, '0');
          nextSeq += 1;
          savedOrder = {
            id: crypto.randomUUID(),
            order_no: orderNo,
            created_at: nowIso,
            stage_changed_at: nowIso,
            ...payload
          };
          nextOrders = [savedOrder, ...db.orders];

    const ROLES = [

      { label: 'Tailor 1', role: 'tailor_1' },

    // ---- SAFE SYNC HELPERS (merge my changes onto the latest cloud copy; never hard-delete) ----
    function isNotFoundError(e) {
      if (!e) return false;
      return /404|not.?found/i.test(String(e.statusCode || e.status || '') + ' ' + String(e.message || '') + ' ' + String(e.error || ''));
    }

    function mergeDb(base, local, cloud) {
      const b0 = base || {};
      const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
      const byId = (key, idFn, tsField) => {
        const bm = new Map((b0[key] || []).map((x) => [idFn(x), x]));
        const out = new Map((cloud[key] || []).map((x) => [idFn(x), x]));
        (local[key] || []).forEach((v) => {
          const k = idFn(v);
          const b = bm.get(k);
          if (!b || !same(b, v)) out.set(k, v);
        });
        const arr = Array.from(out.values());
        if (tsField) arr.sort((a, b) => String(b[tsField] || '').localeCompare(String(a[tsField] || '')));
        return arr;
      };
      const merged = { ...cloud };
      new Set([...Object.keys(local), ...Object.keys(cloud)]).forEach((k) => {
        if (k === 'orders') merged.orders = byId('orders', (o) => o.id, 'created_at');
        else if (k === 'activityLogs') merged.activityLogs = byId('activityLogs', (l) => l.id, 'created_at');
        else if (k === 'pieceLogs') merged.pieceLogs = byId('pieceLogs', (l) => l.id, 'logged_at');
        else if (k === 'devices') merged.devices = byId('devices', (d) => d.fp, null);
        else if (k === 'nextOrderSeq') merged.nextOrderSeq = Math.max(Number(local.nextOrderSeq) || 1, Number(cloud.nextOrderSeq) || 1);
        else if (k === 'settings') {
          const st = { ...(cloud.settings || {}) };
          Object.keys(local.settings || {}).forEach((sk) => {
            if (!same((local.settings || {})[sk], (b0.settings || {})[sk])) st[sk] = local.settings[sk];
          });
          merged.settings = st;
        } else {
          merged[k] = !same(local[k], b0[k]) ? local[k] : cloud[k];
        }
      });
      // Two devices saving at the same moment could pick the same order number: renumber MY new order.
      const baseIds = new Set((b0.orders || []).map((o) => o.id));
      const mineNew = new Set((local.orders || []).filter((o) => !baseIds.has(o.id)).map((o) => o.id));
      const cloudIds = new Set((cloud.orders || []).map((o) => o.id));
      (merged.orders || []).forEach((o, i) => {
        if (!mineNew.has(o.id) || cloudIds.has(o.id)) return;
        const clash = merged.orders.some((x) => x.id !== o.id && x.order_no === o.order_no);
        if (!clash) return;
        const oldNo = o.order_no;
        const newNo = 'SC-' + String(merged.nextOrderSeq).padStart(4, '0');
        merged.nextOrderSeq += 1;
        merged.orders[i] = { ...o, order_no: newNo };
        merged.activityLogs = (merged.activityLogs || []).map((l) => (l.order_no === oldNo && !(b0.activityLogs || []).some((x) => x.id === l.id) && (local.activityLogs || []).some((x) => x.id === l.id) ? { ...l, order_no: newNo } : l));
      });
      return merged;
    }

      const [savedKey, setSavedKey] = useState(() => localStorage.getItem('sg_supabase_key') || '');
      const [keyInput, setKeyInput] = useState('');
      const [supabaseClient, setSupabaseClient] = useState(null);

      const [db, setDb] = useState(() => {
        const cached = localStorage.getItem('sg_cloud_db_cache');
        return cached ? JSON.parse(cached) : INITIAL_DB;
      });
      const [syncStatus, setSyncStatus] = useState('Ready');
      const baseDbRef = useRef(null);       // last copy known to be in the cloud
      const cloudReadyRef = useRef(false);  // true only after the cloud copy was read successfully
      const saveChainRef = useRef(Promise.resolve());

      const [currentRole, setCurrentRole] = useState(() => sessionStorage.getItem('sg_active_role') || null);
      const [selectedRole, setSelectedRole] = useState(ROLES[0].role);
      const [pin, setPin] = useState('');
      const [installPrompt, setInstallPrompt] = useState(null);

      const scannedOrderNo = new URLSearchParams(window.location.search).get('scan');
      const myFp = getDeviceFingerprint();

      useEffect(() => {
        const handler = (e) => { e.preventDefault(); setInstallPrompt(e); };
        window.addEventListener('beforeinstallprompt', handler);
        return () => window.removeEventListener('beforeinstallprompt', handler);
      }, []);

      const triggerInstall = async () => {
        if (installPrompt) {
          installPrompt.prompt();
          await installPrompt.userChoice;
          setInstallPrompt(null);
        } else {
          alert('To install this app:\n• Desktop Chrome: Click the Install icon in the right side of the address bar.\n• Mobile Safari/Chrome: Tap Share / 3-dots menu -> "Add to Home Screen".');
        }
      };

      useEffect(() => {
        if (!savedKey || savedKey.length < 15) return;
        const client = createClient(DEFAULT_SUPABASE_URL, savedKey.trim());
        setSupabaseClient(client);

        (async () => {
          try {
            await client.storage.createBucket('sofa_ops_store', { public: false }).catch(() => {});
            const { data, error } = await client.storage.from('sofa_ops_store').download('db.json');
            if (data) {
              const parsed = JSON.parse(await data.text());
              baseDbRef.current = parsed;
              cloudReadyRef.current = true;
              setDb(parsed);
              localStorage.setItem('sg_cloud_db_cache', JSON.stringify(parsed));
              setSyncStatus('Synced');
            } else if (isNotFoundError(error)) {
              baseDbRef.current = null;       // very first setup: no db.json yet
              cloudReadyRef.current = true;
              setSyncStatus('Ready');
            } else {
              setSyncStatus('OFFLINE - changes will not save');
            }
          } catch (e) { setSyncStatus('OFFLINE - changes will not save'); }
        })();

        const channel = client
          .channel('sg-live-sync')
          .on('broadcast', { event: 'db_update' }, ({ payload }) => {
            if (payload) {
              baseDbRef.current = payload;
              setDb(payload);
              localStorage.setItem('sg_cloud_db_cache', JSON.stringify(payload));
              setSyncStatus('Live Synced');
            }
          })
          .subscribe();

        return () => client.removeChannel(channel);
      }, [savedKey]);

      const saveDb = (nextDb) => {
        if (supabaseClient && !cloudReadyRef.current) {
          alert('Server se connection nahi hua, isliye ye badlav SAVE NAHI hua. Internet check karke page refresh karo aur dobara koshish karo.');
          return Promise.resolve();
        }
        setDb(nextDb);
        localStorage.setItem('sg_cloud_db_cache', JSON.stringify(nextDb));
        if (!supabaseClient) return Promise.resolve();
        const run = async () => {
          setSyncStatus('Saving...');
          try {
            const store = supabaseClient.storage.from('sofa_ops_store');
            const { data: latestBlob, error: dErr } = await store.download('db.json');
            let merged = nextDb;
            if (latestBlob) {
              merged = mergeDb(baseDbRef.current, nextDb, JSON.parse(await latestBlob.text()));
            } else if (!isNotFoundError(dErr)) {
              throw dErr || new Error('Could not read latest data');
            }
            const blob = new Blob([JSON.stringify(merged)], { type: 'application/json' });
            const { error: uErr } = await store.upload('db.json', blob, { upsert: true });
            if (uErr) throw uErr;
            baseDbRef.current = merged;
            setDb(merged);
            localStorage.setItem('sg_cloud_db_cache', JSON.stringify(merged));
            setSyncStatus('Saved');
            supabaseClient.channel('sg-live-sync').send({ type: 'broadcast', event: 'db_update', payload: merged }).catch(() => {});
          } catch (e) {
            setSyncStatus('NOT SAVED - retry');
            alert('Ye badlav server pe SAVE NAHI hua (internet/server problem). Please dobara koshish karo, aur jab tak "Saved" na dikhe tab tak page band mat karo.');
          }
        };
        saveChainRef.current = saveChainRef.current.then(run, run);
        return saveChainRef.current;
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const expectedPin = db.settings?.pins?.[selectedRole] || '8866';
        if (pin !== expectedPin) {
          alert('Incorrect 4-digit PIN.');
          return;
        }
        if (selectedRole === 'admin') {
          const exists = db.devices.find((d) => d.fp === myFp);
          if (!exists || exists.status !== 'approved') {
            saveDb({ ...db, devices: [...db.devices.filter((d) => d.fp !== myFp), { fp: myFp, role: 'admin', status: 'approved' }] });
          }
        } else {
          const exists = db.devices.find((d) => d.fp === myFp);
          if (!exists) {
            saveDb({ ...db, devices: [...db.devices, { fp: myFp, role: selectedRole, status: 'pending' }] });
          }
        }
        sessionStorage.setItem('sg_active_role', selectedRole);
        setCurrentRole(selectedRole);
        setPin('');
      };

      if (!savedKey || savedKey.length < 15) {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
            <div className="bg-white border border-gray-300 rounded-md p-6 max-w-md w-full shadow-sm space-y-4">
              <div>
                <h1 className="font-bold text-lg text-gray-900">Shree Gayatri Handloom House</h1>
                <p className="text-xs text-gray-500">Sofa Cover Department — Initial Connection Setup</p>
              </div>
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  const k = keyInput.trim() || 'LOCAL_DIRECT_MODE_KEY_12345';
                  localStorage.setItem('sg_supabase_key', k);
                  setSavedKey(k);
                }}
                className="space-y-3"
              >
                <div>
                  <label className="block text-xs font-semibold text-gray-700 mb-1 mobile-label">Supabase Publishable Key</label>
                  <input
                    placeholder="sb_publishable_..."
                    className="w-full border border-gray-300 rounded px-3 py-2 text-sm font-mono"
                    value={keyInput}
                    onChange={(e) => setKeyInput(e.target.value)}
                  />
                </div>
                <button className="w-full bg-amber-700 hover:bg-amber-800 text-white py-3 rounded font-bold text-sm min-h-[44px]">
                  Connect & Open ERP
                </button>
              </form>
            </div>
          </div>
        );
      }

      if (!currentRole) {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
            <div className="bg-white border border-gray-300 rounded-md p-6 max-w-sm w-full shadow-sm space-y-5">
              <div className="border-b border-gray-200 pb-3">
                <h1 className="font-bold text-base text-gray-900">Shree Gayatri Handloom House</h1>
                <p className="text-xs text-gray-500">Sofa Cover Dept — Staff Sign In</p>
              </div>
              <form onSubmit={handleLogin} className="space-y-3.5">
                <div>
                  <label className="block text-xs font-semibold text-gray-700 mb-1 mobile-label">Department Role</label>
                  <select
                    className="w-full border border-gray-300 rounded px-3 py-2 text-sm font-semibold bg-white"
                    value={selectedRole}
                    onChange={(e) => setSelectedRole(e.target.value)}
                  >
                    {ROLES.map((r) => (
                      <option key={r.role} value={r.role}>{r.label}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-gray-700 mb-1 mobile-label">4-Digit PIN</label>
                  <input
                    type="password"
                    maxLength={4}
                    inputMode="numeric"
                    placeholder="••••"
                    className="w-full border border-gray-300 rounded px-3 py-2 text-center text-xl tracking-widest font-bold"
                    value={pin}
                    onChange={(e) => setPin(e.target.value)}
                  />
                </div>
                <button className="w-full bg-gray-900 hover:bg-gray-800 text-white py-3 rounded font-bold text-sm min-h-[44px]">
                  Sign In
                </button>
              </form>
              <button onClick={triggerInstall} className="w-full border border-gray-300 hover:bg-gray-50 text-gray-700 py-2.5 rounded text-xs font-semibold min-h-[44px]">
                Install App on Desktop / Mobile
              </button>
            </div>
          </div>
        );
      }

      const myDeviceRecord = db.devices.find((d) => d.fp === myFp);
      if (currentRole !== 'admin' && myDeviceRecord?.status !== 'approved') {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
            <div className="bg-white border border-gray-300 rounded-md p-6 max-w-sm w-full text-center space-y-4">
              <h2 className="font-bold text-base text-gray-900">Device Authorization Required</h2>
              <p className="text-xs text-gray-600">
                Device ID: <strong className="font-mono">{myFp}</strong><br />
                Ask the Owner (Admin) to approve this device in <strong>Shop Settings & Data</strong>.
              </p>
              <button
                onClick={() => { sessionStorage.removeItem('sg_active_role'); setCurrentRole(null); }}
                className="w-full bg-gray-900 text-white py-2.5 rounded text-xs font-bold min-h-[44px]"
              >
                Back to Sign In
              </button>
            </div>
          </div>
        );
      }

      if (['admin', 'sales'].includes(currentRole)) {
        return (
          <DesktopERPView
            db={db}
            saveDb={saveDb}
            currentRole={currentRole}
            savedKey={savedKey}
            syncStatus={syncStatus}
            triggerInstall={triggerInstall}
            onLogout={() => { sessionStorage.removeItem('sg_active_role'); setCurrentRole(null); }}
          />
        );
      }

      return (
        <div className="min-h-screen bg-gray-100">
          <header className="bg-gray-900 text-white px-4 py-3 flex justify-between items-center sticky top-0 z-30">
            <div>
              <div className="font-bold text-sm">Shree Gayatri Handloom House</div>
              <div className="text-xs text-amber-400 font-semibold uppercase">{currentRole.replace('_', ' ')} • {syncStatus}</div>
            </div>
            <button
              onClick={() => { sessionStorage.removeItem('sg_active_role'); setCurrentRole(null); }}
              className="bg-gray-800 border border-gray-700 px-3 py-2 rounded text-xs font-semibold min-h-[44px]"
            >
              Logout
            </button>
          </header>
          <ShopFloorMobileView db={db} saveDb={saveDb} currentRole={currentRole} scannedOrderNo={scannedOrderNo} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
