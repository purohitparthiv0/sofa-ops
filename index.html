    // =========================================================================
    // WHATSAPP FABRIC ORDERS WORKFLOW (Admin, Counter Sales & Cutting Master)
    // =========================================================================
    function WhatsAppOrdersPanel({ db, saveDb, currentRole, onOpenOrder, onNotify }) {
      const [tailorPick, setTailorPick] = useState({});

      const whatsappOrders = useMemo(() => {
        return (db.orders || [])
          .filter((o) => hasPendingWhatsAppLines(o))
          .sort((a, b) => (a.promised_date || '9999-12-31').localeCompare(b.promised_date || '9999-12-31'));
      }, [db.orders]);

      const handleReceiveAndSendToCutting = (order) => {
        if (!confirm(`Confirm fabric received for ${order.order_no} and send to Cutting Master?`)) return;
        const nowIso = new Date().toISOString();
        const nextOrders = db.orders.map((o) => {
          if (o.id !== order.id) return o;
          const updatedLines = getOrderLines(o).map((l) =>
            getLineRoute(l) === 'whatsapp' && !l.whatsapp_received
              ? { ...l, route: 'cutting', whatsapp_received: true }
              : l
          );
          const nextStatus = ['WhatsApp Pending', 'Cotton Dari'].includes(o.status) ? 'Cutting Pending' : o.status;
          return { ...o, lines: updatedLines, status: nextStatus, stage_changed_at: nowIso, updated_at: nowIso };
        });
        const nextActivity = [
          { id: crypto.randomUUID(), order_no: order.order_no, action: 'WhatsApp fabric received -> Sent to Cutting', role: currentRole, created_at: nowIso },
          ...db.activityLogs
        ];
        saveDb({ ...db, orders: nextOrders, activityLogs: nextActivity });
        if (onNotify) onNotify(`${order.order_no}: Fabric received -> Sent to Cutting`);
      };

      const handleReceiveAndSendToTailor = (order) => {
        const tailor = tailorPick[order.id];
        if (!tailor) return alert('Select Tailor 1 or Tailor 2 first.');
        const tailorLabel = tailor === 'tailor_1' ? 'Tailor 1' : 'Tailor 2';
        if (!confirm(`Confirm fabric received for ${order.order_no} and send directly to ${tailorLabel}?`)) return;
        const nowIso = new Date().toISOString();
        const nextOrders = db.orders.map((o) => {
          if (o.id !== order.id) return o;
          const updatedLines = getOrderLines(o).map((l) =>
            getLineRoute(l) === 'whatsapp' && !l.whatsapp_received
              ? { ...l, whatsapp_received: true }
              : l
          );
          return { ...o, lines: updatedLines, status: 'With Tailor', assigned_tailor: tailor, stage_changed_at: nowIso, updated_at: nowIso };
        });
        const nextActivity = [
          { id: crypto.randomUUID(), order_no: order.order_no, action: `WhatsApp fabric received -> Sent directly to ${tailorLabel}`, role: currentRole, created_at: nowIso },
          ...db.activityLogs
        ];
        saveDb({ ...db, orders: nextOrders, activityLogs: nextActivity });
        if (onNotify) onNotify(`${order.order_no}: Fabric received -> Sent to ${tailorLabel}`);
      };

      return (
        <div className="space-y-4">
          <div className="bg-purple-50 border border-purple-200 rounded p-3.5 flex flex-wrap justify-between items-center gap-2">
            <div>
              <h2 className="font-bold text-base text-purple-950 flex items-center gap-2">
                <Icon name="MessageCircle" size={18} /> WhatsApp Fabric Orders ({whatsappOrders.length})
              </h2>
              <p className="text-xs text-purple-800 mt-0.5">
                Out-of-stock designs ordered via WhatsApp. Once fabric arrives, mark Fabric Received to send to Cutting or directly to Tailor.
              </p>
            </div>
          </div>

          {whatsappOrders.length === 0 ? (
            <div className="bg-white border border-gray-300 rounded p-10 text-center space-y-1">
              <div className="font-bold text-gray-800">No pending WhatsApp fabric orders</div>
              <p className="text-xs text-gray-500">Orders with lines ticked as "2. WhatsApp" will appear here.</p>
            </div>
          ) : (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              {whatsappOrders.map((order) => {
                const waLines = getOrderLines(order).filter((l) => getLineRoute(l) === 'whatsapp' && !l.whatsapp_received);
                const urgency = getDueUrgency(order.promised_date, order.status);
                return (
                  <div key={order.id} className="bg-white border-2 border-purple-300 rounded p-4 space-y-3 shadow-sm">
                    <div className="flex justify-between items-start border-b border-gray-200 pb-2.5 gap-2">
                      <div>
                        <div className="flex flex-wrap items-center gap-2">
                          <span className="font-bold text-lg text-gray-900">{order.order_no}</span>
                          <StatusChip status={order.status} />
                          {urgency && (
                            <span className={`px-2 py-0.5 rounded text-xs font-bold ${urgency.level === 'overdue' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-900'}`}>
                              {urgency.label}
                            </span>
                          )}
                        </div>
                        <div className="text-sm font-semibold text-gray-800 mt-0.5">{order.customer_name} • {order.mobile}</div>
                      </div>
                      <div className="text-right tabular-nums shrink-0">
                        <div className="text-[11px] font-semibold text-gray-500 uppercase">Delivery Due</div>
                        <div className="text-sm font-bold text-gray-900">{formatDateDDMMYYYY(order.promised_date)}</div>
                        <div className="text-xs font-bold text-purple-800">{order.total_pcs} PCS</div>
                      </div>
                    </div>

                    <div className="bg-purple-50/60 border border-purple-200 rounded p-3 space-y-1.5 text-sm">
                      <div className="text-[11px] font-bold uppercase text-purple-900">WhatsApp Fabric Lines ({waLines.length})</div>
                      {waLines.map((l, i) => (
                        <div key={i} className="text-gray-900">
                          <strong className="text-purple-900">{linePartName(l)}:</strong>{' '}
                          <span className="font-semibold">{l.design || order.design_name || '—'}</span> —{' '}
                          <span>{lineRowsText(l)} ({Number(l.qty) || 0} {l.unit === 'Pcs' ? 'pcs' : l.unit === 'Meter' ? 'mtr' : 'ft'})</span>
                        </div>
                      ))}
                      {order.tailor_notes && (
                        <div className="pt-1.5 border-t border-purple-200 text-xs text-gray-800">
                          <strong>Notes:</strong> {order.tailor_notes}
                        </div>
                      )}
                    </div>

                    <div className="space-y-2 pt-1">
                      <button
                        type="button"
                        onClick={() => handleReceiveAndSendToCutting(order)}
                        className="w-full bg-amber-700 hover:bg-amber-800 text-white py-2.5 px-3 rounded font-bold text-xs inline-flex items-center justify-center gap-1.5 min-h-[44px]"
                      >
                        <Icon name="Scissors" size={15} /> Fabric Received → Send to Cutting
                      </button>

                      <div className="flex flex-wrap items-center gap-2">
                        {['tailor_1', 'tailor_2'].map((tKey) => (
                          <button
                            key={tKey}
                            type="button"
                            onClick={() => setTailorPick({ ...tailorPick, [order.id]: tKey })}
                            className={`flex-1 py-2 rounded border font-bold text-xs min-h-[42px] ${
                              tailorPick[order.id] === tKey ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-800 border-gray-300'
                            }`}
                          >
                            {tKey === 'tailor_1' ? 'Tailor 1' : 'Tailor 2'}
                          </button>
                        ))}
                        <button
                          type="button"
                          onClick={() => handleReceiveAndSendToTailor(order)}
                          className="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white py-2 px-3 rounded font-bold text-xs min-h-[42px]"
                        >
                          Send to Tailor
                        </button>
                      </div>

                      {onOpenOrder && (
                        <button
                          type="button"
                          onClick={() => onOpenOrder(order)}
                          className="w-full border border-gray-300 bg-white hover:bg-gray-50 text-gray-700 py-2 rounded text-xs font-semibold min-h-[40px]"
                        >
                          Open Full Order Details
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // MOBILE-FIRST CUTTING & TAILOR WORK QUEUES (Large Touch Targets, 1 Task/Screen)
    // =========================================================================
    function ShopFloorMobileView({ db, saveDb, currentRole, scannedOrderNo }) {
      const [selectedTailor, setSelectedTailor] = useState({});
      const [undoState, setUndoState] = useState(null);
      const [viewingSketch, setViewingSketch] = useState(null);
      const [cuttingTab, setCuttingTab] = useState('cut'); // cut | whatsapp

      const whatsappCount = useMemo(
        () => (db.orders || []).filter((o) => hasPendingWhatsAppLines(o)).length,
        [db.orders]
      );

      const queueOrders = useMemo(() => {
        const list = db.orders.filter((o) => {
          if (o.is_archived || o.is_trashed) return false;
          if (currentRole === 'cutting') return o.status === 'Cutting Pending' && hasCuttingLines(o);
          if (currentRole === 'tailor_1' || currentRole === 'tailor_2') {
            return o.status === 'With Tailor' && o.assigned_tailor === currentRole;
          }
          return false;
        });
        return list.sort((a, b) => (a.promised_date || '9999-12-31').localeCompare(b.promised_date || '9999-12-31'));
      }, [db.orders, currentRole]);

      const startOfDay = new Date();
      startOfDay.setHours(0, 0, 0, 0);
      const startOfMonth = new Date(startOfDay.getFullYear(), startOfDay.getMonth(), 1);

      const myLogs = db.pieceLogs.filter((l) => l.tailor_role === currentRole);
      const todayPcs = myLogs.filter((l) => new Date(l.logged_at) >= startOfDay).reduce((s, l) => s + Number(l.pcs_count), 0);
      const monthPcs = myLogs.filter((l) => new Date(l.logged_at) >= startOfMonth).reduce((s, l) => s + Number(l.pcs_count), 0);

      const triggerUndoableChange = (prevDbSnapshot, nextDbSnapshot, label) => {
        saveDb(nextDbSnapshot);
        if (undoState?.timer) clearTimeout(undoState.timer);
        const timer = setTimeout(() => setUndoState(null), 10000);
        setUndoState({ prevDb: prevDbSnapshot, label, timer });
      };

      const handleUndo = () => {
        if (!undoState) return;
        clearTimeout(undoState.timer);
        saveDb(undoState.prevDb);
        setUndoState(null);
      };

      const handleCuttingComplete = (order) => {
        const tailor = selectedTailor[order.id];
        if (!tailor) return alert('Select Tailor 1 or Tailor 2 before confirming.');
        const tailorLabel = tailor === 'tailor_1' ? 'Tailor 1' : 'Tailor 2';
        if (!confirm(`Confirm cutting complete for ${order.order_no} and assign to ${tailorLabel}?`)) return;

        const nowIso = new Date().toISOString();
        const nextOrders = db.orders.map((o) =>
          o.id === order.id ? { ...o, status: 'With Tailor', assigned_tailor: tailor, stage_changed_at: nowIso, updated_at: nowIso } : o
        );
        const nextActivity = [
          { id: crypto.randomUUID(), order_no: order.order_no, action: `Cutting completed -> Assigned to ${tailorLabel}`, role: currentRole, created_at: nowIso },
          ...db.activityLogs
        ];
        triggerUndoableChange(db, { ...db, orders: nextOrders, activityLogs: nextActivity }, `${order.order_no} assigned to ${tailorLabel}`);
      };

      const handleStitchingComplete = (order) => {
        if (!confirm(`Confirm stitching complete for ${order.order_no} (${order.total_pcs} pcs)?`)) return;
        const nowIso = new Date().toISOString();
        const rate = db.settings?.tailorRates?.[currentRole] || 150;
        const nextOrders = db.orders.map((o) =>
          o.id === order.id ? { ...o, status: 'Silai Done', stage_changed_at: nowIso, updated_at: nowIso } : o
        );
        const nextPieceLogs = [
          {
            id: crypto.randomUUID(),
            order_no: order.order_no,
            tailor_role: currentRole,
            pcs_count: Number(order.total_pcs) || 1,
            rate_at_time: rate,
            is_manual_adjustment: false,
            logged_at: nowIso
          },
          ...db.pieceLogs
        ];
        const nextActivity = [
          { id: crypto.randomUUID(), order_no: order.order_no, action: `Stitching completed (${order.total_pcs} pcs)`, role: currentRole, created_at: nowIso },
          ...db.activityLogs
        ];
        triggerUndoableChange(db, { ...db, orders: nextOrders, pieceLogs: nextPieceLogs, activityLogs: nextActivity }, `${order.order_no} marked Silai Done`);
      };

      return (
        <div className="max-w-xl mx-auto p-3 space-y-4">
          {undoState && (
            <div className="bg-gray-900 text-white px-4 py-3 rounded flex justify-between items-center shadow-md">
              <span className="text-sm font-medium">{undoState.label}</span>
              <button onClick={handleUndo} className="bg-amber-600 text-white px-3 py-2 rounded text-xs font-bold uppercase min-h-[44px]">
                Undo (10s)
              </button>
            </div>
          )}

          {currentRole.startsWith('tailor') && (
            <div className="bg-white border border-gray-300 rounded p-4 grid grid-cols-2 divide-x divide-gray-200 text-center tabular-nums">
              <div>
                <div className="text-xs font-semibold text-gray-500 uppercase">Today Stitched</div>
                <div className="text-2xl font-bold text-gray-900 mt-0.5">{todayPcs} pcs</div>
              </div>
              <div>
                <div className="text-xs font-semibold text-gray-500 uppercase">This Month</div>
                <div className="text-2xl font-bold text-amber-800 mt-0.5">{monthPcs} pcs</div>
              </div>
            </div>
          )}

          {currentRole === 'cutting' && (
            <div className="grid grid-cols-2 gap-2 bg-white p-1.5 rounded border border-gray-300">
              <button
                type="button"
                onClick={() => setCuttingTab('cut')}
                className={`py-2.5 rounded font-bold text-sm min-h-[44px] ${cuttingTab === 'cut' ? 'bg-gray-900 text-white' : 'text-gray-700 hover:bg-gray-100'}`}
              >
                To Cut ({queueOrders.length})
              </button>
              <button
                type="button"
                onClick={() => setCuttingTab('whatsapp')}
                className={`py-2.5 rounded font-bold text-sm min-h-[44px] ${cuttingTab === 'whatsapp' ? 'bg-purple-700 text-white' : 'text-purple-900 bg-purple-50 hover:bg-purple-100'}`}
              >
                WhatsApp ({whatsappCount})
              </button>
            </div>
          )}

          {currentRole === 'cutting' && cuttingTab === 'whatsapp' ? (
            <WhatsAppOrdersPanel db={db} saveDb={saveDb} currentRole={currentRole} />
          ) : (
            <>
          <div className="flex justify-between items-center px-1">
            <h2 className="font-bold text-base text-gray-900">
              {currentRole === 'cutting' ? `To Cut (${queueOrders.length})` : `To Stitch (${queueOrders.length})`}
            </h2>
            <span className="text-xs text-gray-500">Sorted by delivery date</span>
          </div>

          {queueOrders.length === 0 ? (
            <div className="bg-white border border-gray-300 rounded p-10 text-center space-y-1">
              <div className="font-bold text-gray-800">Queue is clear</div>
              <p className="text-xs text-gray-500">No pending orders assigned to your station right now.</p>
            </div>
          ) : (
            queueOrders.map((order) => {
              const urgency = getDueUrgency(order.promised_date, order.status);
              const isScanned = scannedOrderNo === order.order_no;
              return (
                <div
                  key={order.id}
                  className={`bg-white rounded border-2 p-4 space-y-3 ${
                    isScanned ? 'border-amber-600' : urgency?.level === 'overdue' ? 'border-red-400' : 'border-gray-300'
                  }`}
                >
                  <div className="flex justify-between items-start border-b border-gray-200 pb-2.5">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-lg text-gray-900">{order.order_no}</span>
                        {urgency && (
                          <span className={`px-2 py-0.5 rounded text-xs font-bold ${
                            urgency.level === 'overdue' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-900'
                          }`}>
                            {urgency.label}
                          </span>
                        )}
                      </div>
                      <div className="text-base font-semibold text-gray-800 mt-0.5">{order.design_name}</div>
                    </div>
                    <div className="text-right tabular-nums">
                      <div className="text-xs font-semibold text-gray-500">DELIVERY</div>
                      <div className="text-sm font-bold text-gray-900">{formatDateDDMMYYYY(order.promised_date)}</div>
                      <div className="text-xs font-bold text-amber-800 mt-0.5">{order.total_pcs} PCS</div>
                    </div>
                  </div>

                  <div className="bg-gray-50 border border-gray-200 rounded p-3 space-y-1.5 text-sm tabular-nums">
                    {order.order_type && order.order_type !== 'Sofa Cover' && (
                      <div className="text-xs font-bold uppercase text-amber-900">Type: {order.order_type}</div>
                    )}
                    {getOrderLines(order)
                      .filter((l) => currentRole !== 'cutting' || getLineRoute(l) === 'cutting')
                      .map((l, i) => (
                      <div key={i} className="space-y-1">
                        <div>
                          <span className="text-gray-500 font-semibold">{linePartName(l)}:</span> <strong>{lineRowsText(l)}</strong> ({Number(l.qty) || 0} {l.unit === 'Pcs' ? 'pcs' : l.unit === 'Meter' ? 'mtr' : 'ft'})
                          {l.design ? <span className="text-gray-600"> — {l.design}</span> : null}
                          {l.pending ? <span className="text-red-700 font-bold"> — MEASUREMENT PENDING</span> : null}
                        </div>
                        {l.sample_photo && (
                          <img src={l.sample_photo} alt="Sample" className="h-24 rounded border border-gray-300 object-contain bg-white" />
                        )}
                      </div>
                    ))}
                    {order.tailor_notes && (
                      <div className="pt-1.5 border-t border-gray-200 text-gray-900 font-medium">
                        <span className="text-red-700 font-bold">Note:</span> {order.tailor_notes}
                      </div>
                    )}
                    {Array.isArray(order.sketches) && order.sketches.length > 0 && (
                      <div className="pt-2 border-t border-gray-200">
                        <div className="text-xs font-bold text-amber-900 mb-1">Attached Drawings (Tap to Zoom):</div>
                        <div className="flex flex-wrap gap-2">
                          {order.sketches.map((sk) => (
                            <img key={sk.id} src={sk.thumb} alt={sk.title} onClick={() => setViewingSketch(sk)} className="h-20 w-32 object-contain bg-white border border-amber-400 rounded cursor-pointer" />
                          ))}
                        </div>
                      </div>
                    )}
                  </div>

                  {currentRole === 'cutting' && (
                    <div className="space-y-2.5 pt-1">
                      <div className="grid grid-cols-2 gap-2">
                        {['tailor_1', 'tailor_2'].map((tKey) => (
                          <button
                            key={tKey}
                            type="button"
                            onClick={() => setSelectedTailor({ ...selectedTailor, [order.id]: tKey })}
                            className={`py-3.5 rounded border-2 font-bold text-base min-h-[48px] ${
                              selectedTailor[order.id] === tKey
                                ? 'bg-gray-900 text-white border-gray-900'
                                : 'bg-white text-gray-800 border-gray-300'
                            }`}
                          >
                            {tKey === 'tailor_1' ? 'Tailor 1' : 'Tailor 2'}
                          </button>
                        ))}
                      </div>
                      <button
                        type="button"
                        onClick={() => handleCuttingComplete(order)}
                        className="w-full bg-amber-700 active:bg-amber-800 text-white py-4 rounded font-bold text-base min-h-[48px]"
                      >
                        Confirm Cutting Done
                      </button>
                    </div>
                  )}

                  {currentRole.startsWith('tailor') && (
                    <button
                      type="button"
                      onClick={() => handleStitchingComplete(order)}
                      className="w-full bg-emerald-700 active:bg-emerald-800 text-white py-4 rounded font-bold text-base min-h-[48px]"
                    >
                      Mark Stitching Done ({order.total_pcs} Pcs)
                    </button>
                  )}
                </div>
              );
            })
          )}
            </>
          )}
          {viewingSketch && <SketchViewerModal sketch={viewingSketch} onClose={() => setViewingSketch(null)} />}
        </div>
      );
    }

    // =========================================================================
    // ADMIN REPORTS MODULE
    // - Desktop (>= 768px): Tabbed report view with inline filters
    // - Mobile (< 768px): Collapsible "Filters" button + Single-column stacked sections in exact priority order:
    //   1. Today's summary (2 stat tiles per row)
    //   2. Pending orders (with stage visual bars + scrollable table)
    //   3. Late orders
    //   4. Ready/Delivery pending
    //   5. Balance due
    //   6. Measurement visits, Tailor report, Salesman report, Unconfirmed follow-up
    // =========================================================================
    function AdminReportsView({ db, onDownloadExcel, onOpenWaPreview }) {
      const activeOrders = useMemo(() => (db.orders || []).filter((o) => !o.is_archived && !o.is_trashed), [db.orders]);
      const todayIso = new Date().toISOString().split('T')[0];
      const thirtyDaysAgoIso = new Date(Date.now() - 30 * 86400000).toISOString().split('T')[0];

      const [reportType, setReportType] = useState('day_end');
      const [fromDate, setFromDate] = useState(thirtyDaysAgoIso);
      const [toDate, setToDate] = useState(todayIso);
      const [mobileFiltersOpen, setMobileFiltersOpen] = useState(false);

      const inRange = (isoStr) => {
        if (!isoStr) return false;
        const d = isoStr.split('T')[0];
        return d >= fromDate && d <= toDate;
      };

      const rangeOrders = activeOrders.filter((o) => inRange(o.created_at));
      const confirmedRange = rangeOrders.filter((o) => !['Measurement Pending', 'Estimate Given'].includes(o.status));

      // Today's summary metrics
      const todayOrders = activeOrders.filter((o) => o.created_at?.startsWith(todayIso));
      const todayConfirmed = todayOrders.filter((o) => !['Measurement Pending', 'Estimate Given'].includes(o.status));
      const cashAdv = todayConfirmed.filter((o) => o.payment_mode === 'Cash').reduce((s, o) => s + Number(o.advance_amount), 0);
      const upiAdv = todayConfirmed.filter((o) => o.payment_mode === 'UPI').reduce((s, o) => s + Number(o.advance_amount), 0);
      const cardAdv = todayConfirmed.filter((o) => o.payment_mode === 'Card').reduce((s, o) => s + Number(o.advance_amount), 0);
      const totalTodayBalance = todayConfirmed.reduce((s, o) => s + Number(o.balance_amount), 0);

      const lateOrdersList = activeOrders.filter(
        (o) => o.status !== 'Delivered' && getDueUrgency(o.promised_date, o.status)?.level === 'overdue'
      );
      const readyDeliveryList = activeOrders.filter((o) => o.status === 'Ready');
      const balanceDueList = activeOrders.filter(
        (o) => !['Measurement Pending', 'Estimate Given'].includes(o.status) && Number(o.balance_amount) > 0
      );

      const shareDailySummaryWhatsApp = () => {
        const text =
          `*Shree Gayatri Furnishing Hub — Sofa Cover Dept*\n` +
          `Daily Closing (${formatDateDDMMYYYY(todayIso)})\n\n` +
          `• Orders Created: ${todayOrders.length}\n` +
          `• Confirmed: ${todayConfirmed.length}\n` +
          `• Ready: ${readyDeliveryList.length}\n` +
          `• Delivered Today: ${activeOrders.filter((o) => o.status === 'Delivered' && o.stage_changed_at?.startsWith(todayIso)).length}\n\n` +
          `*Advance Collected Today:*\n` +
          `Cash: ${formatINR(cashAdv)} | UPI: ${formatINR(upiAdv)} | Card: ${formatINR(cardAdv)}\n` +
          `Total Advance: *${formatINR(cashAdv + upiAdv + cardAdv)}*\n` +
          `Total Pending Customer Dues: *${formatINR(balanceDueList.reduce((s, o) => s + Number(o.balance_amount), 0))}*`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      };

      const REPORT_TABS = [
        { id: 'day_end', label: '1. Day-End Closing' },
        { id: 'aging', label: '2. Stage Aging & Bottlenecks' },
        { id: 'late_delivery', label: '3. Late & Delivery Pending' },
        { id: 'visits', label: '4. Measurement Visits' },
        { id: 'tailors', label: '5. Tailor Piece & Earnings' },
        { id: 'salesmen', label: '6. Salesman Conversion' },
        { id: 'unconfirmed', label: '7. Unconfirmed Follow-Up' },
        { id: 'dues', label: '8. Customer Dues' }
      ];

      const pendingStages = ['Measurement Pending', 'Awaiting Measurement', 'Estimate Given', 'Cutting Pending', 'With Tailor', 'Silai Done', 'Ready'];
      const maxStageCount = Math.max(1, ...pendingStages.map((st) => activeOrders.filter((o) => o.status === st).length));

      return (
        <div className="space-y-4">
          {/* Mobile Collapsible "Filters" Button Bar (< 768px) */}
          <div className="md:hidden bg-white border border-gray-300 rounded p-3 space-y-3 no-print">
            <div className="flex justify-between items-center gap-2">
              <div className="text-sm font-bold text-gray-900">
                Reports ({formatDateDDMMYYYY(fromDate)} – {formatDateDDMMYYYY(toDate)})
              </div>
              <button
                type="button"
                onClick={() => setMobileFiltersOpen((v) => !v)}
                className="px-3.5 py-2 bg-gray-900 text-white rounded text-sm font-semibold inline-flex items-center gap-2 min-h-[44px]"
              >
                <Icon name="SlidersHorizontal" size={16} />
                <span>Filters</span>
              </button>
            </div>

            {mobileFiltersOpen && (
              <div className="pt-3 border-t border-gray-200 space-y-3">
                <div className="grid grid-cols-1 gap-2.5">
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1 mobile-label">From Date</label>
                    <input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} className="w-full border border-gray-300 rounded px-3 py-2 text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1 mobile-label">To Date</label>
                    <input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} className="w-full border border-gray-300 rounded px-3 py-2 text-sm" />
                  </div>
                </div>
                <div className="grid grid-cols-1 gap-2">
                  <button onClick={shareDailySummaryWhatsApp} className="w-full py-2.5 bg-emerald-700 text-white rounded text-sm font-semibold inline-flex items-center justify-center gap-2 min-h-[44px]">
                    <Icon name="Share2" size={16} /> Share Daily Summary (WhatsApp)
                  </button>
                  <button onClick={onDownloadExcel} className="w-full py-2.5 bg-gray-900 text-white rounded text-sm font-semibold inline-flex items-center justify-center gap-2 min-h-[44px]">
                    <Icon name="Download" size={16} /> Export Excel (.xlsx)
                  </button>
                  <button onClick={() => window.print()} className="w-full py-2.5 bg-white border border-gray-300 text-gray-800 rounded text-sm font-semibold inline-flex items-center justify-center gap-2 min-h-[44px]">
                    <Icon name="Printer" size={16} /> Print / PDF
                  </button>
                </div>
              </div>
            )}
          </div>

          {/* Desktop Filter & Export Header (>= 768px) */}
          <div className="hidden md:flex bg-white border border-gray-300 rounded p-4 flex-wrap justify-between items-center gap-3 no-print">
            <div className="flex flex-wrap items-center gap-2">
              <label className="text-xs font-bold text-gray-600">From:</label>
              <input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} className="border border-gray-300 rounded px-2.5 py-1.5 text-xs font-medium" />
              <label className="text-xs font-bold text-gray-600">To:</label>
              <input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} className="border border-gray-300 rounded px-2.5 py-1.5 text-xs font-medium" />
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={shareDailySummaryWhatsApp} className="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded text-xs font-semibold inline-flex items-center gap-1.5">
                <Icon name="Share2" size={14} /> Share Daily Summary (WA)
              </button>
              <button onClick={() => window.print()} className="px-3 py-1.5 bg-white hover:bg-gray-50 border border-gray-300 text-gray-800 rounded text-xs font-semibold inline-flex items-center gap-1.5">
                <Icon name="Printer" size={14} /> Print / PDF
              </button>
              <button onClick={onDownloadExcel} className="px-3 py-1.5 bg-gray-900 hover:bg-gray-800 text-white rounded text-xs font-semibold inline-flex items-center gap-1.5">
                <Icon name="Download" size={14} /> Export Excel (.xlsx)
              </button>
            </div>
          </div>

          {/* Desktop Report Selector Bar (>= 768px) */}
          <div className="hidden md:flex flex-wrap gap-1.5 no-print">
            {REPORT_TABS.map((rt) => (
              <button
                key={rt.id}
                onClick={() => setReportType(rt.id)}
                className={`px-3 py-2 rounded text-xs font-semibold border ${
                  reportType === rt.id
                    ? 'bg-amber-700 text-white border-amber-700'
                    : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'
                }`}
              >
                {rt.label}
              </button>
            ))}
          </div>

          {/* =============================================================== */}
          {/* MOBILE SINGLE-COLUMN ORDERED REPORTS (< 768px)                  */}
          {/* Order: 1. Today's summary -> 2. Pending orders -> 3. Late       */}
          {/* -> 4. Ready/Delivery pending -> 5. Balance due -> Rest          */}
          {/* =============================================================== */}
          <div className="md:hidden space-y-4">

                        <td className="p-2.5 font-semibold">{o.visit_staff_name || '—'}</td>
                        <td className="p-2.5 text-right font-bold">{formatINR(o.visit_charge)}</td>
                        <td className="p-2.5 text-right">{formatINR(o.estimate_total)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {reportType === 'tailors' && (
              <div className="space-y-4">
                <table className="w-full text-sm border border-gray-200 tabular-nums">
                  <thead className="bg-gray-100 text-xs uppercase text-gray-600">
                    <tr>
                      <th className="p-2.5 text-left border-b">Tailor</th>
                      <th className="p-2.5 text-right border-b">Today Pcs</th>
                      <th className="p-2.5 text-right border-b">Period Pcs</th>
                      <th className="p-2.5 text-right border-b">Current Rate / Pc</th>
                      <th className="p-2.5 text-right border-b">Period Earning</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-300">
                    {['tailor_1', 'tailor_2'].map((tRole) => {
                      const logs = db.pieceLogs.filter((l) => l.tailor_role === tRole && inRange(l.logged_at));
                      const todayPcs = db.pieceLogs.filter((l) => l.tailor_role === tRole && l.logged_at?.startsWith(todayIso)).reduce((s, l) => s + Number(l.pcs_count), 0);
                      const periodPcs = logs.reduce((s, l) => s + Number(l.pcs_count), 0);
                      const earning = logs.reduce((s, l) => s + Number(l.pcs_count) * Number(l.rate_at_time || 150), 0);
                      return (
                        <tr key={tRole}>
                          <td className="p-2.5 font-bold">{tRole === 'tailor_1' ? 'Tailor 1' : 'Tailor 2'}</td>
                          <td className="p-2.5 text-right">{todayPcs}</td>
                          <td className="p-2.5 text-right font-bold">{periodPcs}</td>
                          <td className="p-2.5 text-right">{formatINR(db.settings?.tailorRates?.[tRole] || 150)}</td>
                          <td className="p-2.5 text-right font-bold text-emerald-700">{formatINR(earning)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}

            {reportType === 'salesmen' && (
              <div className="overflow-x-auto">
                <table className="w-full text-sm border border-gray-200 tabular-nums">
                  <thead className="bg-gray-100 text-xs uppercase text-gray-600">
                    <tr>
                      <th className="p-2.5 text-left border-b">Salesman</th>
                      <th className="p-2.5 text-right border-b">Total Enquiries</th>
                      <th className="p-2.5 text-right border-b">Confirmed Orders</th>
                      <th className="p-2.5 text-right border-b">Conversion %</th>
                      <th className="p-2.5 text-right border-b">Confirmed Sales Value</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-300">
                    {db.salesmen.map((sm) => {
                      const smAll = rangeOrders.filter((o) => o.salesman_name === sm);
                      const smConf = smAll.filter((o) => !['Measurement Pending', 'Estimate Given'].includes(o.status));
                      const conv = smAll.length ? Math.round((smConf.length / smAll.length) * 100) : 0;
                      const val = smConf.reduce((s, o) => s + Number(o.estimate_total), 0);
                      return (
                        <tr key={sm}>
                          <td className="p-2.5 font-bold">{sm}</td>
                          <td className="p-2.5 text-right">{smAll.length}</td>
                          <td className="p-2.5 text-right font-semibold">{smConf.length}</td>
                          <td className="p-2.5 text-right font-bold text-amber-800">{conv}%</td>
                          <td className="p-2.5 text-right font-bold text-emerald-700">{formatINR(val)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}

            {reportType === 'unconfirmed' && (
              <div className="overflow-x-auto">
                <table className="w-full text-sm border border-gray-200 tabular-nums">
                  <thead className="bg-gray-100 text-xs uppercase text-gray-600">
                    <tr>
                      <th className="p-2.5 text-left border-b">Order No</th>
                      <th className="p-2.5 text-left border-b">Date</th>
                      <th className="p-2.5 text-left border-b">Customer</th>
                      <th className="p-2.5 text-left border-b">Design</th>
                      <th className="p-2.5 text-right border-b">Estimate</th>
                      <th className="p-2.5 text-right border-b no-print">Follow-Up</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-300">
                    {activeOrders.filter((o) => ['Measurement Pending', 'Estimate Given'].includes(o.status)).map((o) => (
                      <tr key={o.id}>
                        <td className="p-2.5 font-bold">{o.order_no}</td>
                        <td className="p-2.5">{formatDateDDMMYYYY(o.created_at)}</td>
                        <td className="p-2.5">{o.customer_name} ({o.mobile})</td>
                        <td className="p-2.5">{o.design_name}</td>
                        <td className="p-2.5 text-right font-bold">{formatINR(o.estimate_total)}</td>
                        <td className="p-2.5 text-right no-print">
                          <a href={WhatsAppService.getLink('estimate', o, db.settings)} target="_blank" rel="noreferrer" className="px-2.5 py-1 bg-emerald-700 text-white rounded text-xs font-semibold">
                            WhatsApp Follow-Up
                          </a>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {reportType === 'dues' && (
              <div className="overflow-x-auto">
                <table className="w-full text-sm border border-gray-200 tabular-nums">
                  <thead className="bg-gray-100 text-xs uppercase text-gray-600">
                    <tr>
                      <th className="p-2.5 text-left border-b">Order No</th>
                      <th className="p-2.5 text-left border-b">Customer</th>
                      <th className="p-2.5 text-left border-b">Status</th>
                      <th className="p-2.5 text-right border-b">Total Bill</th>
                      <th className="p-2.5 text-right border-b">Advance</th>
                      <th className="p-2.5 text-right border-b">Balance Due</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-300">
                    {balanceDueList.map((o) => (
                      <tr key={o.id}>
                        <td className="p-2.5 font-bold">{o.order_no}</td>
                        <td className="p-2.5">{o.customer_name} ({o.mobile})</td>
                        <td className="p-2.5"><StatusChip status={o.status} /></td>
                        <td className="p-2.5 text-right">{formatINR(o.estimate_total)}</td>
                        <td className="p-2.5 text-right">{formatINR(o.advance_amount)}</td>
                        <td className="p-2.5 text-right font-bold text-red-700">{formatINR(o.balance_amount)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // DESKTOP & RESPONSIVE MOBILE ERP SHELL
    // - Above 768px: exact left sidebar + dense table
    // - Below 768px: slide-in drawer from hamburger, compact header (logo + short title + search icon),
    //   Install App & Logout inside drawer, and card-based orders list
    // =========================================================================
    function DesktopERPView({ db, saveDb, currentRole, savedKey, supabaseClient, serverAuthMode, onLogout, triggerInstall, syncStatus }) {
      const isAdmin = currentRole === 'admin';
      const [activeNav, setActiveNav] = useState('orders'); // orders | new_order | reports | settings
      const [queueFilter, setQueueFilter] = useState('ALL'); // ALL | READY_DELIVERY | BALANCE_DUE | STUCK | UNCONFIRMED
      const [searchQuery, setSearchQuery] = useState('');
      const [sortOrder, setSortOrder] = useState('NEWEST');
      const [selectedIds, setSelectedIds] = useState([]);
      const [mobileDrawerOpen, setMobileDrawerOpen] = useState(false);

      const [editingOrder, setEditingOrder] = useState(null);
      const [stickerBatch, setStickerBatch] = useState(null);
      const [timelineOrder, setTimelineOrder] = useState(null);
      const [waPreview, setWaPreview] = useState(null); // { order, type }
      const [viewingSketch, setViewingSketch] = useState(null);
      const [undoState, setUndoState] = useState(null);
      const [serverDevices, setServerDevices] = useState([]);
      const [loadingDevices, setLoadingDevices] = useState(false);
      const [notifDropdownOpen, setNotifDropdownOpen] = useState(false);
      const [sqlNotifs, setSqlNotifs] = useState([]);

      // Subscribe to Supabase Realtime on admin_notifications (for Admin)
      useEffect(() => {
        if (!isAdmin || !supabaseClient || savedKey === 'LOCAL_DIRECT_MODE_KEY_12345') return;
        let cancelled = false;
        (async () => {
          const { data, error } = await supabaseClient
            .from('admin_notifications')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(40);
          if (!cancelled && !error && Array.isArray(data)) setSqlNotifs(data);
        })();

        const notifChannel = supabaseClient
          .channel('sg-admin-notifications')
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'admin_notifications' },
            (payload) => {
              if (payload.eventType === 'INSERT' && payload.new) {
                setSqlNotifs((prev) => [payload.new, ...prev.filter((x) => x.id !== payload.new.id)]);
              } else if (payload.eventType === 'UPDATE' && payload.new) {
                setSqlNotifs((prev) => prev.map((x) => (x.id === payload.new.id ? payload.new : x)));
              }
            }
          )
          .subscribe();

        return () => {
          cancelled = true;
          supabaseClient.removeChannel(notifChannel);
        };
      }, [isAdmin, supabaseClient, savedKey]);

      const mergedAdminNotifications = useMemo(() => {
        const map = new Map();
        (db.admin_notifications || []).forEach((n) => map.set(n.id, n));
        (sqlNotifs || []).forEach((n) => map.set(n.id, { ...(map.get(n.id) || {}), ...n }));
        return Array.from(map.values()).sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
      }, [db.admin_notifications, sqlNotifs]);

      const unreadNotifCount = useMemo(
        () => mergedAdminNotifications.filter((n) => !n.is_read).length,
        [mergedAdminNotifications]
      );

      const handleMarkNotificationRead = async (notif) => {
        if (!notif) return;
        const nextNotifs = (db.admin_notifications || []).map((n) => (n.id === notif.id ? { ...n, is_read: true } : n));
        if (!(db.admin_notifications || []).some((n) => n.id === notif.id)) {
          nextNotifs.unshift({ ...notif, is_read: true });
        }
        setSqlNotifs((prev) => prev.map((n) => (n.id === notif.id ? { ...n, is_read: true } : n)));
        saveDb({ ...db, admin_notifications: nextNotifs });
        if (supabaseClient && savedKey !== 'LOCAL_DIRECT_MODE_KEY_12345') {
          supabaseClient.from('admin_notifications').update({ is_read: true }).eq('id', notif.id).then(() => {}).catch(() => {});
        }
      };

      const handleMarkAllNotificationsRead = async () => {
        const nextNotifs = mergedAdminNotifications.map((n) => ({ ...n, is_read: true }));
        setSqlNotifs((prev) => prev.map((n) => ({ ...n, is_read: true })));
        saveDb({ ...db, admin_notifications: nextNotifs });
        if (supabaseClient && savedKey !== 'LOCAL_DIRECT_MODE_KEY_12345') {
          supabaseClient.from('admin_notifications').update({ is_read: true }).eq('is_read', false).then(() => {}).catch(() => {});
        }
      };

      // Ctrl+K Global Search Modal
      const [globalSearchOpen, setGlobalSearchOpen] = useState(false);
      const [globalSearchTerm, setGlobalSearchTerm] = useState('');

      // Admin Settings State
      const [newSalesman, setNewSalesman] = useState('');
      const [pinEdits, setPinEdits] = useState(db.settings.pins);
      const [rateEdits, setRateEdits] = useState(db.settings.tailorRates);
      const [dimEdits, setDimEdits] = useState({ w: db.settings.sticker_width_mm || 60, h: db.settings.sticker_height_mm || 40 });
      const [alertEdits, setAlertEdits] = useState(db.settings.stageAlertHours || { 'Cutting Pending': 24, 'With Tailor': 48, 'Silai Done': 12, 'Ready': 72 });
      const [shopPhoneEdits, setShopPhoneEdits] = useState({
        primary: db.settings.shop_phone || '9016904528',
        alt: db.settings.shop_phone_alt || '9725454423'
      });
      const [waTemplatesEdit, setWaTemplatesEdit] = useState(() => ({
        ...DEFAULT_WA_TEMPLATES,
        ...(db.settings.wa_templates || {})
      }));

      const refreshServerDevices = async () => {
        if (!isAdmin || !supabaseClient || !serverAuthMode) return;
        setLoadingDevices(true);
        try {
          const { data, error } = await supabaseClient.rpc('admin_list_devices');
          if (!error && Array.isArray(data)) setServerDevices(data);
        } finally {
          setLoadingDevices(false);
        }
      };

      useEffect(() => {
        if (activeNav === 'settings' && isAdmin && serverAuthMode) {
          refreshServerDevices();
        }
      }, [activeNav, isAdmin, serverAuthMode]);

      useEffect(() => {
        const onKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setGlobalSearchOpen((prev) => !prev);
            setGlobalSearchTerm('');
          } else if (e.key === 'Escape') {
            setGlobalSearchOpen(false);
            setMobileDrawerOpen(false);
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      const selectPage = (nav, filter = null) => {
        setActiveNav(nav);
        if (filter !== null) setQueueFilter(filter);
        setMobileDrawerOpen(false);
      };

      const triggerUndoableChange = (prevDb, nextDb, label) => {
        saveDb(nextDb);
        if (undoState?.timer) clearTimeout(undoState.timer);
        const timer = setTimeout(() => setUndoState(null), 10000);
        setUndoState({ prevDb, label, timer });
      };

      const handleUndo = () => {
        if (!undoState) return;
        clearTimeout(undoState.timer);
        saveDb(undoState.prevDb);
        setUndoState(null);
      };

      const handleCommitOrder = (payload, wasConfirmed, afterAction, noteMeta = {}) => {
        const nowIso = new Date().toISOString();
        let savedOrder;
        let nextOrders;
        let nextSeq = db.nextOrderSeq || 1;

        let salesEditNotification = null;
        if (editingOrder) {
          savedOrder = { ...editingOrder, ...payload, stage_changed_at: nowIso, updated_at: nowIso };
          nextOrders = db.orders.map((o) => (o.id === editingOrder.id ? savedOrder : o));

          if (currentRole === 'sales') {
            const changes = [];
            if ((editingOrder.customer_name || '') !== (savedOrder.customer_name || '')) changes.push('customer name');
            if ((editingOrder.mobile || '') !== (savedOrder.mobile || '')) changes.push('mobile');
            if ((editingOrder.address || '') !== (savedOrder.address || '')) changes.push('address');
            if ((editingOrder.design_name || '') !== (savedOrder.design_name || '')) changes.push('fabric/design');
            if (Number(editingOrder.total_pcs || 0) !== Number(savedOrder.total_pcs || 0)) changes.push(`pieces (${editingOrder.total_pcs}→${savedOrder.total_pcs})`);
            if (JSON.stringify(editingOrder.lines || []) !== JSON.stringify(savedOrder.lines || [])) changes.push('items/measurements');
            if (Number(editingOrder.estimate_total || 0) !== Number(savedOrder.estimate_total || 0)) changes.push(`total (${formatINR(editingOrder.estimate_total)}→${formatINR(savedOrder.estimate_total)})`);
            if (Number(editingOrder.advance_amount || 0) !== Number(savedOrder.advance_amount || 0)) changes.push(`advance (${formatINR(editingOrder.advance_amount)}→${formatINR(savedOrder.advance_amount)})`);
            if ((editingOrder.promised_date || '') !== (savedOrder.promised_date || '')) changes.push('delivery date');
            if ((editingOrder.tailor_notes || '') !== (savedOrder.tailor_notes || '')) changes.push('notes');
            const editorName = savedOrder.salesman_name || 'Sales Counter';
            const diffText = changes.length ? changes.join(' / ') : 'order details';
            salesEditNotification = {
              id: crypto.randomUUID(),
              order_id: savedOrder.id,
              order_number: savedOrder.order_no,
              edited_by_name: editorName,
              edited_by_role: 'sales',
              summary: `Sales (${editorName}) updated ${savedOrder.order_no}: Changed ${diffText}`,
              is_read: false,
              created_at: nowIso
            };
          }
        } else {
          const orderNo = 'SC-' + String(nextSeq).padStart(4, '0');
          nextSeq += 1;
          savedOrder = {
            id: crypto.randomUUID(),
            order_no: orderNo,
            created_at: nowIso,
            stage_changed_at: nowIso,
            ...payload
          };
          nextOrders = [savedOrder, ...db.orders];
        }

        const nextActivity = [
          {
            id: crypto.randomUUID(),
            order_no: savedOrder.order_no,
            action: editingOrder ? `Updated (${savedOrder.status})` : `Created (${savedOrder.status})`,
            role: currentRole,
            created_at: nowIso
          },
          ...db.activityLogs
        ];

        const existingNotes = Array.isArray(db.notes) ? db.notes : [];
        const addedNotes = [];
        const pushNote = (text, priority) => {
          addedNotes.push({
            id: crypto.randomUUID(),
            order_id: savedOrder.id,
            order_no: savedOrder.order_no,
            text,
            priority: priority || 'Normal',
            status: 'open',
            created_by: currentRole,
            created_at: nowIso
          });
        };
        if (noteMeta?.manualNote?.text) pushNote(noteMeta.manualNote.text, noteMeta.manualNote.priority);
        if (noteMeta?.advanceZeroOnConfirm) {
          const alreadyHas = existingNotes.some((n) => n.order_id === savedOrder.id && n.status !== 'done' && /Advance not taken/i.test(n.text));
          if (!alreadyHas) pushNote('Advance not taken', 'Urgent');
        }
        if (noteMeta?.hasPendingLine) {
          const alreadyHas = existingNotes.some((n) => n.order_id === savedOrder.id && n.status !== 'done' && /Measurement pending/i.test(n.text));
          if (!alreadyHas) pushNote('Measurement pending on one or more lines', 'Urgent');
        }

        const nextAdminNotifs = salesEditNotification
          ? [salesEditNotification, ...(db.admin_notifications || [])]
          : (db.admin_notifications || []);
        if (salesEditNotification && supabaseClient && savedKey !== 'LOCAL_DIRECT_MODE_KEY_12345') {
          supabaseClient.from('admin_notifications').insert([salesEditNotification]).then(() => {}).catch(() => {});
        }
        saveDb({ ...db, nextOrderSeq: nextSeq, orders: nextOrders, activityLogs: nextActivity, notes: [...addedNotes, ...existingNotes], admin_notifications: nextAdminNotifs });
        setEditingOrder(null);
        setActiveNav('orders');

        if (afterAction === 'sticker_and_wa') {
          setStickerBatch([savedOrder]);
          setWaPreview({ order: savedOrder, type: 'receipt' });
        } else if (afterAction === 'sticker_only') {
          setStickerBatch([savedOrder]);
        }
      };

      const handleMarkNoteDone = (note) => {
        const nowIso = new Date().toISOString();
        const nextNotes = (db.notes || []).map((n) => (n.id === note.id ? { ...n, status: 'done', done_at: nowIso, done_by: currentRole } : n));
        saveDb({ ...db, notes: nextNotes });
      };

      // ITEM 3: Move Back to Pending, Archive, Trash (30d), Restore, Permanent Delete (Admin only, reason required, logged)
      const handleMoveBackToPending = (order) => {
        if (!isAdmin) return;
        const alreadyStarted = Boolean(order.sticker_printed_at) || ['With Tailor', 'Silai Done', 'Ready', 'Delivered'].includes(order.status);
        if (alreadyStarted) {
          if (!confirm(`WARNING: Sticker was already printed or cutting/stitching has started for ${order.order_no} (Status: ${order.status}). Still move back to Pending confirmation?`)) return;
        }
        const reason = prompt(`Enter reason for moving ${order.order_no} back to Estimate / Pending confirmation:`);
        if (!reason || !reason.trim()) return alert('A reason is required.');
        const nowIso = new Date().toISOString();
        const nextOrders = db.orders.map((o) => (o.id === order.id ? { ...o, status: 'Estimate Given', assigned_tailor: null, stage_changed_at: nowIso } : o));
        const nextActivity = [
          { id: crypto.randomUUID(), order_no: order.order_no, action: `Moved back to Pending (Estimate Given). Reason: ${reason.trim()}`, role: currentRole, created_at: nowIso },
          ...db.activityLogs
        ];
        saveDb({ ...db, orders: nextOrders, activityLogs: nextActivity });
      };

      const handleArchiveOrder = (order) => {
        if (!isAdmin) return;
        const reason = prompt(`Enter reason for archiving ${order.order_no} (hidden from active list & sales totals):`);
        if (!reason || !reason.trim()) return alert('A reason is required to archive.');
        const nowIso = new Date().toISOString();
        const nextOrders = db.orders.map((o) => (o.id === order.id ? { ...o, is_archived: true, archive_reason: reason.trim(), archived_at: nowIso } : o));
        const nextActivity = [
          { id: crypto.randomUUID(), order_no: order.order_no, action: `Archived order. Reason: ${reason.trim()}`, role: currentRole, created_at: nowIso },
          ...db.activityLogs
        ];
        saveDb({ ...db, orders: nextOrders, activityLogs: nextActivity });
      };

      const handleMoveToTrash = (order) => {
        if (!isAdmin) return;
        const reason = prompt(`Enter reason for deleting ${order.order_no} (moves to Trash for 30 days):`);
        if (!reason || !reason.trim()) return alert('A reason is required to delete.');
        const nowIso = new Date().toISOString();
        const nextOrders = db.orders.map((o) => (o.id === order.id ? { ...o, is_trashed: true, trash_reason: reason.trim(), trashed_at: nowIso } : o));
        const nextActivity = [
          { id: crypto.randomUUID(), order_no: order.order_no, action: `Moved to Trash. Reason: ${reason.trim()}`, role: currentRole, created_at: nowIso },
          ...db.activityLogs
        ];
        saveDb({ ...db, orders: nextOrders, activityLogs: nextActivity });
      };

      const handleRestoreOrder = (order) => {
        if (!isAdmin) return;
        const nowIso = new Date().toISOString();
        const nextOrders = db.orders.map((o) => (o.id === order.id ? { ...o, is_archived: false, is_trashed: false } : o));
        const nextActivity = [
          { id: crypto.randomUUID(), order_no: order.order_no, action: 'Restored order to active list', role: currentRole, created_at: nowIso },
          ...db.activityLogs
        ];
        saveDb({ ...db, orders: nextOrders, activityLogs: nextActivity });
      };

      const handlePermanentDelete = (order) => {
        if (!isAdmin) return;
        const typed = prompt(`PERMANENT DELETE: Type the exact order number "${order.order_no}" to permanently delete this order:`);
        if (typed !== order.order_no) return alert('Order number did not match. Cancelled.');
        const nowIso = new Date().toISOString();
        const nextOrders = db.orders.filter((o) => o.id !== order.id);
        const nextDeleted = Array.from(new Set([...(db.deletedOrderIds || []), order.id]));
        const nextActivity = [
          { id: crypto.randomUUID(), order_no: order.order_no, action: 'Permanently deleted from Trash', role: currentRole, created_at: nowIso },
          ...db.activityLogs
        ];
        saveDb({ ...db, orders: nextOrders, deletedOrderIds: nextDeleted, activityLogs: nextActivity });
      };

      const handleStatusChange = (order, newStatus) => {
        const isDelivering = String(newStatus).toLowerCase() === 'delivered';
        if (isDelivering && !isAdmin) {
          alert('Only Admin can mark an order as Delivered.');
          return;
        }
        const confirmMsg = isDelivering
          ? `Mark ${order.order_no} (${order.customer_name}) as Delivered? Balance due (${formatINR(order.balance_amount)}) will automatically be cleared to ₹0.`
          : `Change status of ${order.order_no} (${order.customer_name}) to "${newStatus}"?`;
        if (!confirm(confirmMsg)) return;

        const nowIso = new Date().toISOString();
        const totalAmt = Number(order.estimate_total) || 0;
        const nextOrders = db.orders.map((o) => {
          if (o.id !== order.id) return o;
          if (isDelivering) {
            return {

          return { ...o, status: newStatus, stage_changed_at: nowIso, updated_at: nowIso };

    // ---- SAFE SYNC HELPERS (bypass CDN cache + merge by timestamp; never revert newer status) ----
    function isNotFoundError(e) {
      if (!e) return false;
      return /404|not.?found/i.test(String(e.statusCode || e.status || '') + ' ' + String(e.message || '') + ' ' + String(e.error || ''));
    }

    async function downloadFreshDbJson(client) {
      const store = client.storage.from('sofa_ops_store');
      // Use a fresh signed URL + cache-buster timestamp so browser/CDN NEVER serves stale db.json
      const { data: signed, error: sErr } = await store.createSignedUrl('db.json', 60);
      if (!sErr && signed?.signedUrl) {
        const sep = signed.signedUrl.includes('?') ? '&' : '?';
        const resp = await fetch(`${signed.signedUrl}${sep}cb=${Date.now()}`, {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'Pragma': 'no-cache' }
        });
        if (resp.status === 404 || resp.status === 400) {
          const errText = await resp.text().catch(() => '');
          if (/not.?found/i.test(errText)) return { parsed: null, notFound: true };
          throw new Error(errText || `HTTP ${resp.status}`);
        }
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        return { parsed: await resp.json(), notFound: false };
      }
      // Fallback to direct download
      const { data, error } = await store.download('db.json');
      if (data) return { parsed: JSON.parse(await data.text()), notFound: false };
      if (isNotFoundError(error)) return { parsed: null, notFound: true };
      throw error || sErr || new Error('Could not read db.json');
    }

    function orderFreshnessTs(o) {
      return String(o?.updated_at || o?.stage_changed_at || o?.created_at || '');
    }

    function mergeDb(base, local, cloud) {
      const b0 = base || {};
      const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
      const byId = (key, idFn, tsField) => {
        const bm = new Map((b0[key] || []).map((x) => [idFn(x), x]));
        const out = new Map((cloud[key] || []).map((x) => [idFn(x), x]));
        (local[key] || []).forEach((v) => {
          const k = idFn(v);
          const b = bm.get(k);
          const cItem = out.get(k);
          if (key === 'orders' && cItem) {
            // Never let a stale cloud copy overwrite a newer local stage/edit, and vice versa
            if (orderFreshnessTs(v) >= orderFreshnessTs(cItem)) {
              out.set(k, v);
            }
          } else if (!b || !same(b, v)) {
            out.set(k, v);
          }
        });
        const arr = Array.from(out.values());
        if (tsField) arr.sort((a, b) => String(b[tsField] || '').localeCompare(String(a[tsField] || '')));
        return arr;
      };
      const merged = { ...cloud };
      new Set([...Object.keys(local), ...Object.keys(cloud)]).forEach((k) => {
        if (k === 'orders') merged.orders = byId('orders', (o) => o.id, 'created_at');
        else if (k === 'activityLogs') merged.activityLogs = byId('activityLogs', (l) => l.id, 'created_at');
        else if (k === 'pieceLogs') merged.pieceLogs = byId('pieceLogs', (l) => l.id, 'logged_at');
        else if (k === 'notes') merged.notes = byId('notes', (n) => n.id, 'created_at');
        else if (k === 'admin_notifications') merged.admin_notifications = byId('admin_notifications', (n) => n.id, 'created_at');
        else if (k === 'deletedOrderIds') merged.deletedOrderIds = Array.from(new Set([...(cloud.deletedOrderIds || []), ...(local.deletedOrderIds || [])]));
        else if (k === 'devices') merged.devices = byId('devices', (d) => d.fp, null);
        else if (k === 'nextOrderSeq') merged.nextOrderSeq = Math.max(Number(local.nextOrderSeq) || 1, Number(cloud.nextOrderSeq) || 1);
        else if (k === 'settings') {
          const st = { ...(cloud.settings || {}) };
          Object.keys(local.settings || {}).forEach((sk) => {
            if (!same((local.settings || {})[sk], (b0.settings || {})[sk])) st[sk] = local.settings[sk];
          });
          merged.settings = st;
        } else {
          merged[k] = !same(local[k], b0[k]) ? local[k] : cloud[k];
        }
      });
      // Two devices saving at the same moment could pick the same order number: renumber MY new order.
      const baseIds = new Set((b0.orders || []).map((o) => o.id));
      const mineNew = new Set((local.orders || []).filter((o) => !baseIds.has(o.id)).map((o) => o.id));
      const cloudIds = new Set((cloud.orders || []).map((o) => o.id));
      (merged.orders || []).forEach((o, i) => {
        if (!mineNew.has(o.id) || cloudIds.has(o.id)) return;
        const clash = merged.orders.some((x) => x.id !== o.id && x.order_no === o.order_no);
        if (!clash) return;
        const oldNo = o.order_no;
        const newNo = 'SC-' + String(merged.nextOrderSeq).padStart(4, '0');
        merged.nextOrderSeq += 1;
        merged.orders[i] = { ...o, order_no: newNo };
        merged.activityLogs = (merged.activityLogs || []).map((l) => (l.order_no === oldNo && !(b0.activityLogs || []).some((x) => x.id === l.id) && (local.activityLogs || []).some((x) => x.id === l.id) ? { ...l, order_no: newNo } : l));
      });
      if (Array.isArray(merged.deletedOrderIds) && merged.deletedOrderIds.length > 0) {
        const delSet = new Set(merged.deletedOrderIds);
        merged.orders = (merged.orders || []).filter((o) => !delSet.has(o.id));
      }
      return merged;
    }
