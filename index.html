    // =========================================================================
    // DESKTOP ERP SHELL (Counter & Admin: Left Sidebar, Dense Tables, Ctrl+K)
    // =========================================================================
    function DesktopERPView({ db, saveDb, currentRole, savedKey, onLogout, triggerInstall, syncStatus }) {
      const isAdmin = currentRole === 'admin';
      const [activeNav, setActiveNav] = useState('orders'); // orders | new_order | reports | settings
      const [queueFilter, setQueueFilter] = useState('ALL'); // ALL | READY_DELIVERY | BALANCE_DUE | STUCK | UNCONFIRMED
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedIds, setSelectedIds] = useState([]);

      const [editingOrder, setEditingOrder] = useState(null);
      const [stickerBatch, setStickerBatch] = useState(null);
      const [timelineOrder, setTimelineOrder] = useState(null);
      const [undoState, setUndoState] = useState(null);

      // Ctrl+K Global Search Modal
      const [globalSearchOpen, setGlobalSearchOpen] = useState(false);
      const [globalSearchTerm, setGlobalSearchTerm] = useState('');

      // Admin Settings State
      const [newSalesman, setNewSalesman] = useState('');
      const [pinEdits, setPinEdits] = useState(db.settings.pins);
      const [rateEdits, setRateEdits] = useState(db.settings.tailorRates);
      const [dimEdits, setDimEdits] = useState({ w: db.settings.sticker_width_mm || 60, h: db.settings.sticker_height_mm || 40 });
      const [alertEdits, setAlertEdits] = useState(db.settings.stageAlertHours || { 'Cutting Pending': 24, 'With Tailor': 48, 'Silai Done': 12, 'Ready': 72 });

      useEffect(() => {
        const onKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setGlobalSearchOpen((prev) => !prev);
            setGlobalSearchTerm('');
          } else if (e.key === 'Escape') {
            setGlobalSearchOpen(false);
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      const triggerUndoableChange = (prevDb, nextDb, label) => {
        saveDb(nextDb);
        if (undoState?.timer) clearTimeout(undoState.timer);
        const timer = setTimeout(() => setUndoState(null), 10000);
        setUndoState({ prevDb, label, timer });
      };

      const handleUndo = () => {
        if (!undoState) return;
        clearTimeout(undoState.timer);
        saveDb(undoState.prevDb);
        setUndoState(null);
      };

      const handleCommitOrder = (payload, wasConfirmed, afterAction) => {
        const nowIso = new Date().toISOString();
        let savedOrder;
        let nextOrders;
        let nextSeq = db.nextOrderSeq || 1;

        if (editingOrder) {
          savedOrder = { ...editingOrder, ...payload, stage_changed_at: nowIso };
          nextOrders = db.orders.map((o) => (o.id === editingOrder.id ? savedOrder : o));
        } else {
          const orderNo = 'SC-' + String(nextSeq).padStart(4, '0');
          nextSeq += 1;
          savedOrder = {
            id: crypto.randomUUID(),
            order_no: orderNo,
            created_at: nowIso,
            stage_changed_at: nowIso,
            ...payload
          };
          nextOrders = [savedOrder, ...db.orders];
        }

        const nextActivity = [
          {
            id: crypto.randomUUID(),
            order_no: savedOrder.order_no,
            action: editingOrder ? `Updated (${savedOrder.status})` : `Created (${savedOrder.status})`,
            role: currentRole,
            created_at: nowIso
          },
          ...db.activityLogs
        ];

        saveDb({ ...db, nextOrderSeq: nextSeq, orders: nextOrders, activityLogs: nextActivity });
        setEditingOrder(null);
        setActiveNav('orders');

        if (afterAction === 'sticker_and_wa') {
          setStickerBatch([savedOrder]);
          window.open(WhatsAppService.getLink('receipt', savedOrder), '_blank');
        } else if (afterAction === 'sticker_only') {
          setStickerBatch([savedOrder]);
        }
      };

      const handleStatusChange = (order, newStatus) => {
        if (!confirm(`Change status of ${order.order_no} (${order.customer_name}) to "${newStatus}"?`)) return;
        const nowIso = new Date().toISOString();
        const nextOrders = db.orders.map((o) => (o.id === order.id ? { ...o, status: newStatus, stage_changed_at: nowIso } : o));
        const nextActivity = [
          { id: crypto.randomUUID(), order_no: order.order_no, action: `Status changed to ${newStatus}`, role: currentRole, created_at: nowIso },
          ...db.activityLogs
        ];
        triggerUndoableChange(db, { ...db, orders: nextOrders, activityLogs: nextActivity }, `${order.order_no} marked ${newStatus}`);
      };

      const handleLogStickerReprint = (order) => {
        const nowIso = new Date().toISOString();
        const nextActivity = [
          { id: crypto.randomUUID(), order_no: order.order_no, action: 'Cutting sticker printed / reprinted', role: currentRole, created_at: nowIso },
          ...db.activityLogs
        ];
        saveDb({ ...db, activityLogs: nextActivity });
      };

      const handleDownloadExcel = () => {
        const todayStr = new Date().toISOString().split('T')[0];
        const orderRows = db.orders.map((o) => ({
          Order_No: o.order_no,
          Created_Date: formatDateDDMMYYYY(o.created_at),
          Status: o.status,
          Customer_Name: o.customer_name,
          Mobile: o.mobile,
          Design_Name: o.design_name,
          Total_Pcs: o.total_pcs,
          Seating_Segments: o.seating_segments,
          Seating_Feet: o.seating_feet,
          Seating_Rate: o.seating_rate,
          Back_Unit: o.back_unit,
          Back_Segments: o.back_segments,
          Back_Billable: o.back_billable_qty,
          Back_Rate: o.back_rate,
          Visit_Charge: o.visit_charge,
          Net_Total: o.estimate_total,
          Advance_Paid: o.advance_amount,
          Payment_Mode: o.payment_mode,
          Balance_Due: o.balance_amount,
          Salesman: o.salesman_name || '',
          Promised_Delivery: formatDateDDMMYYYY(o.promised_date),
          Assigned_Tailor: o.assigned_tailor || '',
          Tailor_Notes: o.tailor_notes || ''
        }));
        const tailorRows = db.pieceLogs.map((l) => ({
          Date: formatDateDDMMYYYY(l.logged_at),
          Tailor: l.tailor_role,
          Order_Or_Reason: l.is_manual_adjustment ? `Correction: ${l.adjustment_reason}` : l.order_no,
          Pieces: l.pcs_count,
          Rate: l.rate_at_time,
          Earning: (l.pcs_count || 0) * (l.rate_at_time || 0)
        }));
        if (window.XLSX) {
          const wb = window.XLSX.utils.book_new();
          window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(orderRows.length ? orderRows : [{ Note: 'No orders' }]), 'Orders');
          window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(tailorRows.length ? tailorRows : [{ Note: 'No logs' }]), 'Tailor_Piece_Logs');
          window.XLSX.writeFile(wb, `Shree_Gayatri_Sofa_ERP_${todayStr}.xlsx`);
        }
      };

      // Counter Queue Counters
      const readyForDeliveryCount = db.orders.filter((o) => o.status === 'Ready').length;
      const balanceDueCount = db.orders.filter((o) => !['Measurement Pending', 'Estimate Given'].includes(o.status) && Number(o.balance_amount) > 0).length;
      const stuckOrdersList = db.orders.filter((o) => {
        const limit = db.settings?.stageAlertHours?.[o.status];
        return limit && getHoursInStage(o) > limit;
      });
      const unconfirmedCount = db.orders.filter((o) => ['Measurement Pending', 'Estimate Given'].includes(o.status)).length;

      const filteredOrders = useMemo(() => {
        const q = searchQuery.toLowerCase().trim();
        return db.orders
          .filter((o) => {
            if (q && !(o.order_no?.toLowerCase().includes(q) || o.customer_name?.toLowerCase().includes(q) || o.mobile?.includes(q) || o.design_name?.toLowerCase().includes(q))) {
              return false;
            }
            if (queueFilter === 'READY_DELIVERY') return o.status === 'Ready';
            if (queueFilter === 'BALANCE_DUE') return !['Measurement Pending', 'Estimate Given'].includes(o.status) && Number(o.balance_amount) > 0;
            if (queueFilter === 'STUCK') {
              const limit = db.settings?.stageAlertHours?.[o.status];
              return limit && getHoursInStage(o) > limit;
            }
            if (queueFilter === 'UNCONFIRMED') return ['Measurement Pending', 'Estimate Given'].includes(o.status);
            return true;
          })
          .sort((a, b) => (a.promised_date || '9999-12-31').localeCompare(b.promised_date || '9999-12-31'));
      }, [db.orders, searchQuery, queueFilter, db.settings]);

      const globalMatches = useMemo(() => {
        const q = globalSearchTerm.toLowerCase().trim();
        if (!q) return db.orders.slice(0, 8);
        return db.orders.filter((o) =>
          o.order_no?.toLowerCase().includes(q) || o.customer_name?.toLowerCase().includes(q) || o.mobile?.includes(q)
        ).slice(0, 10);
      }, [db.orders, globalSearchTerm]);

      const staffMagicLink = `${window.location.origin}${window.location.pathname}?setup_key=${encodeURIComponent(savedKey)}`;

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Application Header */}
          <header className="bg-gray-900 text-white px-4 h-13 py-2.5 flex justify-between items-center border-b border-gray-800 sticky top-0 z-30 no-print">
            <div className="flex items-center gap-3">
              <div className="w-7 h-7 rounded bg-amber-600 text-white font-bold text-xs flex items-center justify-center">SG</div>
              <div>
                <div className="font-bold text-sm leading-tight">Shree Gayatri Handloom House — Sofa Cover Dept</div>
                <div className="text-[11px] text-gray-400 flex items-center gap-2">
                  <span>Role: <strong className="text-gray-200 uppercase">{currentRole.replace('_', ' ')}</strong></span>
                  <span>•</span>
                  <span className="text-emerald-400">{syncStatus}</span>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => { setGlobalSearchOpen(true); setGlobalSearchTerm(''); }}
                className="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 px-3 py-1.5 rounded text-xs inline-flex items-center gap-2"
              >
                <Icon name="Search" size={14} />
                <span>Quick Search</span>
                <kbd className="bg-gray-900 px-1.5 py-0.5 rounded text-[10px] text-gray-400">Ctrl+K</kbd>
              </button>
              <button onClick={triggerInstall} className="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 px-2.5 py-1.5 rounded text-xs font-medium inline-flex items-center gap-1">
                <Icon name="Download" size={14} /> Install App
              </button>
              <button onClick={onLogout} className="bg-gray-800 hover:bg-red-900/60 text-gray-200 border border-gray-700 px-2.5 py-1.5 rounded text-xs font-medium inline-flex items-center gap-1">
                <Icon name="LogOut" size={14} /> Logout
              </button>
            </div>
          </header>

          <div className="flex-1 flex">
            {/* Left Sidebar Navigation (Zoho/Tally Clean) */}
            <aside className="w-56 bg-white border-r border-gray-300 p-3 flex flex-col justify-between shrink-0 no-print">
              <div className="space-y-1">
                <button
                  onClick={() => { setEditingOrder(null); setActiveNav('new_order'); }}
                  className="w-full mb-3 bg-amber-700 hover:bg-amber-800 text-white py-2.5 px-3 rounded font-bold text-sm inline-flex items-center justify-center gap-2 shadow-sm"
                >
                  <Icon name="Plus" size={16} /> New Order / Estimate
                </button>

                <button
                  onClick={() => { setActiveNav('orders'); setQueueFilter('ALL'); }}
                  className={`w-full text-left px-3 py-2 rounded text-sm font-medium flex justify-between items-center ${
                    activeNav === 'orders' && queueFilter === 'ALL' ? 'bg-gray-900 text-white' : 'text-gray-700 hover:bg-gray-100'
                  }`}
                >
                  <span className="inline-flex items-center gap-2"><Icon name="ListOrdered" size={16} /> All Orders</span>
                  <span className="text-xs opacity-80 tabular-nums">{db.orders.length}</span>
                </button>

                          setActiveNav('new_order');
                        }}
                        className="w-full text-left px-4 py-2.5 hover:bg-gray-50 flex justify-between items-center"
                      >
                        <div>
                          <span className="font-bold text-sm text-gray-900">{o.order_no}</span>
                          <span className="ml-2 text-sm text-gray-700">{o.customer_name}</span>
                          <div className="text-xs text-gray-500">{o.mobile} • {o.design_name}</div>
                        </div>
                        <StatusChip status={o.status} />
                      </button>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {stickerBatch && (
            <StickerPrintModal
              ordersList={stickerBatch}
              settings={db.settings}
              onClose={() => setStickerBatch(null)}
              onLogReprint={handleLogStickerReprint}
            />
          )}

          {timelineOrder && (
            <OrderTimelineModal
              order={timelineOrder}
              activityLogs={db.activityLogs}
              onClose={() => setTimelineOrder(null)}
            />
          )}
        </div>
      );
    }

    // =========================================================================
    // MAIN APPLICATION ENTRY (Auth + Realtime Cloud Sync)
    // =========================================================================
    const ROLES = [
      { label: 'Owner (Admin)', role: 'admin' },
      { label: 'Sales Counter', role: 'sales' },
      { label: 'Cutting Master', role: 'cutting' },
      { label: 'Tailor 1', role: 'tailor_1' },
      { label: 'Tailor 2', role: 'tailor_2' }
    ];

    function App() {
      const [savedKey, setSavedKey] = useState(() => localStorage.getItem('sg_supabase_key') || '');
      const [keyInput, setKeyInput] = useState('');
      const [supabaseClient, setSupabaseClient] = useState(null);

      const [db, setDb] = useState(() => {
        const cached = localStorage.getItem('sg_cloud_db_cache');
        return cached ? JSON.parse(cached) : INITIAL_DB;
      });
      const [syncStatus, setSyncStatus] = useState('Ready');

      const [currentRole, setCurrentRole] = useState(() => sessionStorage.getItem('sg_active_role') || null);
      const [selectedRole, setSelectedRole] = useState(ROLES[0].role);
      const [pin, setPin] = useState('');
      const [installPrompt, setInstallPrompt] = useState(null);

      const scannedOrderNo = new URLSearchParams(window.location.search).get('scan');
      const myFp = getDeviceFingerprint();

      useEffect(() => {
        const handler = (e) => { e.preventDefault(); setInstallPrompt(e); };
        window.addEventListener('beforeinstallprompt', handler);
        return () => window.removeEventListener('beforeinstallprompt', handler);
      }, []);

      const triggerInstall = async () => {
        if (installPrompt) {
          installPrompt.prompt();
          await installPrompt.userChoice;
          setInstallPrompt(null);
        } else {
          alert('To install this app:\n• Desktop Chrome: Click the Install icon in the right side of the address bar.\n• Mobile Chrome: Tap the 3-dots menu -> "Install app" or "Add to Home screen".');
        }
      };

      useEffect(() => {
        if (!savedKey || savedKey.length < 15) return;
        const client = createClient(DEFAULT_SUPABASE_URL, savedKey.trim());
        setSupabaseClient(client);

        (async () => {
          try {
            await client.storage.createBucket('sofa_ops_store', { public: true }).catch(() => {});
            const { data } = await client.storage.from('sofa_ops_store').download('db.json');
            if (data) {
              const parsed = JSON.parse(await data.text());
              setDb(parsed);
              localStorage.setItem('sg_cloud_db_cache', JSON.stringify(parsed));
              setSyncStatus('Synced');
            }
          } catch (e) {}
        })();

        const channel = client
          .channel('sg-live-sync')
          .on('broadcast', { event: 'db_update' }, ({ payload }) => {
            if (payload) {
              setDb(payload);
              localStorage.setItem('sg_cloud_db_cache', JSON.stringify(payload));
              setSyncStatus('Live Synced');
            }
          })
          .subscribe();

        return () => client.removeChannel(channel);
      }, [savedKey]);

      const saveDb = async (nextDb) => {
        setDb(nextDb);
        localStorage.setItem('sg_cloud_db_cache', JSON.stringify(nextDb));
        if (!supabaseClient) return;
        setSyncStatus('Saving...');
        try {
          await supabaseClient.channel('sg-live-sync').send({
            type: 'broadcast',
            event: 'db_update',
            payload: nextDb
          });
          await supabaseClient.storage.createBucket('sofa_ops_store', { public: true }).catch(() => {});
          const blob = new Blob([JSON.stringify(nextDb)], { type: 'application/json' });
          await supabaseClient.storage.from('sofa_ops_store').upload('db.json', blob, { upsert: true });
          setSyncStatus('Saved');
        } catch (e) {
          setSyncStatus('Local Cache');
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const expectedPin = db.settings?.pins?.[selectedRole] || '8866';
        if (pin !== expectedPin) {
          alert('Incorrect 4-digit PIN.');
          return;
        }
        if (selectedRole === 'admin') {
          const exists = db.devices.find((d) => d.fp === myFp);
          if (!exists || exists.status !== 'approved') {
            saveDb({ ...db, devices: [...db.devices.filter((d) => d.fp !== myFp), { fp: myFp, role: 'admin', status: 'approved' }] });
          }
        } else {
          const exists = db.devices.find((d) => d.fp === myFp);
          if (!exists) {
            saveDb({ ...db, devices: [...db.devices, { fp: myFp, role: selectedRole, status: 'pending' }] });
          }
        }
        sessionStorage.setItem('sg_active_role', selectedRole);
        setCurrentRole(selectedRole);
        setPin('');
      };

      if (!savedKey || savedKey.length < 15) {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
            <div className="bg-white border border-gray-300 rounded-md p-6 max-w-md w-full shadow-sm space-y-4">
              <div>
                <h1 className="font-bold text-lg text-gray-900">Shree Gayatri Handloom House</h1>
                <p className="text-xs text-gray-500">Sofa Cover Department — Initial Connection Setup</p>
              </div>
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  const k = keyInput.trim() || 'LOCAL_DIRECT_MODE_KEY_12345';
                  localStorage.setItem('sg_supabase_key', k);
                  setSavedKey(k);
                }}
                className="space-y-3"
              >
                <div>
                  <label className="block text-xs font-semibold text-gray-700 mb-1">Supabase Publishable Key</label>
                  <input
                    placeholder="sb_publishable_..."
                    className="w-full border border-gray-300 rounded px-3 py-2 text-sm font-mono"
                    value={keyInput}
                    onChange={(e) => setKeyInput(e.target.value)}
                  />
                </div>
                <button className="w-full bg-amber-700 hover:bg-amber-800 text-white py-2.5 rounded font-bold text-sm">
                  Connect & Open ERP
                </button>
              </form>
            </div>
          </div>
        );
      }

      if (!currentRole) {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
            <div className="bg-white border border-gray-300 rounded-md p-6 max-w-sm w-full shadow-sm space-y-5">
              <div className="border-b border-gray-200 pb-3">
                <h1 className="font-bold text-base text-gray-900">Shree Gayatri Handloom House</h1>
                <p className="text-xs text-gray-500">Sofa Cover Dept — Staff Sign In</p>
              </div>
              <form onSubmit={handleLogin} className="space-y-3">
                <div>
                  <label className="block text-xs font-semibold text-gray-700 mb-1">Department Role</label>
                  <select
                    className="w-full border border-gray-300 rounded px-3 py-2 text-sm font-semibold bg-white"
                    value={selectedRole}
                    onChange={(e) => setSelectedRole(e.target.value)}
                  >
                    {ROLES.map((r) => (
                      <option key={r.role} value={r.role}>{r.label}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-gray-700 mb-1">4-Digit PIN</label>
                  <input
                    type="password"
                    maxLength={4}
                    inputMode="numeric"
                    placeholder="••••"
                    className="w-full border border-gray-300 rounded px-3 py-2 text-center text-xl tracking-widest font-bold"
                    value={pin}
                    onChange={(e) => setPin(e.target.value)}
                  />
                </div>
                <button className="w-full bg-gray-900 hover:bg-gray-800 text-white py-2.5 rounded font-bold text-sm">
                  Sign In
                </button>
              </form>
              <button onClick={triggerInstall} className="w-full border border-gray-300 hover:bg-gray-50 text-gray-700 py-2 rounded text-xs font-semibold">
                Install App on Desktop / Mobile
              </button>
            </div>
          </div>
        );
      }

      const myDeviceRecord = db.devices.find((d) => d.fp === myFp);
      if (currentRole !== 'admin' && myDeviceRecord?.status !== 'approved') {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
            <div className="bg-white border border-gray-300 rounded-md p-6 max-w-sm w-full text-center space-y-4">
              <h2 className="font-bold text-base text-gray-900">Device Authorization Required</h2>
              <p className="text-xs text-gray-600">
                Device ID: <strong className="font-mono">{myFp}</strong><br />
                Ask the Owner (Admin) to approve this device in <strong>Shop Settings & Data</strong>.
              </p>
              <button
                onClick={() => { sessionStorage.removeItem('sg_active_role'); setCurrentRole(null); }}
                className="w-full bg-gray-900 text-white py-2 rounded text-xs font-bold"
              >
                Back to Sign In
              </button>
            </div>
          </div>
        );
      }

      if (['admin', 'sales'].includes(currentRole)) {
        return (
          <DesktopERPView
            db={db}
            saveDb={saveDb}
            currentRole={currentRole}
            savedKey={savedKey}
            syncStatus={syncStatus}
            triggerInstall={triggerInstall}
            onLogout={() => { sessionStorage.removeItem('sg_active_role'); setCurrentRole(null); }}
          />
        );
      }

      return (
        <div className="min-h-screen bg-gray-100">
          <header className="bg-gray-900 text-white px-4 py-3 flex justify-between items-center sticky top-0 z-30">
            <div>
              <div className="font-bold text-sm">Shree Gayatri Handloom House</div>
              <div className="text-[11px] text-amber-400 font-semibold uppercase">{currentRole.replace('_', ' ')} • {syncStatus}</div>
            </div>
            <button
              onClick={() => { sessionStorage.removeItem('sg_active_role'); setCurrentRole(null); }}
              className="bg-gray-800 border border-gray-700 px-3 py-1.5 rounded text-xs font-semibold"
            >
              Logout
            </button>
          </header>
          <ShopFloorMobileView db={db} saveDb={saveDb} currentRole={currentRole} scannedOrderNo={scannedOrderNo} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
