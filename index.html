<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Shree Gayatri Furnishing Hub - Sofa Cover ERP</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { margin: 0; padding: 0; width: 100%; max-width: 100vw; overflow-x: hidden; background: #f3f4f6; color: #111827; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; -webkit-text-size-adjust: 100%; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    @media (max-width: 767px) {
      html, body, #root { font-size: 15px; }
      .mobile-touch-target, button, select, input[type="text"], input[type="tel"], input[type="number"], input[type="date"], input[type="password"] { min-height: 44px; font-size: 15px; }
      .mobile-label { font-size: 13px !important; line-height: 1.35 !important; }
    }
    @media print { body * { visibility: hidden; } #printable-area, #printable-area * { visibility: visible; } #printable-area { position: fixed; left: 0; top: 0; width: 100%; margin: 0 !important; padding: 0 !important; box-shadow: none !important; background: #fff !important; } .no-print { display: none !important; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script>
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    const { createClient } = window.supabase;
    const DEFAULT_SUPABASE_URL = 'https://qsyubbefhttdfiglbtbt.supabase.co';

    const urlParams = new URLSearchParams(window.location.search);
    const urlSetupKey = urlParams.get('setup_key');
    if (urlSetupKey && urlSetupKey.length > 15) { localStorage.setItem('sg_supabase_key', urlSetupKey.trim()); window.history.replaceState({}, document.title, window.location.pathname); }

    function Icon({ name, size = 16, className = '' }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide && window.lucide.icons[name]) {
          const svg = window.lucide.createElement(window.lucide.icons[name]);
          svg.setAttribute('width', size); svg.setAttribute('height', size);
          if (className) svg.setAttribute('class', className);
          ref.current.innerHTML = ''; ref.current.appendChild(svg);
        }
      }, [name, size, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" />;
    }

    function getDeviceFingerprint() {
      let fp = localStorage.getItem('sg_device_fp');
      if (!fp) { fp = 'DEV-' + Math.random().toString(36).substring(2, 10).toUpperCase(); localStorage.setItem('sg_device_fp', fp); }
      return fp;
    }
    function formatINR(num) { return '₹' + Math.round(Number(num) || 0).toLocaleString('en-IN'); }
    function formatDateDDMMYYYY(dInput) {
      if (!dInput) return '—'; const d = new Date(dInput); if (isNaN(d.getTime())) return String(dInput);
      return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
    }
    function formatDateTimeDDMMYYYY(dInput) {
      if (!dInput) return '—'; const d = new Date(dInput); if (isNaN(d.getTime())) return String(dInput);
      return `${formatDateDDMMYYYY(d)} ${d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true })}`;
    }
    function getDueUrgency(pDate, status) {
      if (!pDate || status === 'Delivered') return null;
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const diffDays = Math.round((new Date(pDate + 'T00:00:00') - today) / 86400000);
      if (diffDays < 0) return { label: `OVERDUE (${Math.abs(diffDays)}d)`, level: 'overdue' };
      if (diffDays === 0) return { label: 'DUE TODAY', level: 'today' };
      if (diffDays === 1) return { label: 'DUE TOMORROW', level: 'tomorrow' };
      return null;
    }
    function getHoursInStage(order) {
      const refTime = order.stage_changed_at || order.created_at;
      if (!refTime) return 0; return Math.max(0, (Date.now() - new Date(refTime).getTime()) / 3600000);
    }

    // =========================================================================
    // V8 SAFE MIGRATION & MULTI-LINE INTEGER MATH
    // =========================================================================
    function migrateOrderToV8(order) {
      if (!order) return order;
      if (Array.isArray(order.order_lines) && order.order_lines.length > 0) return order;
      const migratedLines = [];
      if (order.seating_segments || order.design_name) {
        const segParts = String(order.seating_segments || '').split('+').map(s => s.trim()).filter(Boolean);
        migratedLines.push({
          id: 'mig-seat-' + (order.id || Math.random()), part: 'Seating', custom_part: '', design_name: order.design_name || '',
          unit: 'Inches', rate: order.seating_rate || 0, measurement_pending: order.status === 'Measurement Pending',
          segments: segParts.length ? segParts.map((len, i) => ({ id: 's-' + i, length: len, width: '', label: '' })) : [{ id: 's-0', length: '', width: '', label: '' }]
        });
      }
      if (order.back_segments) {
        const bParts = String(order.back_segments || '').split('+').map(s => s.trim()).filter(Boolean);
        migratedLines.push({
          id: 'mig-back-' + (order.id || Math.random()), part: 'Back', custom_part: '', design_name: order.design_name || '',
          unit: order.back_unit === 'Pcs' ? 'Pcs' : 'Inches', rate: order.back_rate || 0, measurement_pending: false,
          segments: bParts.map((len, i) => ({ id: 'b-' + i, length: len, width: '', label: '' }))
        });
      }
      return { ...order, order_lines: migratedLines, sofa_shape: order.sofa_shape || { type: 'None', unit: 'inch', sides: {} }, special_cuts: Array.isArray(order.special_cuts) ? order.special_cuts : [], is_archived: Boolean(order.is_archived), is_trashed: Boolean(order.is_trashed) };
    }

    function evalLengthToken(token) {
      const clean = String(token ?? '').trim().toLowerCase().replace(/×/g, 'x').replace(/\*/g, 'x');
      if (!clean) return 0;
      if (clean.includes('x')) {
        const parts = clean.split('x').map((p) => p.trim()).filter(Boolean);
        if (!parts.length) return 0;
        let prod = 1; for (const p of parts) { const v = Number(p); if (!Number.isFinite(v) || v <= 0) return 0; prod *= v; }
        return prod;
      }
      const v = Number(clean); return Number.isFinite(v) && v > 0 ? v : 0;
    }

    function parseLengthExpression(expr) {
      if (!expr) return []; return String(expr).replace(/,/g, '+').split('+').map((t) => evalLengthToken(t)).filter((n) => n > 0);
    }
    function toInt(val) { const n = parseInt(String(val ?? '').replace(/[^0-9-]/g, ''), 10); return Number.isInteger(n) ? n : 0; }

    function calcLineEstimate(line = {}) {
      const unit = line.unit === 'Pcs' ? 'Pcs' : 'Inches';
      const rateInt = Math.max(0, toInt(line.rate));
      const lengthValues = []; const displaySegments = [];
      (line.segments || []).forEach((seg) => {
        const rawLen = String(seg?.length ?? '').trim(); const rawWid = String(seg?.width ?? '').trim();
        if (!rawLen) return;
        const parsedLens = parseLengthExpression(rawLen); parsedLens.forEach((val) => lengthValues.push(val));
        if (parsedLens.length > 0) {
          const segStr = rawWid ? `${rawLen}"×${rawWid}"` : (unit === 'Inches' ? `${rawLen}"` : `${rawLen}`);
          displaySegments.push(seg.label ? `${segStr} (${seg.label})` : segStr);
        }
      });
      const totalCentiInches = lengthValues.reduce((acc, n) => acc + Math.round(n * 100), 0);
      const totalInches = totalCentiInches / 100;
      let quarters = 0, billableQty = 0, billableStr = '0.00', amount = 0;
      if (unit === 'Pcs') {
        billableQty = Math.round(totalInches); billableStr = String(billableQty); amount = Math.floor(billableQty * rateInt);
      } else {
        quarters = totalCentiInches > 0 ? Math.ceil(totalCentiInches / 300) : 0;
        billableQty = quarters / 4; billableStr = billableQty.toFixed(2);
        amount = Math.floor((quarters * rateInt) / 4); // Math.floor for whole rupees
      }
      const partLabel = line.part === 'Other' ? (line.custom_part || 'Other') : (line.part || 'Seating');
      const exprText = displaySegments.length ? displaySegments.join(' + ') : '0';
      const liveText = unit === 'Inches' ? `${partLabel}${line.design_name ? ' - ' + line.design_name : ''}: ${exprText} = ${totalInches}" = ${billableStr} ft × Rs ${rateInt.toLocaleString('en-IN')} = Rs ${amount.toLocaleString('en-IN')}` : `${partLabel}${line.design_name ? ' - ' + line.design_name : ''}: ${exprText} = ${billableStr} pcs × Rs ${rateInt.toLocaleString('en-IN')} = Rs ${amount.toLocaleString('en-IN')}`;
      return { id: line.id, partLabel, design_name: line.design_name || '', unit, rateInt, lengthValues, displaySegments, totalInches, quarters, billableQty, billableStr, amount, liveText, measurement_pending: Boolean(line.measurement_pending) };
    }

    function calcOrderEstimate(form = {}) {
      const lineCalcs = (form.order_lines || []).map((l) => calcLineEstimate(l));
      const linesTotal = lineCalcs.reduce((s, c) => s + c.amount, 0);
      const visitChargeInt = Math.max(0, toInt(form.visit_charge));
      const advanceInt = Math.max(0, toInt(form.advance_amount));
      const total = linesTotal + visitChargeInt;
      const balance = total - advanceInt;
      const seatCalcs = lineCalcs.filter(c => c.partLabel === 'Seating');
      const backCalcs = lineCalcs.filter(c => c.partLabel !== 'Seating');
      return { lineCalcs, linesTotal, visitChargeInt, advanceInt, total, balance, hasMeasurementPending: lineCalcs.some((c) => c.measurement_pending), allDesigns: [...new Set(lineCalcs.map((c) => c.design_name).filter(Boolean))].join(', ') || form.design_name || '', seatingInches: seatCalcs.reduce((s, c) => s + c.totalInches, 0), seatingFeet: seatCalcs.reduce((s, c) => s + c.billableQty, 0), seatingSegmentsStr: seatCalcs.map(c => c.displaySegments.join('+')).filter(Boolean).join(' | '), backRaw: backCalcs.reduce((s, c) => s + c.totalInches, 0), backBillable: backCalcs.reduce((s, c) => s + c.billableQty, 0), backSegmentsStr: backCalcs.map(c => `${c.partLabel}: ${c.displaySegments.join('+')}`).filter(Boolean).join(' | ') };
    }

    // =========================================================================
    // V8 SHAPES, SPECIAL CUTS & WHATSAPP
    // =========================================================================
    const SOFA_SHAPE_TEMPLATES = {
      'None': { label: 'No Shape Outline', sides: [] }, 'Straight': { label: 'Straight Sofa', sides: ['A', 'B'] },
      'L-shape': { label: 'L-Shape Sofa', sides: ['A', 'B', 'C', 'D'] }, 'L-shape with a step': { label: 'L-Shape with Step Cut', sides: ['A', 'B', 'C', 'D', 'E', 'F'] },
      'U-shape': { label: 'U-Shape Sofa', sides: ['A', 'B', 'C', 'D', 'E'] }, 'Corner': { label: 'Corner Wedge', sides: ['A', 'B', 'C'] }, 'Curved corner': { label: 'Curved Corner', sides: ['A', 'B', 'R'] }
    };
    const SPECIAL_CUT_TYPES = ['Step cut', 'Notch around leg/pillar', 'Curved corner', 'Recliner', 'Chaise', 'Round arm', 'Other'];

    function SofaShapeSVG({ shape, compact = false }) {
      if (!shape || !shape.type || shape.type === 'None') return null;
      const u = shape.unit === 'ft' ? 'ft' : '"'; const s = shape.sides || {}; const lbl = (k) => `${k}: ${s[k] || '?'}${u}`;
      return (
        <div className={`bg-white border border-gray-300 rounded ${compact ? 'p-1' : 'p-2.5'} inline-block`}>
          <div className="text-[10px] font-bold uppercase text-gray-700 mb-1">Shape: {shape.type}</div>
          <svg viewBox="0 0 220 120" className={compact ? 'w-36 h-20' : 'w-60 h-32'}>
            {shape.type === 'Straight' && <><rect x="25" y="35" width="170" height="50" fill="#fef3c7" stroke="#111827" strokeWidth="2" /><text x="110" y="25" textAnchor="middle" fontSize="11">{lbl('A')}</text><text x="202" y="64" fontSize="11">{lbl('B')}</text></>}
            {shape.type === 'L-shape' && <><polygon points="20,20 190,20 190,60 80,60 80,105 20,105" fill="#fef3c7" stroke="#111827" strokeWidth="2" /><text x="105" y="14" textAnchor="middle" fontSize="10">{lbl('A')}</text><text x="195" y="44" fontSize="10">{lbl('B')}</text><text x="135" y="74" textAnchor="middle" fontSize="10">{lbl('C')}</text><text x="86" y="92" fontSize="10">{lbl('D')}</text></>}
            {shape.type === 'L-shape with a step' && <><polygon points="20,20 190,20 190,55 155,55 155,68 78,68 78,105 20,105" fill="#fef3c7" stroke="#111827" strokeWidth="2" /><text x="105" y="14" textAnchor="middle" fontSize="9.5">{lbl('A')}</text><text x="194" y="40" fontSize="9.5">{lbl('B')}</text><text x="172" y="66" textAnchor="middle" fontSize="9">{lbl('C')}</text><text x="116" y="80" textAnchor="middle" fontSize="9.5">{lbl('D')}</text><text x="84" y="95" fontSize="9.5">{lbl('E')}</text><text x="48" y="116" textAnchor="middle" fontSize="9.5">{lbl('F')}</text></>}
            {shape.type === 'U-shape' && <><polygon points="20,20 200,20 200,105 155,105 155,55 65,55 65,105 20,105" fill="#fef3c7" stroke="#111827" strokeWidth="2" /><text x="110" y="14" textAnchor="middle" fontSize="9.5">{lbl('A')}</text><text x="14" y="65" textAnchor="end" fontSize="9.5">{lbl('B')}</text><text x="110" y="70" textAnchor="middle" fontSize="9.5">{lbl('C')}</text><text x="204" y="65" fontSize="9.5">{lbl('D')}</text><text x="177" y="116" textAnchor="middle" fontSize="9.5">{lbl('E')}</text></>}
            {shape.type === 'Corner' && <><polygon points="25,20 185,20 185,65 110,65 65,105 25,105" fill="#fef3c7" stroke="#111827" strokeWidth="2" /><text x="105" y="14" textAnchor="middle" fontSize="10">{lbl('A')}</text><text x="190" y="45" fontSize="10">{lbl('B')}</text><text x="105" y="92" textAnchor="middle" fontSize="10">{lbl('C')}</text></>}
            {shape.type === 'Curved corner' && <><path d="M 25 20 L 185 20 L 185 65 Q 85 65 85 105 L 25 105 Z" fill="#fef3c7" stroke="#111827" strokeWidth="2" /><text x="105" y="14" textAnchor="middle" fontSize="10">{lbl('A')}</text><text x="190" y="45" fontSize="10">{lbl('B')}</text><text x="115" y="88" textAnchor="middle" fontSize="10">{lbl('R')}</text></>}
          </svg>
        </div>
      );
    }

    const DEFAULT_WA_TEMPLATES = {
      estimate: { lang: 'Hinglish', text: `Namaste {customer} ji!\n*Shree Gayatri Furnishing Hub* mein aapka swagat hai.\n\nAapke Sofa Cover ka Estimate (*{order_no}*):\n{lines}\n\n*Estimate Total: Rs {total}*\nOrder confirm karne ke liye kripya sampark karein: {shop_phone}` },
      receipt: { lang: 'Hinglish', text: `Namaste {customer} ji! Aapka Sofa Cover order confirm ho gaya hai.\n\n*Shree Gayatri Furnishing Hub*\nOrder No: *{order_no}*\n\n*Order Details:*\n{lines}\n\nEstimate Total: *Rs {total}*\nAdvance Paid: *Rs {advance}*\nBalance Due: *Rs {balance}*\nPromised Delivery Date: *{promised_date}*\nShop Contact: {shop_phone}\n\n*Zaroori Niyam (Terms):*\n1. Cover ko garm paani mein na dhoyein (Do not wash the cover in hot water).\n2. Machine-dry ya spin bilkul na karein (Do not machine-dry/spin).\n3. Sofa aur curtain items ki delivery ke liye 3rd floor par jana hoga (For delivery of sofa and curtain items you must go to the 3rd floor).\n4. Diya gaya advance non-refundable hai (Advance paid is non-refundable).` },
      ready: { lang: 'Hinglish', text: `Namaste {customer} ji! Aapka Sofa Cover (Order *{order_no}*) bankar *READY* hai.\n\n{lines}\nBalance Due: *Rs {balance}*\n\nNote: Sofa aur curtain items ki delivery ke liye 3rd floor par padharein.\n- *Shree Gayatri Furnishing Hub* ({shop_phone})` },
      reminder: { lang: 'Hinglish', text: `Namaste {customer} ji! Aapke Sofa Cover Order *{order_no}* ka Balance *Rs {balance}* baaki hai.\nKripya 3rd floor se apna order collect karein.\n- *Shree Gayatri Furnishing Hub* ({shop_phone})` },
      delivered: { lang: 'Hinglish', text: `Dhanyavaad {customer} ji! Order *{order_no}* deliver ho chuka hai.\nYaad rakhein: Cover ko garm paani mein na dhoyein aur machine-dry/spin na karein.\n- *Shree Gayatri Furnishing Hub* ({shop_phone})` }
    };

    const WhatsAppService = {
      formatPhone(mobile) { const d = String(mobile||'').replace(/\D/g, ''); return d.length === 10 ? `91${d}` : d; },
      buildLinesSummary(order) {
        const calc = calcOrderEstimate(migrateOrderToV8(order));
        if (!calc.lineCalcs.length) return `${order.design_name || 'Sofa Cover'}: Rs ${Number(order.estimate_total || 0).toLocaleString('en-IN')}`;
        return calc.lineCalcs.map(c => `${c.partLabel} - ${c.design_name}: ${c.billableStr} ${c.unit === 'Inches' ? 'ft' : 'pcs'} x Rs ${c.rateInt} = Rs ${c.amount}`).join('\n');
      },
      renderMessage(type, order, settings) {
        const tplObj = (settings?.wa_templates || DEFAULT_WA_TEMPLATES)[type] || DEFAULT_WA_TEMPLATES.receipt;
        const shopPhone = [settings?.shop_phone || '8866925561', settings?.shop_phone_alt].filter(Boolean).join(' / ');
        return (typeof tplObj === 'string' ? tplObj : tplObj.text)
          .replace(/\{customer\}/g, order.customer_name || '').replace(/\{order_no\}/g, order.order_no || '')
          .replace(/\{lines\}/g, this.buildLinesSummary(order)).replace(/\{total\}/g, Number(order.estimate_total||0).toLocaleString('en-IN'))
          .replace(/\{advance\}/g, Number(order.advance_amount||0).toLocaleString('en-IN')).replace(/\{balance\}/g, Number(order.balance_amount||0).toLocaleString('en-IN'))
          .replace(/\{promised_date\}/g, formatDateDDMMYYYY(order.promised_date)).replace(/\{shop_phone\}/g, shopPhone);
      },
      open(type, order, settings) {
        const text = this.renderMessage(type, order, settings);
        window.open(`https://wa.me/${this.formatPhone(order.mobile)}?text=${encodeURIComponent(text)}`, '_blank');
      }
    };

    // =========================================================================
    // MODALS (WhatsApp Preview, Sticker Print, Timeline, StatusChip)
    // =========================================================================
    function StatusChip({ status }) {
      const map = { 'Measurement Pending': 'bg-gray-100 text-gray-700 border-gray-300', 'Estimate Given': 'bg-gray-100 text-gray-800 border-gray-400', 'Cutting Pending': 'bg-amber-50 text-amber-800 border-amber-300', 'With Tailor': 'bg-blue-50 text-blue-800 border-blue-300', 'Silai Done': 'bg-teal-50 text-teal-800 border-teal-300', 'Ready': 'bg-emerald-50 text-emerald-800 border-emerald-300', 'Delivered': 'bg-slate-800 text-white border-slate-800' };
      return <span className={`inline-flex items-center px-2.5 py-0.5 rounded text-xs font-semibold border whitespace-nowrap ${map[status] || map['Measurement Pending']}`}>{status}</span>;
    }

    function WhatsAppPreviewModal({ type, order, settings, onClose }) {
      const [msgType, setMsgType] = useState(type || 'receipt');
      const [text, setText] = useState(() => WhatsAppService.renderMessage(type || 'receipt', order, settings));
      useEffect(() => { setText(WhatsAppService.renderMessage(msgType, order, settings)); }, [msgType, order, settings]);
      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-md max-w-lg w-full p-4 md:p-5 shadow-xl space-y-4">
            <div className="flex justify-between items-center border-b pb-3"><div><h3 className="font-bold text-base text-gray-900">WhatsApp Preview</h3><p className="text-xs text-gray-500">To: {order.customer_name} ({order.mobile})</p></div><button onClick={onClose} className="p-2 bg-gray-100 rounded hover:bg-gray-200"><Icon name="X" size={18} /></button></div>
            <div className="flex flex-wrap gap-1.5">{[{id:'estimate',label:'Estimate'},{id:'receipt',label:'Receipt'},{id:'ready',label:'Ready'},{id:'reminder',label:'Reminder'},{id:'delivered',label:'Delivered'}].map(t => <button key={t.id} onClick={()=>setMsgType(t.id)} className={`px-2.5 py-1.5 rounded text-xs font-semibold border ${msgType===t.id?'bg-emerald-700 text-white':'bg-gray-50 text-gray-700'}`}>{t.label}</button>)}</div>
            <textarea rows={10} className="w-full border rounded p-3 text-xs font-mono bg-gray-50" value={text} onChange={(e) => setText(e.target.value)} />
            <div className="flex gap-2"><button onClick={()=>{window.open(WhatsAppService.getEncodedUrl(order.mobile, text), '_blank'); onClose();}} className="flex-1 bg-emerald-700 text-white py-2.5 rounded font-bold text-sm min-h-[44px]">Send on WhatsApp</button><button onClick={onClose} className="px-4 py-2.5 border rounded font-semibold min-h-[44px]">Cancel</button></div>
          </div>
        </div>
      );
    }

    function StickerPrintModal({ ordersList, settings, onClose, onLogReprint }) {
      const w = settings?.sticker_width_mm || 60; const h = settings?.sticker_height_mm || 40;
      const handlePrint = () => {
        const style = document.createElement('style'); style.innerHTML = `@page { size: ${w}mm ${h}mm; margin: 0; }`;
        document.head.appendChild(style); ordersList.forEach(ord => onLogReprint && onLogReprint(ord)); window.print(); document.head.removeChild(style);
      };
      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-md max-w-lg w-full p-4 md:p-5 shadow-lg">
            <div className="flex justify-between items-center border-b pb-3 mb-3">
              <div><h3 className="font-bold text-base text-gray-900">{ordersList.length > 1 ? `Batch Stickers (${ordersList.length})` : `Cutting Sticker`}</h3><p className="text-xs text-gray-500">Label size: {w} × {h} mm</p></div>
              <button onClick={onClose} className="p-2 bg-gray-100 rounded hover:bg-gray-200 min-w-[44px] min-h-[44px]"><Icon name="X" size={18} /></button>
            </div>
            <div id="printable-area" className="max-h-80 overflow-y-auto bg-gray-100 p-3 rounded space-y-3 mb-3">
              {ordersList.map(raw => {
                const order = migrateOrderToV8(raw); const calc = calcOrderEstimate(order);
                const qrUrl = `${window.location.origin}${window.location.pathname}?scan=${order.order_no}`;
                const qrImg = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&margin=0&data=${encodeURIComponent(qrUrl)}`;
                return (
                  <div key={order.id} style={{ width: `${w}mm`, minHeight: `${h}mm`, pageBreakAfter: 'always' }} className="bg-white border border-black p-1 flex flex-col justify-between text-black leading-tight overflow-hidden mx-auto">
                    <div className="flex justify-between items-start border-b border-black pb-0.5">
                      <div><div className="font-bold text-xs tracking-tight">{order.order_no}</div><div className="text-[8px] font-semibold truncate max-w-[38mm]">{calc.allDesigns}</div></div>
                      <img src={qrImg} className="w-[8mm] h-[8mm]" />
                    </div>
                    <div className="text-[7.5px] space-y-0.5 my-0.5">
                      {calc.lineCalcs.map((lc, i) => (
                        <div key={i} className={lc.measurement_pending ? 'font-bold underline' : ''}><strong>{lc.partLabel}:</strong> {lc.design_name} — {lc.displaySegments.join(' + ') || 'PENDING'} ({lc.billableStr}{lc.unit==='Inches'?'ft':'pcs'}){lc.measurement_pending&&' [PENDING]'}</div>
                      ))}
                      {order.sofa_shape?.type && order.sofa_shape.type !== 'None' && <div className="pt-0.5"><SofaShapeSVG shape={order.sofa_shape} compact={true} /></div>}
                      {order.special_cuts?.length > 0 && <div className="border-t border-black pt-0.5 font-bold">SPL CUT: {order.special_cuts.map(sc => `${sc.type} (${sc.line_ref} ${sc.size}: ${sc.note})`).join('; ')}</div>}
                      {order.tailor_notes && <div className="truncate italic border-t border-dashed border-gray-500 pt-0.5">Note: {order.tailor_notes}</div>}
                    </div>
                    <div className="text-[7.5px] font-bold border-t border-black pt-0.5 flex justify-between"><span>DEL: {formatDateDDMMYYYY(order.promised_date)}</span><span>PCS: {order.total_pcs}</span></div>
                  </div>
                );
              })}
            </div>
            <button onClick={handlePrint} className="w-full bg-amber-700 text-white py-3 rounded font-bold text-sm min-h-[44px]">Print Sticker(s)</button>
          </div>
        </div>
      );
    }

    function OrderTimelineModal({ order, activityLogs, onClose }) {
      const logs = activityLogs.filter((l) => l.order_id === order.id || l.orders?.order_no === order.order_no);
      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-md max-w-lg w-full p-4 md:p-5 shadow-lg">
            <div className="flex justify-between items-center border-b pb-3 mb-4"><div><h3 className="font-bold text-base text-gray-900">Audit Timeline — {order.order_no}</h3></div><button onClick={onClose} className="p-2 bg-gray-100 rounded min-w-[44px] min-h-[44px]"><Icon name="X" size={18} /></button></div>
            <div className="max-h-80 overflow-y-auto space-y-3">
              {logs.length === 0 ? <p className="text-sm text-gray-500 py-6 text-center">No activity logged.</p> : logs.map((l) => (
                <div key={l.id} className="flex items-start gap-3 border-l-2 border-amber-600 pl-3 py-1"><div className="flex-1"><div className="text-sm font-medium">{l.action}</div><div className="text-xs text-gray-500">By <span className="font-semibold uppercase">{l.performed_by_role || l.role}</span> • {formatDateTimeDDMMYYYY(l.created_at)}</div></div></div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function ImportantNotesBoard({ notes, orders, onMarkDone, onOpenOrder }) {
      const [showHistory, setShowHistory] = useState(false);
      const openNotes = notes.filter(n => n.status !== 'done');
      const displayed = showHistory ? notes.filter(n => n.status === 'done') : openNotes;
      return (
        <div className="bg-white border border-amber-300 rounded shadow-sm mb-4">
          <div className="px-4 py-2.5 bg-amber-50 border-b border-amber-200 flex flex-wrap justify-between items-center gap-2">
            <div className="flex items-center gap-2"><Icon name="Pin" size={16} className="text-amber-800" /><span className="font-bold text-sm text-gray-900">Important Notes Board</span><span className="px-2 py-0.5 rounded-full text-xs font-bold bg-red-600 text-white tabular-nums">{openNotes.length} Open</span></div>
            <button onClick={() => setShowHistory(!showHistory)} className="text-xs font-semibold text-amber-900 underline min-h-[36px]">{showHistory ? `View Open (${openNotes.length})` : `View History`}</button>
          </div>
          {displayed.length === 0 ? <div className="p-3 text-xs text-gray-500 text-center">No notes.</div> : (
            <div className="divide-y divide-gray-200 max-h-56 overflow-y-auto">
              {displayed.map(note => {
                const linkedOrder = orders.find(o => o.id === note.order_id || o.order_no === note.order_no);
                return (
                  <div key={note.id} onClick={() => linkedOrder && onOpenOrder(linkedOrder)} className="px-4 py-2.5 hover:bg-gray-50 cursor-pointer flex flex-wrap justify-between items-center gap-2">
                    <div className="space-y-0.5">
                      <div className="flex items-center gap-2"><span className="font-bold text-xs underline">{note.order_no}</span><span className={`px-1.5 py-0.5 rounded text-[10px] font-bold uppercase ${note.priority==='Urgent'?'bg-red-100 text-red-800 border border-red-300':'bg-gray-100 text-gray-700'}`}>{note.priority}</span><span className="text-sm font-medium">{note.note_text}</span></div>
                      <div className="text-[11px] text-gray-500">By <strong className="uppercase">{note.created_by_role}</strong> • {formatDateTimeDDMMYYYY(note.created_at)}</div>
                    </div>
                    {note.status !== 'done' && <button onClick={(e) => { e.stopPropagation(); onMarkDone(note); }} className="px-3 py-1.5 bg-emerald-700 text-white rounded text-xs font-semibold min-h-[36px]">Mark Done</button>}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // V8 ORDER ENTRY SCREEN (FULL DESKTOP & MOBILE LAYOUT RESTORED)
    // =========================================================================
    function OrderEntryScreen({ supabase, existingOrder: rawExisting, allOrders, salesmen, notes, currentRole, onCancel, onCommitOrder }) {
      const existingOrder = useMemo(() => migrateOrderToV8(rawExisting), [rawExisting]);
      const isConfirmed = existingOrder && !['Measurement Pending', 'Estimate Given'].includes(existingOrder.status);
      const canEditSpecs = !isConfirmed || currentRole === 'admin';
      const draftKey = existingOrder ? `sg_draft_v8_${existingOrder.id}` : 'sg_draft_v8_new_order';

      const [form, setForm] = useState(() => {
        if (!existingOrder) { const saved = localStorage.getItem(draftKey); if (saved) try { return JSON.parse(saved); } catch (e) {} }
        return {
          customer_name: existingOrder?.customer_name || '', mobile: existingOrder?.mobile || '', address: existingOrder?.address || '',
          home_delivery: existingOrder?.home_delivery || false, measurement_source: existingOrder?.measurement_source || 'Customer brought',
          visit_staff_name: existingOrder?.visit_staff_name || '', visit_charge: existingOrder?.visit_charge || 0,
          order_lines: existingOrder?.order_lines?.length ? existingOrder.order_lines : [{ id: 'line-1', part: 'Seating', design_name: '', unit: 'Inches', rate: '', measurement_pending: false, segments: [{ id: 'seg-1', length: '', width: '36', label: '' }] }],
          sofa_shape: existingOrder?.sofa_shape || { type: 'None', unit: 'inch', sides: {} }, special_cuts: existingOrder?.special_cuts || [], sketch_photo_url: existingOrder?.sketch_photo_url || '',
          tailor_notes: existingOrder?.tailor_notes || '', total_pcs: existingOrder?.total_pcs || '', advance_amount: existingOrder?.advance_amount || 0, payment_mode: existingOrder?.payment_mode || 'Cash',
          salesman_id: existingOrder?.salesman_id || (salesmen[0]?.id || ''), promised_date: existingOrder?.promised_date || '', important_note_text: '', important_note_priority: 'Normal'
        };
      });

      const [uploadingPhoto, setUploadingPhoto] = useState(false);
      const [reviewMode, setReviewMode] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const calc = useMemo(() => calcOrderEstimate(form), [form]);

      useEffect(() => { if (!existingOrder) localStorage.setItem(draftKey, JSON.stringify(form)); }, [form]);
      
      const usedWidths = useMemo(() => {
        const set = new Set(['26', '36', '48', '54']);
        (form.order_lines || []).forEach(l => (l.segments || []).forEach(s => { if (s.width && String(s.width).trim()) set.add(String(s.width).trim()); }));
        return Array.from(set);
      }, [form.order_lines]);

      const matchingPastOrders = useMemo(() => {
        const cleanMob = String(form.mobile || '').replace(/\D/g, '');
        if (cleanMob.length < 10) return [];
        return allOrders.filter((o) => String(o.mobile || '').replace(/\D/g, '').endsWith(cleanMob.slice(-10)) && o.id !== existingOrder?.id);
      }, [form.mobile, allOrders]);
      const handleMobileChange = (val) => {
        const clean = val.replace(/\D/g, '').slice(0, 10); const updates = { mobile: clean };
        if (clean.length === 10) {
          const prev = allOrders.find((o) => String(o.mobile || '').replace(/\D/g, '').endsWith(clean));
          if (prev) { if (!form.customer_name) updates.customer_name = prev.customer_name; if (!form.address && prev.address) updates.address = prev.address; }
        }
        setForm((f) => ({ ...f, ...updates }));
      };

      const formRef = useRef(null);
      const handleFieldKeyDown = (e, isSeg = false) => {
        if (e.key !== 'Enter') return; e.preventDefault();
        if (isSeg) { const val = e.target.value.trim(); if (val && !val.endsWith('+')) { setForm((f) => ({ ...f, [e.target.name]: val + '+' })); return; } }
        const focusables = Array.from(formRef.current.querySelectorAll('input:not([disabled]), select:not([disabled]), textarea:not([disabled])'));
        const idx = focusables.indexOf(e.target); if (idx > -1 && idx < focusables.length - 1) focusables[idx + 1].focus();
      };

      const addLine = () => setForm(f => ({ ...f, order_lines: [...f.order_lines, { id: 'line-' + Math.random(), part: f.order_lines.length===1 ? 'Back':'Handle', design_name: f.order_lines[0]?.design_name||'', unit: 'Inches', rate: '', measurement_pending: false, segments: [{ id: 'seg-' + Math.random(), length: '', width: '36', label: '' }] }] }));
      const updateLine = (id, p) => setForm(f => ({ ...f, order_lines: f.order_lines.map(l => l.id === id ? { ...l, ...p } : l) }));
      const removeLine = (id) => setForm(f => ({ ...f, order_lines: f.order_lines.filter(l => l.id !== id) }));
      const addSegment = (id) => setForm(f => ({ ...f, order_lines: f.order_lines.map(l => l.id === id ? { ...l, segments: [...l.segments, { id: 'seg-' + Math.random(), length: '', width: l.segments[l.segments.length-1]?.width||'36', label: '' }] } : l) }));
      const updateSegment = (lId, sId, p) => setForm(f => ({ ...f, order_lines: f.order_lines.map(l => l.id === lId ? { ...l, segments: l.segments.map(s => s.id === sId ? { ...s, ...p } : s) } : l) }));
      const removeSegment = (lId, sId) => setForm(f => ({ ...f, order_lines: f.order_lines.map(l => l.id === lId && l.segments.length>1 ? { ...l, segments: l.segments.filter(s => s.id !== sId) } : l) }));

      const handlePhotoUpload = async (e) => {
        const file = e.target.files?.[0]; if (!file) return; setUploadingPhoto(true);
        try {
          const fn = `sketch_${Date.now()}.jpg`;
          const { error } = await supabase.storage.from('sofa_sketches').upload(fn, file, { upsert: true });
          if (!error) { const { data } = supabase.storage.from('sofa_sketches').getPublicUrl(fn); setForm(f => ({ ...f, sketch_photo_url: data.publicUrl })); }
        } finally { setUploadingPhoto(false); }
      };

      const validateAndOpenReview = () => {
        setErrorMsg('');
        if (!form.customer_name.trim() || String(form.mobile).replace(/\D/g, '').length < 10) return setErrorMsg('Please enter Customer Name and 10-digit Mobile.');
        if (!form.order_lines.some((l) => l.design_name.trim())) return setErrorMsg('Please enter Design Name on at least one order line.');
        if (!form.salesman_id || !form.promised_date || !form.total_pcs) return setErrorMsg('Salesman, Promised Date, and Total Pieces are required to confirm.');
        setReviewMode(true);
      };

      const finalizeSave = (targetStatus, afterAction = 'none') => {
        setErrorMsg(''); if (!form.customer_name.trim() || !String(form.mobile).trim()) return setErrorMsg('Customer Name and Mobile required.');
        const nextStatus = targetStatus === 'Confirmed' ? (calc.hasMeasurementPending ? 'Measurement Pending' : 'Cutting Pending') : targetStatus;
        const p = { ...form, visit_charge: calc.visitChargeInt, design_name: calc.allDesigns, seating_segments: calc.seatingSegmentsStr, seating_total_inches: calc.seatingInches, seating_feet: calc.seatingFeet, seating_rate: calc.lineCalcs[0]?.rateInt||0, back_unit: 'Inches', back_segments: calc.backSegmentsStr, back_total_raw: calc.backRaw, back_billable_qty: calc.backBillable, back_rate: calc.lineCalcs[1]?.rateInt||0, total_pcs: parseInt(form.total_pcs)||1, estimate_total: calc.total, advance_amount: calc.advanceInt, status: nextStatus };
        onCommitOrder(p, targetStatus === 'Confirmed', afterAction, { manualNote: form.important_note_text ? { text: form.important_note_text, priority: form.important_note_priority } : null, hasMeasurementPending: calc.hasMeasurementPending, advanceZeroOnConfirm: targetStatus === 'Confirmed' && calc.advanceInt === 0 });
      };

      return (
        <div className="bg-white border rounded shadow-sm">
          <div className="px-4 md:px-5 py-3 border-b flex justify-between items-center bg-gray-50">
            <div className="flex items-center gap-3"><button onClick={onCancel} className="px-3 py-2 border bg-white rounded text-xs font-semibold min-h-[44px] md:min-h-0 flex items-center gap-1.5"><Icon name="ArrowLeft" size={14} /> Back</button><h2 className="font-bold">{existingOrder ? `Edit ${existingOrder.order_no}` : 'New Order / Estimate'}</h2></div>
            {!existingOrder && <button type="button" onClick={() => { localStorage.removeItem(draftKey); setForm({...form, customer_name:'', mobile:''}); }} className="text-xs text-gray-600 underline">Clear Form</button>}
          </div>
          {errorMsg && <div className="mx-4 md:mx-5 mt-4 p-3 bg-red-50 border border-red-300 text-red-800 rounded text-sm font-medium flex items-center gap-2"><Icon name="AlertCircle" size={16} /> {errorMsg}</div>}

          <div ref={formRef} className="p-4 md:p-5 grid grid-cols-1 lg:grid-cols-3 gap-5 md:gap-6">
            <div className="lg:col-span-2 space-y-5">
              <div className="border rounded p-3.5 md:p-4 space-y-3.5">
                <div className="text-xs font-bold uppercase text-gray-500">1. Customer Details</div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3.5">
                  <div><label className="block text-xs font-semibold mb-1 mobile-label">Mobile *</label><input type="tel" className="w-full border rounded px-3 py-2 text-sm tabular-nums" value={form.mobile} onChange={e => handleMobileChange(e.target.value)} onKeyDown={handleFieldKeyDown} /></div>
                  <div><label className="block text-xs font-semibold mb-1 mobile-label">Name *</label><input className="w-full border rounded px-3 py-2 text-sm" value={form.customer_name} onChange={e => setForm({ ...form, customer_name: e.target.value })} onKeyDown={handleFieldKeyDown} /></div>
                  <div><label className="block text-xs font-semibold mb-1 mobile-label">Salesman *</label><select className="w-full border rounded px-3 py-2 bg-white text-sm" value={form.salesman_id} onChange={e => setForm({ ...form, salesman_id: e.target.value })} onKeyDown={handleFieldKeyDown}><option value="">Select Salesman</option>{salesmen.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}</select></div>
                </div>
                {matchingPastOrders.length > 0 && (
                  <div className="bg-amber-50 border border-amber-200 rounded p-3 text-xs text-amber-900 flex justify-between items-center">
                    <span><strong>Returning:</strong> Found {matchingPastOrders.length} past orders</span>
                    <button type="button" onClick={() => { const p = matchingPastOrders[0]; setForm(f => ({ ...f, order_lines: p.order_lines||f.order_lines, total_pcs: p.total_pcs })); }} className="px-3 py-2 bg-amber-700 text-white rounded font-semibold min-h-[44px] md:min-h-0">Copy Past Meas.</button>
                  </div>
                )}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3.5">
                  <div><label className="block text-xs font-semibold mb-1 mobile-label">Promised Date *</label><input type="date" className="w-full border rounded px-3 py-2 text-sm" value={form.promised_date} onChange={e => setForm({ ...form, promised_date: e.target.value })} onKeyDown={handleFieldKeyDown} /></div>
                  <div><label className="block text-xs font-semibold mb-1 mobile-label">Total Pcs *</label><input type="number" className="w-full border rounded px-3 py-2 text-sm tabular-nums" value={form.total_pcs} onChange={e => setForm({ ...form, total_pcs: e.target.value })} onKeyDown={handleFieldKeyDown} /></div>
                  <div><label className="block text-xs font-semibold mb-1 mobile-label">Address</label><input className="w-full border rounded px-3 py-2 text-sm" value={form.address} onChange={e => setForm({ ...form, address: e.target.value })} onKeyDown={handleFieldKeyDown} /></div>
                </div>
              </div>

              <div className="border rounded p-3.5 md:p-4 space-y-4">
                <div className="flex flex-wrap justify-between items-center gap-2 border-b pb-2.5">
                  <div><span className="text-xs font-bold uppercase text-gray-800">2. Order Lines</span></div>
                  <button disabled={!canEditSpecs} onClick={addLine} className="px-3.5 py-2 bg-amber-700 text-white rounded text-xs font-bold min-h-[44px] md:min-h-0 flex items-center gap-1.5"><Icon name="Plus" size={14} /> Add Line</button>
                </div>
                <div className="flex flex-wrap gap-1.5 text-xs"><span className="text-gray-500 font-semibold">Widths used:</span>{usedWidths.map(w => <span key={w} className="px-2 py-0.5 bg-gray-100 border rounded font-mono text-[11px]">{w}"</span>)}</div>
                <div className="space-y-4">
                  {form.order_lines.map((line, lIdx) => {
                    const lc = calc.lineCalcs[lIdx];
                    return (
                      <div key={line.id} className={`border-2 rounded p-3.5 space-y-3 ${line.measurement_pending ? 'border-amber-500 bg-amber-50/30' : 'bg-gray-50 border-gray-200'}`}>
                        <div className="flex justify-between items-center"><span className="font-bold text-xs uppercase">Line #{lIdx+1}</span><div className="flex items-center gap-3"><label className="text-xs font-bold text-amber-900 flex items-center gap-1 min-h-[44px]"><input type="checkbox" className="w-4 h-4" checked={line.measurement_pending} onChange={e=>updateLine(line.id, {measurement_pending: e.target.checked})} /> Pending</label>{form.order_lines.length>1&&<button onClick={()=>removeLine(line.id)} className="text-xs text-red-700 font-bold p-2">X</button>}</div></div>
                        <div className="grid grid-cols-1 sm:grid-cols-4 gap-2.5">
                          <div><label className="block text-[11px] font-semibold mb-0.5">Part</label><select disabled={!canEditSpecs} className="w-full border rounded px-2.5 py-1.5 text-sm bg-white" value={line.part} onChange={e=>updateLine(line.id, {part:e.target.value})}><option value="Seating">Seating</option><option value="Back">Back</option><option value="Handle">Handle</option><option value="Other">Other</option></select>{line.part==='Other'&&<input placeholder="Custom Part..." className="mt-1.5 w-full border rounded px-2.5 py-1 text-xs" value={line.custom_part||''} onChange={e=>updateLine(line.id, {custom_part:e.target.value})}/>}</div>
                          <div><label className="block text-[11px] font-semibold mb-0.5">Design *</label><input disabled={!canEditSpecs} className="w-full border rounded px-2.5 py-1.5 text-sm" value={line.design_name} onChange={e=>updateLine(line.id, {design_name:e.target.value})} /></div>
                          <div><label className="block text-[11px] font-semibold mb-0.5">Unit</label><select disabled={!canEditSpecs} className="w-full border rounded px-2.5 py-1.5 text-sm bg-white" value={line.unit} onChange={e=>updateLine(line.id, {unit:e.target.value})}><option value="Inches">Inches</option><option value="Pcs">Pcs</option></select></div>
                          <div><label className="block text-[11px] font-semibold mb-0.5">Rate</label><input type="number" disabled={!canEditSpecs} className="w-full border rounded px-2.5 py-1.5 text-sm tabular-nums" value={line.rate} onChange={e=>updateLine(line.id, {rate:e.target.value})} /></div>
                        </div>
                        <div className="space-y-2 pt-1 border-t">
                          <div className="flex justify-between items-center"><span className="text-[11px] font-bold">Segments (Len x Width)</span><button disabled={!canEditSpecs} onClick={()=>addSegment(line.id)} className="px-2.5 py-1 bg-white border rounded text-xs font-bold min-h-[36px] md:min-h-0">+ Seg</button></div>
                          {line.segments.map(seg => (
                            <div key={seg.id} className="grid grid-cols-12 gap-2 items-center">
                              <div className="col-span-6"><input disabled={!canEditSpecs} placeholder="Len (e.g. 24x4)" className="w-full border rounded px-2.5 py-1.5 text-sm tabular-nums" value={seg.length} onChange={e=>updateSegment(line.id, seg.id, {length:e.target.value})} /></div>
                              <div className="col-span-4"><input disabled={!canEditSpecs} placeholder='Width' className="w-full border rounded px-2.5 py-1.5 text-sm tabular-nums" value={seg.width} onChange={e=>updateSegment(line.id, seg.id, {width:e.target.value})} /></div>
                              <div className="col-span-2 text-right">{line.segments.length>1&&<button onClick={()=>removeSegment(line.id, seg.id)} className="text-red-700 font-bold p-2 min-h-[36px]">X</button>}</div>
                            </div>
                          ))}
                        </div>
                        <div className="text-xs font-bold text-amber-900 bg-amber-50 border border-amber-200 rounded px-3 py-2 tabular-nums">{lc.liveText}</div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="border rounded p-4 space-y-4">
                <div className="text-xs font-bold uppercase text-gray-700">3. Shape, Special Cuts & Photo</div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="space-y-3">
                    <div className="flex gap-2">
                      <div className="flex-1"><label className="block text-xs font-semibold mb-1">Shape</label><select className="w-full border rounded px-3 py-2 text-sm bg-white" value={form.sofa_shape?.type||'None'} onChange={e=>setForm({...form, sofa_shape:{type:e.target.value, unit:'inch', sides:{}}})}>{Object.keys(SOFA_SHAPE_TEMPLATES).map(k=><option key={k} value={k}>{SOFA_SHAPE_TEMPLATES[k].label}</option>)}</select></div>
                      <div className="w-28"><label className="block text-xs font-semibold mb-1">Unit</label><select className="w-full border rounded px-2.5 py-2 text-sm bg-white" value={form.sofa_shape?.unit||'inch'} onChange={e=>setForm({...form, sofa_shape:{...form.sofa_shape, unit:e.target.value}})}><option value="inch">inch</option><option value="ft">feet</option></select></div>
                    </div>
                    {SOFA_SHAPE_TEMPLATES[form.sofa_shape?.type||'None'].sides.length>0 && (
                      <div className="grid grid-cols-3 gap-2">{SOFA_SHAPE_TEMPLATES[form.sofa_shape.type].sides.map(sKey => <div key={sKey}><label className="block text-xs font-bold">Side {sKey}</label><input type="number" className="w-full border rounded px-2 py-1.5 text-sm tabular-nums" value={form.sofa_shape.sides[sKey]||''} onChange={e=>setForm({...form, sofa_shape:{...form.sofa_shape, sides:{...form.sofa_shape.sides, [sKey]:e.target.value}}})} /></div>)}</div>
                    )}
                  </div>
                  <SofaShapeSVG shape={form.sofa_shape} />
                </div>
                <div className="pt-3 border-t space-y-2">
                  <div className="flex justify-between items-center"><span className="text-xs font-bold text-amber-900 uppercase">Special Cuts</span><button onClick={()=>setForm(f=>({...f, special_cuts:[...(f.special_cuts||[]), {id:Math.random(), type:'Step cut', line_ref:'', size:'', note:''}]}))} className="px-3 py-1 bg-amber-100 border border-amber-400 text-amber-900 rounded text-xs font-bold min-h-[36px]">+ Add Cut</button></div>
                  {(form.special_cuts||[]).map(sc => (
                    <div key={sc.id} className="grid grid-cols-1 sm:grid-cols-12 gap-2 bg-amber-50 p-2 rounded border border-amber-300">
                      <select className="sm:col-span-3 border rounded px-2 py-1.5 text-xs bg-white min-h-[44px] md:min-h-0" value={sc.type} onChange={e=>setForm(f=>({...f, special_cuts:f.special_cuts.map(x=>x.id===sc.id?{...x, type:e.target.value}:x)}))}>{SPECIAL_CUT_TYPES.map(t=><option key={t}>{t}</option>)}</select>
                      <input placeholder="Line/Seg" className="sm:col-span-3 border rounded px-2 py-1.5 text-xs bg-white" value={sc.line_ref} onChange={e=>setForm(f=>({...f, special_cuts:f.special_cuts.map(x=>x.id===sc.id?{...x, line_ref:e.target.value}:x)}))} />
                      <input placeholder="Size" className="sm:col-span-2 border rounded px-2 py-1.5 text-xs bg-white" value={sc.size} onChange={e=>setForm(f=>({...f, special_cuts:f.special_cuts.map(x=>x.id===sc.id?{...x, size:e.target.value}:x)}))} />
                      <input placeholder="Note" className="sm:col-span-3 border rounded px-2 py-1.5 text-xs bg-white" value={sc.note} onChange={e=>setForm(f=>({...f, special_cuts:f.special_cuts.map(x=>x.id===sc.id?{...x, note:e.target.value}:x)}))} />
                      <button onClick={()=>setForm(f=>({...f, special_cuts:f.special_cuts.filter(x=>x.id!==sc.id)}))} className="sm:col-span-1 text-red-700 font-bold p-2 min-h-[44px] md:min-h-0">X</button>
                    </div>
                  ))}
                </div>
                <div className="pt-3 border-t">
                  <label className="block text-xs font-bold text-gray-700">Attach Sketch Photo</label>
                  <input type="file" accept="image/*" capture="environment" onChange={handlePhotoUpload} className="mt-1 text-xs" />
                  {uploadingPhoto && <span className="text-xs text-amber-700 ml-2">Uploading...</span>}
                  {form.sketch_photo_url && <div className="mt-2 flex gap-2"><img src={form.sketch_photo_url} className="h-16 w-20 object-cover rounded border" /><button onClick={()=>setForm({...form, sketch_photo_url:''})} className="text-xs text-red-600 underline">Remove</button></div>}
                </div>
                <div><label className="block text-xs font-semibold mb-1">Tailor Notes (Printed on Sticker)</label><textarea rows={2} className="w-full border rounded px-3 py-2 text-sm" value={form.tailor_notes} onChange={e=>setForm({...form, tailor_notes:e.target.value})} /></div>
              </div>

              <div className="border border-amber-300 bg-amber-50/40 rounded p-4 space-y-2">
                <div className="text-xs font-bold uppercase text-amber-900">4. Important Note (Pinned to Dashboard)</div>
                <div className="grid grid-cols-1 sm:grid-cols-4 gap-2">
                  <input placeholder="Note for counter/admin..." className="sm:col-span-3 border rounded px-3 py-2 text-sm bg-white" value={form.important_note_text} onChange={e=>setForm({...form, important_note_text:e.target.value})} />
                  <select className="border rounded px-3 py-2 text-sm bg-white font-semibold min-h-[44px] md:min-h-0" value={form.important_note_priority} onChange={e=>setForm({...form, important_note_priority:e.target.value})}><option>Normal</option><option>Urgent</option></select>
                </div>
              </div>
            </div>

            <div className="bg-gray-50 border rounded p-4 flex flex-col justify-between space-y-5">
              <div className="space-y-3">
                <div className="border-b pb-2"><span className="text-xs font-bold uppercase">Live Estimate</span></div>
                <table className="w-full text-sm tabular-nums">
                  <tbody className="divide-y">
                    {calc.lineCalcs.map((lc, i) => (
                      <tr key={i}><td className="py-2 text-gray-700"><div className="font-semibold">{lc.partLabel} — {lc.design_name}</div><div className="text-xs text-gray-500">{lc.billableStr} {lc.unit==='Inches'?'ft':'pcs'} × ₹{lc.rateInt}</div></td><td className="py-2 text-right font-bold">{formatINR(lc.amount)}</td></tr>
                    ))}
                    {calc.visitChargeInt > 0 && <tr><td className="py-2 text-gray-600">Visit Charge</td><td className="py-2 text-right font-semibold">{formatINR(calc.visitChargeInt)}</td></tr>}
                    <tr className="bg-white"><td className="py-2.5 font-bold text-base">Net Payable</td><td className="py-2.5 text-right font-bold text-lg">{formatINR(calc.total)}</td></tr>
                  </tbody>
                </table>
                <div className="pt-2 space-y-3 border-t">
                  <div><label className="block text-xs font-semibold mb-1">Advance Received (₹)</label><input type="number" className="w-full border bg-white rounded px-3 py-2 text-base font-bold tabular-nums min-h-[44px]" value={form.advance_amount} onChange={e=>setForm({...form, advance_amount:e.target.value})} /></div>
                  <div className="grid grid-cols-3 gap-2">{['Cash', 'UPI', 'Card'].map(m => <button key={m} onClick={()=>setForm({...form, payment_mode:m})} className={`py-2 rounded text-xs font-semibold border min-h-[44px] ${form.payment_mode===m ? 'bg-gray-900 text-white' : 'bg-white text-gray-700'}`}>{m}</button>)}</div>
                  <div className="bg-white border rounded p-3 flex justify-between items-center"><span className="text-xs font-bold uppercase">Balance Due</span><span className={`text-lg font-bold ${calc.balance>0?'text-red-700':'text-emerald-700'}`}>{formatINR(calc.balance)}</span></div>
                </div>
              </div>
              <div className="space-y-2.5 pt-3 border-t">
                {(!existingOrder || ['Measurement Pending', 'Estimate Given'].includes(existingOrder.status)) ? (
                  <><button onClick={()=>finalizeSave(calc.hasMeasurementPending ? 'Measurement Pending' : 'Estimate Given')} className="w-full bg-white border py-3 rounded font-semibold text-sm min-h-[44px]">Save as Pending</button>
                  <button onClick={validateAndOpenReview} className="w-full bg-amber-700 text-white py-3 rounded font-bold text-sm min-h-[44px]">Review & Confirm →</button></>
                ) : <button onClick={()=>finalizeSave(existingOrder.status)} className="w-full bg-gray-900 text-white py-3 rounded font-bold text-sm min-h-[44px]">Save Changes</button>}
              </div>
            </div>
          </div>

          {reviewMode && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-md max-w-xl w-full p-5 shadow-xl space-y-4">
                <div className="flex justify-between items-center border-b pb-3"><h3 className="font-bold text-lg">Final Review</h3><button onClick={() => setReviewMode(false)} className="p-2 min-h-[44px] min-w-[44px]"><Icon name="X" size={18} /></button></div>
                <div className="bg-gray-50 border rounded p-4 space-y-2 text-sm">
                  <div className="flex justify-between"><span>Customer:</span><strong className="text-right">{form.customer_name} ({form.mobile})</strong></div>
                  {calc.lineCalcs.map((lc, idx) => <div key={idx} className="flex justify-between text-xs"><span>{lc.partLabel}:</span><strong className="text-right">{lc.billableStr} {lc.unit==='Inches'?'ft':'pcs'} × ₹{lc.rateInt} = {formatINR(lc.amount)}</strong></div>)}
                  <div className="border-t pt-2 flex justify-between text-base"><span>Total: <strong>{formatINR(calc.total)}</strong> | Adv: <strong>{formatINR(calc.advanceInt)}</strong></span><span className="text-red-700 font-bold">Bal: {formatINR(calc.balance)}</span></div>
                </div>
                <div className="space-y-2">
                  <button onClick={() => finalizeSave('Confirmed', 'sticker_and_wa')} className="w-full bg-amber-700 text-white py-3 rounded font-bold text-sm min-h-[44px]">Confirm + Sticker + WA Preview</button>
                  <button onClick={() => finalizeSave('Confirmed', 'sticker_only')} className="w-full bg-gray-900 text-white py-3 rounded font-semibold text-sm min-h-[44px]">Confirm + Sticker Only</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // MOBILE SHOP FLOOR VIEW (CUTTING & TAILOR)
    // =========================================================================
    function ShopFloorMobileView({ supabase, profile, scannedOrderNo }) {
      const [orders, setOrders] = useState([]);
      const [pieceStats, setPieceStats] = useState({ today: 0, month: 0 });
      const [selectedTailor, setSelectedTailor] = useState({});
      const [specialCutReadAck, setSpecialCutReadAck] = useState({});

      const fetchProd = async () => {
        const { data } = await supabase.from('production_orders_view').select('*').order('promised_date', { ascending: true });
        if (data) {
          const migrated = data.map(migrateOrderToV8);
          if (profile.role === 'cutting') setOrders(migrated.filter(o => o.status === 'Cutting Pending'));
          else if (profile.role.startsWith('tailor')) setOrders(migrated.filter(o => o.status === 'With Tailor' && o.assigned_tailor === profile.role));
          else setOrders(migrated);
        }
        if (profile.role.startsWith('tailor')) {
          const startOfDay = new Date(); startOfDay.setHours(0, 0, 0, 0);
          const startOfMonth = new Date(startOfDay.getFullYear(), startOfDay.getMonth(), 1);
          const { data: logs } = await supabase.from('tailor_piece_logs').select('pcs_count, logged_at').gte('logged_at', startOfMonth.toISOString());
          if (logs) setPieceStats({ month: logs.reduce((s, l) => s + l.pcs_count, 0), today: logs.filter(l => new Date(l.logged_at) >= startOfDay).reduce((s, l) => s + l.pcs_count, 0) });
        }
      };

      useEffect(() => { fetchProd(); const sub = supabase.channel('prod-live').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, fetchProd).subscribe(); return () => supabase.removeChannel(sub); }, [profile.role]);

      const handleCuttingComplete = async (order) => {
        const hasSpecial = (order.special_cuts?.length > 0) || (order.sofa_shape?.type && order.sofa_shape.type !== 'None') || Boolean(order.sketch_photo_url);
        if (hasSpecial && !specialCutReadAck[order.id]) return alert('Please tick "I have read the special cut" before marking Cutting OK.');
        const tailor = selectedTailor[order.id]; if (!tailor) return alert('Select Tailor 1 or Tailor 2');
        if (!confirm('Confirm cutting done?')) return;
        await supabase.rpc('advance_production_status', { p_order_id: order.id, p_new_status: 'With Tailor', p_assigned_tailor: tailor }); fetchProd();
      };
      const handleStitchingComplete = async (order) => {
        if (!confirm(`Confirm stitching complete for ${order.order_no} (${order.total_pcs} pcs)?`)) return;
        await supabase.rpc('advance_production_status', { p_order_id: order.id, p_new_status: 'Silai Done' }); fetchProd();
      };

      return (
        <div className="max-w-xl mx-auto p-3 space-y-4">
          {profile.role.startsWith('tailor') && (
            <div className="bg-white border rounded p-4 grid grid-cols-2 divide-x text-center tabular-nums">
              <div><div className="text-xs font-semibold text-gray-500 uppercase">Today</div><div className="text-2xl font-bold mt-0.5">{pieceStats.today} pcs</div></div>
              <div><div className="text-xs font-semibold text-gray-500 uppercase">This Month</div><div className="text-2xl font-bold text-amber-800 mt-0.5">{pieceStats.month} pcs</div></div>
            </div>
          )}
          <div className="flex justify-between items-center px-1"><h2 className="font-bold text-base">{profile.role === 'cutting' ? `To Cut (${orders.length})` : `To Stitch (${orders.length})`}</h2></div>
          {orders.length === 0 ? <div className="bg-white border rounded p-10 text-center text-gray-500">Queue is clear</div> : orders.map((order) => {
            const calc = calcOrderEstimate(order); const urgency = getDueUrgency(order.promised_date, order.status);
            const hasSpecialCut = (order.special_cuts?.length > 0) || (order.sofa_shape?.type && order.sofa_shape.type !== 'None') || Boolean(order.sketch_photo_url);
            return (
              <div key={order.id} className={`bg-white rounded border-2 p-4 space-y-3 ${scannedOrderNo === order.order_no ? 'border-amber-600' : 'border-gray-300'}`}>
                <div className="flex justify-between items-start border-b pb-2.5">
                  <div><div className="flex items-center gap-2"><span className="font-bold text-lg">{order.order_no}</span>{urgency && <span className="px-2 py-0.5 rounded text-[11px] font-bold bg-red-100 text-red-800">{urgency.label}</span>}</div><div className="text-base font-semibold mt-0.5">{calc.allDesigns}</div></div>
                  <div className="text-right tabular-nums"><div className="text-xs font-semibold text-gray-500">DELIVERY</div><div className="text-sm font-bold">{formatDateDDMMYYYY(order.promised_date)}</div><div className="text-xs font-bold text-amber-800">{order.total_pcs} PCS</div></div>
                </div>
                <div className="bg-gray-50 border rounded p-3 space-y-1.5 text-sm">
                  {calc.lineCalcs.map((lc, idx) => <div key={idx} className={lc.measurement_pending ? 'bg-amber-100 font-bold' : ''}><strong>{lc.partLabel} - {lc.design_name}:</strong> {lc.displaySegments.join(' + ')} ({lc.billableStr} {lc.unit==='Inches'?'ft':'pcs'}){lc.measurement_pending&&' [PENDING]'}</div>)}
                  {order.tailor_notes && <div className="pt-1.5 border-t text-red-700 font-bold">Note: {order.tailor_notes}</div>}
                </div>
                {hasSpecialCut && (
                  <div className="bg-amber-100 border-2 border-amber-500 rounded p-3 space-y-2">
                    <div className="font-bold text-xs uppercase text-amber-950 flex items-center gap-1.5"><Icon name="AlertTriangle" size={16} /> SPECIAL CUT & SHAPE</div>
                    <SofaShapeSVG shape={order.sofa_shape} />
                    {order.special_cuts?.map((sc, i) => <div key={i} className="text-sm font-bold text-gray-900">• {sc.type} — {sc.line_ref} ({sc.size}): {sc.note}</div>)}
                    {order.sketch_photo_url && <div><img src={order.sketch_photo_url} className="max-h-48 rounded border border-gray-400" /></div>}
                    {profile.role === 'cutting' && <label className="flex items-center gap-2 pt-2 border-t border-amber-300 font-bold text-sm min-h-[44px] cursor-pointer"><input type="checkbox" className="w-5 h-5" checked={Boolean(specialCutReadAck[order.id])} onChange={e=>setSpecialCutReadAck({...specialCutReadAck, [order.id]:e.target.checked})}/> I have read the special cut</label>}
                  </div>
                )}
                {profile.role === 'cutting' && (
                  <div className="space-y-2.5 pt-1">
                    <div className="grid grid-cols-2 gap-2">{['tailor_1', 'tailor_2'].map(tKey => <button key={tKey} onClick={() => setSelectedTailor({ ...selectedTailor, [order.id]: tKey })} className={`py-3.5 rounded border-2 font-bold min-h-[48px] ${selectedTailor[order.id] === tKey ? 'bg-gray-900 text-white' : 'bg-white'}`}>{tKey === 'tailor_1' ? 'Tailor 1' : 'Tailor 2'}</button>)}</div>
                    <button disabled={hasSpecialCut && !specialCutReadAck[order.id]} onClick={() => handleCuttingComplete(order)} className="w-full bg-amber-700 disabled:bg-gray-300 disabled:text-gray-500 text-white py-4 rounded font-bold text-base min-h-[48px]">Cutting OK</button>
                  </div>
                )}
                {profile.role.startsWith('tailor') && <button onClick={() => handleStitchingComplete(order)} className="w-full bg-emerald-700 text-white py-4 rounded font-bold text-base min-h-[48px]">Mark Stitching Done ({order.total_pcs} Pcs)</button>}
              </div>
            );
          })}
        </div>
      );
    }

    // =========================================================================
    // ADMIN REPORTS (FULL V6 DESKTOP/MOBILE VIEW)
    // =========================================================================
    function AdminReportsView({ orders, salesmen, settings, pieceLogs, onDownloadExcel }) {
      const todayIso = new Date().toISOString().split('T')[0];
      const thirtyDaysAgoIso = new Date(Date.now() - 30 * 86400000).toISOString().split('T')[0];
      const [reportType, setReportType] = useState('day_end');
      const [fromDate, setFromDate] = useState(thirtyDaysAgoIso);
      const [toDate, setToDate] = useState(todayIso);
      const [mobileFiltersOpen, setMobileFiltersOpen] = useState(false);

      const inRange = (isoStr) => { if (!isoStr) return false; const d = isoStr.split('T')[0]; return d >= fromDate && d <= toDate; };
      const rangeOrders = orders.filter((o) => inRange(o.created_at));
      const confirmedRange = rangeOrders.filter((o) => !['Measurement Pending', 'Estimate Given'].includes(o.status));
      const todayOrders = orders.filter((o) => o.created_at?.startsWith(todayIso));
      const todayConfirmed = todayOrders.filter((o) => !['Measurement Pending', 'Estimate Given'].includes(o.status));
      
      const cashAdv = todayConfirmed.filter(o => o.payment_mode === 'Cash').reduce((s, o) => s + Number(o.advance_amount), 0);
      const upiAdv = todayConfirmed.filter(o => o.payment_mode === 'UPI').reduce((s, o) => s + Number(o.advance_amount), 0);
      const cardAdv = todayConfirmed.filter(o => o.payment_mode === 'Card').reduce((s, o) => s + Number(o.advance_amount), 0);
      const totalTodayBalance = todayConfirmed.reduce((s, o) => s + Number(o.balance_amount), 0);

      const readyDeliveryList = orders.filter((o) => o.status === 'Ready');
      const lateOrdersList = orders.filter(o => o.status !== 'Delivered' && getDueUrgency(o.promised_date, o.status)?.level === 'overdue');
      const balanceDueList = orders.filter(o => !['Measurement Pending', 'Estimate Given'].includes(o.status) && Number(o.balance_amount) > 0);

      const REPORT_TABS = [{ id: 'day_end', label: '1. Day-End' }, { id: 'aging', label: '2. Aging' }, { id: 'late_delivery', label: '3. Late/Del' }, { id: 'visits', label: '4. Visits' }, { id: 'tailors', label: '5. Tailors' }, { id: 'salesmen', label: '6. Salesmen' }, { id: 'unconfirmed', label: '7. Unconfirmed' }, { id: 'dues', label: '8. Dues' }];
      const pendingStages = ['Measurement Pending', 'Estimate Given', 'Cutting Pending', 'With Tailor', 'Silai Done', 'Ready'];
      const maxStageCount = Math.max(1, ...pendingStages.map(st => orders.filter(o => o.status === st).length));

      return (
        <div className="space-y-4">
          <div className="md:hidden bg-white border rounded p-3 space-y-3 no-print">
            <div className="flex justify-between items-center"><div className="text-sm font-bold">Reports</div><button onClick={() => setMobileFiltersOpen(!mobileFiltersOpen)} className="px-3.5 py-2 bg-gray-900 text-white rounded text-sm font-semibold inline-flex items-center gap-2 min-h-[44px]"><Icon name="SlidersHorizontal" size={16} /> Filters</button></div>
            {mobileFiltersOpen && (
              <div className="pt-3 border-t space-y-3">
                <div className="grid grid-cols-1 gap-2.5"><div><label className="block text-xs font-bold mb-1">From</label><input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} className="w-full border rounded px-3 py-2 text-sm min-h-[44px]" /></div><div><label className="block text-xs font-bold mb-1">To</label><input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} className="w-full border rounded px-3 py-2 text-sm min-h-[44px]" /></div></div>
                <button onClick={onDownloadExcel} className="w-full py-2.5 bg-gray-900 text-white rounded text-sm font-semibold min-h-[44px]"><Icon name="Download" size={16} /> Export Excel</button>
              </div>
            )}
          </div>

          <div className="hidden md:flex bg-white border rounded p-4 flex-wrap justify-between items-center gap-3 no-print">
            <div className="flex items-center gap-2"><label className="text-xs font-bold">From:</label><input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} className="border rounded px-2.5 py-1.5 text-xs font-medium" /><label className="text-xs font-bold">To:</label><input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} className="border rounded px-2.5 py-1.5 text-xs font-medium" /></div>
            <button onClick={onDownloadExcel} className="px-3 py-1.5 bg-gray-900 text-white rounded text-xs font-semibold inline-flex items-center gap-1.5"><Icon name="Download" size={14} /> Export Excel</button>
          </div>

          <div className="hidden md:flex flex-wrap gap-1.5 no-print">{REPORT_TABS.map(rt => <button key={rt.id} onClick={() => setReportType(rt.id)} className={`px-3 py-2 rounded text-xs font-semibold border ${reportType === rt.id ? 'bg-amber-700 text-white border-amber-700' : 'bg-white hover:bg-gray-50 border-gray-300'}`}>{rt.label}</button>)}</div>

          {/* MOBILE SINGLE-COLUMN VIEW */}
          <div className="md:hidden space-y-4">
            <section className="bg-white border rounded p-4 space-y-3"><h3 className="font-bold border-b pb-2">1. Today's Summary</h3><div className="grid grid-cols-2 gap-3"><div className="border rounded p-3 bg-gray-50"><div className="text-xs font-semibold">Orders Today</div><div className="text-lg font-bold">{todayOrders.length}</div></div><div className="border rounded p-3 bg-gray-50"><div className="text-xs font-semibold">Ready / Del</div><div className="text-lg font-bold">{readyDeliveryList.length} / {orders.filter(o=>o.status==='Delivered').length}</div></div><div className="border rounded p-3 bg-gray-50"><div className="text-xs font-semibold">Advance Today</div><div className="text-lg font-bold text-emerald-700">{formatINR(cashAdv+upiAdv+cardAdv)}</div></div><div className="border rounded p-3 bg-gray-50"><div className="text-xs font-semibold">Today Balance</div><div className="text-lg font-bold text-red-700">{formatINR(totalTodayBalance)}</div></div></div></section>
            <section className="bg-white border rounded p-4 space-y-3"><h3 className="font-bold border-b pb-2">2. Stage Aging</h3><div className="space-y-2 w-full">{pendingStages.map(st => { const count=orders.filter(o=>o.status===st).length; const pct=Math.round((count/maxStageCount)*100); return <div key={st} className="w-full"><div className="flex justify-between text-xs font-semibold"><span>{st}</span><span>{count}</span></div><div className="w-full bg-gray-100 h-2.5 rounded"><div className="bg-amber-700 h-full rounded" style={{width:`${pct}%`}}/></div></div>; })}</div></section>
            <section className="bg-white border rounded p-4 space-y-3"><div className="flex justify-between items-center border-b pb-2"><h3 className="font-bold">3. Late Orders</h3><span className="px-2 bg-red-100 text-red-800 rounded text-xs font-bold">{lateOrdersList.length}</span></div><div className="overflow-x-auto"><table className="w-full text-sm"><tbody>{lateOrdersList.map(o=><tr key={o.id}><td className="p-2 font-bold">{o.order_no}</td><td className="p-2 text-red-700 font-bold">{formatDateDDMMYYYY(o.promised_date)}</td><td className="p-2 text-right font-bold">{formatINR(o.balance_amount)}</td></tr>)}</tbody></table></div></section>
            <section className="bg-white border rounded p-4 space-y-3"><div className="flex justify-between items-center border-b pb-2"><h3 className="font-bold">4. Ready Pending</h3><span className="px-2 bg-emerald-100 text-emerald-800 rounded text-xs font-bold">{readyDeliveryList.length}</span></div><div className="overflow-x-auto"><table className="w-full text-sm"><tbody>{readyDeliveryList.map(o=><tr key={o.id}><td className="p-2 font-bold">{o.order_no}</td><td className="p-2">{o.customer_name}</td><td className="p-2 text-right font-bold text-red-700">{formatINR(o.balance_amount)}</td></tr>)}</tbody></table></div></section>
            <section className="bg-white border rounded p-4 space-y-3"><div className="flex justify-between items-center border-b pb-2"><h3 className="font-bold">5. Balance Due</h3><span className="font-bold text-red-700">{formatINR(balanceDueList.reduce((s,o)=>s+Number(o.balance_amount),0))}</span></div><div className="overflow-x-auto"><table className="w-full text-sm"><tbody>{balanceDueList.map(o=><tr key={o.id}><td className="p-2 font-bold">{o.order_no}</td><td className="p-2">{o.customer_name}</td><td className="p-2 text-right font-bold text-red-700">{formatINR(o.balance_amount)}</td></tr>)}</tbody></table></div></section>
            <section className="bg-white border rounded p-4 space-y-3"><div className="flex justify-between items-center border-b pb-2"><h3 className="font-bold">6. Tailor Earning</h3></div><div className="overflow-x-auto"><table className="w-full text-sm"><tbody>{['tailor_1','tailor_2'].map(tr=>{ const pl=pieceLogs.filter(l=>l.tailor_role===tr&&inRange(l.logged_at)); const ern=pl.reduce((s,l)=>s+(l.pcs_count*l.rate_at_time),0); return <tr key={tr}><td className="p-2 font-bold">{tr}</td><td className="p-2 text-right">{pl.reduce((s,l)=>s+l.pcs_count,0)} pcs</td><td className="p-2 text-right font-bold text-emerald-700">{formatINR(ern)}</td></tr>; })}</tbody></table></div></section>
            <section className="bg-white border rounded p-4 space-y-3"><div className="flex justify-between items-center border-b pb-2"><h3 className="font-bold">7. Salesmen</h3></div><div className="overflow-x-auto"><table className="w-full text-sm"><tbody>{salesmen.map(sm=>{ const sAll=rangeOrders.filter(o=>o.salesman_id===sm.id && !['Measurement Pending','Estimate Given'].includes(o.status)); const val=sAll.reduce((s,o)=>s+Number(o.estimate_total),0); return <tr key={sm.id}><td className="p-2 font-bold">{sm.name}</td><td className="p-2 text-right">{sAll.length} ord</td><td className="p-2 text-right font-bold text-emerald-700">{formatINR(val)}</td></tr>; })}</tbody></table></div></section>
            <section className="bg-white border rounded p-4 space-y-3"><div className="flex justify-between items-center border-b pb-2"><h3 className="font-bold">8. Unconfirmed</h3></div><div className="overflow-x-auto"><table className="w-full text-sm"><tbody>{orders.filter(o=>['Measurement Pending','Estimate Given'].includes(o.status)).map(o=><tr key={o.id}><td className="p-2 font-bold">{o.order_no}</td><td className="p-2">{o.customer_name}</td><td className="p-2 text-right font-bold">{formatINR(o.estimate_total)}</td></tr>)}</tbody></table></div></section>
          </div>

          {/* DESKTOP TABBED VIEW */}
          <div id="printable-area" className="hidden md:block bg-white border border-gray-300 rounded p-4 space-y-4">
            <h3 className="font-bold text-base text-gray-900 border-b pb-2">{REPORT_TABS.find(r=>r.id===reportType)?.label}</h3>
            {reportType === 'day_end' && (
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3"><div className="border rounded p-3 bg-gray-50"><div className="text-xs text-gray-500 font-semibold">Orders Today</div><div className="text-xl font-bold mt-1">{todayOrders.length}</div></div></div>
            )}
            {reportType === 'aging' && (
              <table className="w-full text-sm border tabular-nums"><thead className="bg-gray-100 text-xs"><tr><th className="p-2.5 text-left border-b">Stage</th><th className="p-2.5 text-right border-b">Pending</th><th className="p-2.5 text-right border-b">Avg Aging</th></tr></thead><tbody>{pendingStages.map(st => { const list=orders.filter(o=>o.status===st); const avg=list.length?(list.reduce((s,o)=>s+getHoursInStage(o)/24,0)/list.length).toFixed(1):'0.0'; return <tr key={st}><td className="p-2.5 font-semibold"><StatusChip status={st}/></td><td className="p-2.5 text-right font-bold">{list.length}</td><td className="p-2.5 text-right">{avg} days</td></tr>; })}</tbody></table>
            )}
            {reportType === 'salesmen' && (
              <table className="w-full text-sm border tabular-nums"><thead className="bg-gray-100 text-xs"><tr><th className="p-2.5 text-left border-b">Salesman</th><th className="p-2.5 text-right border-b">Orders</th><th className="p-2.5 text-right border-b">Sales Value</th></tr></thead><tbody>{salesmen.map(sm => { const sAll = rangeOrders.filter(o => o.salesman_id === sm.id && !['Measurement Pending','Estimate Given'].includes(o.status)); const val = sAll.reduce((s,o)=>s+Number(o.estimate_total),0); return <tr key={sm.id}><td className="p-2.5">{sm.name}</td><td className="p-2.5 text-right">{sAll.length}</td><td className="p-2.5 text-right font-bold text-emerald-700">{formatINR(val)}</td></tr>; })}</tbody></table>
            )}
            {reportType !== 'day_end' && reportType !== 'aging' && reportType !== 'salesmen' && <div className="text-gray-500 p-4">Select 'Export Excel' to view full data for {reportType}</div>}
          </div>
        </div>
      );
    }

    // =========================================================================
    // DESKTOP & RESPONSIVE ERP SHELL (V6 Sidebar + V8 features)
    // =========================================================================
    function DesktopERPView({ supabase, profile, savedKey, onLogout, triggerInstall }) {
      const isAdmin = profile.role === 'admin';
      const [activeNav, setActiveNav] = useState('orders'); // orders | archived | trash | new_order | settings
      const [queueFilter, setQueueFilter] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedIds, setSelectedIds] = useState([]);
      const [mobileDrawerOpen, setMobileDrawerOpen] = useState(false);

      const [orders, setOrders] = useState([]);
      const [salesmen, setSalesmen] = useState([]);
      const [settings, setSettings] = useState({ sticker_width_mm: 60, sticker_height_mm: 40, shop_phone: '8866925561', wa_templates: DEFAULT_WA_TEMPLATES });
      const [devices, setDevices] = useState([]);
      const [pieceLogs, setPieceLogs] = useState([]);
      const [activityLogs, setActivityLogs] = useState([]);
      const [notes, setNotes] = useState([]);

      const [editingOrder, setEditingOrder] = useState(null);
      const [stickerBatch, setStickerBatch] = useState(null);
      const [timelineOrder, setTimelineOrder] = useState(null);
      const [waPreviewOrder, setWaPreviewOrder] = useState(null);

      const [globalSearchOpen, setGlobalSearchOpen] = useState(false);
