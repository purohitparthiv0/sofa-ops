        if (/Windows/i.test(ua)) return 'Windows PC';
        if (/Mac/i.test(ua)) return 'Mac';
        return ua.slice(0, 32) || 'Browser Device';
      };

      useEffect(() => {
        const handler = (e) => { e.preventDefault(); setInstallPrompt(e); };
        window.addEventListener('beforeinstallprompt', handler);
        return () => window.removeEventListener('beforeinstallprompt', handler);
      }, []);

      const triggerInstall = async () => {
        if (installPrompt) {
          installPrompt.prompt();
          await installPrompt.userChoice;
          setInstallPrompt(null);
        } else {
          alert('To install this app:\n• Desktop Chrome: Click the Install icon in the right side of the address bar.\n• Mobile Safari/Chrome: Tap Share / 3-dots menu -> "Add to Home Screen".');
        }
      };

      const loadCloudDb = async (client) => {
        if (!client) return;
        try {
          const { parsed, notFound } = await downloadFreshDbJson(client);
          if (parsed) {
            baseDbRef.current = parsed;
            cloudReadyRef.current = true;
            setDb(parsed);
            localStorage.setItem('sg_cloud_db_cache', JSON.stringify(parsed));
            setSyncStatus('Synced');
          } else if (notFound) {
            baseDbRef.current = null;
            cloudReadyRef.current = true;
            setSyncStatus('Ready');
          }
        } catch (e) {
          if (/403|unauthorized|policy|row-level/i.test(String(e?.message || ''))) {
            setSyncStatus('Locked (Approval Needed)');
          } else {
            setSyncStatus('OFFLINE - changes will not save');
          }
        }
      };

      useEffect(() => {
        if (!savedKey || savedKey.length < 15) return;
        // Send x-device-fp on every Supabase request for PostgreSQL RLS enforcement
        const client = createClient(DEFAULT_SUPABASE_URL, savedKey.trim(), {
          global: { headers: { 'x-device-fp': myFp } }
        });
        setSupabaseClient(client);

        // Check server-side device status + locked role BEFORE loading any data
        (async () => {
          const { data: devInfo, error: infoErr } = await client.rpc('get_my_device_info');
          if (!infoErr && devInfo && typeof devInfo.registered === 'boolean') {
            setServerAuthMode(true);
            if (devInfo.registered && devInfo.role) {
              setLockedDeviceRole(devInfo.role);
              setSelectedRole(devInfo.role);
              localStorage.setItem('sg_locked_device_role', devInfo.role);
              // Prevent sessionStorage tampering: if active session role != locked device role, force logout
              const activeSes = sessionStorage.getItem('sg_active_role');
              if (activeSes && activeSes !== devInfo.role) {
                sessionStorage.removeItem('sg_active_role');
                setCurrentRole(null);
              }
            } else {
              setLockedDeviceRole(null);
              localStorage.removeItem('sg_locked_device_role');
            }
            if (devInfo.status === 'approved') {
              setServerDeviceStatus('approved');
              sessionStorage.setItem('sg_device_status', 'approved');
              await loadCloudDb(client);
            } else {
              localStorage.removeItem('sg_cloud_db_cache');
              setDb(INITIAL_DB);
              if (sessionStorage.getItem('sg_active_role')) {
                setServerDeviceStatus(devInfo.status || 'pending');
                sessionStorage.setItem('sg_device_status', devInfo.status || 'pending');
              }
            }
            return;
          }

          // Fallback to older is_device_approved RPC if v13 SQL not run yet
          const { data: approvedFlag, error: rpcErr } = await client.rpc('is_device_approved');
          if (!rpcErr && typeof approvedFlag === 'boolean') {
            setServerAuthMode(true);
            if (approvedFlag) {
              setServerDeviceStatus('approved');
              sessionStorage.setItem('sg_device_status', 'approved');
              await loadCloudDb(client);
            } else {
              localStorage.removeItem('sg_cloud_db_cache');
              setDb(INITIAL_DB);
              if (sessionStorage.getItem('sg_active_role')) {
                setServerDeviceStatus('pending');
                sessionStorage.setItem('sg_device_status', 'pending');
              }
            }
          } else {
            setServerAuthMode(false);
            await loadCloudDb(client);
          }
        })();

        const channel = client
          .channel('sg-live-sync')
          .on('broadcast', { event: 'db_update' }, ({ payload }) => {
            if (payload && cloudReadyRef.current) {
              baseDbRef.current = payload;
              setDb(payload);
              localStorage.setItem('sg_cloud_db_cache', JSON.stringify(payload));
              setSyncStatus('Live Synced');
            }
          })
          .subscribe();

        return () => client.removeChannel(channel);
      }, [savedKey]);

      const saveDb = (nextDb) => {
        if (supabaseClient && !cloudReadyRef.current) {
          alert('Server se connection nahi hua, isliye ye badlav SAVE NAHI hua. Internet check karke page refresh karo aur dobara koshish karo.');
          return Promise.resolve();
        }
        setDb(nextDb);
        localStorage.setItem('sg_cloud_db_cache', JSON.stringify(nextDb));
        if (!supabaseClient) return Promise.resolve();
        const run = async () => {
          setSyncStatus('Saving...');
          try {
            const store = supabaseClient.storage.from('sofa_ops_store');
            const { parsed: latestCloud, notFound } = await downloadFreshDbJson(supabaseClient);
            let merged = nextDb;
            if (latestCloud) {
              merged = mergeDb(baseDbRef.current, nextDb, latestCloud);
            } else if (!notFound) {
              throw new Error('Could not read latest data');
            }
            const blob = new Blob([JSON.stringify(merged)], { type: 'application/json' });
            const { error: uErr } = await store.upload('db.json', blob, {
              upsert: true,
              cacheControl: '0',
              contentType: 'application/json'
            });
            if (uErr) throw uErr;
            baseDbRef.current = merged;
            setDb(merged);
            localStorage.setItem('sg_cloud_db_cache', JSON.stringify(merged));
            setSyncStatus('Saved');
            supabaseClient.channel('sg-live-sync').send({ type: 'broadcast', event: 'db_update', payload: merged }).catch(() => {});
          } catch (e) {
            setSyncStatus('NOT SAVED - retry');
            alert('Ye badlav server pe SAVE NAHI hua (internet/server problem). Please dobara koshish karo, aur jab tak "Saved" na dikhe tab tak page band mat karo.');
          }
        };
        saveChainRef.current = saveChainRef.current.then(run, run);
        return saveChainRef.current;
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        if (supabaseClient && savedKey !== 'LOCAL_DIRECT_MODE_KEY_12345') {
          setLoginBusy(true);
          try {
            const { data: res, error } = await supabaseClient.rpc('login_and_check_device', {
              p_role: selectedRole,
              p_pin: pin,
              p_fp: myFp,
              p_device_name: getDeviceLabel()
            });
            if (!error && res) {
              setServerAuthMode(true);
              if (!res.ok) {
                alert(res.error || 'Incorrect 4-digit PIN.');
                setLoginBusy(false);
                return;
              }
              const effectiveRole = res.role || selectedRole;
              setLockedDeviceRole(effectiveRole);
              localStorage.setItem('sg_locked_device_role', effectiveRole);
              setServerDeviceStatus(res.status);
              sessionStorage.setItem('sg_device_status', res.status);
              sessionStorage.setItem('sg_active_role', effectiveRole);
              setCurrentRole(effectiveRole);
              setPin('');
              if (res.status === 'approved') {
                await loadCloudDb(supabaseClient);
              } else {
                localStorage.removeItem('sg_cloud_db_cache');
                setDb(INITIAL_DB);
              }
              setLoginBusy(false);
              return;
            }
          } catch (err) {}
          setLoginBusy(false);
        }

        // Local fallback when server RLS RPC is not installed
        const existingDev = db.devices.find((d) => d.fp === myFp);
        if (existingDev && existingDev.role && existingDev.role !== selectedRole) {
          alert(`This device is locked to ${existingDev.role.toUpperCase()} role only. You cannot sign in as ${selectedRole.toUpperCase()} on this device.`);
          return;
        }
        const expectedPin = db.settings?.pins?.[selectedRole] || '8866';
        if (pin !== expectedPin) {
          alert('Incorrect 4-digit PIN.');
          return;
        }
        if (selectedRole === 'admin') {
          if (!existingDev || existingDev.status !== 'approved') {
            saveDb({ ...db, devices: [...db.devices.filter((d) => d.fp !== myFp), { fp: myFp, role: 'admin', status: 'approved', device_name: getDeviceLabel(), requested_at: new Date().toISOString() }] });
          }
        } else {
          if (!existingDev) {
            saveDb({ ...db, devices: [...db.devices, { fp: myFp, role: selectedRole, status: 'pending', device_name: getDeviceLabel(), requested_at: new Date().toISOString() }] });
          }
        }
        setLockedDeviceRole(selectedRole);
        localStorage.setItem('sg_locked_device_role', selectedRole);
        sessionStorage.setItem('sg_active_role', selectedRole);
        setCurrentRole(selectedRole);
        setPin('');
      };

      if (!savedKey || savedKey.length < 15) {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
            <div className="bg-white border border-gray-300 rounded-md p-6 max-w-md w-full shadow-sm space-y-4">
              <div>
                <h1 className="font-bold text-lg text-gray-900">Shree Gayatri Handloom House</h1>
                <p className="text-xs text-gray-500">Sofa Cover Department — Initial Connection Setup</p>
              </div>
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  const k = keyInput.trim() || 'LOCAL_DIRECT_MODE_KEY_12345';
                  localStorage.setItem('sg_supabase_key', k);
                  setSavedKey(k);
                }}
                className="space-y-3"
              >
                <div>
                  <label className="block text-xs font-semibold text-gray-700 mb-1 mobile-label">Supabase Publishable Key</label>
                  <input
                    placeholder="sb_publishable_..."
                    className="w-full border border-gray-300 rounded px-3 py-2 text-sm font-mono"
                    value={keyInput}
                    onChange={(e) => setKeyInput(e.target.value)}
                  />
                </div>
                <button className="w-full bg-amber-700 hover:bg-amber-800 text-white py-3 rounded font-bold text-sm min-h-[44px]">
                  Connect & Open ERP
                </button>
              </form>
            </div>
          </div>
        );
      }

      if (!currentRole) {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
            <div className="bg-white border border-gray-300 rounded-md p-6 max-w-sm w-full shadow-sm space-y-5">
              <div className="border-b border-gray-200 pb-3">
                <h1 className="font-bold text-base text-gray-900">Shree Gayatri Handloom House</h1>
                <p className="text-xs text-gray-500">Sofa Cover Dept — Staff Sign In</p>
              </div>
              <form onSubmit={handleLogin} className="space-y-3.5">
                <div>
                  <label className="block text-xs font-semibold text-gray-700 mb-1 mobile-label">Department Role</label>
                  <select
                    disabled={!!lockedDeviceRole}
                    className="w-full border border-gray-300 rounded px-3 py-2 text-sm font-semibold bg-white disabled:bg-gray-100 disabled:text-gray-800"
                    value={lockedDeviceRole || selectedRole}
                    onChange={(e) => setSelectedRole(e.target.value)}
                  >
                    {ROLES.map((r) => (
                      <option key={r.role} value={r.role}>{r.label}</option>
                    ))}
                  </select>
                  {lockedDeviceRole && (
                    <p className="text-[11px] text-amber-800 font-semibold mt-1">
                      Device locked to: <span className="uppercase">{lockedDeviceRole.replace('_', ' ')}</span> only (Admin must remove device to change role)
                    </p>
                  )}
                </div>
                <div>
                  <label className="block text-xs font-semibold text-gray-700 mb-1 mobile-label">4-Digit PIN</label>
                  <input
                    type="password"
                    maxLength={4}
                    inputMode="numeric"
                    placeholder="••••"
                    className="w-full border border-gray-300 rounded px-3 py-2 text-center text-xl tracking-widest font-bold"
                    value={pin}
                    onChange={(e) => setPin(e.target.value)}
                  />
                </div>
                <button className="w-full bg-gray-900 hover:bg-gray-800 text-white py-3 rounded font-bold text-sm min-h-[44px]">
                  Sign In
                </button>
              </form>
              <button onClick={triggerInstall} className="w-full border border-gray-300 hover:bg-gray-50 text-gray-700 py-2.5 rounded text-xs font-semibold min-h-[44px]">
                Install App on Desktop / Mobile
              </button>
            </div>
          </div>
        );
      }

      const myDeviceRecord = db.devices.find((d) => d.fp === myFp);
      const isBlockedByServer = serverAuthMode && serverDeviceStatus !== 'approved';
      const isBlockedLocally = !serverAuthMode && currentRole !== 'admin' && myDeviceRecord?.status !== 'approved';
      if (isBlockedByServer || isBlockedLocally) {
        const isRejected = (serverAuthMode ? serverDeviceStatus : myDeviceRecord?.status) === 'rejected';
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
            <div className="bg-white border border-gray-300 rounded-md p-6 max-w-sm w-full text-center space-y-4 shadow-sm">
              <h2 className="font-bold text-base text-gray-900">
                {isRejected ? 'Device Access Rejected' : 'Approval Pending'}
              </h2>
              <p className="text-xs text-gray-600 leading-relaxed">
                Device: <strong>{getDeviceLabel()}</strong><br />
                Device ID: <strong className="font-mono">{myFp}</strong><br />
                No shop data is loaded on this device until the Owner (Admin) clicks <strong>Allow</strong> in <strong>Shop Settings & Data</strong>.
              </p>
              {serverAuthMode && (
                <button
                  onClick={async () => {
                    const { data: ok } = await supabaseClient.rpc('is_device_approved');
                    if (ok) {
                      setServerDeviceStatus('approved');
                      sessionStorage.setItem('sg_device_status', 'approved');
                      await loadCloudDb(supabaseClient);
                    } else {
                      alert('Still waiting for Admin approval.');
                    }
                  }}
                  className="w-full bg-amber-700 hover:bg-amber-800 text-white py-2.5 rounded text-xs font-bold min-h-[44px]"
                >
                  Check Approval Status
                </button>
              )}
              <button
                onClick={() => { sessionStorage.removeItem('sg_active_role'); sessionStorage.removeItem('sg_device_status'); setCurrentRole(null); setServerDeviceStatus(null); }}
                className="w-full bg-gray-900 text-white py-2.5 rounded text-xs font-bold min-h-[44px]"
              >
                Back to Sign In
              </button>
            </div>
          </div>
        );
      }

      if (['admin', 'sales'].includes(currentRole)) {
        return (
          <DesktopERPView
            db={db}
            saveDb={saveDb}
            currentRole={currentRole}
            savedKey={savedKey}
            supabaseClient={supabaseClient}
            serverAuthMode={serverAuthMode}
            syncStatus={syncStatus}
            triggerInstall={triggerInstall}
            onLogout={() => { sessionStorage.removeItem('sg_active_role'); sessionStorage.removeItem('sg_device_status'); setCurrentRole(null); setServerDeviceStatus(null); }}
          />
        );
      }

      return (
        <div className="min-h-screen bg-gray-100">
          <header className="bg-gray-900 text-white px-4 py-3 flex justify-between items-center sticky top-0 z-30">
            <div>
              <div className="font-bold text-sm">Shree Gayatri Handloom House</div>
              <div className="text-xs text-amber-400 font-semibold uppercase">{currentRole.replace('_', ' ')} • {syncStatus}</div>
            </div>
            <button
              onClick={() => { sessionStorage.removeItem('sg_active_role'); setCurrentRole(null); }}
              className="bg-gray-800 border border-gray-700 px-3 py-2 rounded text-xs font-semibold min-h-[44px]"
            >
              Logout
            </button>
          </header>
          <ShopFloorMobileView db={db} saveDb={saveDb} currentRole={currentRole} scannedOrderNo={scannedOrderNo} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
