    function ShopFloorMobileView({ supabase, profile, scannedOrderNo }) {
      const [orders, setOrders] = useState([]);
      const [pieceStats, setPieceStats] = useState({ today: 0, month: 0 });
      const [selectedTailor, setSelectedTailor] = useState({});
      const [specialCutReadAck, setSpecialCutReadAck] = useState({});

      const fetchProd = async () => {
        const { data } = await supabase.from('production_orders_view').select('*').order('promised_date', { ascending: true });
        if (data) {
          const migrated = data.map(migrateOrderToV8);
          if (profile.role === 'cutting') setOrders(migrated.filter((o) => o.status === 'Cutting Pending'));
          else if (profile.role.startsWith('tailor')) setOrders(migrated.filter((o) => o.status === 'With Tailor' && o.assigned_tailor === profile.role));
          else setOrders(migrated);
        }
        if (profile.role.startsWith('tailor')) {
          const startOfDay = new Date(); startOfDay.setHours(0, 0, 0, 0);
          const startOfMonth = new Date(startOfDay.getFullYear(), startOfDay.getMonth(), 1);
          const { data: logs } = await supabase.from('tailor_piece_logs').select('pcs_count, logged_at').gte('logged_at', startOfMonth.toISOString());
          if (logs) {
            setPieceStats({
              month: logs.reduce((s, l) => s + l.pcs_count, 0),
              today: logs.filter((l) => new Date(l.logged_at) >= startOfDay).reduce((s, l) => s + l.pcs_count, 0)
            });
          }
        }
      };

      useEffect(() => {
        fetchProd();
        const sub = supabase.channel('prod-live').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, fetchProd).subscribe();
        return () => supabase.removeChannel(sub);
      }, [profile.role]);

      const handleCuttingComplete = async (order) => {
        const hasSpecial = (order.special_cuts && order.special_cuts.length > 0) || (order.sofa_shape && order.sofa_shape.type && order.sofa_shape.type !== 'None') || Boolean(order.sketch_photo_url);
        if (hasSpecial && !specialCutReadAck[order.id]) {
          return alert('Please tick "I have read the special cut" before marking Cutting OK.');
        }
        const tailor = selectedTailor[order.id];
        if (!tailor) return alert('Select Tailor 1 or Tailor 2');
        if (!confirm('Confirm cutting done?')) return;
        await supabase.rpc('advance_production_status', { p_order_id: order.id, p_new_status: 'With Tailor', p_assigned_tailor: tailor });
        fetchProd();
      };

      const handleStitchingComplete = async (order) => {
        if (!confirm(`Confirm stitching complete for ${order.order_no} (${order.total_pcs} pcs)?`)) return;
        await supabase.rpc('advance_production_status', { p_order_id: order.id, p_new_status: 'Silai Done' });
        fetchProd();
      };

      return (
        <div className="max-w-xl mx-auto p-3 space-y-4">
          {profile.role.startsWith('tailor') && (
            <div className="bg-white border border-gray-300 rounded p-4 grid grid-cols-2 divide-x divide-gray-200 text-center tabular-nums">
              <div><div className="text-xs font-semibold text-gray-500 uppercase">Today</div><div className="text-2xl font-bold text-gray-900 mt-0.5">{pieceStats.today} pcs</div></div>
              <div><div className="text-xs font-semibold text-gray-500 uppercase">This Month</div><div className="text-2xl font-bold text-amber-800 mt-0.5">{pieceStats.month} pcs</div></div>
            </div>
          )}

          <div className="flex justify-between items-center px-1">
            <h2 className="font-bold text-base text-gray-900">
              {profile.role === 'cutting' ? `To Cut (${orders.length})` : `To Stitch (${orders.length})`}
            </h2>
          </div>

          {orders.length === 0 ? (
            <div className="bg-white border rounded p-10 text-center text-gray-500">Queue is clear</div>
          ) : (
            orders.map((order) => {
              const calc = calcOrderEstimate(order);
              const urgency = getDueUrgency(order.promised_date, order.status);
              const hasSpecialCut = (order.special_cuts && order.special_cuts.length > 0) || (order.sofa_shape && order.sofa_shape.type && order.sofa_shape.type !== 'None') || Boolean(order.sketch_photo_url);

              return (
                <div key={order.id} className={`bg-white rounded border-2 p-4 space-y-3 ${scannedOrderNo === order.order_no ? 'border-amber-600' : 'border-gray-300'}`}>
                  <div className="flex justify-between items-start border-b border-gray-200 pb-2.5">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-lg">{order.order_no}</span>
                        {urgency && <span className="px-2 py-0.5 rounded text-[11px] font-bold bg-red-100 text-red-800">{urgency.label}</span>}
                      </div>
                      <div className="text-base font-semibold mt-0.5">{calc.allDesigns}</div>
                    </div>
                    <div className="text-right tabular-nums">
                      <div className="text-xs font-semibold text-gray-500">DELIVERY</div>
                      <div className="text-sm font-bold">{formatDateDDMMYYYY(order.promised_date)}</div>
                      <div className="text-xs font-bold text-amber-800">{order.total_pcs} PCS</div>
                    </div>
                  </div>

                  {/* Multi-Line Production Specs */}
                  <div className="bg-gray-50 border border-gray-200 rounded p-3 space-y-1.5 text-sm">
                    {calc.lineCalcs.map((lc, idx) => (
                      <div key={idx} className={`p-1.5 rounded ${lc.measurement_pending ? 'bg-amber-100 border border-amber-400 font-bold text-amber-900' : ''}`}>
                        <strong>{lc.partLabel} - {lc.design_name}:</strong> {lc.displaySegments.join(' + ') || 'Pending'} ({lc.billableStr} {lc.unit === 'Inches' ? 'ft' : 'pcs'})
                        {lc.measurement_pending && <span className="ml-2 px-1.5 py-0.5 bg-red-600 text-white text-[10px] rounded">MEASUREMENT PENDING</span>}
                      </div>
                    ))}
                    {order.tailor_notes && <div className="pt-1.5 border-t border-gray-200 text-red-700 font-bold">Note: {order.tailor_notes}</div>}
                  </div>

                  {/* YELLOW SPECIAL CUT BOX (ITEMS 3 + 4) */}
                  {hasSpecialCut && (
                    <div className="bg-amber-100 border-2 border-amber-500 rounded p-3 space-y-2">
                      <div className="font-bold text-xs uppercase text-amber-950 flex items-center gap-1.5">
                        <Icon name="AlertTriangle" size={16} /> SPECIAL CUT & SHAPE INSTRUCTIONS
                      </div>
                      {order.sofa_shape && order.sofa_shape.type && order.sofa_shape.type !== 'None' && (
                        <SofaShapeSVG shape={order.sofa_shape} />
                      )}
                      {Array.isArray(order.special_cuts) && order.special_cuts.map((sc, i) => (
                        <div key={i} className="text-sm font-bold text-gray-900">
                          • {sc.type} — {sc.line_ref} ({sc.size}): {sc.note}
                        </div>
                      ))}
                      {order.sketch_photo_url && (
                        <div>
                          <div className="text-xs font-semibold text-gray-700 mb-1">Attached Hand Sketch:</div>
                          <img src={order.sketch_photo_url} alt="Hand Sketch" className="max-h-48 rounded border border-gray-400" />
                        </div>
                      )}
                      {profile.role === 'cutting' && (
                        <label className="flex items-center gap-2 pt-2 border-t border-amber-300 font-bold text-sm text-gray-900 cursor-pointer">
                          <input
                            type="checkbox"
                            className="w-5 h-5"
                            checked={Boolean(specialCutReadAck[order.id])}
                            onChange={(e) => setSpecialCutReadAck({ ...specialCutReadAck, [order.id]: e.target.checked })}
                          />
                          I have read the special cut
                        </label>
                      )}
                    </div>
                  )}

                  {profile.role === 'cutting' && (
                    <div className="space-y-2.5 pt-1">
                      <div className="grid grid-cols-2 gap-2">
                        {['tailor_1', 'tailor_2'].map((tKey) => (
                          <button
                            key={tKey}
                            type="button"
                            onClick={() => setSelectedTailor({ ...selectedTailor, [order.id]: tKey })}
                            className={`py-3.5 rounded border-2 font-bold min-h-[48px] ${selectedTailor[order.id] === tKey ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-800 border-gray-300'}`}
                          >
                            {tKey === 'tailor_1' ? 'Tailor 1' : 'Tailor 2'}
                          </button>
                        ))}
                      </div>
                      <button
                        type="button"
                        disabled={hasSpecialCut && !specialCutReadAck[order.id]}
                        onClick={() => handleCuttingComplete(order)}
                        className="w-full bg-amber-700 disabled:bg-gray-300 disabled:text-gray-500 text-white py-4 rounded font-bold text-base min-h-[48px]"
                      >
                        Cutting OK (Confirm Cutting Done)
                      </button>
                    </div>
                  )}

                  {profile.role.startsWith('tailor') && (
                    <button onClick={() => handleStitchingComplete(order)} className="w-full bg-emerald-700 text-white py-4 rounded font-bold text-base min-h-[48px]">
                      Mark Stitching Done ({order.total_pcs} Pcs)
                    </button>
                  )}
                </div>
              );
            })
          )}
        </div>
      );
    }

    // =========================================================================
    // DESKTOP & RESPONSIVE ERP SHELL (Includes Backup JSON/Excel, Archive/Trash, Notes, WA Templates)
    // =========================================================================
    function DesktopERPView({ supabase, profile, savedKey, onLogout, triggerInstall }) {
      const isAdmin = profile.role === 'admin';
      const [activeNav, setActiveNav] = useState('orders'); // orders | archived | trash | new_order | settings
      const [queueFilter, setQueueFilter] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedIds, setSelectedIds] = useState([]);
      const [mobileDrawerOpen, setMobileDrawerOpen] = useState(false);

      const [orders, setOrders] = useState([]);
      const [salesmen, setSalesmen] = useState([]);
      const [settings, setSettings] = useState({
        sticker_width_mm: 60,
        sticker_height_mm: 40,
        shop_phone: '8866925561',
        shop_phone_alt: '',
        wa_templates: DEFAULT_WA_TEMPLATES
      });
      const [devices, setDevices] = useState([]);
      const [pieceLogs, setPieceLogs] = useState([]);
      const [activityLogs, setActivityLogs] = useState([]);
      const [notes, setNotes] = useState([]);

      const [editingOrder, setEditingOrder] = useState(null);
      const [stickerBatch, setStickerBatch] = useState(null);
      const [timelineOrder, setTimelineOrder] = useState(null);
      const [waPreviewOrder, setWaPreviewOrder] = useState(null);

      const loadAll = async () => {
        const { data: ord } = await supabase.from('orders').select('*, salesmen(name)').order('created_at', { ascending: false });
        setOrders((ord || []).map(migrateOrderToV8));
        const { data: sm } = await supabase.from('salesmen').select('*').eq('is_active', true).order('name');
        setSalesmen(sm || []);
        const { data: st } = await supabase.from('app_settings').select('*').single();
        if (st) {
          setSettings({
            ...st,
            shop_phone: st.shop_phone || '8866925561',
            wa_templates: st.wa_templates || DEFAULT_WA_TEMPLATES
          });
        }
        const { data: nt } = await supabase.from('important_notes').select('*').order('created_at', { ascending: false });
        if (nt) setNotes(nt);

        if (isAdmin) {
          const { data: dev } = await supabase.from('devices').select('*').order('created_at', { ascending: false });
          setDevices(dev || []);
          const { data: pl } = await supabase.from('tailor_piece_logs').select('*, orders(order_no)').order('logged_at', { ascending: false });
          setPieceLogs(pl || []);
          const { data: al } = await supabase.from('activity_logs').select('*, orders(order_no)').order('created_at', { ascending: false }).limit(200);
          setActivityLogs(al || []);
        }
      };

      useEffect(() => {
        loadAll();
        const sub = supabase.channel('sql-live-v8').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, loadAll).subscribe();
        return () => supabase.removeChannel(sub);
      }, [isAdmin]);

      // PRE-STEP (b): ONE-CLICK FULL JSON & EXCEL BACKUP
      const handleDownloadJSONBackup = () => {
        const todayStr = new Date().toISOString().split('T')[0];
        const fullDump = {
          exported_at: new Date().toISOString(),
          shop: 'Shree Gayatri Furnishing Hub',
          orders,
          salesmen,
          settings,
          devices,
          pieceLogs,
          activityLogs,
          notes
        };
        const blob = new Blob([JSON.stringify(fullDump, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `SG_Sofa_Full_Backup_${todayStr}.json`;
        a.click();
      };

      const handleDownloadExcelBackup = () => {
        const todayStr = new Date().toISOString().split('T')[0];
        const orderRows = orders.map((o) => ({
          Order_No: o.order_no,
          Date: formatDateDDMMYYYY(o.created_at),
          Status: o.status,
          Archived: o.is_archived ? 'Yes' : 'No',
          Trashed: o.is_trashed ? 'Yes' : 'No',
          Customer_Name: o.customer_name,
          Mobile: o.mobile,
          Lines_Summary: WhatsAppService.buildLinesSummary(o).replace(/\n/g, ' | '),
          Total_Pcs: o.total_pcs,
          Estimate_Total: o.estimate_total,
          Advance: o.advance_amount,
          Balance: o.balance_amount,
          Salesman: o.salesmen?.name || '',
          Promised_Date: formatDateDDMMYYYY(o.promised_date)
        }));
        if (window.XLSX) {
          const wb = window.XLSX.utils.book_new();
          window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(orderRows), 'Orders');
          window.XLSX.writeFile(wb, `SG_Sofa_Excel_Backup_${todayStr}.xlsx`);
        }
      };

      const createImportantNote = async (orderId, orderNo, text, priority = 'Urgent') => {
        await supabase.from('important_notes').insert({
          order_id: orderId,
          order_no: orderNo,
          note_text: text,
          priority,
          status: 'open',
          created_by_role: profile.role
        });
      };

      const handleCommitOrder = async (payload, wasConfirmed, afterAction, noteMeta) => {
        try {
          let savedOrder;
          if (editingOrder) {
            const { data, error } = await supabase.from('orders').update(payload).eq('id', editingOrder.id).select('*, salesmen(name)').single();
            if (error) throw error;
            savedOrder = data;
            await supabase.from('activity_logs').insert({ order_id: savedOrder.id, action: `Updated -> ${payload.status}`, performed_by: profile.id, performed_by_role: profile.role });
          } else {
            const { data, error } = await supabase.from('orders').insert({ ...payload, created_by: profile.id }).select('*, salesmen(name)').single();
            if (error) throw error;
            savedOrder = data;
            await supabase.from('activity_logs').insert({ order_id: savedOrder.id, action: `Created -> ${payload.status}`, performed_by: profile.id, performed_by_role: profile.role });
          }

          // ITEM 8: Manual Note + Auto-notes on Advance = 0 or Measurement Pending
          if (noteMeta?.manualNote) {
            await createImportantNote(savedOrder.id, savedOrder.order_no, noteMeta.manualNote.text, noteMeta.manualNote.priority);
          }
          if (noteMeta?.advanceZeroOnConfirm) {
            await createImportantNote(savedOrder.id, savedOrder.order_no, 'Advance not taken (Confirmed with Rs 0 advance)', 'Urgent');
          }
          if (noteMeta?.hasMeasurementPending) {
            await createImportantNote(savedOrder.id, savedOrder.order_no, 'Measurement pending on one or more lines', 'Urgent');
          }

          setEditingOrder(null);
          setActiveNav('orders');
          await loadAll();

          if (afterAction === 'sticker_and_wa') {
            setStickerBatch([savedOrder]);
            setWaPreviewOrder({ order: savedOrder, type: 'receipt' });
          } else if (afterAction === 'sticker_only') {
            setStickerBatch([savedOrder]);
          }
        } catch (e) {
          alert(e.message);
        }
      };

      // ITEM 7: MOVE BACK TO PENDING, ARCHIVE, TRASH & PERMANENT DELETE (Admin Only, Reason Required, Logged)
      const handleMoveBackToPending = async (order) => {
        if (!isAdmin) return;
        const alreadyStarted = ['With Tailor', 'Silai Done', 'Ready', 'Delivered'].includes(order.status) || Boolean(order.sticker_printed_at);
        if (alreadyStarted) {
          const warnOk = confirm(`WARNING: Order ${order.order_no} has already had a sticker printed or cutting/stitching started (Status: ${order.status}). Do you still want to move it back to Pending Confirmation?`);
          if (!warnOk) return;
        }
        const reason = prompt(`Enter reason for moving ${order.order_no} back to Estimate / Pending confirmation:`);
        if (!reason || !reason.trim()) return alert('A reason is required.');

        await supabase.from('orders').update({ status: 'Estimate Given' }).eq('id', order.id);
        await supabase.from('activity_logs').insert({
          order_id: order.id,
          action: `Moved back to Pending (Estimate Given). Reason: ${reason.trim()}`,
          old_value: order.status,
          new_value: 'Estimate Given',
          performed_by: profile.id,
          performed_by_role: profile.role
        });
        loadAll();
      };

      const handleArchiveOrder = async (order) => {
        if (!isAdmin) return;
        const reason = prompt(`Enter reason for archiving Order ${order.order_no}:`);
        if (!reason || !reason.trim()) return alert('A reason is required to archive.');
        await supabase.from('orders').update({
          is_archived: true,
          archive_reason: reason.trim(),
          archived_at: new Date().toISOString()
        }).eq('id', order.id);
        await supabase.from('activity_logs').insert({
          order_id: order.id,
          action: `Archived order. Reason: ${reason.trim()}`,
          performed_by: profile.id,
          performed_by_role: profile.role
        });
        loadAll();
      };

      const handleRestoreOrder = async (order) => {
        if (!isAdmin) return;
        await supabase.from('orders').update({
          is_archived: false,
          is_trashed: false
        }).eq('id', order.id);
        await supabase.from('activity_logs').insert({
          order_id: order.id,
          action: 'Restored order to active list',
          performed_by: profile.id,
          performed_by_role: profile.role
        });
        loadAll();
      };

      const handleMoveToTrash = async (order) => {
        if (!isAdmin) return;
        const reason = prompt(`Enter reason for deleting Order ${order.order_no} (moves to Trash for 30 days):`);
        if (!reason || !reason.trim()) return alert('A reason is required to delete.');
        await supabase.from('orders').update({
          is_trashed: true,
          trash_reason: reason.trim(),
          trashed_at: new Date().toISOString()
        }).eq('id', order.id);
        await supabase.from('activity_logs').insert({
          order_id: order.id,
          action: `Moved to Trash. Reason: ${reason.trim()}`,
          performed_by: profile.id,
          performed_by_role: profile.role
        });
        loadAll();
      };

      const handlePermanentDelete = async (order) => {
        if (!isAdmin) return;
        const typed = prompt(`PERMANENT DELETE: Type exact order number "${order.order_no}" to permanently erase this order:`);
        if (typed !== order.order_no) {
          return alert('Order number did not match. Permanent delete cancelled.');
        }
        await supabase.from('orders').delete().eq('id', order.id);
        loadAll();
      };

      // Active vs Archived vs Trash filtering (Archived & Trashed excluded from active lists and sales totals)
      const activeOrders = useMemo(() => orders.filter((o) => !o.is_archived && !o.is_trashed), [orders]);
      const archivedOrders = useMemo(() => orders.filter((o) => o.is_archived && !o.is_trashed), [orders]);
      const trashedOrders = useMemo(() => orders.filter((o) => o.is_trashed), [orders]);

      const displayedOrders = useMemo(() => {
        const base = activeNav === 'archived' ? archivedOrders : activeNav === 'trash' ? trashedOrders : activeOrders;
        const q = searchQuery.toLowerCase().trim();
        return base.filter((o) => {
          if (q && !(o.order_no?.toLowerCase().includes(q) || o.customer_name?.toLowerCase().includes(q) || o.mobile?.includes(q))) return false;
          if (activeNav === 'orders') {
            if (queueFilter === 'READY_DELIVERY') return o.status === 'Ready';
            if (queueFilter === 'BALANCE_DUE') return !['Measurement Pending', 'Estimate Given'].includes(o.status) && Number(o.balance_amount) > 0;
            if (queueFilter === 'UNCONFIRMED') return ['Measurement Pending', 'Estimate Given'].includes(o.status);
          }
          return true;
        });
      }, [activeOrders, archivedOrders, trashedOrders, activeNav, searchQuery, queueFilter]);

      const openNotesCount = notes.filter((n) => n.status !== 'done').length;

      return (
        <div className="min-h-screen flex flex-col w-full max-w-full overflow-x-hidden">
          <header className="bg-gray-900 text-white px-4 py-2.5 flex justify-between items-center sticky top-0 z-30 no-print">
            <div className="flex items-center gap-2.5">
              <div className="w-7 h-7 rounded bg-amber-600 font-bold text-xs flex items-center justify-center">SG</div>
              <div>
                <div className="font-bold text-sm">Shree Gayatri Furnishing Hub — Sofa Cover ERP</div>
                <div className="text-[11px] text-gray-400">Role: <strong className="text-white uppercase">{profile.role}</strong> • Server RLS Enforced</div>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={handleDownloadJSONBackup} className="bg-amber-700 hover:bg-amber-600 text-white px-2.5 py-1.5 rounded text-xs font-bold inline-flex items-center gap-1">
                <Icon name="Download" size={13} /> Backup JSON
              </button>
              <button onClick={handleDownloadExcelBackup} className="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 px-2.5 py-1.5 rounded text-xs font-semibold inline-flex items-center gap-1">
                <Icon name="FileSpreadsheet" size={13} /> Backup Excel
              </button>
              <button onClick={onLogout} className="bg-gray-800 hover:bg-red-900 text-gray-200 px-2.5 py-1.5 rounded text-xs font-semibold">
                Logout
              </button>
            </div>
          </header>

          <div className="flex-1 flex">
            <aside className="hidden md:flex w-56 bg-white border-r border-gray-300 p-3 flex-col justify-between shrink-0 no-print">
              <div className="space-y-1">
                <button onClick={() => { setEditingOrder(null); setActiveNav('new_order'); }} className="w-full mb-3 bg-amber-700 hover:bg-amber-800 text-white py-2.5 px-3 rounded font-bold text-sm">
                  + New Order / Estimate
                </button>
                <button onClick={() => { setActiveNav('orders'); setQueueFilter('ALL'); }} className={`w-full text-left px-3 py-2 rounded text-sm font-medium flex justify-between ${activeNav === 'orders' ? 'bg-gray-900 text-white' : 'text-gray-700 hover:bg-gray-100'}`}>
                  <span>Active Orders</span><span>{activeOrders.length}</span>
                </button>
                {isAdmin && (
                  <>
                    <button onClick={() => setActiveNav('archived')} className={`w-full text-left px-3 py-2 rounded text-sm font-medium flex justify-between ${activeNav === 'archived' ? 'bg-gray-900 text-white' : 'text-gray-700 hover:bg-gray-100'}`}>
                      <span>Archived</span><span>{archivedOrders.length}</span>
                    </button>
                    <button onClick={() => setActiveNav('trash')} className={`w-full text-left px-3 py-2 rounded text-sm font-medium flex justify-between ${activeNav === 'trash' ? 'bg-red-900 text-white' : 'text-gray-700 hover:bg-gray-100'}`}>
                      <span>Trash (30d)</span><span>{trashedOrders.length}</span>
                    </button>
                    <button onClick={() => setActiveNav('settings')} className={`w-full text-left px-3 py-2 rounded text-sm font-medium flex justify-between ${activeNav === 'settings' ? 'bg-gray-900 text-white' : 'text-gray-700 hover:bg-gray-100'}`}>
                      <span>Settings & Devices</span>
                    </button>
                  </>
                )}
              </div>
            </aside>

            <main className="flex-1 p-4 overflow-x-auto">
              {activeNav === 'new_order' && (
                <OrderEntryScreen
                  supabase={supabase}
                  existingOrder={editingOrder}
                  allOrders={activeOrders}
                  salesmen={salesmen}
                  notes={notes}
                  currentRole={profile.role}
                  onCancel={() => { setEditingOrder(null); setActiveNav('orders'); }}
                  onCommitOrder={handleCommitOrder}
                />
              )}

              {(activeNav === 'orders' || activeNav === 'archived' || activeNav === 'trash') && (
                <>
                  {/* ITEM 8: IMPORTANT NOTES BOARD ON ADMIN & SALES HOME SCREEN */}
                  {activeNav === 'orders' && (
                    <ImportantNotesBoard
                      notes={notes}
                      orders={activeOrders}
                      onMarkDone={async (note) => {
                        await supabase.from('important_notes').update({
                          status: 'done',
                          done_at: new Date().toISOString(),
                          done_by_role: profile.role
                        }).eq('id', note.id);
                        loadAll();
                      }}
                      onOpenOrder={(ord) => { setEditingOrder(ord); setActiveNav('new_order'); }}
                    />
                  )}

                  <div className="bg-white border border-gray-300 rounded shadow-sm">
                    <div className="p-3 border-b border-gray-200 flex flex-wrap justify-between items-center gap-2 bg-gray-50">
                      <div className="flex items-center gap-2">
                        <h3 className="font-bold text-sm uppercase text-gray-800">
                          {activeNav === 'archived' ? 'Archived Orders (Excluded from Sales Totals)' : activeNav === 'trash' ? 'Trash (Restorable for 30 Days)' : 'Active Orders Queue'}
                        </h3>
                        <input
                          placeholder="Search Order No, Name, Mobile..."
                          className="border border-gray-300 rounded px-3 py-1.5 text-sm bg-white"
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                        />
                      </div>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse tabular-nums text-sm">
                        <thead className="bg-gray-100 text-gray-600 text-xs uppercase border-b border-gray-300">
                          <tr>
                            <th className="p-2.5">Order No</th>
                            <th className="p-2.5">Customer</th>
                            <th className="p-2.5">Lines (Part - Design - Specs)</th>
                            <th className="p-2.5">Status</th>
                            <th className="p-2.5 text-right">Total</th>
                            <th className="p-2.5 text-right">Balance</th>
                            <th className="p-2.5 text-right">Actions</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-200">
                          {displayedOrders.map((o) => {
                            const calc = calcOrderEstimate(o);
                            const isConfirmed = !['Measurement Pending', 'Estimate Given'].includes(o.status);
                            return (
                              <tr key={o.id} className="hover:bg-gray-50">
                                <td className="p-2.5 font-bold">{o.order_no}</td>
                                <td className="p-2.5">
                                  <div className="font-semibold">{o.customer_name}</div>
                                  <div className="text-xs text-gray-500">{o.mobile}</div>
                                </td>
                                <td className="p-2.5 text-xs space-y-0.5">
                                  {calc.lineCalcs.map((lc, idx) => (
                                    <div key={idx} className={lc.measurement_pending ? 'text-amber-800 font-bold' : ''}>
                                      <strong>{lc.partLabel}</strong> - {lc.design_name}: {lc.displaySegments.join('+')} ({lc.billableStr} {lc.unit === 'Inches' ? 'ft' : 'pcs'})
                                      {lc.measurement_pending && ' [PENDING]'}
                                    </div>
                                  ))}
                                  {o.archive_reason && <div className="text-gray-500 italic">Archive reason: {o.archive_reason}</div>}
                                  {o.trash_reason && <div className="text-red-700 italic">Trash reason: {o.trash_reason}</div>}
                                </td>
                                <td className="p-2.5"><StatusChip status={o.status} /></td>
                                <td className="p-2.5 text-right font-semibold">{formatINR(o.estimate_total)}</td>
                                <td className="p-2.5 text-right font-bold text-red-700">{formatINR(o.balance_amount)}</td>
                                <td className="p-2.5 text-right whitespace-nowrap">
                                  <div className="inline-flex items-center gap-1">
                                    {activeNav === 'orders' && (
                                      <>
                                        <button onClick={() => { setEditingOrder(o); setActiveNav('new_order'); }} className="px-2 py-1 border rounded text-xs font-semibold">Open</button>
                                        <button onClick={() => setStickerBatch([o])} className="px-2 py-1 border rounded text-xs" title="Sticker">🖨️</button>
                                        <button onClick={() => setWaPreviewOrder({ order: o, type: isConfirmed ? 'receipt' : 'estimate' })} className="px-2 py-1 bg-emerald-700 text-white rounded text-xs font-semibold">WA</button>
                                        {isAdmin && isConfirmed && (
                                          <button onClick={() => handleMoveBackToPending(o)} className="px-2 py-1 bg-amber-100 text-amber-900 border border-amber-300 rounded text-xs font-semibold">
                                            Move Back
                                          </button>
                                        )}
                                        {isAdmin && (
                                          <button onClick={() => handleArchiveOrder(o)} className="px-2 py-1 bg-gray-100 text-gray-700 border rounded text-xs">
                                            Archive
                                          </button>
                                        )}
                                        {isAdmin && (
                                          <button onClick={() => handleMoveToTrash(o)} className="px-2 py-1 bg-red-50 text-red-700 border border-red-200 rounded text-xs">
                                            Delete
                                          </button>
                                        )}
                                      </>
                                    )}
                                    {(activeNav === 'archived' || activeNav === 'trash') && isAdmin && (
                                      <>
                                        <button onClick={() => handleRestoreOrder(o)} className="px-2.5 py-1 bg-emerald-700 text-white rounded text-xs font-semibold">Restore</button>
                                        {activeNav === 'trash' && (
                                          <button onClick={() => handlePermanentDelete(o)} className="px-2.5 py-1 bg-red-700 text-white rounded text-xs font-bold">
                                            Delete Permanently
                                          </button>
                                        )}
                                      </>
                                    )}
                                  </div>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </>
              )}

              {/* ADMIN SETTINGS: DEVICE APPROVAL (ITEM 6) & WHATSAPP TEMPLATES (ITEM 5) */}
              {isAdmin && activeNav === 'settings' && (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  {/* ITEM 6: REAL SERVER-SIDE DEVICE APPROVAL */}
                  <div className="bg-white border border-gray-300 rounded p-4 space-y-3">
                    <h3 className="font-bold text-base text-gray-900">Device Approval Gate (Server-Side RLS Enforced)</h3>
                    <p className="text-xs text-gray-500">Unapproved devices cannot query or write orders in Supabase PostgreSQL.</p>
                    <div className="divide-y border rounded">
                      {devices.map((d) => (
                        <div key={d.id} className="p-3 flex justify-between items-center text-xs">
                          <div>
                            <div className="font-bold text-gray-900">{d.device_name || 'Device'} ({d.requested_role})</div>
                            <div className="text-gray-500 font-mono">{d.device_fingerprint} • {formatDateTimeDDMMYYYY(d.created_at)}</div>
                            <div className="mt-0.5">Status: <strong className="uppercase">{d.status}</strong></div>
                          </div>
                          <div className="flex gap-1.5">
                            {d.status !== 'approved' && (
                              <button onClick={async () => { await supabase.from('devices').update({ status: 'approved', approved_by: profile.id }).eq('id', d.id); loadAll(); }} className="px-2.5 py-1.5 bg-emerald-700 text-white rounded font-bold">
                                Allow
                              </button>
                            )}
                            {d.status !== 'rejected' && (
                              <button onClick={async () => { await supabase.from('devices').update({ status: 'rejected' }).eq('id', d.id); loadAll(); }} className="px-2.5 py-1.5 bg-amber-600 text-white rounded font-bold">
                                Reject
                              </button>
                            )}
                            <button onClick={async () => { await supabase.from('devices').delete().eq('id', d.id); loadAll(); }} className="px-2.5 py-1.5 bg-red-100 text-red-700 rounded font-bold">
                              Remove
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* ITEM 5: WHATSAPP MESSAGE TEMPLATES & SHOP PHONES */}
                  <div className="bg-white border border-gray-300 rounded p-4 space-y-3">
                    <h3 className="font-bold text-base text-gray-900">WhatsApp Templates & Shop Phone Numbers</h3>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-xs font-semibold text-gray-600">Primary Shop Phone</label>
                        <input className="w-full border rounded px-2.5 py-1.5 text-sm" value={settings.shop_phone || ''} onChange={(e) => setSettings({ ...settings, shop_phone: e.target.value })} />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-gray-600">Secondary Phone</label>
                        <input className="w-full border rounded px-2.5 py-1.5 text-sm" value={settings.shop_phone_alt || ''} onChange={(e) => setSettings({ ...settings, shop_phone_alt: e.target.value })} />
                      </div>
                    </div>

                    {Object.keys(DEFAULT_WA_TEMPLATES).map((tKey) => {
                      const cur = settings.wa_templates?.[tKey] || DEFAULT_WA_TEMPLATES[tKey];
                      return (
                        <div key={tKey} className="border border-gray-200 rounded p-2.5 space-y-1.5 bg-gray-50">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-xs uppercase">{tKey} Template</span>
                            <select
                              className="border rounded px-2 py-0.5 text-xs bg-white"
                              value={cur.lang || 'Hinglish'}
                              onChange={(e) =>
                                setSettings({
                                  ...settings,
                                  wa_templates: {
                                    ...(settings.wa_templates || DEFAULT_WA_TEMPLATES),
                                    [tKey]: { ...cur, lang: e.target.value }
                                  }
                                })
                              }
                            >
                              <option value="Hinglish">Hinglish</option>
                              <option value="English">English</option>
                              <option value="Gujarati">Gujarati</option>
                            </select>
                          </div>
                          <textarea
                            rows={3}
                            className="w-full border rounded p-2 text-xs font-mono bg-white"
                            value={cur.text || ''}
                            onChange={(e) =>
                              setSettings({
                                ...settings,
                                wa_templates: {
                                  ...(settings.wa_templates || DEFAULT_WA_TEMPLATES),
                                  [tKey]: { ...cur, text: e.target.value }
                                }
                              })
                            }
                          />
                        </div>
                      );
                    })}

                    <button
                      onClick={async () => {
                        await supabase.from('app_settings').update({
                          shop_phone: settings.shop_phone,
                          shop_phone_alt: settings.shop_phone_alt,
                          wa_templates: settings.wa_templates
                        }).eq('id', 1);
                        alert('WhatsApp templates & shop phones saved.');
                      }}
                      className="w-full bg-gray-900 text-white py-2.5 rounded font-bold text-xs"
                    >
                      Save WhatsApp Settings
                    </button>
                  </div>
                </div>
              )}
            </main>
          </div>

          {stickerBatch && (
            <StickerPrintModal
              ordersList={stickerBatch}
              settings={settings}
              onClose={() => setStickerBatch(null)}
              onLogReprint={async (ord) => {
                await supabase.from('orders').update({ sticker_printed_at: new Date().toISOString() }).eq('id', ord.id);
                await supabase.from('activity_logs').insert({ order_id: ord.id, action: 'Sticker printed', performed_by: profile.id, performed_by_role: profile.role });
              }}
            />
          )}
          {timelineOrder && <OrderTimelineModal order={timelineOrder} activityLogs={activityLogs} onClose={() => setTimelineOrder(null)} />}
          {waPreviewOrder && (
            <WhatsAppPreviewModal
              type={waPreviewOrder.type}
              order={waPreviewOrder.order}
              settings={settings}
              onClose={() => setWaPreviewOrder(null)}
            />
          )}
        </div>
      );
    }

    const STAFF_ACCOUNTS = [
      { label: 'Owner (Admin)', email: 'admin@shop.local', role: 'admin' },
      { label: 'Sales Counter', email: 'sales@shop.local', role: 'sales' },
      { label: 'Cutting Master', email: 'cutting@shop.local', role: 'cutting' },
      { label: 'Tailor 1', email: 'tailor1@shop.local', role: 'tailor_1' },
      { label: 'Tailor 2', email: 'tailor2@shop.local', role: 'tailor_2' }
    ];

    // =========================================================================
    // APP ENTRY WITH SERVER-SIDE HEADER x-device-fp & ONE-TIME ADMIN BOOTSTRAP
    // =========================================================================
    function App() {
      const [savedKey, setSavedKey] = useState(() => localStorage.getItem('sg_supabase_key') || '');
      const [keyInput, setKeyInput] = useState('');
      const [supabaseClient, setSupabaseClient] = useState(null);
      const [session, setSession] = useState(null);
      const [profile, setProfile] = useState(null);
      const [deviceStatus, setDeviceStatus] = useState('checking');
      const [selectedStaff, setSelectedStaff] = useState(STAFF_ACCOUNTS[0]);
      const [pin, setPin] = useState('');

      const scannedOrderNo = new URLSearchParams(window.location.search).get('scan');

      useEffect(() => {
        if (savedKey && savedKey.length > 15) {
          // ITEM 6: Pass x-device-fp header on every request so PostgreSQL RLS enforces device approval server-side
          const client = createClient(DEFAULT_SUPABASE_URL, savedKey.trim(), {
            global: {
              headers: { 'x-device-fp': getDeviceFingerprint() }
            }
          });
          setSupabaseClient(client);
        }
      }, [savedKey]);

      useEffect(() => {
        if (!supabaseClient) return;
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          if (session) verifyProfileAndDevice(supabaseClient, session.user.id);
        });
        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_e, sess) => {
          setSession(sess);
          if (sess) verifyProfileAndDevice(supabaseClient, sess.user.id);
          else { setProfile(null); setDeviceStatus('unauthenticated'); }
        });
        return () => subscription.unsubscribe();
      }, [supabaseClient]);

      const verifyProfileAndDevice = async (client, userId) => {
        const { data: prof } = await client.from('profiles').select('*').eq('id', userId).maybeSingle();
        if (!prof) return;
        setProfile(prof);
        const fp = getDeviceFingerprint();
        const devName = navigator.userAgent.slice(0, 45);

        const { data: dev } = await client.from('devices').select('*').eq('device_fingerprint', fp).maybeSingle();
        if (!dev) {
          // If this is the very first Admin device during one-time setup, call server-side bootstrap RPC
          if (prof.role === 'admin') {
            const { data: bootStatus, error: rpcErr } = await client.rpc('bootstrap_first_admin_device', { p_fp: fp, p_name: devName });
            if (!rpcErr && bootStatus === 'approved') {
              setDeviceStatus('approved');
              return;
            }
          }
          await client.from('devices').insert({
            device_fingerprint: fp,
            device_name: devName,
            requested_role: prof.role,
            status: 'pending'
          });
          setDeviceStatus('pending');
        } else {
          setDeviceStatus(dev.status);
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        const { error } = await supabaseClient.auth.signInWithPassword({
          email: selectedStaff.email,
          password: `SG_${pin}_PIN`
        });
        if (error) alert('Invalid PIN.');
        setPin('');
      };

      if (!supabaseClient) {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
            <div className="bg-white border rounded p-6 max-w-sm w-full space-y-4 text-center">
              <h1 className="font-bold text-lg">Shree Gayatri Furnishing Hub</h1>
              <input placeholder="sb_publishable_..." className="w-full border rounded px-3 py-2 text-sm font-mono" value={keyInput} onChange={(e) => setKeyInput(e.target.value)} />
              <button onClick={() => { localStorage.setItem('sg_supabase_key', keyInput); setSavedKey(keyInput); }} className="w-full bg-amber-700 text-white py-3 rounded font-bold text-sm">
                Connect Database
              </button>
            </div>
          </div>
        );
      }

      if (session && deviceStatus !== 'approved') {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
            <div className="bg-white border border-gray-300 rounded p-6 max-w-sm w-full text-center space-y-4 shadow-sm">
              <h2 className="font-bold text-base text-gray-900">
                {deviceStatus === 'rejected' ? 'Device Access Rejected' : 'Approval Pending'}
              </h2>
              <p className="text-xs text-gray-600">
                Device ID: <strong className="font-mono">{getDeviceFingerprint()}</strong><br />
                No shop data is loaded on this device until the Owner (Admin) approves it in <strong>Settings & Devices</strong>.
              </p>
              <button onClick={() => verifyProfileAndDevice(supabaseClient, session.user.id)} className="w-full bg-amber-700 text-white py-2.5 rounded text-xs font-bold">
                Refresh Approval Status
              </button>
              <button onClick={() => supabaseClient.auth.signOut()} className="text-xs text-red-700 underline block mx-auto">
                Logout
              </button>
            </div>
          </div>
        );
      }

      if (!session || !profile) {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
            <div className="bg-white border rounded p-6 max-w-sm w-full shadow-sm space-y-5">
              <div className="border-b pb-3 text-center">
                <h1 className="font-bold text-base">Shree Gayatri Furnishing Hub</h1>
                <p className="text-xs text-gray-500">Sofa Cover Dept — Secure Sign In</p>
              </div>
              <form onSubmit={handleLogin} className="space-y-3.5">
                <div>
                  <label className="block text-xs font-semibold mb-1">Role</label>
                  <select className="w-full border rounded px-3 py-2 text-sm font-semibold bg-white" value={selectedStaff.email} onChange={(e) => setSelectedStaff(STAFF_ACCOUNTS.find((s) => s.email === e.target.value))}>
                    {STAFF_ACCOUNTS.map((s) => <option key={s.email} value={s.email}>{s.label}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold mb-1">4-Digit PIN</label>
                  <input type="password" maxLength={4} inputMode="numeric" placeholder="••••" className="w-full border rounded px-3 py-2 text-center text-xl tracking-widest font-bold" value={pin} onChange={(e) => setPin(e.target.value)} />
                </div>
                <button className="w-full bg-gray-900 text-white py-3 rounded font-bold text-sm">Sign In</button>
              </form>
            </div>
          </div>
        );
      }

      if (['admin', 'sales'].includes(profile.role)) {
        return <DesktopERPView supabase={supabaseClient} profile={profile} savedKey={savedKey} triggerInstall={() => {}} onLogout={() => supabaseClient.auth.signOut()} />;
      }
      return (
        <div className="min-h-screen bg-gray-100">
          <header className="bg-gray-900 text-white px-4 py-3 flex justify-between">
            <div className="font-bold text-sm">Shree Gayatri Furnishing Hub</div>
            <button onClick={() => supabaseClient.auth.signOut()} className="bg-gray-800 border px-3 py-2 rounded text-xs font-semibold">Logout</button>
          </header>
          <ShopFloorMobileView supabase={supabaseClient} profile={profile} scannedOrderNo={scannedOrderNo} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
