  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const DEFAULT_SUPABASE_URL = 'https://qsyubbefhttdfiglbtbt.supabase.co';

    // Capture setup_key from URL for instant staff onboarding

      localStorage.setItem('sg_supabase_key', urlSetupKey.trim());

    // Simple Lucide Icon wrapper
    function Icon({ name, size = 16, className = '' }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide && window.lucide.icons[name]) {
          const svg = window.lucide.createElement(window.lucide.icons[name]);
          svg.setAttribute('width', size);
          svg.setAttribute('height', size);
          if (className) svg.setAttribute('class', className);
          ref.current.innerHTML = '';
          ref.current.appendChild(svg);
        }
      }, [name, size, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" />;
    }

    function getDeviceFingerprint() {
      let fp = localStorage.getItem('sg_device_fp');
      if (!fp) {
        fp = 'DEV-' + Math.random().toString(36).substring(2, 10).toUpperCase();
        localStorage.setItem('sg_device_fp', fp);
      }
      return fp;
    }

    // Formatting Helpers: Indian Rupee Grouping (1,25,000) & DD/MM/YYYY
    function formatINR(num) {
      const val = Math.round(Number(num) || 0);
      return '₹' + val.toLocaleString('en-IN');
    }

    function formatDateDDMMYYYY(dateInput) {
      if (!dateInput) return '—';
      const d = new Date(dateInput);
      if (isNaN(d.getTime())) return String(dateInput);
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      return `${dd}/${mm}/${yyyy}`;
    }

    function formatDateTimeDDMMYYYY(dateInput) {
      if (!dateInput) return '—';
      const d = new Date(dateInput);
      if (isNaN(d.getTime())) return String(dateInput);
      const time = d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
      return `${formatDateDDMMYYYY(d)} ${time}`;
    }

    function getDueUrgency(promisedDateStr, status) {
      if (!promisedDateStr || status === 'Delivered') return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const due = new Date(promisedDateStr + 'T00:00:00');
      const diffDays = Math.round((due - today) / 86400000);
      if (diffDays < 0) return { label: `OVERDUE (${Math.abs(diffDays)}d)`, level: 'overdue' };
      if (diffDays === 0) return { label: 'DUE TODAY', level: 'today' };
      if (diffDays === 1) return { label: 'DUE TOMORROW', level: 'tomorrow' };
      return null;
    }

    function getHoursInStage(order) {
      const refTime = order.stage_changed_at || order.created_at;
      if (!refTime) return 0;
      return Math.max(0, (Date.now() - new Date(refTime).getTime()) / 3600000);
    }

    // Core Business Math (Pure Integer Math — zero floating-point drift, never NaN)
    function parseSegmentsList(input) {
      if (!input) return [];
      const raw = Array.isArray(input) ? input.join('+') : String(input);
      return raw
        .split(/[+,\s]+/)
        .map((s) => parseInt(s.trim(), 10))
        .filter((n) => Number.isInteger(n) && n > 0);
    }

    function toInt(val) {
      const n = parseInt(String(val ?? '').replace(/[^0-9-]/g, ''), 10);
      return Number.isInteger(n) ? n : 0;
    }

    function calcEstimate(form = {}) {
      const seatingList = parseSegmentsList(form.seating_segments ?? form.seatingSegments);
      const seatingInches = seatingList.reduce((acc, n) => acc + n, 0);
      const seatingQuarters = seatingInches > 0 ? Math.ceil(seatingInches / 3) : 0;
      const seatingFeet = seatingQuarters / 4;
      const seatingFeetStr = seatingFeet.toFixed(2);
      const seatingRateInt = Math.max(0, toInt(form.seating_rate ?? form.seatingRate));
      const seatingAmount = Math.round((seatingQuarters * seatingRateInt) / 4);

      const backUnit = (form.back_unit ?? form.backUnit) === 'Pcs' ? 'Pcs' : 'Inches';
      const backList = parseSegmentsList(form.back_segments ?? form.backSegments);
      const backRaw = backList.reduce((acc, n) => acc + n, 0);
      const backRateInt = Math.max(0, toInt(form.back_rate ?? form.backRate));

      let backQuarters = 0;
      let backBillable = 0;
      let backBillableStr = '0';
      let backAmount = 0;

      if (backUnit === 'Inches') {
        backQuarters = backRaw > 0 ? Math.ceil(backRaw / 3) : 0;
        backBillable = backQuarters / 4;
        backBillableStr = backBillable.toFixed(2);
        backAmount = Math.round((backQuarters * backRateInt) / 4);
      } else {
        backBillable = backRaw;
        backBillableStr = String(backRaw);
        backAmount = backRaw * backRateInt;
      }

      const visitChargeInt = Math.max(0, toInt(form.visit_charge ?? form.visitCharge));
      const advanceInt = Math.max(0, toInt(form.advance_amount ?? form.advanceAmount));
      const total = seatingAmount + backAmount + visitChargeInt;
      const balance = total - advanceInt;

      const seatingExpr = seatingList.length ? seatingList.join(' + ') : '0';
      const backExpr = backList.length ? backList.join(' + ') : '0';

      const seatingLine = `Seating: ${seatingExpr} = ${seatingInches} in = ${seatingFeetStr} ft × Rs ${seatingRateInt.toLocaleString('en-IN')} = Rs ${seatingAmount.toLocaleString('en-IN')}`;
      const backLine = backUnit === 'Inches'
        ? `Back: ${backExpr} = ${backRaw} in = ${backBillableStr} ft × Rs ${backRateInt.toLocaleString('en-IN')} = Rs ${backAmount.toLocaleString('en-IN')}`
        : `Back: ${backExpr} = ${backRaw} pcs × Rs ${backRateInt.toLocaleString('en-IN')} = Rs ${backAmount.toLocaleString('en-IN')}`;
      const summaryLine = `Estimate total: Rs ${total.toLocaleString('en-IN')} | Advance: Rs ${advanceInt.toLocaleString('en-IN')} | Balance: Rs ${balance.toLocaleString('en-IN')}`;

      return {
        seatingList,
        seatingInches,
        seatingQuarters,
        seatingFeet,
        seatingFeetStr,
        seatingRateInt,
        seatingAmount,
        backUnit,
        backList,
        backRaw,
        backQuarters,
        backBillable,
        backBillableStr,
        backRateInt,
        backAmount,
        visitChargeInt,
        advanceInt,
        total,
        balance,
        seatingLine,
        backLine,
        summaryLine
      };
    }
    const calculateEstimate = calcEstimate;

    const WhatsAppService = {
      formatPhone(mobile) {
        const digits = String(mobile || '').replace(/\D/g, '');
        return digits.length === 10 ? `91${digits}` : digits;

      getLink(type, order) {
        const phone = this.formatPhone(order.mobile);
        let msg = '';
        if (type === 'receipt') {
          msg = `Namaste ${order.customer_name} ji! Aapka custom Sofa Cover order confirm ho gaya hai.\n\nOrder No: *${order.order_no}*\nDesign: ${order.design_name}\nTotal Estimate: ${formatINR(order.estimate_total)}\nAdvance Paid: ${formatINR(order.advance_amount)}\nBalance Due: *${formatINR(order.balance_amount)}*\nDelivery Date: ${formatDateDDMMYYYY(order.promised_date)}\n\n- Shree Gayatri Handloom House (Fixed Rate Shop)`;
        } else if (type === 'ready') {
          msg = `Namaste ${order.customer_name} ji! Aapka Sofa Cover (Order *${order.order_no}* - ${order.design_name}) bankar *READY* hai.\nBalance Amount: ${formatINR(order.balance_amount)}.\nAap shop se collect kar sakte hain. Dhanyavaad!\n- Shree Gayatri Handloom House`;
        } else if (type === 'followup') {
          msg = `Namaste ${order.customer_name} ji! Shree Gayatri Handloom House se aapke Sofa Cover estimate (*${order.order_no}* - ${order.design_name}, Estimate: ${formatINR(order.estimate_total)}) ke baare mein follow-up kar rahe hain. Order confirm karne ke liye reply karein. Dhanyavaad!`;
        } else {
          msg = `Thank you ${order.customer_name} ji! Order *${order.order_no}* deliver ho chuka hai. Umeed hai aapko fitting aur design pasand aaya hoga. Fir se padhariye!\n- Shree Gayatri Handloom House`;
        }
        return `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
      }
    };

    // Generate 30 Realistic Demo Orders for testing all reports & workflows
    function buildDemoDataset(currentDb) {
      const customers = [
        ['Rajeshbhai Patel', '9825011223', '14, Shantinagar Society, Maninagar'],
        ['Meenaben Shah', '9879044556', 'B-202, Suramya Residency, Kankaria'],
        ['Hiteshbhai Desai', '9426077889', '8, Ghodasar Cross Road, Ahmedabad'],
        ['Nileshbhai Joshi', '9824033445', '45, Rambaug Society, Maninagar'],
        ['Kiranben Mehta', '9909988776', '12, Pushpkunj, Kankaria'],
        ['Pareshbhai Trivedi', '9825366778', 'C-104, Kalrav Flat, Maninagar'],
        ['Dipakbhai Modi', '9727711990', '22, Dakshini Society, Maninagar'],
        ['Bhavnaben Parekh', '9898022334', '9, Anupam Colony, Khokhra'],
        ['Maheshbhai Solanki', '9427055667', '31, Jawahar Chowk, Maninagar'],
        ['Sonalben Amin', '9825199001', 'A-401, Devnandan Heights, Isanpur'],
        ['Ketanbhai Thakkar', '9925044332', '18, LG Corner, Maninagar'],
        ['Rakeshbhai Vyas', '9879566112', '7, Krishnabaug, Maninagar'],
        ['Alkabhen Pandya', '9426388990', '52, Sindhi Market Road, Maninagar'],
        ['Chiragbhai Gajjar', '9824511009', '11, Uttamnagar, Maninagar'],
        ['Pritiben Dave', '9909022118', 'D-302, Shivalik Avenue, Ghodasar']
      ];
      const designs = [
        'Velvet Jacquard Beige 402', 'Chenille Royal Maroon 118', 'Jute Texture Grey 905',
        'Suede Brown Diamond 310', 'Cotton Dobby Cream 204', 'Embossed Gold Floral 512',
        'Heavy Turkish Blue 701', 'Linen Weave Olive 615'
      ];
      const salesmen = currentDb.salesmen.length ? currentDb.salesmen : ['Ramesh Bhai', 'Suresh Bhai', 'Jignesh Bhai'];
      const modes = ['Cash', 'UPI', 'Card'];
      const statuses = [
        'Measurement Pending', 'Estimate Given', 'Estimate Given',
        'Cutting Pending', 'Cutting Pending', 'Cutting Pending',
        'With Tailor', 'With Tailor', 'With Tailor', 'With Tailor',
        'Silai Done', 'Silai Done',
        'Ready', 'Ready', 'Ready',
        'Delivered', 'Delivered', 'Delivered', 'Delivered', 'Delivered'
      ];

      const now = Date.now();
      const demoOrders = [];
      const demoPieceLogs = [];
      const demoActivity = [];

      for (let i = 1; i <= 30; i++) {
        const cust = customers[i % customers.length];
        const design = designs[i % designs.length];
        const salesman = salesmen[i % salesmen.length];
        const status = statuses[i % statuses.length];
        const isVisit = i % 4 === 0;
        const visitCharge = isVisit ? 200 : 0;

        const seatSeg = i % 3 === 0 ? '81+96+103+58' : i % 2 === 0 ? '72+72+54' : '84+60+60';
        const seatRate = i % 2 === 0 ? 180 : 210;
        const backUnit = i % 4 === 1 ? 'Pcs' : 'Inches';
        const backSeg = backUnit === 'Pcs' ? '2+2+3' : '80+80+70';
        const backRate = backUnit === 'Pcs' ? 120 : 140;
        const totalPcs = 6 + (i % 7);

        const calc = calculateEstimate({
          seatingSegments: seatSeg,
          seatingRate: seatRate,
          backUnit,
          backSegments: backSeg,
          backRate,
          advanceAmount: 0,
          visitCharge
        });

        const isUnconfirmed = ['Measurement Pending', 'Estimate Given'].includes(status);
        const advance = isUnconfirmed ? 0 : (status === 'Delivered' && i % 2 === 0 ? calc.total : Math.round((calc.total * 0.5) / 100) * 100);
        const balance = calc.total - advance;

        // Date offsets: create overdue, due today, due tomorrow, and past completed orders
        const createdDaysAgo = 1 + (i % 14);
        const createdAt = new Date(now - createdDaysAgo * 86400000).toISOString();
        const dueOffsetDays = status === 'Delivered' ? -1 : (i % 7) - 3; // -3 to +3 days
        const promisedDate = new Date(now + dueOffsetDays * 86400000).toISOString().split('T')[0];

        // Stage aging: make some stuck > 36h
        const stageAgeHours = (i % 5 === 0) ? 54 : (4 + (i % 18));
        const stageChangedAt = new Date(now - stageAgeHours * 3600000).toISOString();
        const assignedTailor = ['With Tailor', 'Silai Done', 'Ready', 'Delivered'].includes(status)
          ? (i % 2 === 0 ? 'tailor_1' : 'tailor_2')
          : null;

        const orderNo = 'SC-' + String(900 + i).padStart(4, '0');
        const orderId = 'DEMO-' + i;

        demoOrders.push({
          id: orderId,
          order_no: orderNo,
          is_demo: true,
          created_at: createdAt,
          stage_changed_at: stageChangedAt,
          customer_name: cust[0],
          mobile: cust[1],
          address: cust[2],
          home_delivery: i % 3 === 0,
          measurement_source: isVisit ? 'Shop visit' : 'Customer brought',
          visit_staff_name: isVisit ? salesman : '',
          visit_charge: visitCharge,
          design_name: design,
          seating_segments: seatSeg,
          seating_total_inches: calc.seatingInches,
          seating_feet: calc.seatingFeet,
          seating_rate: seatRate,
          back_unit: backUnit,
          back_segments: backSeg,
          back_total_raw: calc.backRaw,
          back_billable_qty: calc.backBillable,
          back_rate: backRate,
          tailor_notes: i % 2 === 0 ? 'Contrast piping on front border, double stitch corners' : 'Standard elastic fit with side lace',
          total_pcs: totalPcs,
          estimate_total: calc.total,
          advance_amount: advance,
          balance_amount: balance,
          payment_mode: modes[i % modes.length],
          salesman_name: salesman,
          promised_date: promisedDate,
          status,
          assigned_tailor: assignedTailor
        });

        demoActivity.push({
          id: 'DEMO-ACT-' + i,
          is_demo: true,
          order_no: orderNo,
          action: `Created & moved to ${status}`,
          role: 'sales',
          created_at: createdAt
        });

        if (['Silai Done', 'Ready', 'Delivered'].includes(status) && assignedTailor) {
          demoPieceLogs.push({
            id: 'DEMO-LOG-' + i,
            is_demo: true,
            order_no: orderNo,
            tailor_role: assignedTailor,
            pcs_count: totalPcs,
            rate_at_time: 150,
            is_manual_adjustment: false,
            logged_at: stageChangedAt
          });
        }
      }

      return {
        ...currentDb,
        orders: [...demoOrders, ...currentDb.orders.filter((o) => !o.is_demo)],
        pieceLogs: [...demoPieceLogs, ...currentDb.pieceLogs.filter((l) => !l.is_demo)],
        activityLogs: [...demoActivity, ...currentDb.activityLogs.filter((a) => !a.is_demo)]
      };
    }

    // =========================================================================
    // STICKER PRINT MODAL (Single & Batch Print with Reprint Logging)
    // =========================================================================
    function StickerPrintModal({ ordersList, settings, onClose, onLogReprint }) {
      const w = settings?.sticker_width_mm || 60;
      const h = settings?.sticker_height_mm || 40;

      const handlePrint = () => {
        const style = document.createElement('style');
        style.innerHTML = `@page { size: ${w}mm ${h}mm; margin: 0; }`;
        document.head.appendChild(style);
        ordersList.forEach((ord) => onLogReprint && onLogReprint(ord));
        window.print();
        document.head.removeChild(style);
      };

      const handleCopyCSV = () => {
        const header = 'OrderNo,Design,Seating,Back,TotalPcs,Notes,PromisedDate';
        const rows = ordersList.map((o) =>
          `"${o.order_no}","${o.design_name}","${o.seating_segments} (${o.seating_feet}ft)","${o.back_segments} (${o.back_billable_qty} ${o.back_unit})","${o.total_pcs}","${(o.tailor_notes || '').replace(/"/g, '""')}","${formatDateDDMMYYYY(o.promised_date)}"`
        );
        navigator.clipboard.writeText([header, ...rows].join('\n'));
        alert(`Copied ${ordersList.length} sticker row(s) as CSV.`);
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-md border border-gray-300 max-w-lg w-full p-5 shadow-lg">
            <div className="flex justify-between items-center border-b border-gray-200 pb-3 mb-4">
              <div>
                <h3 className="font-bold text-base text-gray-900">
                  {ordersList.length > 1 ? `Batch Cutting Stickers (${ordersList.length} Orders)` : `Cutting Sticker — ${ordersList[0].order_no}`}
                </h3>
                <p className="text-xs text-gray-500">Label size: {w} × {h} mm • Thermal / PDF ready</p>
              </div>
              <button onClick={onClose} className="p-1.5 text-gray-500 hover:bg-gray-100 rounded">
                <Icon name="X" size={18} />
              </button>
            </div>

            <div id="printable-area" className="max-h-80 overflow-y-auto bg-gray-100 p-4 rounded border border-gray-200 space-y-3 mb-4">
              {ordersList.map((order) => {
                const qrUrl = `${window.location.origin}${window.location.pathname}?scan=${order.order_no}`;
                const qrImgSrc = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&margin=0&data=${encodeURIComponent(qrUrl)}`;
                return (
                  <div
                    key={order.id}
                    style={{ width: `${w}mm`, height: `${h}mm`, pageBreakAfter: 'always' }}
                    className="bg-white border border-black p-1.5 flex flex-col justify-between text-black leading-tight overflow-hidden mx-auto"
                  >
                    <div className="flex justify-between items-start border-b border-black pb-0.5">
                      <div>
                        <div className="font-bold text-sm tracking-tight">{order.order_no}</div>
                        <div className="text-[9px] font-semibold truncate max-w-[34mm]">{order.design_name}</div>
                      </div>
                      <img src={qrImgSrc} alt="QR" className="w-[9mm] h-[9mm]" />
                    </div>
                    <div className="text-[8.5px] space-y-0.5 my-0.5">
                      <div><strong>S:</strong> {order.seating_segments} = <b>{order.seating_feet}ft</b></div>
                      <div><strong>B:</strong> {order.back_segments} = <b>{order.back_billable_qty}{order.back_unit === 'Inches' ? 'ft' : 'pcs'}</b> ({order.total_pcs} pcs)</div>
                      {order.tailor_notes && (
                        <div className="truncate italic border-t border-dashed border-gray-500 pt-0.5">
                          Note: {order.tailor_notes}
                        </div>
                      )}
                    </div>
                    <div className="text-[8px] font-bold border-t border-black pt-0.5 flex justify-between">
                      <span>DEL: {formatDateDDMMYYYY(order.promised_date)}</span>
                      <span>PCS: {order.total_pcs}</span>
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="flex gap-2">
              <button onClick={handlePrint} className="flex-1 bg-amber-700 hover:bg-amber-800 text-white py-2.5 px-4 rounded font-semibold text-sm inline-flex items-center justify-center gap-2">
                <Icon name="Printer" size={16} /> Print {ordersList.length > 1 ? `All (${ordersList.length})` : 'Sticker'}
              </button>
              <button onClick={handleCopyCSV} className="border border-gray-300 hover:bg-gray-50 text-gray-800 py-2.5 px-4 rounded font-semibold text-sm inline-flex items-center justify-center gap-2">
                <Icon name="Copy" size={16} /> Copy CSV

          </div>
        </div>
      );
    }

    // ORDER TIMELINE MODAL
    // =========================================================================
    function OrderTimelineModal({ order, activityLogs, onClose }) {
      const logs = activityLogs.filter((l) => l.order_no === order.order_no);
      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-md border border-gray-300 max-w-lg w-full p-5 shadow-lg">
            <div className="flex justify-between items-center border-b border-gray-200 pb-3 mb-4">
              <div>
                <h3 className="font-bold text-base text-gray-900">Order Audit Timeline — {order.order_no}</h3>
                <p className="text-xs text-gray-500">{order.customer_name} • {order.design_name}</p>
              </div>
              <button onClick={onClose} className="p-1.5 text-gray-500 hover:bg-gray-100 rounded">
                <Icon name="X" size={18} />
              </button>
            </div>
            <div className="max-h-80 overflow-y-auto space-y-3">
              {logs.length === 0 ? (
                <p className="text-sm text-gray-500 py-6 text-center">No activity events logged for this order yet.</p>
              ) : (
                logs.map((l) => (
                  <div key={l.id} className="flex items-start gap-3 border-l-2 border-amber-600 pl-3 py-1">
                    <div className="flex-1">
                      <div className="text-sm font-medium text-gray-900">{l.action}</div>
                      <div className="text-xs text-gray-500">
                        By <span className="font-semibold uppercase">{l.role}</span> • {formatDateTimeDDMMYYYY(l.created_at)}
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // KEYBOARD-FIRST ONE-SCREEN ORDER ENTRY + REVIEW & CONFIRM FLOW
    // =========================================================================
    function OrderEntryScreen({ existingOrder, allOrders, salesmen, currentRole, onCancel, onCommitOrder }) {
      const isConfirmed = existingOrder && !['Measurement Pending', 'Estimate Given'].includes(existingOrder.status);
      const canEditSpecs = !isConfirmed || currentRole === 'admin';

      const draftKey = existingOrder ? `sg_draft_${existingOrder.id}` : 'sg_draft_new_order';

      const [form, setForm] = useState(() => {
        if (!existingOrder) {
          const savedDraft = localStorage.getItem(draftKey);
          if (savedDraft) {
            try { return JSON.parse(savedDraft); } catch (e) {}
          }
        }
        return {
          customer_name: existingOrder?.customer_name || '',
          mobile: existingOrder?.mobile || '',
          address: existingOrder?.address || '',
          home_delivery: existingOrder?.home_delivery || false,
          measurement_source: existingOrder?.measurement_source || 'Customer brought',
          visit_staff_name: existingOrder?.visit_staff_name || '',
          visit_charge: existingOrder?.visit_charge || 0,
          design_name: existingOrder?.design_name || '',
          seating_segments: existingOrder?.seating_segments || '',
          seating_rate: existingOrder?.seating_rate || '',
          back_unit: existingOrder?.back_unit || 'Inches',
          back_segments: existingOrder?.back_segments || '',
          back_rate: existingOrder?.back_rate || '',
          tailor_notes: existingOrder?.tailor_notes || '',
          total_pcs: existingOrder?.total_pcs || '',
          advance_amount: existingOrder?.advance_amount || 0,
          payment_mode: existingOrder?.payment_mode || 'Cash',
          salesman_name: existingOrder?.salesman_name || (salesmen[0] || ''),
          promised_date: existingOrder?.promised_date || ''
        };
      });

      const [draftSavedAt, setDraftSavedAt] = useState(null);
      const [reviewMode, setReviewMode] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      // Autosave draft
      useEffect(() => {
        if (!existingOrder) {
          localStorage.setItem(draftKey, JSON.stringify(form));
          setDraftSavedAt(new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        }
      }, [form]);

      // Returning Customer lookup by mobile number
      const matchingPastOrders = useMemo(() => {
        const cleanMob = String(form.mobile || '').replace(/\D/g, '');
        if (cleanMob.length < 10) return [];
        return allOrders.filter(
          (o) => String(o.mobile || '').replace(/\D/g, '').endsWith(cleanMob.slice(-10)) && o.id !== existingOrder?.id
        );
      }, [form.mobile, allOrders]);

      const handleMobileChange = (val) => {
        const clean = val.replace(/\D/g, '').slice(0, 10);
        const updates = { mobile: clean };
        if (clean.length === 10) {
          const prev = allOrders.find((o) => String(o.mobile || '').replace(/\D/g, '').endsWith(clean));
          if (prev) {
            if (!form.customer_name) updates.customer_name = prev.customer_name;
            if (!form.address && prev.address) updates.address = prev.address;
          }
        }
        setForm((f) => ({ ...f, ...updates }));
      };

      // Keyboard-first navigation: Enter moves to next field; inside segment inputs, Enter appends '+' if trailing digit
      const formRef = useRef(null);
      const handleFieldKeyDown = (e, isSegmentField = false) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (isSegmentField) {
          const val = e.target.value.trim();
          if (val && !val.endsWith('+')) {
            const fieldName = e.target.name;
            setForm((f) => ({ ...f, [fieldName]: val + '+' }));
            return;
          }
        }
        const focusables = Array.from(formRef.current.querySelectorAll('input:not([disabled]), select:not([disabled]), textarea:not([disabled])'));
        const idx = focusables.indexOf(e.target);
        if (idx > -1 && idx < focusables.length - 1) {
          focusables[idx + 1].focus();
        }
      };

      const calc = calcEstimate(form);

      const validateAndOpenReview = () => {
        setErrorMsg('');
        if (!form.customer_name.trim() || form.mobile.length < 10 || !form.design_name.trim()) {
          setErrorMsg('Please enter Customer Name, 10-digit Mobile Number, and Design Name.');
          return;
        }
        if (!form.seating_segments.trim() || !form.salesman_name || !form.promised_date || !form.total_pcs) {
          setErrorMsg('To confirm an order, Seating Measurements, Salesman, Promised Date, and Total Pieces are required.');
          return;
        }
        setReviewMode(true);
      };

      const finalizeSave = (targetStatus, afterAction = 'none') => {
        setErrorMsg('');
        if (!form.customer_name.trim() || !form.mobile.trim() || !form.design_name.trim()) {
          setErrorMsg('Customer Name, Mobile Number, and Design Name are required.');
          return;
        }
        const nextStatus = targetStatus === 'Confirmed' ? 'Cutting Pending' : targetStatus;
        const payload = {
          ...form,
          seating_total_inches: calc.seatingInches,
          seating_feet: calc.seatingFeet,
          back_total_raw: calc.backRaw,
          back_billable_qty: calc.backBillable,
          estimate_total: calc.total,
          advance_amount: parseFloat(form.advance_amount) || 0,
          balance_amount: calc.balance,
          total_pcs: parseInt(form.total_pcs) || 1,
          visit_charge: parseFloat(form.visit_charge) || 0,
          seating_rate: parseFloat(form.seating_rate) || 0,
          back_rate: parseFloat(form.back_rate) || 0,
          status: nextStatus
        };
        if (!existingOrder) localStorage.removeItem(draftKey);
        onCommitOrder(payload, targetStatus === 'Confirmed', afterAction);
      };

      return (
        <div className="bg-white border border-gray-300 rounded-md shadow-sm">
          {/* Top Bar */}
          <div className="px-5 py-3.5 border-b border-gray-200 flex flex-wrap justify-between items-center gap-3 bg-gray-50">
            <div className="flex items-center gap-3">
              <button onClick={onCancel} className="px-2.5 py-1.5 border border-gray-300 bg-white hover:bg-gray-100 rounded text-xs font-semibold text-gray-700 inline-flex items-center gap-1">
                <Icon name="ArrowLeft" size={14} /> Back to Queue
              </button>
              <div>
                <h2 className="font-bold text-base text-gray-900">
                  {existingOrder ? `Edit Order ${existingOrder.order_no}` : 'New Sofa Cover Order / Estimate'}
                </h2>
                <p className="text-xs text-gray-500">
                  Keyboard mode: Press <kbd className="px-1 py-0.5 bg-gray-200 rounded text-[11px]">Enter</kbd> to advance fields or add <code className="font-bold">+</code> between segments
                </p>
              </div>
            </div>
            <div className="flex items-center gap-3">
              {!existingOrder && draftSavedAt && (
                <span className="text-xs text-gray-500">Draft autosaved at {draftSavedAt}</span>
              )}
              {!existingOrder && (
                <button
                  type="button"
                  onClick={() => {
                    localStorage.removeItem(draftKey);
                    setForm({
                      customer_name: '', mobile: '', address: '', home_delivery: false,
                      measurement_source: 'Customer brought', visit_staff_name: '', visit_charge: 0,
                      design_name: '', seating_segments: '', seating_rate: '', back_unit: 'Inches',
                      back_segments: '', back_rate: '', tailor_notes: '', total_pcs: '',
                      advance_amount: 0, payment_mode: 'Cash', salesman_name: salesmen[0] || '', promised_date: ''
                    });
                  }}
                  className="text-xs text-gray-600 hover:text-gray-900 underline"
                >
                  Clear Form
                </button>
              )}
            </div>
          </div>

          {errorMsg && (
            <div className="mx-5 mt-4 p-3 bg-red-50 border border-red-300 text-red-800 rounded text-sm font-medium flex items-center gap-2">
              <Icon name="AlertCircle" size={16} /> {errorMsg}
            </div>
          )}

          {/* Split Screen: Form Left (2 cols) + Live Estimate Sticky Right (1 col) */}
          <div ref={formRef} className="p-5 grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 space-y-5">
              {/* Section 1: Customer Details */}
              <div className="border border-gray-200 rounded p-4 space-y-3">
                <div className="text-xs font-bold uppercase tracking-wider text-gray-500">1. Customer & Delivery Details</div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div>
                    <label className="block text-xs font-semibold text-gray-700 mb-1">Mobile Number (10 digits) *</label>
                    <input
                      autoFocus
                      type="tel"
                      placeholder="98250XXXXX"
                      className="w-full border border-gray-300 focus:border-amber-600 focus:outline-none rounded px-3 py-2 text-sm tabular-nums"
                      value={form.mobile}
                      onChange={(e) => handleMobileChange(e.target.value)}
                      onKeyDown={(e) => handleFieldKeyDown(e)}
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-700 mb-1">Customer Name *</label>
                    <input
                      placeholder="Full Name"
                      className="w-full border border-gray-300 focus:border-amber-600 focus:outline-none rounded px-3 py-2 text-sm"
                      value={form.customer_name}
                      onChange={(e) => setForm({ ...form, customer_name: e.target.value })}
                      onKeyDown={(e) => handleFieldKeyDown(e)}
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-700 mb-1">Salesman *</label>
                    <select
                      className="w-full border border-gray-300 focus:border-amber-600 focus:outline-none rounded px-3 py-2 text-sm bg-white"
                      value={form.salesman_name}
                      onChange={(e) => setForm({ ...form, salesman_name: e.target.value })}
                      onKeyDown={(e) => handleFieldKeyDown(e)}
                    >
                      <option value="">Select Salesman</option>
                      {salesmen.map((s) => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </div>
                </div>

                {matchingPastOrders.length > 0 && (
                  <div className="bg-amber-50 border border-amber-200 rounded p-2.5 text-xs text-amber-900 flex flex-wrap justify-between items-center gap-2">
                    <span>
                      <strong>Returning Customer:</strong> Found {matchingPastOrders.length} past order(s) — Latest: <b>{matchingPastOrders[0].order_no}</b> ({matchingPastOrders[0].design_name}, {formatDateDDMMYYYY(matchingPastOrders[0].created_at)})
                    </span>
                    <button
                      type="button"
                      onClick={() => {
                        const prev = matchingPastOrders[0];
                        setForm((f) => ({
                          ...f,
                          seating_segments: f.seating_segments || prev.seating_segments,
                          back_unit: prev.back_unit || f.back_unit,
                          back_segments: f.back_segments || prev.back_segments,
                          total_pcs: f.total_pcs || prev.total_pcs
                        }));
                      }}
                      className="px-2 py-1 bg-amber-700 text-white rounded font-semibold"
                    >
                      Copy Past Measurements
                    </button>
                  </div>
                )}

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-1">
                  <div>
                    <label className="block text-xs font-semibold text-gray-700 mb-1">Measurement Source</label>
                    <select
                      className="w-full border border-gray-300 rounded px-3 py-2 text-sm bg-white"
                      value={form.measurement_source}
                      onChange={(e) => setForm({ ...form, measurement_source: e.target.value })}
                      onKeyDown={(e) => handleFieldKeyDown(e)}
                    >
                      <option>Customer brought</option>
                      <option>Shop visit</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-700 mb-1">Promised Delivery Date *</label>
                    <input
                      type="date"
                      className="w-full border border-gray-300 rounded px-3 py-2 text-sm"
                      value={form.promised_date}
                      onChange={(e) => setForm({ ...form, promised_date: e.target.value })}
                      onKeyDown={(e) => handleFieldKeyDown(e)}
                    />
                  </div>
                  <div className="flex items-end pb-2">
                    <label className="inline-flex items-center gap-2 cursor-pointer text-sm font-medium text-gray-800">
                      <input
                        type="checkbox"
                        className="w-4 h-4 accent-amber-700"
                        checked={form.home_delivery}
                        onChange={(e) => setForm({ ...form, home_delivery: e.target.checked })}
                      />
                      Home Delivery Required
                    </label>
                  </div>
                </div>

                {form.measurement_source === 'Shop visit' && (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-gray-50 p-3 rounded border border-gray-200">
                    <div>
                      <label className="block text-xs font-semibold text-gray-700 mb-1">Staff Who Visited</label>
                      <input
                        className="w-full border border-gray-300 rounded px-3 py-2 text-sm bg-white"
                        value={form.visit_staff_name}
                        onChange={(e) => setForm({ ...form, visit_staff_name: e.target.value })}
                        onKeyDown={(e) => handleFieldKeyDown(e)}
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-gray-700 mb-1">Visit Charge (₹)</label>
                      <input
                        type="number"
                        className="w-full border border-gray-300 rounded px-3 py-2 text-sm bg-white tabular-nums"
                        value={form.visit_charge}
                        onChange={(e) => setForm({ ...form, visit_charge: e.target.value })}
                        onKeyDown={(e) => handleFieldKeyDown(e)}
                      />
                    </div>
                  </div>
                )}

                {(form.home_delivery || form.measurement_source === 'Shop visit' || form.address) && (
                  <div>
                    <label className="block text-xs font-semibold text-gray-700 mb-1">Customer Address</label>
                    <input
                      placeholder="House/Flat No, Society, Area"
                      className="w-full border border-gray-300 rounded px-3 py-2 text-sm"
                      value={form.address}
                      onChange={(e) => setForm({ ...form, address: e.target.value })}
                      onKeyDown={(e) => handleFieldKeyDown(e)}
                    />
                  </div>
                )}
              </div>

              {/* Section 2: Fabric & Measurements */}
              <div className="border border-gray-200 rounded p-4 space-y-4">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-bold uppercase tracking-wider text-gray-500">2. Fabric & Measurements (Fixed Rate — No Discount)</span>
                  {!canEditSpecs && <span className="text-xs text-amber-800 font-semibold">Locked after confirmation (Admin only)</span>}
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div className="sm:col-span-2">
                    <label className="block text-xs font-semibold text-gray-700 mb-1">Design / Fabric Name & Shade *</label>
                    <input
                      placeholder="e.g. Velvet Jacquard Beige 402"
                      className="w-full border border-gray-300 rounded px-3 py-2 text-sm"
                      value={form.design_name}
                      onChange={(e) => setForm({ ...form, design_name: e.target.value })}
                      onKeyDown={(e) => handleFieldKeyDown(e)}
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-700 mb-1">Total Pieces (Pcs) *</label>
                    <input
                      type="number"
                      disabled={!canEditSpecs}
                      placeholder="e.g. 8"
                      className="w-full border border-gray-300 rounded px-3 py-2 text-sm disabled:bg-gray-100 tabular-nums"
                      value={form.total_pcs}
                      onChange={(e) => setForm({ ...form, total_pcs: e.target.value })}
                      onKeyDown={(e) => handleFieldKeyDown(e)}
                    />
                  </div>
                </div>

                {/* Seating */}
                <div className="bg-gray-50 border border-gray-200 rounded p-3 space-y-2">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-bold text-gray-800">SEATING SEGMENTS (Always Inches)</span>
                    <button
                      type="button"
                      disabled={!canEditSpecs}
                      onClick={() => setForm((f) => ({ ...f, seating_segments: f.seating_segments ? String(f.seating_segments).replace(/\+*$/, '') + '+' : '' }))}
                      className="text-xs font-semibold px-2 py-0.5 bg-white border border-gray-300 rounded hover:bg-gray-100"
                    >
                      + Add segment
                    </button>
                  </div>
                  <div className="grid grid-cols-3 gap-3">
                    <div className="col-span-2">
                      <label className="block text-[11px] font-semibold text-gray-600 mb-0.5">Segments in Inches (e.g. 88+99+66)</label>
                      <input
                        name="seating_segments"
                        disabled={!canEditSpecs}
                        placeholder="88+99+66"
                        className="w-full border border-gray-300 bg-white rounded px-3 py-2 text-sm disabled:bg-gray-100 tabular-nums"
                        value={form.seating_segments}
                        onChange={(e) => setForm((f) => ({ ...f, seating_segments: e.target.value }))}
                        onKeyDown={(e) => handleFieldKeyDown(e, true)}
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-gray-600 mb-0.5">Rate per ft (₹)</label>
                      <input
                        disabled={!canEditSpecs}
                        type="number"
                        placeholder="200"
                        className="w-full border border-gray-300 bg-white rounded px-3 py-2 text-sm disabled:bg-gray-100 tabular-nums"
                        value={form.seating_rate}
                        onChange={(e) => setForm((f) => ({ ...f, seating_rate: e.target.value }))}
                        onKeyDown={(e) => handleFieldKeyDown(e)}
                      />
                    </div>
                  </div>
                  <div className="text-xs font-bold text-amber-900 bg-amber-50 border border-amber-200 rounded px-2.5 py-1.5 tabular-nums">
                    {calc.seatingLine}
                  </div>
                </div>

                {/* Back */}
                <div className="bg-gray-50 border border-gray-200 rounded p-3 space-y-2">
                  <div className="flex justify-between items-center">
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold text-gray-800">BACK SEGMENTS</span>
                      <select
                        disabled={!canEditSpecs}
                        className="border border-gray-300 rounded px-2 py-0.5 text-xs font-semibold bg-white"
                        value={form.back_unit}
                        onChange={(e) => setForm((f) => ({ ...f, back_unit: e.target.value }))}
                      >
                        <option value="Inches">Inches</option>
                        <option value="Pcs">Pcs</option>
                      </select>
                    </div>
                    <button
                      type="button"
                      disabled={!canEditSpecs}
                      onClick={() => setForm((f) => ({ ...f, back_segments: f.back_segments ? String(f.back_segments).replace(/\+*$/, '') + '+' : '' }))}
                      className="text-xs font-semibold px-2 py-0.5 bg-white border border-gray-300 rounded hover:bg-gray-100"
                    >
                      + Add segment
                    </button>
                  </div>
                  <div className="grid grid-cols-3 gap-3">
                    <div className="col-span-2">
                      <label className="block text-[11px] font-semibold text-gray-600 mb-0.5">
                        {form.back_unit === 'Inches' ? 'Segments in Inches (e.g. 80+90+60)' : 'Segments in Pcs (e.g. 2+2+3+5)'}
                      </label>
                      <input
                        name="back_segments"
                        disabled={!canEditSpecs}
                        placeholder={form.back_unit === 'Inches' ? '80+90+60' : '2+2+3+5'}
                        className="w-full border border-gray-300 bg-white rounded px-3 py-2 text-sm disabled:bg-gray-100 tabular-nums"
                        value={form.back_segments}
                        onChange={(e) => setForm((f) => ({ ...f, back_segments: e.target.value }))}
                        onKeyDown={(e) => handleFieldKeyDown(e, true)}
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-gray-600 mb-0.5">
                        {form.back_unit === 'Inches' ? 'Rate per ft (₹)' : 'Rate per pc (₹)'}
                      </label>
                      <input
                        disabled={!canEditSpecs}
                        type="number"
                        placeholder="200"
                        className="w-full border border-gray-300 bg-white rounded px-3 py-2 text-sm disabled:bg-gray-100 tabular-nums"
                        value={form.back_rate}
                        onChange={(e) => setForm((f) => ({ ...f, back_rate: e.target.value }))}
                        onKeyDown={(e) => handleFieldKeyDown(e)}
                      />
                    </div>
                  </div>
                  <div className="text-xs font-bold text-amber-900 bg-amber-50 border border-amber-200 rounded px-2.5 py-1.5 tabular-nums">
                    {calc.backLine}
                  </div>
                  <div className="text-xs font-bold text-gray-900 bg-white border border-gray-300 rounded px-2.5 py-1.5 tabular-nums">
                    {calc.summaryLine}
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-gray-700 mb-1">Cutting & Tailor Instructions (Printed on Sticker)</label>
                  <textarea
                    rows={2}
                    placeholder="Piping colour, joint placement, elastic/lace instructions..."
                    className="w-full border border-gray-300 rounded px-3 py-2 text-sm"
                    value={form.tailor_notes}
                    onChange={(e) => setForm({ ...form, tailor_notes: e.target.value })}
                  />
                </div>
              </div>
            </div>

            {/* Right Column: Live Estimate Summary */}
            <div className="bg-gray-50 border border-gray-300 rounded p-4 flex flex-col justify-between space-y-5">
              <div className="space-y-3">
                <div className="border-b border-gray-300 pb-2 flex justify-between items-center">
                  <span className="text-xs font-bold uppercase tracking-wider text-gray-700">Estimate Summary</span>
                  <span className="text-[11px] font-semibold text-gray-500">FIXED RATE</span>
                </div>

                <table className="w-full text-sm tabular-nums">
                  <tbody className="divide-y divide-gray-200">
                    <tr>
                      <td className="py-2 text-gray-600">Seating ({calc.seatingFeetStr} ft × {formatINR(calc.seatingRateInt)})</td>
                      <td className="py-2 text-right font-semibold text-gray-900">{formatINR(calc.seatingAmount)}</td>
                    </tr>
                    <tr>
                      <td className="py-2 text-gray-600">Back ({calc.backBillableStr} {form.back_unit === 'Inches' ? 'ft' : 'pcs'} × {formatINR(calc.backRateInt)})</td>
                      <td className="py-2 text-right font-semibold text-gray-900">{formatINR(calc.backAmount)}</td>
                    </tr>
                    {Number(form.visit_charge) > 0 && (
                      <tr>
                        <td className="py-2 text-gray-600">Measurement Visit Charge</td>
                        <td className="py-2 text-right font-semibold text-gray-900">{formatINR(form.visit_charge)}</td>
                      </tr>
                    )}
                    <tr className="bg-white">
                      <td className="py-2.5 font-bold text-base text-gray-900">Net Payable Total</td>
                      <td className="py-2.5 text-right font-bold text-lg text-gray-900">{formatINR(calc.total)}</td>

    // =========================================================================
    // MOBILE-FIRST CUTTING & TAILOR WORK QUEUES (Large Touch Targets, 1 Task/Screen)
    // =========================================================================
    function ShopFloorMobileView({ db, saveDb, currentRole, scannedOrderNo }) {
      const [selectedTailor, setSelectedTailor] = useState({});
      const [undoState, setUndoState] = useState(null);

      // Sort by promised date ascending (overdue first)
      const queueOrders = useMemo(() => {
        const list = db.orders.filter((o) => {
          if (currentRole === 'cutting') return o.status === 'Cutting Pending';
          if (currentRole === 'tailor_1' || currentRole === 'tailor_2') {
            return o.status === 'With Tailor' && o.assigned_tailor === currentRole;
          }
          return false;
        });
        return list.sort((a, b) => (a.promised_date || '9999-12-31').localeCompare(b.promised_date || '9999-12-31'));
      }, [db.orders, currentRole]);

      const startOfDay = new Date();
      startOfDay.setHours(0, 0, 0, 0);
      const startOfMonth = new Date(startOfDay.getFullYear(), startOfDay.getMonth(), 1);

      const myLogs = db.pieceLogs.filter((l) => l.tailor_role === currentRole);
      const todayPcs = myLogs.filter((l) => new Date(l.logged_at) >= startOfDay).reduce((s, l) => s + Number(l.pcs_count), 0);
      const monthPcs = myLogs.filter((l) => new Date(l.logged_at) >= startOfMonth).reduce((s, l) => s + Number(l.pcs_count), 0);

      const triggerUndoableChange = (prevDbSnapshot, nextDbSnapshot, label) => {
        saveDb(nextDbSnapshot);
        if (undoState?.timer) clearTimeout(undoState.timer);
        const timer = setTimeout(() => setUndoState(null), 10000);
        setUndoState({ prevDb: prevDbSnapshot, label, timer });
      };

      const handleUndo = () => {
        if (!undoState) return;
        clearTimeout(undoState.timer);
        saveDb(undoState.prevDb);
        setUndoState(null);
      };

      const handleCuttingComplete = (order) => {
        const tailor = selectedTailor[order.id];
        if (!tailor) return alert('Select Tailor 1 or Tailor 2 before confirming.');
        const tailorLabel = tailor === 'tailor_1' ? 'Tailor 1' : 'Tailor 2';
        if (!confirm(`Confirm cutting complete for ${order.order_no} and assign to ${tailorLabel}?`)) return;

        const nowIso = new Date().toISOString();
        const nextOrders = db.orders.map((o) =>
          o.id === order.id ? { ...o, status: 'With Tailor', assigned_tailor: tailor, stage_changed_at: nowIso } : o
        );
        const nextActivity = [
          { id: crypto.randomUUID(), order_no: order.order_no, action: `Cutting completed -> Assigned to ${tailorLabel}`, role: currentRole, created_at: nowIso },
          ...db.activityLogs
        ];
        triggerUndoableChange(db, { ...db, orders: nextOrders, activityLogs: nextActivity }, `${order.order_no} assigned to ${tailorLabel}`);
      };

      const handleStitchingComplete = (order) => {
        if (!confirm(`Confirm stitching complete for ${order.order_no} (${order.total_pcs} pcs)?`)) return;
        const nowIso = new Date().toISOString();
        const rate = db.settings?.tailorRates?.[currentRole] || 150;
        const nextOrders = db.orders.map((o) =>
          o.id === order.id ? { ...o, status: 'Silai Done', stage_changed_at: nowIso } : o
        );
        const nextPieceLogs = [
          {
            id: crypto.randomUUID(),
            order_no: order.order_no,
            tailor_role: currentRole,
            pcs_count: Number(order.total_pcs) || 1,
            rate_at_time: rate,
            is_manual_adjustment: false,
            logged_at: nowIso
          },
          ...db.pieceLogs
        ];
        const nextActivity = [
          { id: crypto.randomUUID(), order_no: order.order_no, action: `Stitching completed (${order.total_pcs} pcs)`, role: currentRole, created_at: nowIso },
          ...db.activityLogs
        ];
        triggerUndoableChange(db, { ...db, orders: nextOrders, pieceLogs: nextPieceLogs, activityLogs: nextActivity }, `${order.order_no} marked Silai Done`);
      };

      return (
        <div className="max-w-xl mx-auto p-3 space-y-4">
          {undoState && (
            <div className="bg-gray-900 text-white px-4 py-3 rounded flex justify-between items-center shadow-md">
              <span className="text-sm font-medium">{undoState.label}</span>
              <button onClick={handleUndo} className="bg-amber-600 text-white px-3 py-1.5 rounded text-xs font-bold uppercase">
                Undo (10s)
              </button>
            </div>
          )}

          {currentRole.startsWith('tailor') && (
            <div className="bg-white border border-gray-300 rounded p-4 grid grid-cols-2 divide-x divide-gray-200 text-center tabular-nums">
              <div>
                <div className="text-xs font-semibold text-gray-500 uppercase">Today Stitched</div>
                <div className="text-2xl font-bold text-gray-900 mt-0.5">{todayPcs} pcs</div>
              </div>
              <div>
                <div className="text-xs font-semibold text-gray-500 uppercase">This Month</div>
                <div className="text-2xl font-bold text-amber-800 mt-0.5">{monthPcs} pcs</div>
              </div>
            </div>
          )}

          <div className="flex justify-between items-center px-1">
            <h2 className="font-bold text-base text-gray-900">
              {currentRole === 'cutting' ? `To Cut (${queueOrders.length})` : `To Stitch (${queueOrders.length})`}
            </h2>
            <span className="text-xs text-gray-500">Sorted by delivery date</span>
          </div>

          {queueOrders.length === 0 ? (
            <div className="bg-white border border-gray-300 rounded p-10 text-center space-y-1">
              <div className="font-bold text-gray-800">Queue is clear</div>
              <p className="text-xs text-gray-500">No pending orders assigned to your station right now.</p>
            </div>
          ) : (
            queueOrders.map((order) => {
              const urgency = getDueUrgency(order.promised_date, order.status);
              const isScanned = scannedOrderNo === order.order_no;
              return (
                <div
                  key={order.id}
                  className={`bg-white rounded border-2 p-4 space-y-3 ${
                    isScanned ? 'border-amber-600' : urgency?.level === 'overdue' ? 'border-red-400' : 'border-gray-300'
                  }`}
                >
                  <div className="flex justify-between items-start border-b border-gray-200 pb-2.5">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-lg text-gray-900">{order.order_no}</span>
                        {urgency && (
                          <span className={`px-2 py-0.5 rounded text-[11px] font-bold ${
                            urgency.level === 'overdue' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-900'
                          }`}>
                            {urgency.label}
                          </span>
                        )}
                      </div>
                      <div className="text-base font-semibold text-gray-800 mt-0.5">{order.design_name}</div>
                    </div>
                    <div className="text-right tabular-nums">
                      <div className="text-xs font-semibold text-gray-500">DELIVERY</div>
                      <div className="text-sm font-bold text-gray-900">{formatDateDDMMYYYY(order.promised_date)}</div>
                      <div className="text-xs font-bold text-amber-800 mt-0.5">{order.total_pcs} PCS</div>
                    </div>
                  </div>

                  <div className="bg-gray-50 border border-gray-200 rounded p-3 space-y-1.5 text-sm tabular-nums">
                    <div><span className="text-gray-500 font-semibold">Seating:</span> <strong>{order.seating_segments}</strong> ({order.seating_feet} ft)</div>
                    <div><span className="text-gray-500 font-semibold">Back:</span> <strong>{order.back_segments}</strong> ({order.back_billable_qty} {order.back_unit})</div>
                    {order.tailor_notes && (
                      <div className="pt-1.5 border-t border-gray-200 text-gray-900 font-medium">
                        <span className="text-red-700 font-bold">Note:</span> {order.tailor_notes}
                      </div>
                    )}
                  </div>

                  {currentRole === 'cutting' && (
                    <div className="space-y-2.5 pt-1">
                      <div className="grid grid-cols-2 gap-2">
                        {['tailor_1', 'tailor_2'].map((tKey) => (
                          <button
                            key={tKey}
                            type="button"
                            onClick={() => setSelectedTailor({ ...selectedTailor, [order.id]: tKey })}
                            className={`py-3.5 rounded border-2 font-bold text-base ${
                              selectedTailor[order.id] === tKey
                                ? 'bg-gray-900 text-white border-gray-900'
                                : 'bg-white text-gray-800 border-gray-300'
                            }`}
                          >
                            {tKey === 'tailor_1' ? 'Tailor 1' : 'Tailor 2'}
                          </button>
                        ))}
                      </div>
                      <button
                        type="button"
                        onClick={() => handleCuttingComplete(order)}
                        className="w-full bg-amber-700 active:bg-amber-800 text-white py-4 rounded font-bold text-base"
                      >
                        Confirm Cutting Done
                      </button>
                    </div>
                  )}

                  {currentRole.startsWith('tailor') && (
                    <button
                      type="button"
                      onClick={() => handleStitchingComplete(order)}
                      className="w-full bg-emerald-700 active:bg-emerald-800 text-white py-4 rounded font-bold text-base"
                    >
                      Mark Stitching Done ({order.total_pcs} Pcs)
                    </button>
                  )}
                </div>
              );
            })
          )}
        </div>
      );
    }

    // =========================================================================
    // ADMIN REPORTS MODULE (8 Business Reports + Date Filters + Excel/PDF/WA)
    // =========================================================================
    function AdminReportsView({ db, onDownloadExcel }) {
      const todayIso = new Date().toISOString().split('T')[0];
      const thirtyDaysAgoIso = new Date(Date.now() - 30 * 86400000).toISOString().split('T')[0];

      const [reportType, setReportType] = useState('day_end');
      const [fromDate, setFromDate] = useState(thirtyDaysAgoIso);
      const [toDate, setToDate] = useState(todayIso);

      const inRange = (isoStr) => {
        if (!isoStr) return false;
        const d = isoStr.split('T')[0];
        return d >= fromDate && d <= toDate;
      };

      const rangeOrders = db.orders.filter((o) => inRange(o.created_at));
      const confirmedRange = rangeOrders.filter((o) => !['Measurement Pending', 'Estimate Given'].includes(o.status));

      // 1. Day-End Closing Metrics
      const todayOrders = db.orders.filter((o) => o.created_at?.startsWith(todayIso));
      const todayConfirmed = todayOrders.filter((o) => !['Measurement Pending', 'Estimate Given'].includes(o.status));
      const cashAdv = todayConfirmed.filter((o) => o.payment_mode === 'Cash').reduce((s, o) => s + Number(o.advance_amount), 0);
      const upiAdv = todayConfirmed.filter((o) => o.payment_mode === 'UPI').reduce((s, o) => s + Number(o.advance_amount), 0);
      const cardAdv = todayConfirmed.filter((o) => o.payment_mode === 'Card').reduce((s, o) => s + Number(o.advance_amount), 0);
      const totalTodayBalance = todayConfirmed.reduce((s, o) => s + Number(o.balance_amount), 0);

      const shareDailySummaryWhatsApp = () => {
        const text =
          `*Shree Gayatri Handloom House — Sofa Cover Dept*\n` +
          `Daily Closing (${formatDateDDMMYYYY(todayIso)})\n\n` +
          `• Orders Created: ${todayOrders.length}\n` +
          `• Confirmed: ${todayConfirmed.length}\n` +
          `• Ready: ${db.orders.filter((o) => o.status === 'Ready').length}\n` +
          `• Delivered Today: ${db.orders.filter((o) => o.status === 'Delivered' && o.stage_changed_at?.startsWith(todayIso)).length}\n\n` +
          `*Advance Collected Today:*\n` +
          `Cash: ${formatINR(cashAdv)} | UPI: ${formatINR(upiAdv)} | Card: ${formatINR(cardAdv)}\n` +
          `Total Advance: *${formatINR(cashAdv + upiAdv + cardAdv)}*\n` +
          `Total Pending Customer Dues: *${formatINR(db.orders.filter((o) => !['Measurement Pending', 'Estimate Given'].includes(o.status)).reduce((s, o) => s + Number(o.balance_amount), 0))}*`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      };

      const REPORT_TABS = [
        { id: 'day_end', label: '1. Day-End Closing' },
        { id: 'aging', label: '2. Stage Aging & Bottlenecks' },
        { id: 'late_delivery', label: '3. Late & Delivery Pending' },
        { id: 'visits', label: '4. Measurement Visits' },
        { id: 'tailors', label: '5. Tailor Piece & Earnings' },
        { id: 'salesmen', label: '6. Salesman Conversion' },
        { id: 'unconfirmed', label: '7. Unconfirmed Follow-Up' },
        { id: 'dues', label: '8. Customer Dues' }
      ];

      return (
        <div className="space-y-4">
          {/* Filter & Export Header */}
          <div className="bg-white border border-gray-300 rounded p-4 flex flex-wrap justify-between items-center gap-3 no-print">
            <div className="flex flex-wrap items-center gap-2">
              <label className="text-xs font-bold text-gray-600">From:</label>
              <input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} className="border border-gray-300 rounded px-2.5 py-1.5 text-xs font-medium" />
              <label className="text-xs font-bold text-gray-600">To:</label>
              <input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} className="border border-gray-300 rounded px-2.5 py-1.5 text-xs font-medium" />
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={shareDailySummaryWhatsApp} className="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded text-xs font-semibold inline-flex items-center gap-1.5">
                <Icon name="Share2" size={14} /> Share Daily Summary (WA)
              </button>
              <button onClick={() => window.print()} className="px-3 py-1.5 bg-white hover:bg-gray-50 border border-gray-300 text-gray-800 rounded text-xs font-semibold inline-flex items-center gap-1.5">
                <Icon name="Printer" size={14} /> Print / PDF
              </button>
              <button onClick={onDownloadExcel} className="px-3 py-1.5 bg-gray-900 hover:bg-gray-800 text-white rounded text-xs font-semibold inline-flex items-center gap-1.5">
                <Icon name="Download" size={14} /> Export Excel (.xlsx)
              </button>
            </div>
          </div>

          {/* Report Selector Bar */}
          <div className="flex flex-wrap gap-1.5 no-print">
            {REPORT_TABS.map((rt) => (
              <button
                key={rt.id}
                onClick={() => setReportType(rt.id)}
                className={`px-3 py-2 rounded text-xs font-semibold border ${
                  reportType === rt.id
                    ? 'bg-amber-700 text-white border-amber-700'
                    : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'
                }`}
              >
                {rt.label}
              </button>
            ))}
          </div>

          <div id="printable-area" className="bg-white border border-gray-300 rounded p-5 space-y-5">
            <div className="border-b border-gray-200 pb-3 flex justify-between items-center">
              <div>
                <h3 className="font-bold text-base text-gray-900">
                  {REPORT_TABS.find((r) => r.id === reportType)?.label}

                <p className="text-xs text-gray-500">
                  Shree Gayatri Handloom House — Sofa Cover Dept • Period: {formatDateDDMMYYYY(fromDate)} to {formatDateDDMMYYYY(toDate)}
                </p>
              </div>

              <div className="space-y-4">

                    <div className="text-xs text-gray-500 font-semibold">Orders Created Today</div>
                    <div className="text-xl font-bold text-gray-900 mt-1">{todayOrders.length} ({todayConfirmed.length} Confirmed)</div>
                  </div>
                  <div className="border border-gray-200 rounded p-3 bg-gray-50">
                    <div className="text-xs text-gray-500 font-semibold">Ready / Delivered</div>
                    <div className="text-xl font-bold text-gray-900 mt-1">
                      {db.orders.filter((o) => o.status === 'Ready').length} Ready / {db.orders.filter((o) => o.status === 'Delivered').length} Del.
                    </div>
                  </div>
                  <div className="border border-gray-200 rounded p-3 bg-gray-50">
                    <div className="text-xs text-gray-500 font-semibold">Today Advance Collected</div>
                    <div className="text-xl font-bold text-emerald-700 mt-1">{formatINR(cashAdv + upiAdv + cardAdv)}</div>
                  </div>
                  <div className="border border-gray-200 rounded p-3 bg-gray-50">
                    <div className="text-xs text-gray-500 font-semibold">Today Balance Receivable</div>
                    <div className="text-xl font-bold text-red-700 mt-1">{formatINR(totalTodayBalance)}</div>
                  </div>
                </div>

                <table className="w-full text-sm border border-gray-200 tabular-nums">
                  <thead className="bg-gray-100 text-xs uppercase text-gray-600">
                    <tr>
                      <th className="p-2.5 text-left border-b">Payment Mode</th>
                      <th className="p-2.5 text-right border-b">Orders Count</th>
                      <th className="p-2.5 text-right border-b">Today Advance</th>

                  </thead>
                  <tbody className="divide-y divide-gray-200">
                    {['Cash', 'UPI', 'Card'].map((mode) => (

                        <td className="p-2.5 text-right">{todayConfirmed.filter((o) => o.payment_mode === mode).length}</td>

                </table>
              </div>

            {/* 6. SALESMAN CONVERSION REPORT */}
            {reportType === 'salesmen' && (

                <table className="w-full text-sm border border-gray-200 tabular-nums">

                    <tr>

                      <th className="p-2.5 text-right border-b">Total Enquiries</th>

                      <th className="p-2.5 text-right border-b">Confirmed Sales Value</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-200">
                    {db.salesmen.map((sm) => {
                      const smAll = rangeOrders.filter((o) => o.salesman_name === sm);
                      const smConf = smAll.filter((o) => !['Measurement Pending', 'Estimate Given'].includes(o.status));
                      const conv = smAll.length ? Math.round((smConf.length / smAll.length) * 100) : 0;
                      const val = smConf.reduce((s, o) => s + Number(o.estimate_total), 0);
                      return (
                        <tr key={sm}>

                          <td className="p-2.5 text-right">{smAll.length}</td>

                          <td className="p-2.5 text-right font-bold text-emerald-700">{formatINR(val)}</td>

                  </tbody>
                </table>
              </div>

            {/* 7. UNCONFIRMED ESTIMATES FOLLOW-UP */}
            {reportType === 'unconfirmed' && (
              <div className="overflow-x-auto">
                <table className="w-full text-sm border border-gray-200 tabular-nums">
                  <thead className="bg-gray-100 text-xs uppercase text-gray-600">
                    <tr>
                      <th className="p-2.5 text-left border-b">Order No</th>
                      <th className="p-2.5 text-left border-b">Date</th>
                      <th className="p-2.5 text-left border-b">Customer</th>
                      <th className="p-2.5 text-left border-b">Design</th>
                      <th className="p-2.5 text-right border-b">Estimate</th>
                      <th className="p-2.5 text-right border-b no-print">Follow-Up</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-200">
                    {db.orders.filter((o) => ['Measurement Pending', 'Estimate Given'].includes(o.status)).map((o) => (
                      <tr key={o.id}>
                        <td className="p-2.5 font-bold">{o.order_no}</td>
                        <td className="p-2.5">{formatDateDDMMYYYY(o.created_at)}</td>
                        <td className="p-2.5">{o.customer_name} ({o.mobile})</td>
                        <td className="p-2.5">{o.design_name}</td>
                        <td className="p-2.5 text-right font-bold">{formatINR(o.estimate_total)}</td>
                        <td className="p-2.5 text-right no-print">
                          <a href={WhatsAppService.getLink('followup', o)} target="_blank" rel="noreferrer" className="px-2.5 py-1 bg-emerald-700 text-white rounded text-xs font-semibold">
                            WhatsApp Follow-Up
                          </a>

                </table>

            {/* 8. CUSTOMER DUES */}
            {reportType === 'dues' && (
              <div className="overflow-x-auto">
                <table className="w-full text-sm border border-gray-200 tabular-nums">
                  <thead className="bg-gray-100 text-xs uppercase text-gray-600">
                    <tr>
                      <th className="p-2.5 text-left border-b">Order No</th>
                      <th className="p-2.5 text-left border-b">Customer</th>
                      <th className="p-2.5 text-left border-b">Status</th>
                      <th className="p-2.5 text-right border-b">Total Bill</th>
                      <th className="p-2.5 text-right border-b">Advance</th>
                      <th className="p-2.5 text-right border-b">Balance Due</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-200">
                    {db.orders
                      .filter((o) => !['Measurement Pending', 'Estimate Given'].includes(o.status) && Number(o.balance_amount) > 0)
                      .map((o) => (
                        <tr key={o.id}>
                          <td className="p-2.5 font-bold">{o.order_no}</td>
                          <td className="p-2.5">{o.customer_name} ({o.mobile})</td>
                          <td className="p-2.5"><StatusChip status={o.status} /></td>
                          <td className="p-2.5 text-right">{formatINR(o.estimate_total)}</td>
                          <td className="p-2.5 text-right">{formatINR(o.advance_amount)}</td>
                          <td className="p-2.5 text-right font-bold text-red-700">{formatINR(o.balance_amount)}</td>
                        </tr>
                      ))}

                </table>
              </div>
            )}
          </div>
        </div>
      );
