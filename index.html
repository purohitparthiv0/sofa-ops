    *, *::before, *::after { box-sizing: border-box; }

      margin: 0;
      padding: 0;

      max-width: 100vw;

      html, body, #root {
        font-size: 15px;

    @media print {

        background: #ffffff !important;

      }
      .cut-print-sheet:last-child {

<body>
  <div id="root"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    const { createClient } = window.supabase;

    const DEFAULT_SUPABASE_URL = 'https://qsyubbefhttdfiglbtbt.supabase.co';

    // Capture setup_key from URL for instant staff onboarding
    const urlParams = new URLSearchParams(window.location.search);
    const urlSetupKey = urlParams.get('setup_key');
    if (urlSetupKey && urlSetupKey.length > 15) {
      localStorage.setItem('sg_supabase_key', urlSetupKey.trim());
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    // Simple Lucide Icon wrapper
    function Icon({ name, size = 16, className = '' }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide && window.lucide.icons[name]) {
          const svg = window.lucide.createElement(window.lucide.icons[name]);
          svg.setAttribute('width', size);
          svg.setAttribute('height', size);
          if (className) svg.setAttribute('class', className);
          ref.current.innerHTML = '';
          ref.current.appendChild(svg);
        }
      }, [name, size, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" />;
    }

    function getDeviceFingerprint() {
      let fp = localStorage.getItem('sg_device_fp');
      if (!fp) {
        fp = 'DEV-' + Math.random().toString(36).substring(2, 10).toUpperCase();
        localStorage.setItem('sg_device_fp', fp);
      }
      return fp;
    }

    // Formatting Helpers: Indian Rupee Grouping (1,25,000) & DD/MM/YYYY
    function formatINR(num) {
      const val = Math.round(Number(num) || 0);
      return '₹' + val.toLocaleString('en-IN');
    }

    function formatDateDDMMYYYY(dateInput) {
      if (!dateInput) return '—';
      const d = new Date(dateInput);
      if (isNaN(d.getTime())) return String(dateInput);
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      return `${dd}/${mm}/${yyyy}`;
    }

    function formatDateTimeDDMMYYYY(dateInput) {
      if (!dateInput) return '—';
      const d = new Date(dateInput);
      if (isNaN(d.getTime())) return String(dateInput);
      const time = d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
      return `${formatDateDDMMYYYY(d)} ${time}`;
    }

    function getDueUrgency(promisedDateStr, status) {
      if (!promisedDateStr || status === 'Delivered') return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const due = new Date(promisedDateStr + 'T00:00:00');
      const diffDays = Math.round((due - today) / 86400000);
      if (diffDays < 0) return { label: `OVERDUE (${Math.abs(diffDays)}d)`, level: 'overdue' };
      if (diffDays === 0) return { label: 'DUE TODAY', level: 'today' };
      if (diffDays === 1) return { label: 'DUE TOMORROW', level: 'tomorrow' };
      return null;
    }

    function getHoursInStage(order) {
      const refTime = order.stage_changed_at || order.created_at;
      if (!refTime) return 0;
      return Math.max(0, (Date.now() - new Date(refTime).getTime()) / 3600000);
    }

    // Core Business Math (Pure Integer Math — zero floating-point drift, never NaN)
    function parseSegmentsList(input) {
      if (!input) return [];
      const raw = Array.isArray(input) ? input.join('+') : String(input);
      return raw
        .split(/[+,\s]+/)
        .map((s) => parseInt(s.trim(), 10))
        .filter((n) => Number.isInteger(n) && n > 0);
    }

    function toInt(val) {
      const n = parseInt(String(val ?? '').replace(/[^0-9-]/g, ''), 10);
      return Number.isInteger(n) ? n : 0;
    }

    function calcEstimate(form = {}) {
      const seatingList = parseSegmentsList(form.seating_segments ?? form.seatingSegments);
      const seatingInches = seatingList.reduce((acc, n) => acc + n, 0);
      const seatingQuarters = seatingInches > 0 ? Math.ceil(seatingInches / 3) : 0;
      const seatingFeet = seatingQuarters / 4;
      const seatingFeetStr = seatingFeet.toFixed(2);
      const seatingRateInt = Math.max(0, toInt(form.seating_rate ?? form.seatingRate));
      const seatingAmount = Math.round((seatingQuarters * seatingRateInt) / 4);

      const backUnit = (form.back_unit ?? form.backUnit) === 'Pcs' ? 'Pcs' : 'Inches';
      const backList = parseSegmentsList(form.back_segments ?? form.backSegments);
      const backRaw = backList.reduce((acc, n) => acc + n, 0);
      const backRateInt = Math.max(0, toInt(form.back_rate ?? form.backRate));

      let backQuarters = 0;
      let backBillable = 0;
      let backBillableStr = '0';
      let backAmount = 0;

      if (backUnit === 'Inches') {
        backQuarters = backRaw > 0 ? Math.ceil(backRaw / 3) : 0;
        backBillable = backQuarters / 4;
        backBillableStr = backBillable.toFixed(2);
        backAmount = Math.round((backQuarters * backRateInt) / 4);
      } else {
        backBillable = backRaw;
        backBillableStr = String(backRaw);
        backAmount = backRaw * backRateInt;
      }

      const visitChargeInt = Math.max(0, toInt(form.visit_charge ?? form.visitCharge));
      const advanceInt = Math.max(0, toInt(form.advance_amount ?? form.advanceAmount));
      const total = seatingAmount + backAmount + visitChargeInt;
      const balance = total - advanceInt;

      const seatingExpr = seatingList.length ? seatingList.join(' + ') : '0';
      const backExpr = backList.length ? backList.join(' + ') : '0';

      const seatingLine = `Seating: ${seatingExpr} = ${seatingInches} in = ${seatingFeetStr} ft × Rs ${seatingRateInt.toLocaleString('en-IN')} = Rs ${seatingAmount.toLocaleString('en-IN')}`;
      const backLine = backUnit === 'Inches'
        ? `Back: ${backExpr} = ${backRaw} in = ${backBillableStr} ft × Rs ${backRateInt.toLocaleString('en-IN')} = Rs ${backAmount.toLocaleString('en-IN')}`
        : `Back: ${backExpr} = ${backRaw} pcs × Rs ${backRateInt.toLocaleString('en-IN')} = Rs ${backAmount.toLocaleString('en-IN')}`;
      const summaryLine = `Estimate total: Rs ${total.toLocaleString('en-IN')} | Advance: Rs ${advanceInt.toLocaleString('en-IN')} | Balance: Rs ${balance.toLocaleString('en-IN')}`;

      return {
        seatingList,
        seatingInches,
        seatingQuarters,
        seatingFeet,
        seatingFeetStr,
        seatingRateInt,
        seatingAmount,
        backUnit,
        backList,
        backRaw,
        backQuarters,
        backBillable,
        backBillableStr,
        backRateInt,
        backAmount,
        visitChargeInt,
        advanceInt,
        total,
        balance,
        seatingLine,
        backLine,
        summaryLine
      };
    }
    const calculateEstimate = calcEstimate;

    // ---- ORDER LINES START (Sofa Cover, Cushion/Pillow Cover, Fabric Only — Inches / Pcs / Meter + Sample + Making) ----
    function newId() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'L' + Date.now() + Math.random().toString(36).slice(2, 7); }
    function isCushionPart(part) { return part === 'Cushion Cover' || part === 'Pillow Cover'; }
    function getLineRoute(l) {
      if (l?.route === 'whatsapp') return 'whatsapp';
      if (l?.route === 'cotton_dari') return 'cotton_dari';
      return 'cutting';
    }
    function lineRouteLabel(route) {
      if (route === 'whatsapp') return 'WhatsApp';
      if (route === 'cotton_dari') return 'Cotton Dari';
      return 'Cutting';
    }
    function hasPendingWhatsAppLines(order) {
      if (!order || order.is_archived || order.is_trashed) return false;
      if (['Measurement Pending', 'Estimate Given', 'Awaiting Measurement', 'Delivered', 'Cancelled'].includes(order.status)) return false;
      return getOrderLines(order).some((l) => getLineRoute(l) === 'whatsapp' && !l.whatsapp_received);
    }
    function hasCuttingLines(order) {
      if (!order) return false;
      return getOrderLines(order).some((l) => getLineRoute(l) === 'cutting');
    }
    function newLine(part, unitOverride) {
      const p = part || 'Seating';
      const defaultUnit = unitOverride || (isCushionPart(p) || p === 'Fabric' ? 'Meter' : 'Inches');
      return {
        id: newId(),
        part: p,
        other_name: '',
        design: '',
        unit: defaultUnit,
        rate: '',
        making_charge: '',
        pending: false,
        route: 'cutting',
        whatsapp_received: false,
        size_l: '',
        size_w: '',
        size_unit: 'in',
        thickness: '',
        covers_count: '',
        fabric_meters: '',
        as_per_sample: false,
        sample_note: '',
        sample_photo: '',
        rows: [{ expr: '', wid: '' }]
      };
    }

    // Compress uploaded sample photo to < ~90 KB JPEG for safe db.json storage
    function compressImageUnder100KB(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Could not read image'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Invalid image file'));
          img.onload = () => {
            let maxDim = 640;
            let quality = 0.72;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            let dataUrl = '';
            for (let attempt = 0; attempt < 5; attempt++) {
              const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
              canvas.width = Math.max(1, Math.round(img.width * scale));
              canvas.height = Math.max(1, Math.round(img.height * scale));
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              dataUrl = canvas.toDataURL('image/jpeg', quality);
              const approxBytes = Math.round((dataUrl.length * 3) / 4);
              if (approxBytes <= 92000) break;
              quality = Math.max(0.35, quality - 0.12);
              maxDim = Math.round(maxDim * 0.8);
            }
            resolve(dataUrl);
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // "102+102+36", "24x4" (x or × = multiply), decimals allowed
    function evalLen(expr) {
      const cleaned = String(expr || '').toLowerCase().replace(/[×*]/g, 'x').replace(/\s*x\s*/g, 'x').replace(/[^0-9.x+,\s]/g, '');
      let total = 0;
      cleaned.split(/[+,\s]+/).forEach((term) => {
        if (!term) return;
        const factors = term.split('x').map((n) => parseFloat(n)).filter((n) => !isNaN(n));
        if (factors.length) total += factors.reduce((a, b) => a * b, 1);
      });
      return Math.round(total * 100) / 100;
    }

    function cleanExpr(e) { return String(e || '').replace(/[+x×*,\s]+$/i, ''); }
    function linePartName(l) { return l.part === 'Other' ? (l.other_name || 'Other') : l.part; }
    function lineExtraDetailsText(l) {
      const bits = [];
      if (l.covers_count) bits.push(`${l.covers_count} cover${Number(l.covers_count) > 1 ? 's' : ''}`);
      if (l.size_l || l.size_w) bits.push(`${l.size_l || '?'}×${l.size_w || '?'} ${l.size_unit || 'in'}`);
      if (l.thickness) bits.push(`${l.thickness} thick`);
      if (l.fabric_meters && l.unit !== 'Meter') bits.push(`${l.fabric_meters} mtr`);
      if (l.as_per_sample) bits.push('As per sample');
      if (l.sample_note) bits.push(l.sample_note);
      return bits.join(', ');
    }
    function lineRowsText(l) {
      if (l.unit === 'Meter') {
        const m = parseFloat(l.fabric_meters);
        const exprPart = (l.rows || []).filter((r) => cleanExpr(r.expr)).map((r) => cleanExpr(r.expr)).join(' + ');
        const base = !isNaN(m) && m > 0 ? `${m} mtr` : (exprPart ? `${exprPart} mtr` : '');
        const extra = lineExtraDetailsText(l);
        return [base, extra].filter(Boolean).join(' • ');
      }
      const base = (l.rows || []).filter((r) => cleanExpr(r.expr)).map((r) => cleanExpr(r.expr) + (r.wid ? ' (W ' + r.wid + '")' : '')).join(' | ');
      const extra = lineExtraDetailsText(l);
      return [base, extra].filter(Boolean).join(' • ');
    }

    // Feet = ceil(inches / 3) / 4 (round UP to .25 ft, integer maths).
    // Meter = decimal meters x rate (integer centi-meter math). Making charge added per line.
    // Amount is rounded DOWN to whole rupees (as on the paper bills).
    function calcLine(line) {
      const unit = line.unit === 'Pcs' ? 'Pcs' : line.unit === 'Meter' ? 'Meter' : 'Inches';
      const rate = Math.max(0, toInt(line.rate));
      const making = Math.max(0, toInt(line.making_charge));
      const rows = (line.rows || []).map((r) => ({ expr: cleanExpr(r.expr), wid: String(r.wid || '').trim(), value: evalLen(r.expr) }));
      const rowsSum = Math.round(rows.reduce((a, r) => a + r.value, 0) * 100) / 100;
      const fabricMetersNum = Math.round((parseFloat(line.fabric_meters) || 0) * 100) / 100;
      const coversNum = Math.max(0, toInt(line.covers_count));

      let raw = rowsSum;
      let quarters = 0, qty = 0, qtyStr = '0', baseAmount = 0;

      if (unit === 'Inches') {
        quarters = raw > 0 ? Math.ceil(Math.round(raw * 100) / 300) : 0;
        qty = quarters / 4;
        qtyStr = qty.toFixed(2);
        baseAmount = Math.floor((quarters * rate) / 4);
      } else if (unit === 'Meter') {
        raw = fabricMetersNum > 0 ? fabricMetersNum : rowsSum;
        qty = raw;
        qtyStr = raw > 0 ? String(raw) : '0';
        baseAmount = Math.floor((Math.round(raw * 100) * rate) / 100);
      } else {
        raw = rowsSum > 0 ? rowsSum : coversNum;
        qty = raw;
        qtyStr = String(raw);
        baseAmount = Math.floor(raw * rate);
      }

      const amount = baseAmount + making;
      const name = linePartName(line);
      const unitLbl = unit === 'Inches' ? 'ft' : unit === 'Meter' ? 'mtr' : 'pcs';
      const rowsText = rows.filter((r) => r.expr).map((r) => r.expr + (r.wid ? ' (W ' + r.wid + '")' : '')).join(' | ');
      const extraTxt = lineExtraDetailsText(line);
      const makingTxt = making > 0 ? ` + Making Rs ${making.toLocaleString('en-IN')}` : '';

      const text = unit === 'Inches'
        ? `${name}: ${rowsText || '0'} = ${raw} in = ${qtyStr} ft × Rs ${rate.toLocaleString('en-IN')}${makingTxt} = Rs ${amount.toLocaleString('en-IN')}`
        : `${name}${extraTxt ? ' (' + extraTxt + ')' : ''}: ${qtyStr} ${unitLbl} × Rs ${rate.toLocaleString('en-IN')}${makingTxt} = Rs ${amount.toLocaleString('en-IN')}`;

      return {
        id: line.id,
        part: line.part,
        other_name: line.other_name || '',
        name,
        design: String(line.design || '').trim(),
        unit,
        unitLbl,
        rate,
        making_charge: making,
        baseAmount,
        pending: !!line.pending,
        route: getLineRoute(line),
        whatsapp_received: !!line.whatsapp_received,
        size_l: String(line.size_l || '').trim(),
        size_w: String(line.size_w || '').trim(),
        size_unit: line.size_unit || 'in',
        thickness: String(line.thickness || '').trim(),
        covers_count: line.covers_count || '',
        fabric_meters: line.fabric_meters || '',
        as_per_sample: !!line.as_per_sample,
        sample_note: String(line.sample_note || '').trim(),
        sample_photo: line.sample_photo || '',
        rows,
        raw,
        quarters,
        qty,
        qtyStr,
        amount,
        text
      };
    }

    function calcOrderLines(form = {}) {
      const lines = (form.lines || []).map(calcLine);
      const visit = Math.max(0, toInt(form.visit_charge ?? form.visitCharge));
      const advance = Math.max(0, toInt(form.advance_amount ?? form.advanceAmount));
      const total = lines.reduce((a, l) => a + l.amount, 0) + visit;
      const balance = total - advance;
      const sum = (arr, f) => arr.reduce((a, l) => a + f(l), 0);
      const seat = lines.filter((l) => l.part === 'Seating');
      const back = lines.filter((l) => l.part === 'Back');
      return {
        lines,
        total,
        balance,
        advanceInt: advance,
        visitChargeInt: visit,
        hasMeasure: lines.some((l) => l.raw > 0 || l.making_charge > 0),
        hasPendingLine: lines.some((l) => l.pending),
        seatingInches: sum(seat, (l) => (l.unit === 'Inches' ? l.raw : 0)),
        seatingFeet: sum(seat, (l) => (l.unit === 'Inches' ? l.qty : 0)),
        backRaw: sum(back, (l) => l.raw),
        backBillable: sum(back, (l) => l.qty),
        summaryLine: `Estimate total: Rs ${total.toLocaleString('en-IN')} | Advance: Rs ${advance.toLocaleString('en-IN')} | Balance: Rs ${balance.toLocaleString('en-IN')}`
      };
    }

    // Old-style fields (design_name, seating_segments, ...) are still filled so reports, Excel, search and older screens keep working.
    function deriveLegacy(cl) {
      const designs = [];
      cl.forEach((l) => { if (l.design && !designs.includes(l.design)) designs.push(l.design); });
      const seat = cl.filter((l) => l.part === 'Seating');
      const back = cl.filter((l) => l.part === 'Back');
      const segs = (arr) => arr.map((l) => l.rows.map((r) => r.expr).filter(Boolean).join('+')).filter(Boolean).join('+');
      return {
        design_name: designs.join(' + '),
        seating_segments: segs(seat),
        seating_rate: seat[0] ? seat[0].rate : 0,
        back_unit: back[0] ? back[0].unit : 'Inches',
        back_segments: segs(back),
        back_rate: back[0] ? back[0].rate : 0
      };
    }
    function storeLine(l) {
      return {
        id: l.id, part: l.part, other_name: l.other_name, design: l.design, unit: l.unit, rate: l.rate,
        making_charge: l.making_charge || 0, pending: l.pending,
        route: getLineRoute(l), whatsapp_received: !!l.whatsapp_received,
        size_l: l.size_l || '', size_w: l.size_w || '', size_unit: l.size_unit || 'in',
        thickness: l.thickness || '', covers_count: l.covers_count || '', fabric_meters: l.fabric_meters || '',
        as_per_sample: !!l.as_per_sample, sample_note: l.sample_note || '', sample_photo: l.sample_photo || '',
        rows: l.rows.map((r) => ({ expr: r.expr, wid: r.wid })), raw: l.raw, qty: l.qty, amount: l.amount
      };
    }

    // Lines of any order: new orders have order.lines, older orders are read from the old fields.
    function getOrderLines(order) {
      if (!order) return [];
      if (Array.isArray(order.lines) && order.lines.length) return order.lines;
      const out = [];
      if (order.seating_segments) out.push({ id: 's', part: 'Seating', design: order.design_name, unit: 'Inches', rate: order.seating_rate, rows: [{ expr: cleanExpr(order.seating_segments), wid: '' }], raw: order.seating_total_inches, qty: order.seating_feet });

    const WhatsAppService = {
      formatPhone(mobile) {
        const digits = String(mobile || '').replace(/\D/g, '');
        return digits.length === 10 ? `91${digits}` : digits;

      buildLinesSummary(order) {
        const ls = getOrderLines(order);
        if (!ls.length) {
          return `${order.design_name || 'Sofa Cover'}: Rs ${Math.round(Number(order.estimate_total) || 0).toLocaleString('en-IN')}`;
        }
        return ls.map((rawLine) => {
          const c = calcLine(rawLine);
          const extra = lineExtraDetailsText(c);
          const unitLbl = c.unit === 'Inches' ? 'ft' : c.unit === 'Meter' ? 'mtr' : 'pcs';
          const makingTxt = c.making_charge > 0 ? ` + Making Rs ${c.making_charge.toLocaleString('en-IN')}` : '';
          return `${c.name}${c.design ? ' - ' + c.design : ''}${extra ? ' (' + extra + ')' : ''}: ${c.qtyStr} ${unitLbl} x Rs ${c.rate.toLocaleString('en-IN')}${makingTxt} = Rs ${c.amount.toLocaleString('en-IN')}`;
        }).join('\n');
      },
      renderMessage(type, order, settings) {
        const mappedType = type === 'followup' ? 'estimate' : (type || 'receipt');
        const templates = settings?.wa_templates || DEFAULT_WA_TEMPLATES;
        const tplObj = templates[mappedType] || DEFAULT_WA_TEMPLATES[mappedType] || DEFAULT_WA_TEMPLATES.receipt;
        const rawTpl = typeof tplObj === 'string' ? tplObj : tplObj.text;
        const shopPhone = [settings?.shop_phone || '9016904528', settings?.shop_phone_alt || '9725454423'].filter(Boolean).join(' / ');
        return rawTpl
          .replace(/\{customer\}/g, order.customer_name || '')
          .replace(/\{order_no\}/g, order.order_no || '')
          .replace(/\{lines\}/g, this.buildLinesSummary(order))
          .replace(/\{total\}/g, Math.round(Number(order.estimate_total) || 0).toLocaleString('en-IN'))
          .replace(/\{advance\}/g, Math.round(Number(order.advance_amount) || 0).toLocaleString('en-IN'))

          .replace(/\{promised_date\}/g, formatDateDDMMYYYY(order.promised_date))
          .replace(/\{shop_phone\}/g, shopPhone);
      },
      getEncodedUrl(mobile, messageText) {
        const phone = this.formatPhone(mobile);
        return `https://wa.me/${phone}?text=${encodeURIComponent(messageText)}`;

    // =========================================================================
    // ITEM 5A: PURE CANVAS DRAWING PAD (SketchPadModal + Vector Renderer + Viewer)
    // =========================================================================
    function renderVectorStrokesToCtx(ctx, strokes, width, height, opts = {}) {
      const { showGrid = false, gridSize = 24, selectedId = null } = opts;
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);

      if (showGrid) {
        ctx.strokeStyle = '#e5e7eb';
        ctx.lineWidth = 1;
        for (let x = 0; x <= width; x += gridSize) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
        }
        for (let y = 0; y <= height; y += gridSize) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
        }
      }

      (strokes || []).forEach((s) => {
        ctx.save();
        ctx.strokeStyle = s.color || '#111827';
        ctx.fillStyle = s.color || '#111827';
        ctx.lineWidth = s.width || 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (s.type === 'pen' && s.pts && s.pts.length > 0) {
          ctx.beginPath();
          ctx.moveTo(s.pts[0].x, s.pts[0].y);
          for (let i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i].x, s.pts[i].y);
          ctx.stroke();
        } else if (s.type === 'line') {
          ctx.beginPath();
          ctx.moveTo(s.x1, s.y1);
          ctx.lineTo(s.x2, s.y2);
          ctx.stroke();
        } else if (s.type === 'polyline' && s.pts && s.pts.length > 1) {
          ctx.beginPath();
          ctx.moveTo(s.pts[0].x, s.pts[0].y);
          for (let i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i].x, s.pts[i].y);
          ctx.stroke();
        } else if (s.type === 'curve') {
          ctx.beginPath();
          ctx.moveTo(s.x1, s.y1);
          ctx.quadraticCurveTo(s.cx, s.cy, s.x2, s.y2);
          ctx.stroke();
        } else if (s.type === 'rect') {
          ctx.strokeRect(s.x1, s.y1, s.x2 - s.x1, s.y2 - s.y1);
        } else if (s.type === 'circle') {
          const r = Math.hypot(s.x2 - s.x1, s.y2 - s.y1);
          ctx.beginPath();
          ctx.arc(s.x1, s.y1, r, 0, Math.PI * 2);
          ctx.stroke();
        } else if (s.type === 'text') {
          ctx.font = `bold ${Math.max(15, (s.width || 3) * 5)}px system-ui, sans-serif`;
          ctx.fillText(s.text || '', s.x, s.y);
        }

        if (selectedId && s.id === selectedId) {
          ctx.strokeStyle = '#d97706';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([5, 4]);
          const b = getStrokeBounds(s);
          ctx.strokeRect(b.minX - 6, b.minY - 6, (b.maxX - b.minX) + 12, (b.maxY - b.minY) + 12);
        }
        ctx.restore();
      });
      ctx.restore();
    }

    function getStrokeBounds(s) {
      if (s.type === 'pen' || s.type === 'polyline') {
        const xs = (s.pts || []).map((p) => p.x);
        const ys = (s.pts || []).map((p) => p.y);
        return { minX: Math.min(...xs), minY: Math.min(...ys), maxX: Math.max(...xs), maxY: Math.max(...ys) };
      }
      if (s.type === 'circle') {
        const r = Math.hypot(s.x2 - s.x1, s.y2 - s.y1);
        return { minX: s.x1 - r, minY: s.y1 - r, maxX: s.x1 + r, maxY: s.y1 + r };
      }
      if (s.type === 'curve') {
        return {
          minX: Math.min(s.x1, s.x2, s.cx), minY: Math.min(s.y1, s.y2, s.cy),
          maxX: Math.max(s.x1, s.x2, s.cx), maxY: Math.max(s.y1, s.y2, s.cy)
        };
      }
      if (s.type === 'text') {
        const w = Math.max(40, (s.text || '').length * 10);
        return { minX: s.x, minY: s.y - 18, maxX: s.x + w, maxY: s.y + 6 };
      }
      return { minX: Math.min(s.x1, s.x2), minY: Math.min(s.y1, s.y2), maxX: Math.max(s.x1, s.x2), maxY: Math.max(s.y1, s.y2) };
    }

    function translateStroke(s, dx, dy) {
      if (s.type === 'pen' || s.type === 'polyline') return { ...s, pts: s.pts.map((p) => ({ x: p.x + dx, y: p.y + dy })) };
      if (s.type === 'curve') return { ...s, x1: s.x1 + dx, y1: s.y1 + dy, x2: s.x2 + dx, y2: s.y2 + dy, cx: s.cx + dx, cy: s.cy + dy };
      if (s.type === 'text') return { ...s, x: s.x + dx, y: s.y + dy };
      return { ...s, x1: s.x1 + dx, y1: s.y1 + dy, x2: s.x2 + dx, y2: s.y2 + dy };
    }

    function hitTestStroke(s, x, y, tol = 14) {
      const b = getStrokeBounds(s);
      return x >= b.minX - tol && x <= b.maxX + tol && y >= b.minY - tol && y <= b.maxY + tol;
    }

    function SketchPadModal({ initialSketch, onSave, onClose }) {
      const CANVAS_W = 960;
      const CANVAS_H = 600;
      const GRID_SIZE = 24;

      const [title, setTitle] = useState(initialSketch?.title || 'Sofa Layout Sketch');
      const [tool, setTool] = useState('pen'); // pen | line | polyline | curve | rect | circle | text | eraser | select
      const [color, setColor] = useState('#111827');
      const [thickness, setThickness] = useState(3);
      const [showGrid, setShowGrid] = useState(initialSketch?.grid !== undefined ? !!initialSketch.grid : true);
      const [snapToGrid, setSnapToGrid] = useState(true);

      const [strokes, setStrokes] = useState(() => (initialSketch?.strokes ? JSON.parse(JSON.stringify(initialSketch.strokes)) : []));
      const [history, setHistory] = useState(() => [initialSketch?.strokes ? JSON.parse(JSON.stringify(initialSketch.strokes)) : []]);
      const [histIdx, setHistIdx] = useState(0);

      const [draftStroke, setDraftStroke] = useState(null);
      const [curveStage, setCurveStage] = useState(null); // { x1, y1, x2, y2, cx, cy } while dragging bend
      const [polyPts, setPolyPts] = useState([]);
      const [selectedId, setSelectedId] = useState(null);

      // Zoom & Pan state
      const [zoom, setZoom] = useState(1);
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const pointersRef = useRef(new Map());
      const pinchRef = useRef(null);
      const dragStartRef = useRef(null);
      const canvasRef = useRef(null);

      const commitStrokes = (nextStrokes) => {
        const trimmed = history.slice(0, histIdx + 1);
        const nextHist = [...trimmed, nextStrokes];
        setStrokes(nextStrokes);
        setHistory(nextHist);
        setHistIdx(nextHist.length - 1);
      };

      const undo = () => {
        if (histIdx <= 0) return;
        const ni = histIdx - 1;
        setHistIdx(ni);
        setStrokes(history[ni]);
        setSelectedId(null);
      };

      const redo = () => {
        if (histIdx >= history.length - 1) return;
        const ni = histIdx + 1;
        setHistIdx(ni);
        setStrokes(history[ni]);
        setSelectedId(null);
      };

      const snap = (v) => (snapToGrid && showGrid ? Math.round(v / GRID_SIZE) * GRID_SIZE : Math.round(v));

      const toCanvasPoint = (e) => {
        const rect = canvasRef.current.getBoundingClientRect();
        const rawX = ((e.clientX - rect.left) / rect.width) * CANVAS_W;
        const rawY = ((e.clientY - rect.top) / rect.height) * CANVAS_H;
        const x = (rawX - pan.x) / zoom;
        const y = (rawY - pan.y) / zoom;
        return { x: snap(x), y: snap(y), rawX: x, rawY: y };
      };

      useEffect(() => {
        const c = canvasRef.current;
        if (!c) return;
        const ctx = c.getContext('2d');
        ctx.save();
        ctx.fillStyle = '#e5e7eb';
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        ctx.translate(pan.x, pan.y);
        ctx.scale(zoom, zoom);

        const all = [...strokes];
        if (draftStroke) all.push(draftStroke);
        if (curveStage) all.push({ ...curveStage, type: 'curve', color, width: thickness });
        if (polyPts.length > 0) all.push({ id: 'poly-draft', type: 'polyline', pts: polyPts, color, width: thickness });

        renderVectorStrokesToCtx(ctx, all, CANVAS_W, CANVAS_H, { showGrid, gridSize: GRID_SIZE, selectedId });

        // Draw Bezier control handle if adjusting curve
        if (curveStage) {
          ctx.strokeStyle = '#d97706';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(curveStage.x1, curveStage.y1);
          ctx.lineTo(curveStage.cx, curveStage.cy);
          ctx.lineTo(curveStage.x2, curveStage.y2);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = '#d97706';
          ctx.beginPath();
          ctx.arc(curveStage.cx, curveStage.cy, 7, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }, [strokes, draftStroke, curveStage, polyPts, showGrid, selectedId, zoom, pan, color, thickness]);

      const handlePointerDown = (e) => {
        e.preventDefault();
        e.currentTarget.setPointerCapture(e.pointerId);
        pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });

        // Two-finger pinch-zoom & pan
        if (pointersRef.current.size === 2) {
          const pts = Array.from(pointersRef.current.values());
          const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
          pinchRef.current = { dist, mid, startZoom: zoom, startPan: { ...pan } };
          setDraftStroke(null);
          return;
        }

        const pt = toCanvasPoint(e);

        if (curveStage) {
          // Finish curve bend placement on pointer down/drag
          dragStartRef.current = { mode: 'curve_bend' };
          setCurveStage((c) => ({ ...c, cx: pt.x, cy: pt.y }));
          return;
        }

        if (tool === 'text') {
          const label = prompt('Enter measurement or text label (e.g. 84" or Step 6"x4"):');
          if (label && label.trim()) {
            commitStrokes([...strokes, { id: newId(), type: 'text', x: pt.x, y: pt.y, text: label.trim(), color, width: thickness }]);
          }
          return;
        }

        if (tool === 'polyline') {
          setPolyPts((prev) => [...prev, { x: pt.x, y: pt.y }]);
          return;
        }

        if (tool === 'eraser') {
          const hit = [...strokes].reverse().find((s) => hitTestStroke(s, pt.rawX, pt.rawY));
          if (hit) commitStrokes(strokes.filter((s) => s.id !== hit.id));
          dragStartRef.current = { mode: 'erase' };
          return;
        }

        if (tool === 'select') {
          const hit = [...strokes].reverse().find((s) => hitTestStroke(s, pt.rawX, pt.rawY));
          setSelectedId(hit ? hit.id : null);
          if (hit) dragStartRef.current = { mode: 'move', id: hit.id, lastX: pt.rawX, lastY: pt.rawY, moved: false };
          return;
        }

        if (tool === 'pen') {
          setDraftStroke({ id: newId(), type: 'pen', color, width: thickness, pts: [{ x: pt.rawX, y: pt.rawY }] });
        } else if (tool === 'line' || tool === 'rect' || tool === 'circle' || tool === 'curve') {
          setDraftStroke({ id: newId(), type: tool, color, width: thickness, x1: pt.x, y1: pt.y, x2: pt.x, y2: pt.y, cx: pt.x, cy: pt.y });
        }
      };

      const handlePointerMove = (e) => {
        if (!pointersRef.current.has(e.pointerId)) return;
        pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (pointersRef.current.size === 2 && pinchRef.current) {
          const pts = Array.from(pointersRef.current.values());
          const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
          const nextZoom = Math.min(3, Math.max(0.5, pinchRef.current.startZoom * (dist / Math.max(10, pinchRef.current.dist))));
          setZoom(nextZoom);
          setPan({
            x: pinchRef.current.startPan.x + (mid.x - pinchRef.current.mid.x),
            y: pinchRef.current.startPan.y + (mid.y - pinchRef.current.mid.y)
          });
          return;
        }

        const pt = toCanvasPoint(e);

        if (dragStartRef.current?.mode === 'curve_bend' && curveStage) {
          setCurveStage((c) => ({ ...c, cx: pt.x, cy: pt.y }));
          return;
        }

        if (dragStartRef.current?.mode === 'erase') {
          const hit = [...strokes].reverse().find((s) => hitTestStroke(s, pt.rawX, pt.rawY));
          if (hit) commitStrokes(strokes.filter((s) => s.id !== hit.id));
          return;
        }

        if (dragStartRef.current?.mode === 'move') {
          const dx = pt.rawX - dragStartRef.current.lastX;
          const dy = pt.rawY - dragStartRef.current.lastY;
          dragStartRef.current.lastX = pt.rawX;
          dragStartRef.current.lastY = pt.rawY;
          dragStartRef.current.moved = true;
          const tid = dragStartRef.current.id;
          setStrokes((prev) => prev.map((s) => (s.id === tid ? translateStroke(s, dx, dy) : s)));
          return;
        }

        if (!draftStroke) return;
        if (draftStroke.type === 'pen') {
          setDraftStroke((d) => ({ ...d, pts: [...d.pts, { x: pt.rawX, y: pt.rawY }] }));
        } else {
          setDraftStroke((d) => ({ ...d, x2: pt.x, y2: pt.y, cx: Math.round((d.x1 + pt.x) / 2), cy: Math.round((d.y1 + pt.y) / 2) }));
        }
      };

      const handlePointerUp = (e) => {
        pointersRef.current.delete(e.pointerId);
        if (pointersRef.current.size < 2) pinchRef.current = null;

        if (dragStartRef.current?.mode === 'curve_bend' && curveStage) {
          commitStrokes([...strokes, { id: newId(), type: 'curve', color, width: thickness, ...curveStage }]);
          setCurveStage(null);
          dragStartRef.current = null;
          return;
        }

        if (dragStartRef.current?.mode === 'move') {
          if (dragStartRef.current.moved) commitStrokes(strokes);
          dragStartRef.current = null;
          return;
        }
        dragStartRef.current = null;

        if (!draftStroke) return;
        if (draftStroke.type === 'curve') {
          if (Math.hypot(draftStroke.x2 - draftStroke.x1, draftStroke.y2 - draftStroke.y1) > 8) {
            setCurveStage({ x1: draftStroke.x1, y1: draftStroke.y1, x2: draftStroke.x2, y2: draftStroke.y2, cx: draftStroke.cx, cy: draftStroke.cy - 40 });
          }
          setDraftStroke(null);
          return;
        }
        commitStrokes([...strokes, draftStroke]);
        setDraftStroke(null);
      };

      const finishPolyline = () => {
        if (polyPts.length > 1) {
          commitStrokes([...strokes, { id: newId(), type: 'polyline', pts: polyPts, color, width: thickness }]);
        }
        setPolyPts([]);
      };

      const handleSaveSketch = () => {
        let finalStrokes = strokes;
        if (polyPts.length > 1) {
          finalStrokes = [...strokes, { id: newId(), type: 'polyline', pts: polyPts, color, width: thickness }];
        }
        const thumb = buildSketchThumbnail(finalStrokes, showGrid);
        onSave({
          id: initialSketch?.id || newId(),
          title: title.trim() || 'Sofa Sketch',
          grid: showGrid,
          strokes: finalStrokes,
          thumb,
          created_at: initialSketch?.created_at || new Date().toISOString()
        });
      };

      const handleDownloadPNG = () => {
        const c = document.createElement('canvas');
        c.width = CANVAS_W; c.height = CANVAS_H;
        renderVectorStrokesToCtx(c.getContext('2d'), strokes, CANVAS_W, CANVAS_H, { showGrid });
        const a = document.createElement('a');
        a.href = c.toDataURL('image/png');
        a.download = `${(title || 'sofa_sketch').replace(/\s+/g, '_')}.png`;
        a.click();
      };

      const TOOLS = [
        { id: 'pen', label: 'Pen', icon: 'Pencil' },
        { id: 'line', label: 'Line', icon: 'Minus' },
        { id: 'polyline', label: 'Poly', icon: 'Spline' },
        { id: 'curve', label: 'Curve', icon: 'GitBranch' },
        { id: 'rect', label: 'Rect', icon: 'Square' },
        { id: 'circle', label: 'Circle', icon: 'Circle' },
        { id: 'text', label: 'Text', icon: 'Type' },
        { id: 'select', label: 'Move', icon: 'Move' },
        { id: 'eraser', label: 'Erase', icon: 'Eraser' }
      ];

      return (
        <div className="fixed inset-0 bg-gray-900 z-50 flex flex-col">
          {/* Top Bar */}
          <div className="bg-gray-900 text-white px-3 py-2 border-b border-gray-700 flex flex-wrap justify-between items-center gap-2">
            <div className="flex items-center gap-2 flex-1 min-w-[200px]">
              <input
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                placeholder="Sketch Name (e.g. L-Shape Step Cut)"
                className="bg-gray-800 border border-gray-600 rounded px-2.5 py-1.5 text-sm text-white w-full max-w-xs"
              />
            </div>
            <div className="flex flex-wrap items-center gap-1.5">
              <button type="button" onClick={undo} disabled={histIdx <= 0} className="px-2.5 py-2 bg-gray-800 disabled:opacity-40 rounded text-xs font-semibold min-h-[44px] inline-flex items-center gap-1">
                <Icon name="Undo2" size={15} /> Undo
              </button>
              <button type="button" onClick={redo} disabled={histIdx >= history.length - 1} className="px-2.5 py-2 bg-gray-800 disabled:opacity-40 rounded text-xs font-semibold min-h-[44px] inline-flex items-center gap-1">
                <Icon name="Redo2" size={15} /> Redo
              </button>
              <button type="button" onClick={() => { if (confirm('Clear entire drawing?')) { commitStrokes([]); setPolyPts([]); setCurveStage(null); } }} className="px-2.5 py-2 bg-gray-800 hover:bg-red-900 rounded text-xs font-semibold min-h-[44px]">
                Clear
              </button>
              <button type="button" onClick={handleDownloadPNG} className="px-2.5 py-2 bg-gray-800 rounded text-xs font-semibold min-h-[44px] inline-flex items-center gap-1">
                <Icon name="Download" size={15} /> PNG
              </button>
              <button type="button" onClick={handleSaveSketch} className="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-bold min-h-[44px] inline-flex items-center gap-1">
                <Icon name="Check" size={15} /> Save Sketch
              </button>
              <button type="button" onClick={onClose} className="px-2.5 py-2 bg-gray-800 rounded text-xs font-semibold min-h-[44px]">
                <Icon name="X" size={18} />
              </button>
            </div>
          </div>

          {/* Tools Bar */}
          <div className="bg-white border-b border-gray-300 px-3 py-2 flex flex-wrap items-center gap-2">
            <div className="flex flex-wrap gap-1">
              {TOOLS.map((t) => (
                <button
                  key={t.id}
                  type="button"
                  onClick={() => { if (polyPts.length > 1) finishPolyline(); setCurveStage(null); setTool(t.id); }}
                  className={`px-2.5 py-1.5 rounded text-xs font-bold border min-h-[44px] inline-flex items-center gap-1 ${
                    tool === t.id ? 'bg-gray-900 text-white border-gray-900' : 'bg-gray-50 text-gray-800 border-gray-300 hover:bg-gray-100'
                  }`}
                >
                  <Icon name={t.icon} size={14} /> {t.label}
                </button>
              ))}
              {polyPts.length > 0 && (
                <button type="button" onClick={finishPolyline} className="px-3 py-1.5 bg-emerald-700 text-white rounded text-xs font-bold min-h-[44px]">
                  Finish Poly ({polyPts.length} pts)
                </button>
              )}
              {curveStage && (
                <span className="px-2.5 py-2 bg-amber-100 text-amber-900 rounded text-xs font-bold">
                  Drag on canvas to bend curve, release to lock
                </span>
              )}
            </div>

            <div className="flex items-center gap-1.5 border-l border-gray-300 pl-2">
              {['#111827', '#dc2626', '#2563eb', '#b45309', '#059669'].map((c) => (
                <button
                  key={c}
                  type="button"
                  onClick={() => setColor(c)}
                  style={{ backgroundColor: c }}
                  className={`w-7 h-7 rounded-full border-2 ${color === c ? 'border-amber-500 scale-110' : 'border-gray-300'}`}
                />
              ))}
            </div>

            <div className="flex items-center gap-1 border-l border-gray-300 pl-2">
              {[2, 4, 6].map((th) => (
                <button
                  key={th}
                  type="button"
                  onClick={() => setThickness(th)}
                  className={`px-2 py-1 rounded text-xs font-bold border min-h-[36px] ${thickness === th ? 'bg-gray-900 text-white' : 'bg-white text-gray-700'}`}
                >
                  {th}px
                </button>
              ))}
            </div>

            <div className="flex items-center gap-2 border-l border-gray-300 pl-2 text-xs">
              <label className="inline-flex items-center gap-1 font-semibold cursor-pointer">
                <input type="checkbox" checked={showGrid} onChange={(e) => setShowGrid(e.target.checked)} /> Grid
              </label>
              <label className="inline-flex items-center gap-1 font-semibold cursor-pointer">
                <input type="checkbox" checked={snapToGrid} onChange={(e) => setSnapToGrid(e.target.checked)} /> Snap
              </label>
              <button type="button" onClick={() => setZoom((z) => Math.min(3, +(z + 0.25).toFixed(2)))} className="px-2 py-1 border rounded font-bold">+</button>
              <button type="button" onClick={() => setZoom((z) => Math.max(0.5, +(z - 0.25).toFixed(2)))} className="px-2 py-1 border rounded font-bold">-</button>
              <button type="button" onClick={() => { setZoom(1); setPan({ x: 0, y: 0 }); }} className="px-2 py-1 border rounded text-[11px]">{Math.round(zoom * 100)}%</button>
            </div>
          </div>

          {/* Interactive Canvas Surface */}
          <div className="flex-1 bg-gray-200 overflow-hidden flex items-center justify-center p-2">
            <canvas
              ref={canvasRef}
              width={CANVAS_W}
              height={CANVAS_H}
              style={{ touchAction: 'none' }}
              onPointerDown={handlePointerDown}
              onPointerMove={handlePointerMove}
              onPointerUp={handlePointerUp}
              onPointerCancel={handlePointerUp}
              onDoubleClick={() => { if (tool === 'polyline') finishPolyline(); }}
              className="bg-white border-2 border-gray-400 shadow-lg max-w-full max-h-full cursor-crosshair"
            />
          </div>
        </div>
      );
    }

    // =========================================================================
    // KEYBOARD-FIRST ONE-SCREEN ORDER ENTRY + REVIEW & CONFIRM FLOW
    // (Stacks cleanly in 1 column on mobile < 768px, 3-col split on desktop)
    // =========================================================================
    function OrderEntryScreen({ existingOrder, allOrders, salesmen, currentRole, orderNotes = [], onCancel, onCommitOrder }) {
      const isConfirmed = existingOrder && !['Measurement Pending', 'Estimate Given', 'Awaiting Measurement'].includes(existingOrder.status);
      const canEditSpecs = !isConfirmed || ['admin', 'sales'].includes(currentRole);

      const draftKey = existingOrder ? `sg_draft_${existingOrder.id}` : 'sg_draft_new_order';

      const [form, setForm] = useState(() => {
        if (!existingOrder) {
          const savedDraft = localStorage.getItem(draftKey);
          if (savedDraft) {
            try { const d = JSON.parse(savedDraft); if (!Array.isArray(d.lines)) d.lines = linesToFormLines(d); return d; } catch (e) {}
          }
        }
        return {
          order_type: existingOrder?.order_type || 'Sofa Cover',
          customer_name: existingOrder?.customer_name || '',
          mobile: existingOrder?.mobile || '',
          address: existingOrder?.address || '',
          home_delivery: existingOrder?.home_delivery || false,
          measurement_source: existingOrder?.measurement_source || 'Customer brought',
          visit_staff_name: existingOrder?.visit_staff_name || '',
          visit_charge: existingOrder?.visit_charge || 0,
          lines: existingOrder ? linesToFormLines(existingOrder) : [newLine('Seating'), newLine('Back')],
          sketches: Array.isArray(existingOrder?.sketches) ? existingOrder.sketches : [],
          tailor_notes: existingOrder?.tailor_notes || '',
          total_pcs: existingOrder?.total_pcs || '',
          advance_amount: existingOrder?.advance_amount || 0,
          payment_mode: existingOrder?.payment_mode || 'Cash',
          salesman_name: existingOrder?.salesman_name || (salesmen[0] || ''),
          promised_date: existingOrder?.promised_date || '',
          important_note: '',
          important_note_priority: 'Normal'
        };
      });

      const [draftSavedAt, setDraftSavedAt] = useState(null);
      const [reviewMode, setReviewMode] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [sketchPadOpen, setSketchPadOpen] = useState(false);
      const [editingSketch, setEditingSketch] = useState(null);
      const [viewingSketch, setViewingSketch] = useState(null);

      useEffect(() => {
        if (!existingOrder) {
          localStorage.setItem(draftKey, JSON.stringify(form));
          setDraftSavedAt(new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        }
      }, [form]);

      const matchingPastOrders = useMemo(() => {
        const cleanMob = String(form.mobile || '').replace(/\D/g, '');
        if (cleanMob.length < 10) return [];
        return allOrders.filter(
          (o) => String(o.mobile || '').replace(/\D/g, '').endsWith(cleanMob.slice(-10)) && o.id !== existingOrder?.id
        );
      }, [form.mobile, allOrders]);

      const handleMobileChange = (val) => {
        const clean = val.replace(/\D/g, '').slice(0, 10);
        const updates = { mobile: clean };
        if (clean.length === 10) {
          const prev = allOrders.find((o) => String(o.mobile || '').replace(/\D/g, '').endsWith(clean));
          if (prev) {
            if (!form.customer_name) updates.customer_name = prev.customer_name;
            if (!form.address && prev.address) updates.address = prev.address;
          }
        }
        setForm((f) => ({ ...f, ...updates }));
      };

      const formRef = useRef(null);
      const handleFieldKeyDown = (e, isSegmentField = false) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (isSegmentField) {
          const val = e.target.value.trim();
          if (val && !val.endsWith('+')) {
            const fieldName = e.target.name;
            setForm((f) => ({ ...f, [fieldName]: val + '+' }));
            return;
          }
        }
        const focusables = Array.from(formRef.current.querySelectorAll('input:not([disabled]), select:not([disabled]), textarea:not([disabled])'));
        const idx = focusables.indexOf(e.target);
        if (idx > -1 && idx < focusables.length - 1) {
          focusables[idx + 1].focus();
        }
      };

      const calc = calcOrderLines(form);
      const visitMode = form.measurement_source === 'Shop visit'; // home/shop visit: details come later, so fields are optional

      const setLines = (fn) => setForm((f) => ({ ...f, lines: fn(f.lines) }));
      const updateLine = (li, patch) => setLines((ls) => ls.map((l, i) => (i === li ? { ...l, ...patch } : l)));
      const updateRow = (li, ri, patch) => setLines((ls) => ls.map((l, i) => (i === li ? { ...l, rows: l.rows.map((r, j) => (j === ri ? { ...r, ...patch } : r)) } : l)));
      const addRow = (li) => setLines((ls) => ls.map((l, i) => {
        if (i !== li) return l;
        const last = l.rows[l.rows.length - 1];
        return { ...l, rows: [...l.rows, { expr: '', wid: last ? last.wid : '' }] };
      }));
      const removeRow = (li, ri) => setLines((ls) => ls.map((l, i) => (i === li ? { ...l, rows: l.rows.length > 1 ? l.rows.filter((_, j) => j !== ri) : l.rows } : l)));
      const addLine = (part) => setLines((ls) => [...ls, newLine(part, form.order_type === 'Fabric Only (Meter)' ? 'Meter' : undefined)]);
      const handleOrderTypeChange = (nextType) => {
        setForm((f) => {
          const allEmpty = (f.lines || []).every((l) => !l.design && !l.rate && !l.fabric_meters && l.rows.every((r) => !r.expr));
          let nextLines = f.lines;
          if (allEmpty) {
            if (nextType === 'Cushion/Pillow Cover') nextLines = [newLine('Cushion Cover', 'Meter')];
            else if (nextType === 'Fabric Only (Meter)') nextLines = [newLine('Fabric', 'Meter')];
            else nextLines = [newLine('Seating', 'Inches'), newLine('Back', 'Inches')];
          }
          return { ...f, order_type: nextType, lines: nextLines };
        });
      };
      const handleSamplePhotoUpload = async (li, file) => {
        if (!file) return;
        try {
          const dataUrl = await compressImageUnder100KB(file);
          updateLine(li, { sample_photo: dataUrl });
        } catch (err) {
          alert('Could not attach sample photo: ' + err.message);
        }
      };
      const removeLine = (li) => setLines((ls) => (ls.length > 1 ? ls.filter((_, i) => i !== li) : ls));
      const usedWidths = Array.from(new Set(form.lines.flatMap((l) => l.rows.map((r) => String(r.wid || '').trim())).filter(Boolean)));
      const onExprEnter = (e, li, ri) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const val = e.target.value.trim();
        if (val && !/[+x×*]$/i.test(val)) { updateRow(li, ri, { expr: val + '+' }); return; }
        const focusables = Array.from(formRef.current.querySelectorAll('input:not([disabled]), select:not([disabled]), textarea:not([disabled])'));
        const idx = focusables.indexOf(e.target);
        if (idx > -1 && idx < focusables.length - 1) focusables[idx + 1].focus();
      };

      const validateAndOpenReview = () => {
        setErrorMsg('');
        if (!form.customer_name.trim() || form.mobile.length < 10) {
          setErrorMsg('Please enter Customer Name and 10-digit Mobile Number.');
          return;
        }
        if (!visitMode) {
          if (!calc.lines.some((l) => l.design)) {
            setErrorMsg('Please enter at least one Design Name.');
            return;
          }
          const noDesign = calc.lines.findIndex((l) => l.raw > 0 && !l.design);
          if (noDesign > -1) {
            setErrorMsg(`Line ${noDesign + 1} (${calc.lines[noDesign].name}): Design Name is missing.`);
            return;
          }
          if (!calc.hasMeasure || !form.salesman_name || !form.promised_date || !form.total_pcs) {
            setErrorMsg('To confirm an order, Measurements, Salesman, Promised Date, and Total Pieces are required.');
            return;
          }
        }
        setReviewMode(true);
      };

      const finalizeSave = (targetStatus, afterAction = 'none') => {
        setErrorMsg('');
        if (!form.customer_name.trim() || !form.mobile.trim() || (!visitMode && !calc.lines.some((l) => l.design))) {
          setErrorMsg(visitMode ? 'Customer Name and Mobile Number are required.' : 'Customer Name, Mobile Number, and at least one Design Name are required.');
          return;
        }
        // Confirmed order with NO measurements yet (e.g. home visit): keep it as "Awaiting Measurement" (shown as Measurement Pending), do not send to Cutting.
        const stillPending = !calc.hasMeasure && (targetStatus === 'Confirmed' || existingOrder?.status === 'Awaiting Measurement');
        const hasCutRoute = calc.lines.some((l) => getLineRoute(l) === 'cutting');
        const hasWaRoute = calc.lines.some((l) => getLineRoute(l) === 'whatsapp' && !l.whatsapp_received);

          total_pcs: parseInt(form.total_pcs) || 1,
          visit_charge: parseFloat(form.visit_charge) || 0,
          measurement_pending: stillPending,
          status: nextStatus

                  <div className="flex justify-between gap-2"><span className="text-gray-600">Customer:</span><strong className="text-right">{form.customer_name} ({form.mobile})</strong></div>
